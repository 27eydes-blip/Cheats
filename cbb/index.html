function sndToggle(){try{localStorage.setItem("cbb-sound",sndOn()?"off":"on")}catch(e){}if(sndOn())sndInit()}
function sndInit(){if(AC||typeof window==="undefined")return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}catch(e){AC=null}}
function noiseBuf(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function sCrowd(sec,peak){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf(sec);f.type="bandpass";f.frequency.value=900;f.Q.value=.6;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+sec*.25);g.gain.exponentialRampToValueAtTime(.001,t+sec);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+sec)}
function sTone(type,freq,dur,vol,slide){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur)}
const buzz=ms=>{try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}};
function sfx(k){
  if(!sndOn())return;sndInit();if(!AC)return;if(AC.state==="suspended")AC.resume().catch(()=>{});
  if(k==="swish")sTone("sine",1400,.12,.05,2200);
  else if(k==="squeak")sTone("triangle",2400,.08,.04,3200);
  else if(k==="dunk"){sTone("sine",90,.25,.35,45);sCrowd(1.4,.25);buzz(60)}
  else if(k==="roar"){sCrowd(1.8,.3);buzz(40)}
  else if(k==="horn"){sTone("square",230,1.1,.12);sTone("square",233,1.1,.08)}
  else if(k==="huge"){sCrowd(3.2,.45);sTone("square",230,1,.1);buzz([120,60,220])}
}
// Called from the live loop with what just happened.
function liveSound(W,bf){
  if(W.kind!=="user"&&W.kind!=="gotw"&&W.kind!=="h2h")return;const g=W.g,tot=g.score[g.home]+g.score[g.away];
  if(W.sTot!=null&&tot>W.sTot){const b=W.banner&&W.banner!==W.sB?W.banner:"";W.sB=W.banner;
    if(/BUZZER/i.test(b))sfx("huge");else if(/THROWS IT DOWN|DUNKS|SLAM/i.test(b))sfx("dunk");else if(b)sfx("roar");else sfx("swish")}
  else if(Math.random()<.04)sfx("squeak");
  W.sTot=tot;if(g.half!==W.sHalf){if(W.sHalf!=null)sfx("horn");W.sHalf=g.half}if(g.over&&!W.sEnd){W.sEnd=1;sfx(g.bzw?"huge":"horn")}
}

  if(!S.ballot||S.ballot.season!==S.season||S.ballot.week!==(S.apWeek||1)){const base=rankIds().slice(0,25);S.ballot={season:S.season,week:S.apWeek||1,order:base.slice(),sent:false}}return S.ballot;
}
function ballotMove(id,d){const B=ballot();if(B.sent)return;const i=B.order.indexOf(id),j=i+d;if(i<0||j<0||j>=B.order.length)return;[B.order[i],B.order[j]]=[B.order[j],B.order[i]]}
function ballotDrop(id){const B=ballot();if(B.sent)return;const i=B.order.indexOf(id);if(i<0)return;B.order.splice(i,1);(B.out=B.out||[]).push(id);const next=rankIds().find(x=>!B.order.includes(x)&&!B.out.includes(x));if(next!=null)B.order.push(next)}
function ballotAdd(id){const B=ballot();if(B.sent||B.order.includes(id))return;B.order.pop();B.order.push(id)}
function ballotSend(){const B=ballot();B.sent=true;B.prev=rankIds().slice(0,15);news("Your ballot is in. It counts in this week's poll.")}
// Called after the poll is voted, to count your ballot and let snubbed coaches react.
function ballotCount(pts){
  const B=S.ballot;if(!B||!B.sent||B.counted||B.season!==S.season)return;B.counted=true;B.order.forEach((id,k)=>{pts[id]=(pts[id]||0)+25-k});
}
function ballotReact(){
  const B=S.ballot;if(!B||!B.sent||B.reacted||!S.ap)return;B.reacted=true;
  const prev=B.prev||rankIds().slice(0,15),me=S.coach.name||T(S.user).abbr;
  for(let k=0;k<prev.length;k++){const id=prev[k];if(id===S.user)continue;const at=B.order.indexOf(id),t=T(id),c=coachOf(t);
    let txt=null;
    if(at<0)txt=`Heard Coach ${me} left No. ${k+1} ${t.name} off the ballot entirely. Interesting. 🧾`;
    else if(k<5&&at-k>=7)txt=`Coach ${me} had us at No. ${at+1}? We were No. ${k+1}. Saving that one for the locker room. 📌`;
    if(!txt)continue;
    post({h:coachHandle(t),n:`Coach ${c.n}`,v:true,txt,tag:"Poll",likes:clout(3),rep:[{h:pick(RFAN),n:"",txt:"The pettiness 😂"},{h:`@${t.abbr}Nation`,n:"",txt:"Disrespect noted"}]});if(isRivalCoach(id))addBeef(t,10);break}
}

  // 3 · camera zoom on the big ones
  if(bzr)fxZoom(W,scorer,"huge");else if(dunk&&(dh>0||da>0))fxZoom(W,scorer,"dunk");else if(and)fxZoom(W,scorer,"and1");else if(g.lc>X.lc&&g.half>=2&&g.clock<=300)fxZoom(W,scorer,"lead");
  // 5 · crowd
  const runFor=g.run.p>=6?g.run.t:null;
  X.crowd=bzr?"rock":ft&&!g.over?"signs":scorer===h&&(dunk||and||runFor===h||block)?"rock":scorer===a&&!g.neutral?(runFor===a?"away":"hush"):runFor===h?"rock":g.half>=2&&g.clock<=120&&Math.abs(g.score[h]-g.score[a])<=5?"tense":"idle";
  if(block&&!scorer)X.crowd=g.poss===h?"rock":"hush";

    tick17(W,"@CBBonCourtside",`${T(vic).abbr} burn a timeout. ${T(runFor).abbr} on a ${g.run.p}-0 run 😮‍💨`);X.bench[vic]={c:"🗣️ Calls timeout and lights into the huddle",b:"😶 Bench quiet",t}}}
  if(!runFor)X.runStart=g.el;
  // 11 · stat graphics
  statGfx(W,{scorer});
  // 13 · in-game Courtside ticker
  if(dunk&&scorer)tick17(W,cp(RFAN),cp(["THAT DUNK 😳","HE GOT UP 🚀","Somebody check on the rim 💀","Posterized. Put him on a shirt.","My TV just shook 📺"]));
  else if(bzr)tick17(W,cp(RFAN),cp(["I'M ON THE FLOOR 😱","BUZZER. BEATER. 🚨","Turn the lights off, it's over"]));
  else if(block)tick17(W,cp(RFAN),cp(["GET THAT WEAK STUFF OUT 🚫","Not in this building!","Sent it to the 5th row"]));
  else if(foul&&Math.random()<.18)tick17(W,cp(RFAN),cp(["Refs are cooked tonight 🦓","That's a foul?? Brother 😭","Zebras need glasses 👓","Let them PLAY","Ref has money on this one 💸"]));
  else if(tech)tick17(W,cp(RFAN),cp(["TECH! It's getting spicy 🌶️","Tempers are flaring 🔥","Somebody hold him back"]));

  if(madeShot&&g.lsh&&(dh>=2||da>=2))duelStep(W,g.lsh,shotTeam);

  // 12 · halftime show
  if(g.half===2&&X.half===1&&!g.over){X.half=2;X.htPts={};for(const id of [h,a])for(const p of T(id).roster)X.htPts[p.id]=boxOf(g,p).pts;
    W.ht=halftimeShow(W);if(W.kind!=="h2h")W.paused=true}
  if(g.half>2&&X.half<g.half){X.half=g.half;fxZoom(W,null,"ot");tick17(W,"@CBBonCourtside","WE'RE GOING TO OVERTIME 🍿")}
  // 15 · celebrations and Shot of the Night
  if(g.over&&!X.endDone){X.endDone=1;if(W.ht)W.ht.done=1;const w=g.score[h]>g.score[a]?h:a;
    if(g.bzw)W.cele="confetti";else if(W.stormed)W.cele="storm";else if(w===S.user&&(g.type==="ncaa"||g.type==="ctourn"))W.cele="confetti";
    W.sotn=shotOfNight(W)}

function benchStep(W,e){
  const g=W.g,X=W.x,t=nowMs();
  for(const id of [g.home,g.away]){
    const pool=id===S.user&&W.kind!=="h2h"&&S.coach&&DEM_ACT[S.coach.dem]||GEN_ACT;let c=null,b=null;
    const forUs=e.scorer===id,vsUs=e.scorer===opp(g,id);
    if(forUs&&(e.dunk||e.and))b=cp(["🙌 Bench on its feet!","🙌 Towels spinning on the bench","🤯 Bench losing its mind"]);
    else if(e.block&&g.poss===id)b="🙌 Bench up for the block!";
    else if(vsUs&&(e.dunk||e.and))b=cp(["🪑 Bench sits stunned","😶 Bench looking at the floor"]);
    if(forUs&&(e.dunk||e.and||e.runFor===id)&&Math.random()<.7)c=cp(pool.up);
    else if((vsUs&&e.runFor===opp(g,id))||(e.tech||e.foul)&&Math.random()<.35)c=cp(pool.dn);
    if(c||b)X.bench[id]={c:c||(X.bench[id]&&X.bench[id].c)||pool.calm,b:b||"",t};
    else if(X.bench[id]&&t-X.bench[id].t>9000)X.bench[id]={c:pool.calm,b:"",t};
  }
}

// ===================== 11 · LIVE STAT GRAPHICS =====================
function statGfx(W,e){
  const g=W.g,X=W.x,show=(h,s,id)=>{if(g.el-X.cool<25&&!/MATCHUP|RUN/.test(h))return false;X.cool=g.el;W.gfx={h,s,c:id!=null?T(id).c1:"#6ed2ff",t:nowMs()};return true};
  // Star matchup at the tip and to start the second half
  if((g.el<60&&!X.mu1)||(g.half===2&&g.clock<1150&&!X.mu2)){if(g.el<60)X.mu1=1;else X.mu2=1;const A=starOf(g,g.away),H=starOf(g,g.home);
    if(A&&H){W.gfx={h:"STAR MATCHUP",s:`${A.n} (${A.ovr}) vs ${H.n} (${H.ovr})${g.half===2?` · ${boxOf(g,A).pts} pts vs ${boxOf(g,H).pts} pts`:""}`,c:"#ffd34d",t:nowMs(),mu:[g.away,g.home]};X.cool=g.el;return}}
  // Runs over the last few minutes
  const H=X.hist,now=H[H.length-1];let best=null;
  for(let i=H.length-2;i>=0&&now[0]-H[i][0]<=330;i--){const dh=now[1]-H[i][1],da=now[2]-H[i][2];
    if(dh>=10&&da<=4&&(!best||dh-da>best.d))best={id:g.home,f:dh,o:da,d:dh-da};if(da>=10&&dh<=4&&(!best||da-dh>best.d))best={id:g.away,f:da,o:dh,d:da-dh}}
  if(best&&g.el-(X.runAt||-999)>200){X.runAt=g.el;show("RUN",`${T(best.id).name} on a ${best.f}-${best.o} run`,best.id);return}
  // Scoring milestones
  if(e.scorer!=null&&g.lsh){const p=PL[g.lsh]||T(e.scorer).roster.find(x=>x.id===g.lsh);if(p){const b=boxOf(g,p),m=b.pts>=30?30:b.pts>=20?20:b.pts>=15&&g.half===1?15:0;
    if(m&&(X.miles[p.id]||0)<m){X.miles[p.id]=m;const hp=X.htPts&&g.half>=2?b.pts-(X.htPts[p.id]||0):0;
      show(`${lname(p).toUpperCase()}: ${b.pts} PTS`,hp>=10?`${hp} pts in the 2nd half · ${b.fgm}-${b.fga} FG`:`${b.fgm}-${b.fga} FG · ${b.tpm} 3PM · ${b.orb+b.drb} reb`,e.scorer);return}}}
  // Team shooting at the under-8 media timeouts
  if(g.clock<480&&g.clock>360&&!X["mt"+g.half]){X["mt"+g.half]=1;const s=id=>{const ts=g.tstat[id];return `${T(id).abbr} ${ts.fga?Math.round(ts.fgm/ts.fga*100):0}% FG, ${ts.tpm}-${ts.tpa} 3PT`};show("BY THE NUMBERS",`${s(g.away)} · ${s(g.home)}`,null)}
}
function gfxHTML(W){
  const G=W.gfx;if(!G||nowMs()-G.t>5200)return "";
  return `<div class="gfx" style="--c:${G.c}" data-t="${G.t}"><b>${esc(G.h)}</b><span>${esc(G.s)}</span></div>`;
}

function duelStep(W,pid,tid){
  const g=W.g,X=W.x,o=opp(g,tid),q=X.lastBy[o];X.lastBy[tid]=pid;
  const D=W.duel;
  if(D&&!D.won){if(pid===D.a||pid===D.b){D.won=pid;const win=PL[pid]||T(tid).roster.find(p=>p.id===pid),lose=PL[pid===D.a?D.b:D.a];
      W.gfx={h:"DUEL WON",s:`${win.n} gets the last word on ${lose?lose.n:"his man"}`,c:T(tid).c1,t:nowMs()};
      tick17(W,cp(RFAN),`${lname(win)} just ENDED ${lose?lname(lose):"him"} 💀 Duel over.`);
      if(userLive(W)&&tid===S.user){g.xb=g.xb||{};g.xb[tid]={until:g.el+120,v:.007};tick17(W,`@${T(S.user).abbr}Nation`,`${lname(win)} won the duel and the whole team is feeding off it 🔋`)}

  if(X.pair[key]>=4){X.duels++;X.pair[key]=-99;const A=PL[pid],B=PL[q];if(!A||!B)return;W.duel={a:pid,b:q,ta:tid,tb:o};

function fxDraw(ctx,W,sx,sy){
  const F=W.fl,b=F&&F.ball,t=nowMs();
  if(b&&b.from){const k=Math.min(1,(t-b.t0)/b.dur),col=b.made?"80,230,140":"255,95,95",age=t-b.t0-b.dur;
    if(age<900){ctx.save();ctx.setLineDash([6*sx,6*sx]);ctx.lineWidth=2.5*sx;ctx.strokeStyle=`rgba(${col},${age>0?Math.max(0,.9-age/1000):.9})`;ctx.beginPath();
      for(let i=0;i<=24;i++){const q=i/24*k,x=b.from[0]+(b.to[0]-b.from[0])*q,y=b.from[1]+(b.to[1]-b.from[1])*q-Math.sin(q*Math.PI)*60;i?ctx.lineTo(x*sx,y*sy):ctx.moveTo(x*sx,y*sy)}ctx.stroke();ctx.restore()}
    if(age>0&&age<700){const r=(10+age/700*34)*sx;ctx.beginPath();ctx.arc(b.to[0]*sx,b.to[1]*sy,r,0,6.28);ctx.lineWidth=3*sx;ctx.strokeStyle=`rgba(${col},${1-age/700})`;ctx.stroke();
      ctx.font=`800 ${15*sx*1.3}px Chakra Petch, sans-serif`;ctx.textAlign="center";ctx.fillStyle=`rgba(${col},${1-age/700})`;ctx.fillText(b.made?"SWISH":"CLANK",b.to[0]*sx,(b.to[1]-40-age/30)*sy)}}
  carrierRing(ctx,W,sx,sy);duelDraw(ctx,W,sx,sy);shotClockTick(W);ballTick(W);
}

  const blobs=Object.values(cell).map(c=>{const p=c.m/c.n,hue=Math.round(p*130);return `<circle cx="${(c.x/c.n).toFixed(0)}" cy="${(c.y/c.n).toFixed(0)}" r="${Math.min(70,26+c.n*7)}" fill="hsl(${hue} 90% 50%)" opacity="${Math.min(.75,.35+c.n*.06).toFixed(2)}"/>`}).join("");

function motionTarget(W,p,id,tg){
  const F=W.fl,g=W.g;if(W.paused||g.over)return tg;const t=nowMs()/1000,ph=(p.id%7)*.9;
  if(id===F.att){let x=tg[0]+Math.sin(t*1.3+ph)*20,y=tg[1]+Math.cos(t*1.1+ph*1.7)*20;
    if(F.cut===p.id&&t-F.cutT<1.3){const B=basketFor(g,id),q=Math.sin((t-F.cutT)/1.3*Math.PI)*.6;x+=(B.x+B.dir*40-x)*q;y+=(250-y)*q}
    if(F.scr===p.id&&t-F.cutT<1.3){const h=F.cur[F.ball&&F.ball.hold];if(h){x+=(h[0]-x)*.5;y+=(h[1]+24-y)*.5}}
    return [x,y]}
  const i=(g.lu[id]||[]).indexOf(p),O=(g.lu[F.att]||[])[i],oc=O&&F.cur[O.id];

}

function carrierRing(ctx,W,sx,sy){

function mpOffers(st,ovr,pos,exclude){
  const want=st>=5?[3.6,5]:st===4?[2.6,4.4]:[1.4,3.2];
  const pool=S0teams().filter(t=>t.pres>=want[0]&&t.pres<=want[1]&&t.id!==exclude);
  // A mix: a few places you'd play right away, a few where you'd have to earn it.
  const all=pool.map(t=>({tid:t.id,role:Math.min(3,roleAt(t,pos,ovr)),r:Math.random()})).sort((a,b)=>a.r-b.r);
  const play=all.filter(o=>o.role<=1).slice(0,3),rest=all.filter(o=>!play.includes(o)).slice(0,6-play.length);
  return play.concat(rest).map(({tid,role})=>({tid,role})).sort((a,b)=>T0(b.tid).pres-T0(a.tid).pres);
}

function mpRole(){const p=mpP();if(!p)return 3;const t=T(S.user),d=depthOf(t,p.pos).indexOf(p);return d<0?3:Math.min(3,d===0?0:d===1?(p.s.min/60/Math.max(1,p.s.g)>=18?1:2):3)}
function mpGoals(){
  const p=mpP();if(!p)return [];const G=S.mp.goals;if(G&&G.season===S.season)return G.list;
  const t=T(S.user),r=depthOf(t,p.pos).indexOf(p),start=r===0;
  const list=[{k:"ppg",t:start?Math.max(8,Math.round((p.ovr-58)*.6)):4,l:"points per game"},{k:"mpg",t:start?26:12,l:"minutes per game"},
    t.pres>=3.2?{k:"ncaa",l:"Make the NCAA Tournament"}:{k:"500",l:"Finish with a winning record"}];
  if(p.ovr>=79)list.push({k:"allc",l:"Make an All-Conference team"});
  S.mp.goals={season:S.season,list};return list;
}
function goalState(g){
  const p=mpP();if(!p)return [0,false];const gp=Math.max(1,p.s.g);
  if(g.k==="ppg"){const v=p.s.pts/gp;return [v,v>=g.t]}
  if(g.k==="mpg"){const v=p.s.min/60/gp;return [v,v>=g.t]}
  if(g.k==="ncaa")return [null,!!(S.ncaa&&S.ncaa.seed[S.user]!=null)];
  if(g.k==="500"){const r=record(S.user);return [null,r.w>r.l]}
  if(g.k==="allc")return [null,(p.aw||[]).some(a=>a.startsWith(String(S.season))&&/All-/.test(a))];
  return [null,false];
}
function mpProj(p){const sc=p.ovr+(3-Math.min(3,p.yr))*1.5;const k=Math.round((90-sc)*4)+1;return k<1?1:k}
const projTxt=k=>k<=5?"Top-5 pick":k<=14?"Lottery pick":k<=30?"First round":k<=60?"Second round":"Undrafted";

function mpAfter(gm){
  if(!isMP())return;const p=mpP(),L=S.lastGame;if(!p||(gm.h!==S.user&&gm.a!==S.user)||!L)return;const b=L.box[p.id];
  const won=gm.winner===S.user,o=T(gm.h===S.user?gm.a:gm.h);
  if(!b||b.min<30){S.mp.log.unshift(`DNP vs ${o.abbr}`);news(`${p.n} didn't get in the game against ${o.name}.`)}
  else{S.mp.xp+=b.min/60+gameScore(b)*.5;const gs=gameScore(b);S.mp.tr=clamp(mpTrust()+(gs>=10?.35:gs>=5?.1:b.min>600&&gs<2?-.25:0),0,6);const ln=`${boxLine(b)} in ${Math.round(b.min/60)} min`;S.mp.log.unshift(`${won?"W":"L"} vs ${o.abbr}: ${ln}`);
    if(b.pts>=(S.mp.hi||0)){S.mp.hi=b.pts}
    if(gameScore(b)>=14||b.pts>=20)post({h:`@${p.n.replace(/\W/g,"")}${p.no}`,n:p.n,txt:pick(["Locked in 🔒","Just hoopin 🏀","Team W. Always. 💯","They gon learn 😤"]),tag:"You"});}
  S.mp.log.length=Math.min(S.mp.log.length,12);
}

function mpPreOff(){

  const ks=MP_FOCUS[S.mp.focus][1];for(const k of ks)p.at[k]=(p.at[k]||0)+1+(hit>=2?1:0);
}
const mpGrowth=p=>p.mp&&S.mp?S.mp.bonus||0:0;
function mpOffStep(){
  const p=mpP(),O=S.off;if(!p)return "";const done=p.yr>=4,k=mpProj(p),h=S.history[S.history.length-1],LG=S.mp.lastGoals||{hit:0,of:0};

    :`<div class="panel" data-c="amber"><h3>What's next?</h3><p>NBA scouts have you as: <b>${projTxt(k)}</b>${k<=60?` (around pick ${k})`:""}.</p>

function mpCareerTable(p){
  const rows=(p.car||[]).map(r=>({y:r.y,t:r.t,s:Object.fromEntries(STATK.map((k,i)=>[k,r.s[i]]))}));

  return rows.length?`<div class="tw"><table class="tbl"><thead><tr><th>Season</th><th>Team</th><th class="n">G</th><th class="n">Min</th><th class="n">Pts</th><th class="n">Reb</th><th class="n">Ast</th></tr></thead><tbody>${rows.map(r=>{const g=Math.max(1,r.s.g);return `<tr><td class="num">${seasonLabel(r.y)}</td><td>${badge(T(r.t))}</td><td class="n">${r.s.g}</td><td class="n">${f1(r.s.min/60/g)}</td><td class="n"><b>${f1(r.s.pts/g)}</b></td><td class="n">${f1((r.s.orb+r.s.drb)/g)}</td><td class="n">${f1(r.s.ast/g)}</td></tr>`}).join("")}</tbody></table></div>`:'<p class="muted">No games yet.</p>';

// The AI finishes your school's offseason: draft decisions, recruiting, then the new season.
function mpAutoOff(){
  const O=S.off;if(!O)return;if((O.tw||[]).length)twResolve();O.invite=null;
  O.board.forEach((slot,si)=>{const order=slot.cands.map((c,ci)=>[c,ci]).sort((a,b)=>b[0].st-a[0].st);for(const [c,ci] of order){if(slot.signed)break;if(c.status==="open"&&c.cost<=O.points)offer(si,ci)}});
  finishSigning();const me=T(S.user);me.plan=aiPlan(me);S.job.sec=100;S.tab="mp";
}
function mpRemove(p,why){const t=T(S.user),i=t.roster.indexOf(p);if(i>=0)t.roster[i]=newPlayer(p.pos,recruitOvr(3,t),0,3,null,t);
  S.alumni.push({id:p.id,n:p.n,pos:p.pos,no:p.no,ht:p.ht,st:p.st,ovr:p.ovr,car:p.car||[],aw:p.aw||[],left:why,draft:p.draft||null,until:S.season});buildPL()}
function mpDeclare(){
  const p=mpP();if(!p)return;const k=mpProj(p)+Math.round(normal()*4),pk=clamp(k,1,99),ok=pk<=60;
  if(ok)p.draft={y:S.season,round:pk<=30?1:2,pick:pk};

  S.mp.done={no:p.no,pos:p.pos,season:S.season,pick:ok?pk:null,team:ok?pick(NBA):null,ovr:p.ovr,name:p.n,aw:(p.aw||[]).slice(),g:total.g,pts:total.pts,car:(p.car||[]).slice(),schools:S.mp.schools.slice()};

}

function courtSVG(home,away,shots,opt={}){
  const h=T(home),a=T(away),cs=courtStyle(home),L=cs.line;
  const end=x=>{const s=x<470?1:-1,r=x<470?52.5:887.5,lane=x<470?0:750,ft=x<470?190:750;
    return `<rect x="${lane}" y="190" width="190" height="120" fill="${cs.paint==="transparent"?"transparent":`color-mix(in srgb,${cs.paint} 78%,transparent)`}" stroke="${L}" stroke-width="2.5"/>
    <circle cx="${ft}" cy="250" r="60" fill="none" stroke="${L}" stroke-width="2.5"/>
    <path d="M${x<470?0:940} 33.5 H${r+s*46.8} A221.5 221.5 0 0 ${x<470?1:0} ${r+s*46.8} 466.5 H${x<470?0:940}" fill="none" stroke="${L}" stroke-width="2.5"/>
    <line x1="${r-s*12.5}" y1="220" x2="${r-s*12.5}" y2="280" stroke="#fff" stroke-width="4"/><circle cx="${r}" cy="250" r="7.5" fill="none" stroke="#ff7a1a" stroke-width="3"/>
    <path d="M${r} 210 A40 40 0 0 ${x<470?1:0} ${r} 290" fill="none" stroke="${L}" stroke-width="2"/>`};

let WATCH=null,wTimer=null;
const SPEED={1:1100,3:420,10:110};
function startWatch(gm,kind){
  const g=newGame(gm,true);
  sndInit();WATCH={g,gm,kind,key:gameKey(gm),speed:3,paused:false,banner:null,exp:expMargin(gm.h,gm.a,gm.neutral)};try{propStart(WATCH)}catch(e){}
  clearTimeout(wTimer);wTimer=setTimeout(wLoop,700);
}
function wStep(n){const W=WATCH,g=W.g;for(let i=0;i<n&&!g.over;i++){const bf=W.kind==="user"?{u:g.score[S.user],o:g.score[opp(g,S.user)],f:g.fouls[S.user]}:null;step(g);if(bf){rageStep(W,bf);liveStep(W,bf);studentLive(W,bf)}liveSound(W,bf);chantStep(W);wpNote(W);if(g.last&&g.last.big)W.banner=g.last.txt;try{liveFx(W,bf)}catch(e){}g.last=null;if(W.paused&&W.ht&&!W.ht.done)break}stormBanner(W);floorUpdate(W)}
function wLoop(){if(!WATCH)return;if(!WATCH.paused&&!WATCH.g.over){wStep(WATCH.speed>=10?3:1);render()}if(WATCH&&!WATCH.g.over)wTimer=setTimeout(wLoop,SPEED[WATCH.speed])}
function liveWP(W){
  const g=W.g;if(g.over)return g.score[g.home]>g.score[g.away]?1:0;
  const left=g.half<=2?((2-g.half)*1200+g.clock)/2400:g.clock/2400;
  const z=(g.score[g.home]-g.score[g.away]+W.exp*left+(g.poss===g.home?.5:-.5))/(11*Math.sqrt(Math.max(left,.0005))+.6);
  return 1/(1+Math.exp(-1.7*z));
}
function finishWatch(){
  const W=WATCH;if(!W||!W.g.over)return;WATCH=null;clearTimeout(wTimer);
  if(W.kind==="h2h"){h2hFinish(W.g);return}
  const res=finalizeGame(W.g);
  if(W.kind==="user"){playRound(res);scrollTo(0,0)}
  else{S.preRes=S.preRes||{};S.preRes[W.key]=res;news(`Game of the Day: ${T(res.hs>res.as?res.h:res.a).name} beat ${T(res.hs>res.as?res.a:res.h).name} ${Math.max(res.hs,res.as)}-${Math.min(res.hs,res.as)}.`)}
}

// Live games update in place: the court and its player canvas stay put, only changed sections are redrawn.
function liveMount(W,top,rest){
  const g=W.g,key=W.key+"|"+W.kind,court=()=>courtFx(W);
  if(!app.querySelector){app.innerHTML=top+`<div class="courtwrap">${court()}</div>`+rest;return}

  if(!root||root.dataset.k!==key){app.innerHTML=`<div class="wview" data-k="${esc(key)}"><div class="wv-top"></div><div class="courtwrap"><div class="wv-court"></div><canvas class="court-fl" aria-hidden="true"></canvas><div class="wv-ovl"></div></div><div class="wv-rest"></div></div>`;root=app.querySelector(".wview");W.cn=-1}
  const set=(el,h)=>{if(el._h!==h){el.innerHTML=h;el._h=h}};

}

// One-time repair for saves from before the development fix: a practice drill let your players climb to 99.
// Ratings above 84 on teams you've coached are pulled back toward realistic levels; everyone keeps their rank order.
function fixInflation(){
  if(!S||S.fix99)return;S.fix99=true;
  const ids=new Set([S.user,S.firstTeam,...(S.history||[]).map(h=>h.team)].filter(x=>x!=null));let n=0,top=0;
  for(const id of ids){const t=S.teams[id];if(!t)continue;for(const p of t.roster)if(p.ovr>84){top=Math.max(top,p.ovr);p.ovr=Math.round(84+(p.ovr-84)*.45);n++}}
  if(S.prac)S.prac.dev=Math.min(1.5,S.prac.dev||0);
  if(n)news(`Ratings repair: ${n} of your players were brought back to realistic levels (your best was ${top} OVR before). Development now slows near the top of the scale.`);
  try{save()}catch(e){}
}
