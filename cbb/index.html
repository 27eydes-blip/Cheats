function buildYearbook(){
  const u=S.user,t=T(u),h=S.history.at(-1),N=S.ncaa;
  const games=S.results.filter(g=>g.h===u||g.a===u).map(g=>{const o=g.h===u?g.a:g.h,ms=g.h===u?g.hs:g.as,ts=g.h===u?g.as:g.hs;return {a:T(o).abbr,w:ms>ts,sc:`${ms}-${ts}`,tag:g.type==="ncaa"?"NCAA":g.type==="ct"?"CT":g.neutral?"N":g.h===u?"":"@"}});
  const ps=t.roster.filter(p=>p.s.g>0);const by=k=>ps.slice().sort((a,b)=>k(b)-k(a))[0];
  const mvp=ps.map(p=>({p,v:poyScore(p,u)})).sort((a,b)=>b.v-a.v)[0];
  const pg=(p,k)=>p.s[k]/Math.max(1,p.s.g);
  const lead=[["Points",by(p=>pg(p,"pts")),p=>f1(pg(p,"pts"))+" ppg"],["Rebounds",by(p=>(p.s.orb+p.s.drb)/p.s.g),p=>f1((p.s.orb+p.s.drb)/p.s.g)+" rpg"],["Assists",by(p=>pg(p,"ast")),p=>f1(pg(p,"ast"))+" apg"],["Threes",by(p=>p.s.tpm),p=>p.s.tpm+" made"]]
    .filter(x=>x[1]).map(([l,p,f])=>({l,n:p.n,pid:p.id,v:f(p)}));
  const aw=[];for(const p of t.roster)for(const a of p.aw||[])if(a.startsWith(String(S.season)))aw.push({n:p.n,a:a.slice(5)});
  const seniors=seniorsOf(t).map(p=>({n:p.n,pos:p.pos,line:statLine(p)}));
  const ex=expWins(u),diff=h.w-ex,tw=ncaaWins(u);
  const score=diff*1.2+(h.seed?3:-2)+tw*2.5+(N.champ===u?6:0)+(h.confChamp?1.5:0);
  const grade=score>=12?"A+":score>=8?"A":score>=5?"B+":score>=2?"B":score>=-1?"C":score>=-4?"D":"F";
  const sh=shotOfYear();
  return {season:S.season,team:u,w:h.w,l:h.l,cw:h.cw,cl:h.cl,result:h.result,grade,games,mvp:mvp?{n:mvp.p.n,pid:mvp.p.id,pos:mvp.p.pos,no:mvp.p.no,line:statLine(mvp.p)}:null,lead,aw,seniors,
    shot:sh&&sh.tid===u?{n:PL[sh.pid]?PL[sh.pid].n:"",label:sh.label,opp:T(sh.opp).abbr}:null,exp:Math.round(ex),lede:ybLede(h,ex,tw)};
}
function ybLede(h,ex,tw){
  const t=T(h.team),N=S.ncaa;
  if(N.champ===h.team)return `They'll hang this banner forever. ${t.name} went ${h.w}-${h.l} and cut down the nets in ${N.site}.`;
  if(tw>=4)return `A Final Four season. ${t.name} won ${h.w} games and made it to the last weekend of college basketball.`;
  if(h.seed&&tw>=2)return `${t.name} danced into the second weekend as a No. ${h.seed} seed and finished ${h.w}-${h.l}.`;
  if(h.seed)return `${t.name} went ${h.w}-${h.l} and heard their name on Selection Sunday as a No. ${h.seed} seed.`;
  if(h.w>=ex+3)return `Nobody saw this coming. Picked for about ${Math.round(ex)} wins, ${t.name} won ${h.w}, even without a bid.`;
  return `A ${h.w}-${h.l} season at ${t.arena}. Not the March anyone wanted, but the work for next year starts now.`;
}

// ===================== MOMENTUM, CROWD & HOT HANDS =====================
// g.mom runs from -1 (road team rolling) to +1 (home team rolling). Runs build it, every trip bleeds a little off.
function momShift(g,id,pts){g.mom=clamp((g.mom||0)+(id===g.home?1:-1)*pts*.05,-1,1)}
function crowdLevel(g){
  if(g.neutral)return {n:g.type==="ncaa"?"Tournament crowd":"Neutral floor",v:.4};
  const v=clamp((T(g.home).hfa/5)*.7+(g.mom||0)*.3+(g.gd?.12:0),0,1);
  return {n:v>=.85?"Deafening":v>=.65?"Rocking":v>=.45?"Into it":v>=.25?"Restless":"Quiet",v};
}
// Hot and cold hands: three straight makes heats a shooter up, five straight misses turns him cold.
function hcMod(g,p){const s=(g.hc&&g.hc[p.id])||0;return s>=3?.025:s<=-5?-.02:0}
function hcUpdate(g,p,made){
  g.hc=g.hc||{};const s=g.hc[p.id]||0,n=made?Math.max(0,s)+1:Math.min(0,s)-1;g.hc[p.id]=n;
  if(n===3)return ` ${p.n} is HEATING UP.`;if(n===-5)return ` ${p.n} has gone ice cold.`;return "";
}
const hcIcon=(g,p)=>{const s=(g.hc&&g.hc[p.id])||0;return s>=3?"🔥":s<=-5?"🧊":""};

// ===================== COLLEGE GAMEDAY =====================
// One marquee game each week gets the show: a guest picker, a packed student section and a bigger crowd edge.
const GD_DAYS=[6,12,15,18,21,24,27,30];
const GUESTS=["a Hall of Fame point guard","a two-time national champion coach","the school's most famous alum","a chart-topping country singer","a Super Bowl MVP","an Olympic gold medalist","a late-night talk show host","the student section's pick of the week"];
function gamedayFor(day){
  if(S.phase!=="regular"||!GD_DAYS.includes(day))return null;
  S.gd=S.gd||{};const k=S.season+":"+day;if(S.gd[k])return S.gd[k];
  const games=S.schedule[day].map(([h,a,ev])=>({h,a,ev}));if(!games.length)return null;
  const r=id=>Math.min(50,rankOf(id));
  const best=games.map(g=>({g,v:(50-r(g.h))+(50-r(g.a))-Math.abs(r(g.h)-r(g.a))*.3+(rivalryOf(g.h,g.a)?12:0)+(T(g.h).hfa*2)})).sort((x,y)=>y.v-x.v)[0].g;
  const p=winProb(best.h,best.a,best.ev>0),pickH=rnd()<clamp(p+.08,.15,.9);
  return S.gd[k]={day,h:best.h,a:best.a,ev:best.ev,guest:pick(GUESTS),pick:pickH?best.h:best.a};
}
const isGameDay=gm=>{const G=gamedayFor(S.day);return !!G&&gm&&gm.h===G.h&&gm.a===G.a};
function gamedayCard(){

function sosData(){

  for(const g of S.results){P[g.h].push(g.a);P[g.a].push(g.h)}
  if(S.schedule){
    if(S.phase==="regular")for(let d=S.day;d<DAYS;d++)for(const [h,a] of S.schedule[d]){R[h].push(a);R[a].push(h)}
    for(const day of S.schedule)for(const [h,a] of day)if(T(h).conf!==T(a).conf){NC[h].push(a);NC[a].push(h)}
  }
  const avg=L=>L.length?L.reduce((s,x)=>s+str[x],0)/L.length:null;
  const val={full:{},played:{},rem:{},nc:{}},opNet={};
  ids.forEach(i=>{const all=P[i].concat(R[i]);val.full[i]=avg(all);val.played[i]=avg(P[i]);val.rem[i]=avg(R[i]);val.nc[i]=avg(NC[i]);
    opNet[i]=all.length?Math.round(all.reduce((s,x)=>s+RD.netRank[x],0)/all.length):null});

// 94 x 50 ft court at 10 units per foot. Shots are plotted where they were taken.
function courtSVG(home,away,shots,opt={}){
  const h=T(home),a=T(away),L="var(--court-line)";
  const end=x=>{const s=x<470?1:-1,r=x<470?52.5:887.5,lane=x<470?0:750,ft=x<470?190:750;
    return `<rect x="${lane}" y="190" width="190" height="120" fill="color-mix(in srgb,${h.c1} 78%,transparent)" stroke="${L}" stroke-width="2.5"/>
    <circle cx="${ft}" cy="250" r="60" fill="none" stroke="${L}" stroke-width="2.5"/>
    <path d="M${x<470?0:940} 33.5 H${r+s*46.8} A221.5 221.5 0 0 ${x<470?1:0} ${r+s*46.8} 466.5 H${x<470?0:940}" fill="none" stroke="${L}" stroke-width="2.5"/>
    <line x1="${r-s*12.5}" y1="220" x2="${r-s*12.5}" y2="280" stroke="#fff" stroke-width="4"/><circle cx="${r}" cy="250" r="7.5" fill="none" stroke="#ff7a1a" stroke-width="3"/>
    <path d="M${r} 210 A40 40 0 0 ${x<470?1:0} ${r} 290" fill="none" stroke="${L}" stroke-width="2"/>`};
  const list=opt.all?shots:shots.slice(-14),n=list.length;
  const dots=list.map((s,i)=>{const [x,y,m,t]=s,c=T(t).c1,mine=opt.user!=null?t===opt.user:true,op=opt.all?(mine?1:.55):(.35+.65*(i+1)/n);
    return m?`<circle cx="${x}" cy="${y}" r="${opt.all?7:9}" fill="${c}" stroke="#fff" stroke-width="2" opacity="${op.toFixed(2)}"/>`:`<g opacity="${op.toFixed(2)}" stroke="${c}" stroke-width="3.5"><line x1="${x-6}" y1="${y-6}" x2="${x+6}" y2="${y+6}"/><line x1="${x-6}" y1="${y+6}" x2="${x+6}" y2="${y-6}"/></g>`}).join("");
  const lastOne=!opt.all&&n?list[n-1]:null;
  return `<svg class="court" viewBox="0 0 940 500" role="img" aria-label="Shot chart: filled circles are makes, crosses are misses">
    <defs><pattern id="pl" width="940" height="22" patternUnits="userSpaceOnUse"><rect width="940" height="22" fill="#d9a868"/><rect y="20" width="940" height="2" fill="#c7904f"/></pattern></defs>
    <rect width="940" height="500" fill="url(#pl)"/><rect x="2" y="2" width="936" height="496" fill="none" stroke="${L}" stroke-width="4"/>
    <line x1="470" y1="0" x2="470" y2="500" stroke="${L}" stroke-width="2.5"/><circle cx="470" cy="250" r="60" fill="color-mix(in srgb,${h.c1} 70%,transparent)" stroke="${L}" stroke-width="2.5"/>
    <text x="470" y="262" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="34" fill="${h.c2}">${esc(h.abbr)}</text>
    ${end(0)}${end(940)}${dots}
    ${lastOne?`<circle cx="${lastOne[0]}" cy="${lastOne[1]}" r="18" fill="none" stroke="#fff" stroke-width="2.5" opacity=".8"/>`:""}
  </svg>`;
}

// ===================== LIVE GAMES =====================
let WATCH=null,wTimer=null;
const SPEED={1:1100,3:420,10:110};
function startWatch(gm,kind){
  const g=newGame(gm,true);
  WATCH={g,gm,kind,key:gameKey(gm),speed:3,paused:false,banner:null,exp:expMargin(gm.h,gm.a,gm.neutral)};
  clearTimeout(wTimer);wTimer=setTimeout(wLoop,700);
}
function wStep(n){const W=WATCH,g=W.g;for(let i=0;i<n&&!g.over;i++){const before=g.log.length;step(g);if(g.last&&g.last.big)W.banner=g.last.txt;g.last=null}}
function wLoop(){if(!WATCH)return;if(!WATCH.paused&&!WATCH.g.over){wStep(WATCH.speed>=10?3:1);render()}if(WATCH&&!WATCH.g.over)wTimer=setTimeout(wLoop,SPEED[WATCH.speed])}
function liveWP(W){
  const g=W.g;if(g.over)return g.score[g.home]>g.score[g.away]?1:0;
  const left=g.half<=2?((2-g.half)*1200+g.clock)/2400:g.clock/2400;
  const z=(g.score[g.home]-g.score[g.away]+W.exp*left+(g.poss===g.home?.5:-.5))/(11*Math.sqrt(Math.max(left,.0005))+.6);
  return 1/(1+Math.exp(-1.7*z));
}
function finishWatch(){
  const W=WATCH;if(!W||!W.g.over)return;WATCH=null;clearTimeout(wTimer);

  if(W.kind==="user"){playRound(res);scrollTo(0,0)}
  else{S.preRes=S.preRes||{};S.preRes[W.key]=res;news(`Game of the Day: ${T(res.hs>res.as?res.h:res.a).name} beat ${T(res.hs>res.as?res.a:res.h).name} ${Math.max(res.hs,res.as)}-${Math.min(res.hs,res.as)}.`)}
}

function gotwGame(){
  const u=S.user,games=currentGames().filter(gm=>gm.h!==u&&gm.a!==u);if(!games.length)return null;
  const r=id=>Math.min(60,rankOf(id));
  return games.map(gm=>({gm,v:(60-r(gm.h))+(60-r(gm.a))-Math.abs(r(gm.h)-r(gm.a))*.3+(rivalryOf(gm.h,gm.a)?14:0)+(gm.type==="ncaa"?20:0)})).sort((a,b)=>b.v-a.v)[0].gm;
}
function gotwCard(){
  const gm=gotwGame();if(!gm)return "";
  const done=S.preRes&&S.preRes[gameKey(gm)],h=T(gm.h),a=T(gm.a),riv=rivalryOf(gm.h,gm.a),N=S.ncaa,sd=id=>gm.type==="ncaa"&&N&&N.seed[id]!=null?`(${N.seed[id]}) `:rankTag(id);
  return `<div class="panel" data-c="amber"><div class="row" style="justify-content:space-between"><h3>Game of the Day</h3>${riv?`<span class="tag amber">${esc(riv)}</span>`:""}</div>
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="row" style="gap:8px;flex-wrap:nowrap">${badge(a)}<b>${sd(a.id)}${esc(a.name)}</b></span><span class="muted">${gm.neutral?"vs":"at"}</span><span class="row" style="gap:8px;flex-wrap:nowrap;justify-content:flex-end;text-align:right"><b>${sd(h.id)}${esc(h.name)}</b>${badge(h)}</span></div>
    <p class="muted" style="font-size:13.5px">${esc(gm.label)} · ${esc(lineFor(gm.h,gm.a,gm.neutral))}</p>
    ${done?`<p class="num" style="font-size:18px"><b>Final: ${esc(T(done.h).abbr)} ${done.hs}, ${esc(T(done.a).abbr)} ${done.as}</b></p>`:`<div class="row"><button class="btn ghost" data-act="watchGotw">Watch it live</button></div>`}</div>`;
}

// ===================== ACTIONS =====================
let jumpTo=null;
function preGame(gm){runPractice();S.uniUse={k:talkKey(),u:uniForGame(gm)}}
function simUserDay(){const gm=userGame();if(gm)preGame(gm);playRound(gm?simGame(gm):null)}
function bcCallout(){return `<div class="panel event"><div class="row" style="justify-content:space-between"><h3>Bracket challenge is open</h3><span class="tag amber">Locks at tip-off</span></div><p>The First Four is done. Fill out your bracket before the first round starts.</p><div class="row"><button class="btn" data-act="tab" data-t="bracket">Fill out my bracket</button></div></div>`}
const ACT={
  resume(){S=SAVED;SAVED=null;if(S){S.confirmReset=false;fixInflation();buildPL();RK.key=null}},
  pick(d){newDynasty(+d.id);scrollTo(0,0)},
  jump(d){jumpTo=d.id},
  tab(d){S.tab=d.t;scrollTo(0,0)},
  player(d){S.pv=+d.id;scrollTo(0,0)},
  closePlayer(){S.pv=null},
  osch(d){plan(S.user).o=d.k},
  dsch(d){plan(S.user).d=d.k},
  tempo(d){plan(S.user).tempo=+d.v},
  boards(d){plan(S.user).boards=+d.v},
  poll(d){S.poll=d.p},
  sim(){simUserDay()},
  simRound(){simUserDay()},
  simTo(d){const to=+d.d;while(S.phase==="regular"&&S.day<to)simUserDay()},
  simRest(){let n=0;while(S.phase==="ncaa"&&S.ncaa.champ==null&&n++<10)simUserDay()},
  selAuto(){const X=selShow();X.auto=!X.auto;if(X.auto&&X.step===0)X.step=1;selLoop()},selNext(){const X=selShow();if(X.step<SEL_LAST)X.step++;scrollTo(0,0)},selAll(){const X=selShow();X.step=SEL_LAST;X.auto=false;clearTimeout(selTimer)},
  startNcaa(){clearTimeout(selTimer);startTournament();S.tab="bracket";scrollTo(0,0)},
  offseason(){beginOffseason();scrollTo(0,0)},
  offStep(d){if(d.s!=="jobs"&&S.off.car.fired&&S.off.car.taken===undefined)return;S.off.step=d.s;scrollTo(0,0)},
  takeJob(d){const O=S.off,id=+d.id;if(O.jobConfirm!==id){O.jobConfirm=id;return}takeJob(id);scrollTo(0,0)},
  stayPut(){const C=S.off.car;if(C.stay||C.fired||C.taken!==undefined)return;C.stay=true;S.job.sec=clamp(S.job.sec+10,0,100);C.after=S.job.sec;S.off.points+=3;news("You turned down the offers. The AD rewarded you with an extension.")},
  skill(d){if(S.coach.pts>0&&S.coach[d.k]<3){S.coach.pts--;S.coach[d.k]++}},
  fac(d){const l=fac(d.k),c=FAC_COST[l];if(l<3&&S.off&&S.off.points>=c){S.off.points-=c;S.fac=S.fac||{};S.fac[d.k]=l+1;news(`${FAC[d.k][0]} upgraded to level ${l+1}.`)}},
  arena(){const me=T(S.user),c=8+me.hfa*4;if(me.hfa<5&&S.off.points>=c){S.off.points-=c;me.hfa++;me.cap+=2500;news(`${me.arena} renovated. Crowd level is now ${me.hfa}/5.`)}},
  portal(d){portalSign(+d.i)},
  pf(d){S.off.pf=d.k},
  offer(d){offer(+d.s,+d.c)},
  finishSigning(){const O=S.off;if(!O)return;if(!O.confirmFinish&&(O.board.some(b=>!b.signed)||O.points>0)){O.confirmFinish=true;return}finishSigning();scrollTo(0,0)},
  cancelFinish(){S.off.confirmFinish=false},
  diff(d){S.diff=+d.d},
  editName(d){S.editing=+d.id},
  cancelName(){S.editing=null},
  saveName(d){const el=document.getElementById("nm-"+d.id),v=el?el.value.replace(/\s+/g," ").trim().slice(0,28):"";if(v&&PL[d.id])PL[d.id].n=v;S.editing=null},
  depth(d){const me=T(S.user),p=PL[+d.id];if(!p)return;const list=depthOf(me,p.pos).map(x=>x.id),i=list.indexOf(p.id),j=i+(+d.d);if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];me.depth=me.depth||{};me.depth[p.pos]=list},
  depthAuto(){T(S.user).depth={}},
  trash(d){trashChoose(d.c)},
  watch(){const gm=userGame();if(gm){preGame(gm);startWatch(gm,"user");scrollTo(0,0)}},
  magRead(){S.magIntro=null;S.tab="preseason";scrollTo(0,0)},magDone(){S.magIntro=null;S.tab="home";scrollTo(0,0)},lockSched(){S.schedLocked=true;scrollTo(0,0)},
  autoSched(d){autoSchedule(d.m)},homeAway(d){toggleHome(+d.w)},event(d){setEvent(+d.k)},
  talk(d){const p=PL[+d.id];if(!p||talksLeft()<1||S.phase==="offseason"||!T(S.user).roster.includes(p))return;S.talk.left--;doTalk(p,d.k)},
  pracInt(d){const P=prac();if(P.done===talkKey())return;P.int=d.k;P.drills=P.drills.slice(0,INTENSITY[d.k].max)},
  pracDrill(d){const P=prac();if(P.done===talkKey())return;const i=P.drills.indexOf(d.k);if(i>=0)P.drills.splice(i,1);else if(P.drills.length<INTENSITY[P.int].max)P.drills.push(d.k)},
  uniEdit(d){uni().edit=d.k},uniPick(d){uni().pick=d.k},uniColor(d){const U=uni(),x=U.sets.find(z=>z.k===U.edit);if(x&&/^#[0-9a-f]{6}$/i.test(d.v))x[d.p]=d.v},
  uniReset(){const U=uni(),x=U.sets.find(z=>z.k===U.edit),def=uniDefaults(T(S.user)).find(z=>z.k===U.edit);if(x&&def)Object.assign(x,def)},
  bcView(d){bc().view=+d.r},bcPick(d){if(bcOpen())bcPick(+d.r,+d.i,+d.id)},bcChalk(){if(bcOpen())bcFillChalk()},bcReset(){if(bcOpen()){const B=bc();B.picks=[[],[],[],[],[],[]];B.view=1}},
  ybOpen(d){S.ybView=+d.s;scrollTo(0,0)},ybClose(){S.ybView=null;S.tab="trophies";scrollTo(0,0)},
  watchGotw(){const gm=gotwGame();if(gm){startWatch(gm,"gotw");scrollTo(0,0)}},
  wPause(){if(WATCH)WATCH.paused=!WATCH.paused},
  wSpeed(d){if(WATCH)WATCH.speed=+d.v},
  wSkip(){if(WATCH){let n=0;while(!WATCH.g.over&&n++<3000)wStep(1)}},
  wLeave(){WATCH=null;DCC=null;clearTimeout(wTimer)},
  wDone(){finishWatch()},
  reset(){if(S.confirmReset){try{localStorage.removeItem(KEY)}catch(e){}S=null;SAVED=null}else S.confirmReset=true},
};
const HEAVY=new Set(["sim","simRound","simTo","simRest","offseason","finishSigning","pick","wDone"]);
let busy=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled||busy)return;
  const act=b.dataset.act,data={...b.dataset};
  if(S&&act!=="reset")S.confirmReset=false;
  if(HEAVY.has(act)){busy=true;const ov=document.getElementById("busy");ov.hidden=false;setTimeout(()=>{try{runAct(act,data)}finally{busy=false;ov.hidden=true}},40);return}
  runAct(act,data);
});
function runAct(act,data){
  ACT[act](data);
  if(S&&!WATCH)save();
  render();
  if(jumpTo){const el=document.getElementById(jumpTo);jumpTo=null;if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
  if(S&&S.editing){const el=document.getElementById("nm-"+S.editing);if(el){el.focus();el.select()}}
  if(S)showToasts();
}
document.addEventListener("change",e=>{
  const id=e.target.id||"";if(!S)return;
  if(id.startsWith("uc-")){ACT.uniColor({p:id.slice(3),v:e.target.value});save();render();return}
  if(id.startsWith("sw-")&&canEditSched()){doSwap(+id.slice(3),+e.target.value);save();render()}
});
document.addEventListener("keydown",e=>{
  const el=e.target;if(!el.id||!el.id.startsWith("nm-"))return;
  if(e.key==="Enter"){e.preventDefault();ACT.saveName({id:el.id.slice(3)});save();render()}
  else if(e.key==="Escape"){S.editing=null;render()}
});

// ===================== BOOT =====================
window.claude?.hot?.snapshot?.(()=>({S}));
// One-time repair for saves from before the development fix: a practice drill let your players climb to 99.
// Ratings above 84 on teams you've coached are pulled back toward realistic levels; everyone keeps their rank order.
function fixInflation(){
  if(!S||S.fix99)return;S.fix99=true;
  const ids=new Set([S.user,S.firstTeam,...(S.history||[]).map(h=>h.team)].filter(x=>x!=null));let n=0,top=0;
  for(const id of ids){const t=S.teams[id];if(!t)continue;for(const p of t.roster)if(p.ovr>84){top=Math.max(top,p.ovr);p.ovr=Math.round(84+(p.ovr-84)*.45);n++}}
  if(S.prac)S.prac.dev=Math.min(1.5,S.prac.dev||0);
  if(n)news(`Ratings repair: ${n} of your players were brought back to realistic levels (your best was ${top} OVR before). Development now slows near the top of the scale.`);
  try{save()}catch(e){}
}
function start(data){
  S=(data&&data.S)||null;if(S){fixInflation();buildPL();RK.key=null}
  render();
  if(!S)loadSaved().then(s=>{SAVED=s;if(!S&&s)render()});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
