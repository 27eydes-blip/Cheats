<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CBB Dynasty">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}@media (display-mode:standalone){body{padding-top:max(20px,env(safe-area-inset-top))!important;padding-bottom:max(40px,env(safe-area-inset-bottom))!important;overscroll-behavior-y:none}}</style>
<title>CBB Dynasty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: March under the arena lights. Team-colored hero band, glass stat chips, grouped dock nav, hardwood court for live games. */
:root{
  --night:#070a13;--panel:#0f1628;--panel-2:#151e35;--line:#1e2944;--chalk:#f2f5fc;--muted:#97a3c2;
  --amber:#f5b83d;--gold-soft:#f8d27e;--steel:#8fb4ff;--good:#34d399;--bad:#fb7185;
  --glass:rgba(15,22,40,.74);--hair:rgba(255,255,255,.08);--maple:#d9a868;--maple-2:#c7904f;--court-line:rgba(255,255,255,.88);
  --tc1:#1e3a8a;--tc2:#ffffff;
  --display:'Graduate','Rockwell','Courier New',serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--chalk);overflow-x:hidden}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background:radial-gradient(1100px 520px at 50% -220px,color-mix(in srgb,var(--tc1) 38%,transparent),transparent 72%),
    radial-gradient(900px 500px at 50% 120%,color-mix(in srgb,var(--tc1) 14%,transparent),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 96px),var(--night)}
#app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,48px);letter-spacing:.02em;line-height:1.05}
h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em}
h3{font-family:var(--num);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.2em;color:#c9d3ee}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
select{background:var(--panel-2);color:var(--chalk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input[type=range]{width:100%;accent-color:var(--amber)}
details summary{cursor:pointer;color:var(--amber);font-family:var(--num);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
[hidden]{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.eyebrow{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
.stars{color:var(--amber);letter-spacing:.05em;white-space:nowrap}
.tag{display:inline-block;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--panel-2);border:1px solid rgba(255,255,255,.14);color:#cdd5ea;white-space:nowrap}
.tag.amber{color:var(--gold-soft);border-color:rgba(245,184,61,.45)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}

/* Buttons */
.btn{font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;border-radius:14px;color:#1d1400;
  background:linear-gradient(180deg,#ffd987,var(--amber) 58%,#dc9b1c);box-shadow:0 3px 0 #94600a,0 10px 26px rgba(245,184,61,.25),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s ease,filter .15s ease}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #94600a}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.btn.ghost{color:var(--chalk);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);box-shadow:none}
.btn.big{padding:14px 16px;font-size:18px}
.small-btn{font-family:var(--num);font-weight:700;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.small-btn:hover:not(:disabled){border-color:var(--amber)}
.small-btn:disabled{opacity:.35;cursor:not-allowed}
.tab{flex:none;font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.tab.on{background:var(--amber);color:#1a1300;border-color:var(--amber)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.05em;color:#fff;opacity:.85;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{opacity:1}
.plink{font:inherit;color:inherit;padding:0;text-align:left;text-decoration:underline dotted color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
.plink:hover{color:var(--amber)}

/* Panels */
.panel{--pb:color-mix(in srgb,var(--acc,var(--steel)) 45%,transparent);display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid transparent;border-radius:22px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 120px) padding-box,linear-gradient(var(--panel),var(--panel)) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 38%,var(--pb)) border-box;box-shadow:0 16px 40px rgba(0,0,0,.38)}
.panel[data-c]{box-shadow:inset 0 3px 0 color-mix(in srgb,var(--acc) 85%,transparent),0 16px 40px rgba(0,0,0,.38)}
[data-c="blue"]{--acc:var(--steel)}[data-c="amber"]{--acc:var(--amber)}[data-c="good"]{--acc:var(--good)}[data-c="bad"]{--acc:var(--bad)}
.panel>h3,.panel>.row>h3{display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:10px;height:10px;border-radius:3px;flex:none;background:var(--acc,var(--steel));box-shadow:0 0 10px color-mix(in srgb,var(--acc,var(--steel)) 70%,transparent)}
.panel>h3::after{content:"";flex:1;height:1px;margin-left:6px;background:linear-gradient(90deg,var(--line),transparent)}
.panel.warn{--pb:var(--bad)}.panel.warn b{color:var(--bad)}
.panel.event{--pb:var(--amber)}

/* Tables */
.tw{overflow-x:auto;min-width:0;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--num);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8e9aba;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.025)}
.tbl td{padding:7px 8px;border-top:1px solid var(--hair);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover td{background:rgba(255,255,255,.035)}
.tbl tr.me td{background:linear-gradient(90deg,color-mix(in srgb,var(--tc1) 34%,transparent),transparent 85%)!important;color:#fff}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.tbl .sub,.sub{color:var(--muted);font-size:12.5px}
.tbl tr.poshead td{font-family:var(--num);font-weight:700;letter-spacing:.1em;color:var(--gold-soft);background:rgba(255,255,255,.03);padding-top:10px}
.wl{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl.w{color:var(--good)}.wl.l{color:var(--bad)}
.mv{font-family:var(--num);font-weight:700;font-size:13px;color:var(--muted)}.mv.up{color:var(--good)}.mv.dn{color:var(--bad)}
@media (max-width:600px){.tbl th,.tbl td{padding-left:6px;padding-right:6px}.tbl .hm{display:none}}

/* Badges & logos */
.badge{display:inline-grid;place-items:center;min-width:46px;height:28px;padding:0 6px;border-radius:8px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.04em;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--b1,#333) 82%,#fff 18%),var(--b1,#333) 55%,color-mix(in srgb,var(--b1,#333) 80%,#000 20%));color:var(--b2,#fff);
  border:1px solid color-mix(in srgb,var(--b2,#fff) 35%,transparent);box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.logo{display:grid;place-items:center;border-radius:50%;flex:none;font-family:var(--num);font-weight:700;letter-spacing:.04em;color:var(--b2);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--b1) 65%,#fff 35%),var(--b1) 62%);border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.seed{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px;border-radius:5px;background:rgba(255,255,255,.1);font-family:var(--num);font-weight:700;font-size:12.5px;color:var(--gold-soft)}

/* Title screen */
.sel-hero{position:relative;overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:34px 28px 30px;border-radius:28px;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.55);
  background:linear-gradient(180deg,rgba(6,9,20,.15) 20%,rgba(6,9,20,.85) 100%),
    radial-gradient(260px 120px at 50% 78%,rgba(0,0,0,.25),transparent 70%),
    repeating-linear-gradient(90deg,var(--maple) 0 46px,var(--maple-2) 46px 48px,#d39e5d 48px 92px,var(--maple-2) 92px 94px)}
.sel-hero::before{content:"";position:absolute;left:50%;bottom:-120px;width:260px;height:260px;margin-left:-130px;border-radius:50%;border:4px solid var(--court-line);opacity:.45}
.sel-hero::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--court-line);opacity:.35}
.sel-hero .lights{position:absolute;inset:0;pointer-events:none}
.sel-hero .lights i{position:absolute;top:-80px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,225,.5),rgba(255,240,200,.1) 35%,transparent 65%);animation:flicker 5s ease-in-out infinite}
.sel-hero .lights i:first-child{left:-100px}.sel-hero .lights i:last-child{right:-100px;animation-delay:-2.5s}
@keyframes flicker{50%{opacity:.7}}
.sel-hero>*:not(.lights){position:relative;z-index:1}
.sel-hero h1{font-size:clamp(46px,11vw,96px);line-height:.95;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.6)}
.sel-hero .eyebrow{color:#ffd34d;letter-spacing:.3em}
.sel-hero p{color:#e5e9f8;font-size:16px;max-width:62ch;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sel-feats{display:flex;flex-wrap:wrap;gap:8px}
.sel-feats span{font-family:var(--num);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);color:#fff}
.sel-conf{display:flex;align-items:center;gap:10px;margin-top:6px;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:none;color:var(--chalk);scroll-margin-top:12px}
.sel-conf::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:10px}
.team-card{position:relative;display:flex;gap:12px;align-items:center;text-align:left;border-radius:18px;padding:12px 14px;border:1px solid var(--hair);
  background:linear-gradient(115deg,color-mix(in srgb,var(--tc) 38%,var(--panel)) 0%,var(--panel) 58%);box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .15s ease,box-shadow .15s ease}
.team-card:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.45),0 0 0 1px var(--tc)}
.team-card .logo{width:46px;height:46px;font-size:13px;border-width:2px}
.team-card .name{font-weight:600}
.team-card .ovr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1;font-family:var(--num);font-weight:700;font-size:22px}
.team-card .ovr small{font-size:10px;letter-spacing:.14em;color:var(--muted)}

/* Hub header */
.teamband{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;padding:26px 24px 64px;border-radius:26px;color:#fff;border:1px solid rgba(255,255,255,.14);text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:linear-gradient(112deg,transparent 0 57%,rgba(255,255,255,.07) 57% 59.5%,transparent 59.5% 62%,rgba(255,255,255,.045) 62% 63.5%,transparent 63.5%),
    radial-gradient(700px 320px at 12% -20%,color-mix(in srgb,var(--t2) 26%,transparent),transparent 70%),
    linear-gradient(135deg,var(--t1) 0%,color-mix(in srgb,var(--t1) 60%,#000) 62%,color-mix(in srgb,var(--t1) 38%,#000) 100%);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.teamband::after{content:attr(data-wm);position:absolute;right:-10px;bottom:-30px;font-family:var(--display);font-size:clamp(110px,26vw,200px);line-height:1;color:#fff;opacity:.1;pointer-events:none}
.teamband .logo{width:clamp(64px,16vw,84px);height:clamp(64px,16vw,84px);font-size:clamp(18px,4.6vw,24px)}
.tb-name{font-size:clamp(30px,7vw,54px);line-height:.98;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.tb-eyebrow{color:#fff;opacity:.85;letter-spacing:.24em}
.tb-sub{font-family:var(--num);font-size:15px;letter-spacing:.04em;opacity:.92}
.teamband .stars{color:#ffd76a}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin:-50px 14px 0;position:relative;z-index:2}
.chip{--acc:var(--amber);display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--hair);
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--acc) 85%,transparent),0 12px 28px rgba(0,0,0,.4)}
.chip[data-c="good"]{--acc:var(--good)}.chip[data-c="bad"]{--acc:var(--bad)}.chip[data-c="blue"]{--acc:var(--steel)}
.chip span{font-family:var(--num);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
.chip b{font-family:var(--num);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip small{font-size:13px;color:var(--muted);font-weight:500}

/* Dock nav */
.navgroups{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 14px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--hair);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.navg{display:flex;align-items:center;gap:10px;min-width:0}
.navl{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--num);font-weight:700;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);flex:none}
.navg .tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;flex:1;min-width:0}
.navg .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;padding:9px 6px 8px;border-radius:14px;font-size:11.5px;letter-spacing:.08em;background:rgba(255,255,255,.03);border:1px solid var(--hair);color:#b9c2e3}
.navg .tab .ti{font-size:20px;line-height:1}
.navg .tab:hover{background:rgba(255,255,255,.07);color:#fff}
.navg .tab.on{color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc1) 78%,#fff 14%),var(--tc1) 60%,color-mix(in srgb,var(--tc1) 70%,#000));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--tc2) 55%,transparent),0 8px 22px color-mix(in srgb,var(--tc1) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
@media (max-width:600px){.navl{writing-mode:horizontal-tb;transform:none}.navg{flex-direction:column;align-items:stretch}.navg .tabs{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}.navg .tab{font-size:10.5px;padding:8px 4px 7px;letter-spacing:.04em}.navg .tab .ti{font-size:18px}}
.hubgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.hubgrid.solo{grid-template-columns:1fr}
.hubmain,.hubside,.tabbody{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:860px){.hubgrid{grid-template-columns:1fr}}

/* Game day card */
.gameday{position:relative;border-radius:26px;overflow:hidden;padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px;color:#fff;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);
  background:linear-gradient(105deg,color-mix(in srgb,var(--ta) 78%,#0a0f1f) 0%,color-mix(in srgb,var(--ta) 42%,#0a0f1f) 46%,color-mix(in srgb,var(--th) 42%,#0a0f1f) 54%,color-mix(in srgb,var(--th) 78%,#0a0f1f) 100%)}
.gameday::after{content:"";position:absolute;inset:-40% -10% auto;height:70%;pointer-events:none;background:radial-gradient(closest-side at 20% 50%,rgba(255,255,255,.14),transparent),radial-gradient(closest-side at 80% 50%,rgba(255,255,255,.14),transparent);mix-blend-mode:screen}
.gameday>*{position:relative;z-index:1}
.gd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gd-label{font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.gd-tag{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--amber);color:#1a1300}
.gd-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.gd-team{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.gd-rank{font-family:var(--num);font-weight:700;font-size:15px;color:#ffd76a;letter-spacing:.04em}
.gd-team .logo{width:clamp(74px,21vw,100px);height:clamp(74px,21vw,100px);font-size:clamp(20px,5.6vw,28px);text-shadow:none}
.gd-name{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.4vw,23px);line-height:1.1;text-wrap:balance}
.gd-rec{font-family:var(--num);font-size:14px;opacity:.85}
.gd-you{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.18)}
.gd-mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 4px;font-family:var(--num);text-align:center}
.gd-at{font-family:var(--display);font-size:clamp(22px,6vw,32px);opacity:.9}
.gd-kick{font-weight:700;font-size:15px;letter-spacing:.04em}
.gd-odds{display:flex;align-items:flex-end;gap:14px;padding:10px 12px;border-radius:12px;background:rgba(5,8,20,.45);border:1px solid rgba(255,255,255,.1)}
.gd-stat{display:flex;flex-direction:column;gap:4px}
.gd-stat.grow{flex:1;min-width:0}
.gd-stat span{font-family:var(--num);font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.gd-stat b{font-family:var(--num);font-size:20px;line-height:1}
.gd-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.gd-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#ffd76a)}
.gd-venue{text-align:center;font-size:13.5px;opacity:.88}
.gd-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gd-chip{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.03em;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.gd-chip.good{background:color-mix(in srgb,var(--good) 25%,transparent);border-color:var(--good)}
.gd-chip.bad{background:color-mix(in srgb,var(--bad) 25%,transparent);border-color:var(--bad)}
.gd-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.gameday .btn.ghost{background:rgba(5,8,20,.45);border-color:rgba(255,255,255,.3);color:#fff}
.gd-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}

/* Live game */
.wboard{display:grid;grid-template-columns:1fr auto 1fr;background:#05070e;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.ws{display:flex;align-items:center;gap:10px;padding:12px 14px;min-width:0}
.ws.home{flex-direction:row-reverse;text-align:right}
.wn{display:flex;flex-direction:column;font-family:var(--num);font-weight:700;letter-spacing:.06em;min-width:0}
.wn small{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.08em}
.wn small.bonus{color:var(--amber)}
.wsc{font-family:var(--num);font-weight:700;font-size:clamp(36px,9vw,58px);line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;margin-inline:auto;text-shadow:0 0 18px rgba(245,184,61,.35)}
.wpos{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);vertical-align:middle;margin-left:4px}
.wmid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;border-inline:1px solid var(--line);font-family:var(--num);text-align:center}
.wclk{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.wdd{font-size:13px;color:var(--amber);font-weight:600}
.court{display:block;width:100%;height:auto;border-radius:14px;border:2px solid #3b2a17;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.wpbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--num);font-size:14px}
.wpt{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel-2)}
.wpt i{display:block;height:100%}
.wbanner{background:var(--amber);color:#1a1300;font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.02em;padding:12px 16px;border-radius:12px}
.log{display:flex;flex-direction:column;gap:4px;font-size:13.5px;max-height:220px;overflow:auto}
.log div{padding:4px 0;border-top:1px solid var(--line);color:var(--muted)}
.log div.hl{color:var(--chalk);font-weight:600}
.log .t{font-family:var(--num);color:var(--muted);margin-right:6px;font-weight:600}
.oncourt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;font-size:13.5px}
.oncourt div{display:flex;flex-direction:column;gap:2px}
.oncourt span{color:var(--muted)}

/* Misc blocks */
.units{display:grid;grid-template-columns:54px 1fr 30px;gap:6px 10px;align-items:center;font-family:var(--num);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.news{display:flex;flex-direction:column;gap:6px;font-size:14px}
.news div{padding-left:10px;border-left:2px solid var(--line)}
.heads{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.heads div{display:flex;gap:10px;align-items:baseline}
.heads .tag{flex:none;min-width:78px;text-align:center}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.skill{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--amber)}
.schemes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.scheme{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.scheme:hover{border-color:var(--muted)}
.scheme.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.scheme b{font-family:var(--num);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.scheme small{font-size:13px;line-height:1.35}
.aggr{display:flex;gap:6px;flex-wrap:wrap}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.statgrid div{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:10px 12px;background:linear-gradient(160deg,color-mix(in srgb,var(--amber) 10%,var(--panel-2)),var(--panel-2))}
.statgrid .big{font-family:var(--num);font-weight:700;font-size:30px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.statgrid span:last-child{color:var(--muted);font-size:13px}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--night) 70%,transparent);z-index:50}
.busy span{display:flex;align-items:center;gap:12px;font-family:var(--num);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 22px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.busy span::before{content:"🏀";display:inline-block;font-size:24px;animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-8px)}}
.hub-head{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:20px 22px;border-radius:24px;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(112deg,transparent 0 62%,rgba(255,255,255,.06) 62% 64%,transparent 64%),linear-gradient(135deg,color-mix(in srgb,var(--tc1) 70%,#000),color-mix(in srgb,var(--tc1) 30%,var(--panel)) 70%);box-shadow:0 18px 44px rgba(0,0,0,.45)}
.hub-head .eyebrow{color:#ffd34d}
.hub-head .badge{min-width:64px;height:40px;font-size:18px}
.slot{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2)}
.slot.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.cand{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center}
@media (max-width:520px){.cand{grid-template-columns:1fr auto}.cand .hide-sm{display:none}}
.nm{background:var(--panel-2);color:var(--chalk);border:1px solid var(--amber);border-radius:6px;padding:5px 8px;font:inherit;width:min(100%,190px);min-width:0}
.edit{color:var(--muted);font-size:14px;padding:2px 5px;border-radius:4px}
.edit:hover{color:var(--amber);background:var(--panel-2)}

/* Player card */
.phead{display:flex;gap:18px;align-items:center;border-radius:20px;padding:18px 20px;border:1px solid rgba(255,255,255,.15);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pno{font-family:var(--display);font-size:clamp(44px,11vw,80px);line-height:1;flex:none}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:6px 18px}
.attr{display:grid;grid-template-columns:1fr 34px;gap:2px 8px;align-items:center;font-size:13.5px}
.attr .bar{grid-column:1/-1}

/* POY race */
.poy{display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-radius:22px;border:1px solid rgba(245,184,61,.35);
  background:radial-gradient(600px 220px at 50% 0%,rgba(245,184,61,.14),transparent 70%),linear-gradient(180deg,#171208,#0d0b07);box-shadow:0 18px 44px rgba(0,0,0,.45)}
.poy-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.poy-title{font-family:var(--display);font-size:clamp(26px,6.5vw,40px);background:linear-gradient(180deg,#fff3c4,#ffd34d 50%,#c8901a);-webkit-background-clip:text;background-clip:text;color:transparent}
.poy-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.poy-row.mine{border-color:var(--amber)}
.poy-row .rk{font-family:var(--display);font-size:22px;color:#ffd34d;text-align:center}
.poy-row .ln{font-size:13px;color:#d6c79f}
.hbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}.hbar i{display:block;height:100%;background:linear-gradient(90deg,#c8901a,#ffd34d)}

/* Bracket */
.region{display:flex;flex-direction:column;gap:10px}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;align-items:center;min-width:640px}
.rcol{display:flex;flex-direction:column;justify-content:space-around;gap:8px;height:100%}
.rcol h4{margin:0;font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bg{display:flex;flex-direction:column;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;font-size:13px}
.bg.me{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.bt{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 8px}
.bt+.bt{border-top:1px solid var(--hair)}
.bt.lost{opacity:.5}
.bt.won b{color:#fff}
.bt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .sc{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.ffour{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}

/* Champion & selection */
.champ{position:relative;overflow:hidden;border-radius:22px;padding:26px 18px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:#fff;
  background:radial-gradient(520px 260px at 50% 0%,rgba(255,211,77,.35),transparent 70%),linear-gradient(135deg,var(--c1) 0%,#0b0a05 50%,var(--c2) 100%);
  border:2px solid #c8901a;box-shadow:0 14px 50px rgba(255,182,39,.28),0 10px 30px rgba(0,0,0,.55);text-shadow:0 2px 4px rgba(0,0,0,.6)}
.champ::before{content:"";position:absolute;inset:-50%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,211,77,.10) 0 8deg,transparent 8deg 22deg);animation:rays 30s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.champ>*{position:relative}
.champ-kicker{font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#fff3c4}
.champ-title{font-family:var(--display);font-size:clamp(32px,8.5vw,64px);line-height:1}
.champ-team{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:clamp(22px,6vw,38px);line-height:1.05}
.champ-team .logo{width:clamp(60px,15vw,80px);height:clamp(60px,15vw,80px);font-size:clamp(17px,4.4vw,23px)}
.champ-score{font-family:var(--num);font-weight:700;font-size:clamp(22px,6vw,32px)}
.champ-facts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.champ-facts span{font-family:var(--num);font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2)}
.selshow{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:28px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.16);
  background:radial-gradient(500px 220px at 50% 0%,rgba(143,180,255,.25),transparent 70%),linear-gradient(160deg,#101a3a,#0a0f1f 70%)}
.selshow h1{font-size:clamp(32px,8vw,56px)}
.selfate{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:18px;color:#fff;width:100%;
  background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 40%,#000));border:1px solid rgba(255,255,255,.2);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.selfate b{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,38px);line-height:1.05}
.onesd{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;width:100%}
.onesd div{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair);text-align:left}


.rk{color:var(--gold-soft);font-family:var(--num);font-weight:700}
.sec-bad{color:var(--bad)}
#app.enter>*{animation:enterUp .38s cubic-bezier(.2,.75,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:.03s}#app.enter>*:nth-child(3){animation-delay:.06s}#app.enter>*:nth-child(n+4){animation-delay:.09s}
@keyframes enterUp{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app.enter>*,.champ::before,.sel-hero .lights i,.busy span::before{animation:none!important}.team-card,.btn{transition:none}.team-card:hover{transform:none}}
/* ===== Ported from CFB Dynasty 2: magazine, locker room, practice, uniforms, yearbook, trophy room, toasts ===== */
.confs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.confs ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.confs li.me{color:var(--amber)}
.sched{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.srow select{min-width:0;width:100%}
/* ===== Locker room ===== */
.lr-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--panel)),var(--panel) 70%);border:1px solid var(--line);box-shadow:var(--shadow)}
@media (max-width:560px){.lr-head{grid-template-columns:1fr}}
.lr-chem{display:flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.15));border:3px solid rgba(255,255,255,.15);margin:auto;text-align:center}
.lr-chem b{font-family:var(--num);font-size:56px;line-height:1}.lr-chem span:last-child{font-family:var(--num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.lr-info p{margin:0 0 8px}
.lr-talks{display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:14px;color:var(--muted)}
.lr-talks i{width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line)}.lr-talks i.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(255,182,39,.6)}
.lr-talks span{margin-left:4px}
.lr-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lr-row:first-of-type{border-top:0}
@media (max-width:760px){.lr-row{grid-template-columns:1fr}.lr-row .lr-btns{justify-content:flex-start}}
.lr-row.risk .lr-who b{color:var(--bad)}
.lr-who{display:flex;gap:10px;align-items:center}.lr-who b{display:block}.lr-who small{color:var(--muted);font-size:13px}
.lr-ic{font-size:22px;line-height:1}
.lr-meter{display:flex;flex-direction:column;gap:4px}.lr-meter small{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lr-bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}.lr-bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.lr-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.caps div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line))}.caps small{color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,380px);pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#1d2647,#121a31);border:1px solid rgba(255,211,77,.5);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 24px rgba(255,211,77,.18);animation:toastIn .45s cubic-bezier(.2,.8,.2,1) both,toastOut .5s ease 4s both}
.toast .ti{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-size:22px;flex:none;background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),var(--tc);box-shadow:0 0 16px var(--tc)}
.toast small{display:block;font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffd34d}
.toast b{font-family:var(--num);font-size:19px}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){#app.enter>*,.toast,.busy span::before,.ring{animation:none!important}.chip:hover,.pred:hover,.tcard:hover,.case:hover,.offer2:hover{transform:none}}
/* ===== Yearbook ===== */
.yb{border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12)}
.yb-cover{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 45%,#000));text-shadow:0 2px 4px rgba(0,0,0,.45)}
.yb-mast{grid-column:1/-1;font-family:var(--display);font-size:clamp(28px,7vw,48px);line-height:1;border-bottom:3px solid rgba(255,255,255,.8);padding-bottom:8px}
.yb-team{display:flex;align-items:center;gap:12px}.yb-team .gd-logo{width:64px;height:64px;font-size:18px}
.yb-team b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,5.5vw,32px);line-height:1.05}.yb-team span{font-family:var(--num);font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.yb-rec{grid-column:1;display:flex;align-items:baseline;gap:12px}.yb-rec b{font-family:var(--num);font-size:clamp(44px,12vw,72px);line-height:1}.yb-rec span{font-family:var(--num);font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.yb-grade{grid-column:2;grid-row:2/4;align-self:center;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;border:4px solid #ffd34d;color:#ffd34d;font-family:var(--display);font-size:40px;line-height:1;transform:rotate(-10deg);text-shadow:none;background:rgba(0,0,0,.35);box-shadow:0 0 0 3px rgba(0,0,0,.3) inset}
.yb-grade small{font-family:var(--num);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:-14px}
.yb-page{background:#f4ecd8;color:#231d12;padding:20px 18px 24px;display:flex;flex-direction:column;gap:10px;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(35,29,18,.05) 31px 32px)}
.yb-page .plink{color:#231d12;text-decoration-color:rgba(35,29,18,.4)}
.yb-lede{margin:0;font-size:17px;line-height:1.55;font-weight:500}
.yb-lede::first-letter{font-family:var(--display);font-size:44px;float:left;line-height:.9;margin:4px 8px 0 0;color:var(--c1)}
.yb-h{margin:12px 0 2px;font-family:var(--display);font-weight:400;font-size:22px;color:#231d12;border-bottom:2px solid var(--c1);padding-bottom:4px}
.ybgames{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ybg{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:8px;background:#fffaf0;border:1px solid #d9ccae;font-family:var(--num);text-align:center}
.ybg.w{border-bottom:4px solid #1f8a54}.ybg.l{border-bottom:4px solid #b4232c}
.ybg span{font-size:10.5px;letter-spacing:.12em;color:#7a6c4f;min-height:12px}.ybg b{font-size:15px}.ybg small{font-size:12px;color:#5b4f37}
.ybms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.ybm{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:#fffaf0;border:1px solid #d9ccae}
.ybm .pk{color:#8a5a00}.ybm b{font-family:var(--num);font-size:26px}.ybm small{color:#7a6c4f}
.ybmvp{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 18%,#fffaf0),#fffaf0)}
.ybno{font-family:var(--display);font-size:56px;line-height:1;color:var(--c1);min-width:70px;text-align:center}
.ybmvp b{display:block;font-family:var(--display);font-weight:400;font-size:24px}.ybmvp div span{display:block;font-family:var(--num);letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:#5b4f37}.ybmvp small{color:#5b4f37}
.ybl,.ybsup,.ybp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.ybl div,.ybsup div,.ybp div{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#fffaf0;border:1px solid #d9ccae}
.ybl span,.ybsup span,.ybp span{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a5a00}
.ybl b{font-family:var(--num);font-size:28px;line-height:1.1}.ybsup b,.ybp b{font-size:16px}
.ybl small,.ybsup small,.ybp small{color:#5b4f37;font-size:13px}
.ybp i{position:absolute;right:8px;top:8px;font-style:normal;font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;transform:rotate(4deg)}
.ybp i.ok{color:#1f8a54;border:2px solid #1f8a54}.ybp i.no{color:#b4232c;border:2px solid #b4232c}
.ybaw,.ybsen{display:flex;flex-direction:column;gap:6px}.ybaw div,.ybsen div{padding:8px 12px;border-radius:8px;background:#fffaf0;border:1px solid #d9ccae}
.ybaw span,.ybsen small{color:#5b4f37;font-size:13.5px}.ybsen div{display:flex;flex-direction:column}
.yb-sign{margin:14px 0 0;text-align:right;font-style:italic;font-size:17px;color:#5b4f37}
/* ===== Trophy room ===== */
.troom{display:flex;flex-direction:column;gap:14px;padding:20px 16px;border-radius:18px;background:radial-gradient(600px 220px at 50% 0%,rgba(255,211,77,.12),transparent 70%),linear-gradient(180deg,#1b1408,#0e0b06);border:1px solid rgba(255,211,77,.35);box-shadow:var(--shadow)}
.tr-head{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tr-head .eyebrow{color:#ffd34d}.tr-head h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);background:linear-gradient(180deg,#fff3c4,#ffd34d 50%,#c8901a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%;margin-top:6px}
.tr-stats div{display:flex;flex-direction:column;padding:10px;border-radius:10px;background:rgba(255,211,77,.07);border:1px solid rgba(255,211,77,.25)}
.tr-stats b{font-family:var(--num);font-size:28px;color:#ffd34d;line-height:1.1}.tr-stats span{font-size:12.5px;color:#d6c79f}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;padding-bottom:12px;border-bottom:8px solid #3a2a10;box-shadow:0 10px 0 -2px #1d1406}
.case{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 10px 12px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);border-bottom:3px solid var(--c1)}
.case .ci{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,211,77,.55))}
.case.nat{background:linear-gradient(180deg,rgba(255,211,77,.2),rgba(255,211,77,.04));border-color:rgba(255,211,77,.6)}.case.nat .ci{font-size:58px}
.case b{font-size:14px;line-height:1.2;color:#f6ecd2}.case small{font-family:var(--num);font-size:13px;color:#c9b37a;letter-spacing:.06em}
.stops{display:flex;flex-direction:column;gap:6px}.stops div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--panel-2);border-left:4px solid var(--c1)}.stops span{color:var(--muted);font-size:14px}
.books{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding:6px 4px 0;border-bottom:6px solid #3a2a10}
.book{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:54px;height:150px;padding:10px 4px;border-radius:4px 4px 0 0;cursor:pointer;color:#fff;background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 70%,#000),var(--c1) 30%,var(--c1) 70%,color-mix(in srgb,var(--c1) 60%,#000));border:1px solid rgba(255,255,255,.2);border-bottom:0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.book:hover{transform:translateY(-6px)}
.book span{font-family:var(--num);font-weight:700;font-size:15px}.book b{writing-mode:vertical-rl;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.1em}.book small{font-family:var(--num);font-size:12px}
.book i{font-style:normal;font-family:var(--display);font-size:16px;color:#ffd34d}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);opacity:.55;filter:grayscale(.8)}
.ach.on{opacity:1;filter:none;border-color:color-mix(in srgb,var(--tc) 60%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 14%,var(--panel-2)),var(--panel-2))}
.ach .ai{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:22px;flex:none;background:var(--panel);border:2px solid var(--tc)}
.ach.on .ai{box-shadow:0 0 14px color-mix(in srgb,var(--tc) 60%,transparent)}
.ach b{display:block;font-size:15px}.ach small{display:block;color:var(--muted);font-size:13px}.ach em{font-style:normal;font-family:var(--num);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
/* ===== Uniforms ===== */
.uni-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.uni-set{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);cursor:pointer}
.uni-set.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset,0 0 18px rgba(244,114,182,.25)}
.uni-set b{font-family:var(--num);font-size:15px}.uni-set small{font-size:12px;color:var(--muted)}
.unisvg{max-width:100%;height:auto;display:block}
.uni-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:640px){.uni-edit{grid-template-columns:1fr}}
.uni-big{padding:16px;border-radius:14px;background:radial-gradient(circle at 50% 30%,#2a3560,#0d1226 70%);border:1px solid var(--line);display:grid;place-items:center}
.uni-ctl{display:flex;flex-direction:column;gap:10px}
.uni-row{display:flex;flex-direction:column;gap:6px}.uni-row>span{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swc{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.swc.on{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.sw input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:2px;cursor:pointer}
.gd-uni{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--num);font-size:13px}
.gd-uni>span{font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-right:2px}
.uchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-family:var(--num);font-weight:600;font-size:13px;cursor:pointer}
.uchip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.uchip.on{background:#fff;color:#111;border-color:#fff}
/* ===== Preseason magazine ===== */
:root{--g1:#fff3c4;--g2:#ffd34d;--g3:#c8901a}
.mag{display:flex;flex-direction:column;gap:16px}
.mag-intro{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px 0}
.mag-cover{position:relative;overflow:hidden;border-radius:16px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:16px;color:#fff;min-height:420px;
  background:radial-gradient(500px 340px at 85% 45%,rgba(255,255,255,.18),transparent 70%),linear-gradient(150deg,var(--c1) 0%,color-mix(in srgb,var(--c1) 55%,#000) 60%,color-mix(in srgb,var(--c2) 45%,#000) 100%);
  border:1px solid rgba(255,255,255,.2);box-shadow:var(--shadow);text-shadow:0 2px 6px rgba(0,0,0,.55)}
.mc-num{position:absolute;right:-10px;bottom:-40px;font-family:var(--display);font-size:clamp(220px,52vw,380px);line-height:1;color:rgba(255,255,255,.09);pointer-events:none;text-shadow:none}
.mc-top{display:flex;flex-direction:column;gap:4px;border-bottom:4px solid #fff;padding-bottom:8px;position:relative}
.mc-mast{font-family:var(--display);font-size:clamp(44px,13vw,92px);line-height:.9;letter-spacing:.02em;text-transform:uppercase}
.mc-issue{font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#ffd34d}
.mc-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:end;position:relative;flex:1}
.mc-lines{display:flex;flex-direction:column;gap:12px}
.mc-lines div{display:flex;flex-direction:column;border-left:4px solid #ffd34d;padding-left:10px}
.mc-lines b{font-family:var(--num);font-weight:700;font-size:clamp(17px,4.2vw,22px);text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.mc-lines span{font-size:13.5px;opacity:.9}
.mc-star{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px}
.mc-kick{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;background:#ffd34d;color:#1a1300;padding:3px 10px;border-radius:4px;text-shadow:none}
.mc-name{font-family:var(--display);font-size:clamp(40px,10vw,76px);line-height:.92;text-wrap:balance}
.mc-sub{font-family:var(--num);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.mc-head{font-family:var(--display);font-size:clamp(18px,4.4vw,26px);color:#ffd34d;line-height:1.1}
.mc-foot{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.4);padding-top:8px;position:relative}
.mc-bar{margin-left:auto;width:90px;height:22px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px);opacity:.8}
@media (max-width:560px){.mc-body{grid-template-columns:1fr}.mc-star{align-items:flex-start;text-align:left;order:-1}.mag-cover{min-height:0}}
.mag-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:6px}
.mag-toc button{display:flex;gap:8px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--chalk);font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.03em;cursor:pointer}
.mag-toc button:hover{border-color:var(--amber)}
.mag-toc i{font-style:normal;color:var(--amber);font-weight:700}
.mag-h{display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--mc);padding-top:10px;margin-top:10px;scroll-margin-top:12px}
.mag-h span{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mc)}
.mag-h h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6.5vw,40px);line-height:1.05}
.pk{font-family:var(--num);font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.preds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.pred{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.pred b{font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,28px);line-height:1.05}
.pred b .plink{font:inherit;color:inherit}
.pred .ps{font-size:14px;color:var(--muted)}
.pred.big{grid-column:1/-1;align-items:flex-start;color:#fff;background:radial-gradient(400px 160px at 90% 0%,rgba(255,211,77,.25),transparent 70%),linear-gradient(120deg,var(--c1),color-mix(in srgb,var(--c1) 35%,#000));border-color:rgba(255,255,255,.25);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.pred.big b{font-size:clamp(32px,8vw,52px)} .pred.big .ps{color:#fff;font-size:16px} .pred.big .pk{color:#ffd34d}
.pred.mine{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.cfp-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:6px}
.cfp-pick div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel-2);font-size:14px;min-width:0}
.cfp-pick div.me{outline:1px solid var(--amber)}
.cfp-pick i{font-style:normal;font-family:var(--num);font-weight:700;color:var(--amber);min-width:18px}
.cfp-pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfp-pick em{margin-left:auto;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.feature{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 35%,var(--panel)),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--c1) 60%,var(--line))}
.ft-hero{display:flex;gap:14px;align-items:center}
.ft-hero h3{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1;text-transform:none;letter-spacing:0}
.ft-hero h3::before{display:none}
.ft-hero p{margin:4px 0 0;font-size:16px}
.ft-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.ft-cols p{margin:4px 0 0;font-size:14.5px}
.stories{display:flex;flex-direction:column;gap:10px}
.story{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c1)}
.story .sn{font-family:var(--display);font-size:42px;line-height:1;color:var(--purple)}
.story h4{margin:0 0 4px;font-family:var(--num);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase}
.story p{margin:0;font-size:15px;line-height:1.5}
.t10{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.tcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--panel)),var(--panel) 70%);border:1px solid var(--line)}
.tcard.me{border-color:var(--amber)}
.tcard .tr{position:absolute;right:8px;top:-8px;font-family:var(--display);font-size:72px;line-height:1;color:rgba(255,255,255,.12)}
.tcard .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.tcard .th b{font-family:var(--display);font-weight:400;font-size:22px}
.tcard p{margin:0;font-size:14px;position:relative} .tcard em{font-style:normal;color:var(--amber);font-weight:600}
details.panel summary{font-size:15px}
.ups{display:flex;flex-direction:column;gap:8px}
.ua{padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(255,93,108,.14),var(--panel) 60%);border:1px solid rgba(255,93,108,.35)}
.ua.me{border-color:var(--amber)}
.ua .uw{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--bad)}
.ua .um{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--num);font-weight:700;font-size:19px;margin:4px 0}
.ua .um i{font-style:normal;color:var(--muted);font-size:14px}
.ua p{margin:0;font-size:14px;color:#d6dbef}
.goty{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:8px}
.gy{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 14px 12px 52px;border-radius:12px;background:linear-gradient(100deg,color-mix(in srgb,var(--ca) 28%,var(--panel)),var(--panel) 45%,var(--panel) 55%,color-mix(in srgb,var(--ch) 28%,var(--panel)));border:1px solid var(--line)}
.gy.me{border-color:var(--amber)}
.gy .gr{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:30px;color:var(--teal)}
.gy .gm{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:20px}
.gy .gm i{font-style:normal;color:var(--muted);font-size:14px}
.aa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.aac{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c1)}
.aac.me{border-color:var(--amber)}
.aac .ap{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--amber)}
.aac b{font-size:16px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.nums div{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.nums b{font-family:var(--num);font-weight:700;font-size:44px;line-height:1;color:var(--pink);font-variant-numeric:tabular-nums}
.nums span{font-size:14px;color:var(--muted)}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.quotes blockquote{margin:0;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c1);display:flex;flex-direction:column;gap:8px}
.quotes p{margin:0;font-family:var(--display);font-size:19px;line-height:1.25}
.quotes cite{font-style:normal;font-family:var(--num);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* ===== Preseason schedule step ===== */
.pre-step{border:2px solid var(--amber);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--amber) 14%,var(--panel)),var(--panel))}
.pre-step h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,34px)}
.fullsched{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px}
.fullsched div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:14px;min-width:0}
.fullsched div.nc{border-color:color-mix(in srgb,var(--amber) 55%,var(--line))}
.fullsched .wk{font-family:var(--num);color:var(--muted);min-width:34px}
.fullsched .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== Practice ===== */
.prac-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:center;padding:20px;border-radius:24px;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(112deg,transparent 0 60%,rgba(255,255,255,.05) 60% 62%,transparent 62%),linear-gradient(135deg,color-mix(in srgb,var(--tc1) 55%,#000),var(--panel) 75%);box-shadow:0 18px 44px rgba(0,0,0,.45)}
@media (max-width:700px){.prac-head{grid-template-columns:1fr}}
.prac-head h2{font-size:clamp(24px,6vw,34px);line-height:1.05}
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.pms{grid-template-columns:1fr}}
.pm{display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
.pm-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pm-top b{font-size:30px;letter-spacing:0;line-height:1}
.pm-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.pm-bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.pm small{font-size:12px;color:var(--muted)}
.ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.int,.drill{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--hair);color:var(--chalk);cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s}
.int b,.drill b{font-family:var(--num);font-size:19px;letter-spacing:.03em}
.int small,.drill small{font-size:13px;color:var(--muted);line-height:1.35}
.int em,.drill em{font-style:normal;font-family:var(--num);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--amber);margin-top:2px}
.int.on,.drill.on{border-color:var(--amber);background:linear-gradient(160deg,rgba(245,184,61,.16),rgba(245,184,61,.03));box-shadow:0 0 0 1px var(--amber) inset,0 8px 22px rgba(245,184,61,.15)}
.int:disabled,.drill:disabled{opacity:.45;cursor:not-allowed}
.int.on:disabled,.drill.on:disabled{opacity:1}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.drill .di{font-size:26px;line-height:1}
.plog{display:flex;flex-direction:column;gap:10px}.plog div{padding:10px 12px;border-radius:12px;background:var(--panel-2)}.plog p{margin:4px 0 0;font-size:14px;color:#d3d9ec}
:root{--shadow:0 16px 40px rgba(0,0,0,.38)}
.mag-h{--mc:var(--amber)}
.yb-team .logo{width:64px;height:64px;font-size:18px}
.mag-intro h1{font-size:clamp(26px,6vw,40px)}
.bcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.bcm{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.bcp{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;border-radius:8px;border:1px solid var(--hair);background:rgba(255,255,255,.03);font-size:14px;font-weight:600}
.bcp:hover{border-color:var(--muted)}
.bcp.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent);color:#fff}
.bcp.mine{box-shadow:inset 3px 0 0 var(--steel)}
.gd-uni{justify-content:center}


.gdshow{background:linear-gradient(110deg,color-mix(in srgb,var(--ta) 30%,var(--panel)),var(--panel) 45%,var(--panel) 55%,color-mix(in srgb,var(--th) 30%,var(--panel)));--pb:var(--amber)}
.trash{margin:0;padding:12px 14px;border-left:4px solid var(--c1);border-radius:10px;background:rgba(0,0,0,.25)}
.trash p{font-family:var(--display);font-size:18px;line-height:1.3}.trash cite{font-style:normal;font-family:var(--num);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.momo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--num);font-size:13.5px;color:var(--muted)}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden}.mbar i{position:absolute;top:0;bottom:0;transition:width .3s ease}.mbar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.weekly-mast{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--amber);padding-bottom:8px}
.weekly-mast h2{font-size:clamp(22px,5vw,32px)}
.upset{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(255,255,255,.15);box-shadow:var(--shadow);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.upset-k{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.upset-h{font-family:var(--display);font-size:clamp(22px,5.4vw,34px);line-height:1.05;text-wrap:balance}.upset-s{font-family:var(--num);font-size:14px;opacity:.9}
.sec-good{color:var(--good)}
@media (prefers-reduced-motion:reduce){.mbar i{transition:none}}
@media (max-width:560px){.ws{padding:10px 8px;gap:6px}.ws .badge{display:none}.wsc{font-size:34px}.wmid{padding:6px 6px}.wclk{font-size:15px}.wdd{font-size:11.5px}.wn{font-size:13px}.wn small{font-size:11px}.momo{grid-template-columns:1fr;gap:4px}}

.lr-moods{display:flex;gap:10px;justify-content:center}.lr-moods div{display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.12)}
.lr-moods b{font-size:32px;line-height:1}.lr-moods span{font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sos{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}.sos.good{color:var(--good)}.sos.bad{color:var(--bad)}
.sosg .big.good{color:var(--good)}.sosg .big.bad{color:var(--bad)}.sosg small{color:var(--muted)}
.tag.q1{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}.tag.q4{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.selstage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.selstage>p{max-width:62ch;color:#d5dcf5}
.seldots{display:flex;gap:5px}.seldots span{width:18px;height:5px;border-radius:3px;background:var(--line)}.seldots span.on{background:var(--amber)}
.selwait{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 35%,#000));border:1px solid rgba(255,255,255,.2)}
.selwait .logo{width:64px;height:64px;font-size:18px}.selwait b{display:block;font-family:var(--display);font-weight:400;font-size:24px}.selwait span{display:block;font-family:var(--num);font-size:14px;opacity:.9}
.pulse{animation:pulse 1.4s ease-in-out infinite;color:#ffd34d}@keyframes pulse{50%{opacity:.35}}
.selreg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px;width:100%;text-align:left}
.selpair{display:flex;flex-direction:column;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.selt{display:grid;grid-template-columns:24px auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;font-size:14px}.selt+.selt{border-top:1px solid var(--hair)}
.selt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selt small{color:var(--muted);font-family:var(--num)}
.selt.me{background:color-mix(in srgb,var(--amber) 20%,transparent);box-shadow:inset 3px 0 0 var(--amber)}
.selcall{width:100%;padding:14px 16px;border-radius:14px;color:#1a1300;background:linear-gradient(180deg,#ffd987,var(--amber));font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.02em}
.selm{animation:selIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.45s)}
@keyframes selIn{from{opacity:.001;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.bids{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.bids div{display:flex;flex-direction:column;padding:10px;border-radius:10px;background:var(--panel-2)}.bids b{font-family:var(--num);font-size:28px;color:var(--amber);line-height:1}.bids span{font-size:13px;color:var(--muted)}
.selctl{justify-content:center}
@media (prefers-reduced-motion:reduce){.selm,.pulse{animation:none}}

function swapOptions(d){

const PERS={leader:["Leader","Lifts everyone around him. Loves being challenged."],grinder:["Grinder","Just wants to work. Challenges fire him up; praise barely registers."],
  diva:["Diva","Needs the spotlight. Loves praise, hates the bench."],quiet:["Quiet","Keeps to himself. Takes criticism hard."],
  hothead:["Hothead","Plays with fire. Challenge him and it could go either way."],team:["Team-first","Easy to coach. Happy as long as the team wins."]};
const PERS_K=Object.keys(PERS);
function relInit(p){if(!p.per)p.per=wpickP([["leader",1],["grinder",1.4],["diva",.9],["quiet",1],["hothead",.8],["team",1.6]]);if(p.rel==null)p.rel=Math.round(58+rnd()*20);return p}
const relLabel=r=>r>=85?"Thrilled":r>=65?"Happy":r>=45?"Content":r>=25?"Frustrated":"Wants out";
const relIcon=r=>r>=85?"🤩":r>=65?"🙂":r>=45?"😐":r>=25?"😠":"🧳";
const relColor=r=>r>=65?"var(--good)":r>=45?"var(--amber)":"var(--bad)";
function relAdj(p,v){relInit(p);p.rel=clamp(Math.round(p.rel+v),0,100)}
function relLog(txt){S.lrLog=S.lrLog||[];S.lrLog.unshift({txt,k:dayKey()});if(S.lrLog.length>14)S.lrLog.pop()}
// Players expect a role that matches their rating on this roster.
function expectedRole(t,p){const r=t.roster.slice().sort((a,b)=>b.ovr-a.ovr).indexOf(p);return r<5?"starter":r<8?"rotation":"bench"}
function myRotation(){const t=T(S.user);return t.roster.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,8)}
function talkKey(){return S.phase+(S.phase==="regular"?S.day:S.phase==="ctourn"?S.ct.round:S.phase==="ncaa"?S.ncaa.round:"")}
const TALKS_PER_GAME=8;
function talksLeft(){if(!S.talk||S.talk.k!==talkKey())S.talk={k:talkKey(),left:TALKS_PER_GAME,max:TALKS_PER_GAME};else if(S.talk.max!==TALKS_PER_GAME){S.talk.left+=TALKS_PER_GAME-2;S.talk.max=TALKS_PER_GAME}return S.talk.left}
const TALK={praise:"Praise",challenge:"Challenge",promise:"Promise minutes"};
function doTalk(p,k){
  relInit(p);const per=p.per;let v=0,msg="";
  if(k==="praise"){v={diva:8,quiet:7,grinder:2,leader:4,hothead:4,team:4}[per];msg=`You praised ${p.n}.`}
  else if(k==="challenge"){if(per==="hothead"){v=rnd()<.5?9:-9;msg=v>0?`${p.n} took the challenge and lit up practice.`:`${p.n} blew up at you after the challenge.`}else{v={leader:7,grinder:8,diva:-4,quiet:-7,team:3}[per];msg=`You challenged ${p.n}.`}}
  else{v=10;p.promise=true;msg=`You promised ${p.n} more minutes. He expects 20 next game.`}
  relAdj(p,v);relLog(`${msg} ${v>=0?"+":""}${v} (${relLabel(p.rel)}).`);
  if(per==="leader"&&k==="challenge")for(const q of myRotation())if(q!==p)relAdj(q,1);
}
function relAfterGame(gm){
  const u=S.user;if(gm.h!==u&&gm.a!==u)return;const L=S.lastGame,t=T(u),won=gm.winner===u;if(!L)return;
  for(const p of t.roster){
    relInit(p);if(p.inj)continue;const min=((L.box[p.id]||{}).min||0)/60,role=expectedRole(t,p),b=L.box[p.id]||{};
    let v=won?1:-1;
    if(p.per==="team")v*=2;if(p.per==="hothead"&&!won)v-=1;
    if(role==="starter"&&min<20)v-=p.per==="diva"?5:3;else if(role==="rotation"&&min<10)v-=p.per==="diva"?4:2;
    if(b.pts>=20)v+=p.per==="diva"?3:2;
    if(p.promise){if(min<20){v-=15;relLog(`${p.n} only played ${Math.round(min)} minutes after you promised him more. He's furious.`)}else{v+=4;relLog(`${p.n} got his minutes, as promised.`)}p.promise=false}
    relAdj(p,v);
  }
}
function lockerTab(){

    <p class="muted" style="font-size:13px">${Object.values(PERS).map(([n,d])=>`<b>${n}</b>: ${d}`).join(" ")}</p></div>
  ${(S.lrLog||[]).length?`<div class="panel"><h3>Locker room log</h3><div class="news">${S.lrLog.map(l=>`<div>${esc(l.txt)}</div>`).join("")}</div></div>`:""}`;

const INTENSITY={light:{n:"Light",d:"Shootaround and recovery. Fresh legs, less sharpness.",cond:-1,fat:-12,mult:.6,inj:0,max:1},
  normal:{n:"Normal",d:"A standard two-hour practice.",cond:1,fat:2,mult:1,inj:.006,max:2},
  hard:{n:"Hard",d:"Full-contact, up-and-down. Big gains, tired legs and some injury risk.",cond:3,fat:11,mult:1.4,inj:.03,max:3}};
const DRILLS={
  shoot:{n:"Shooting",i:"🎯",d:"Catch-and-shoot reps. Better from three next game."},
  finish:{n:"Finishing",i:"💪",d:"Layup lines through contact. Better at the rim."},
  defense:{n:"Shell defense",i:"🛡️",d:"Rotations and closeouts. Opponents shoot worse."},
  boards:{n:"Rebounding",i:"🧱",d:"Box-out wars. More offensive boards."},
  ball:{n:"Ball security",i:"🤲",d:"Press breaks and two-ball drills. Fewer turnovers."},
  ft:{n:"Free throws",i:"🎳",d:"Pressure free throws at the end of practice."},
  film:{n:"Film study",i:"🎬",d:"Scout the next opponent. A small edge on every trip."},
  cond:{n:"Conditioning",i:"🏃",d:"Suicides and sprints. Builds conditioning for late in games."},
  youth:{n:"Player development",i:"🌱",d:"Extra reps for freshmen and sophomores. They grow more this offseason."},
};
function prac(){if(!S.prac)S.prac={int:"normal",drills:["shoot","defense"],cond:55,fat:20,dev:0,log:[],done:null,pb:null};return S.prac}
function runPractice(){
  const P=prac(),k=talkKey();if(P.done===k)return;P.done=k;
  const I=INTENSITY[P.int],m=I.mult,dr=P.drills.slice(0,I.max),pb={three:0,rim:0,def:0,orb:0,to:0,ft:0,all:0};
  for(const d of dr){if(d==="shoot")pb.three+=.012*m;if(d==="finish")pb.rim+=.012*m;if(d==="defense")pb.def+=.008*m;if(d==="boards")pb.orb+=.025*m;if(d==="ball")pb.to+=.07*m;if(d==="ft")pb.ft+=.035*m;if(d==="film")pb.all+=.005*m;if(d==="cond")P.cond=clamp(P.cond+4*m,0,100);if(d==="youth")P.dev=Math.min(1.5,P.dev+.05*m)}
  P.cond=clamp(P.cond+I.cond,0,100);P.fat=clamp(P.fat+I.fat+6,0,100);
  pb.all-=Math.max(0,P.fat-50)*.0003;pb.late=(P.cond-50)*.00025;P.pb={k,...pb};
  let hurt=null;if(rnd()<I.inj){const c=myRotation().filter(p=>!p.inj&&!(p.star&&!(S.history||[]).length));if(c.length){hurt=pick(c);hurt.inj=1+Math.floor(rnd()*2)}}
  P.log.unshift({k:phaseDate(),txt:`${I.n} practice${dr.length?`: ${dr.map(x=>DRILLS[x].n).join(", ")}`:""}. Conditioning ${Math.round(P.cond)}, fatigue ${Math.round(P.fat)}.${hurt?` ${hurt.n} tweaked something and will miss ${hurt.inj} game${hurt.inj>1?"s":""}.`:""}`});
  if(P.log.length>10)P.log.pop();
  if(hurt)news(`Practice injury: ${hurt.pos} ${hurt.n} will miss ${hurt.inj} game${hurt.inj>1?"s":""}.`);
}
function pracBoost(id){const P=S.prac;return id===S.user&&P&&P.pb&&P.pb.k===talkKey()?P.pb:null}
function pracRest(){const P=prac();P.fat=clamp(P.fat-9,0,100)}
const meter=(l,v,c,sub)=>`<div class="pm"><div class="pm-top"><span>${l}</span><b style="color:${c}">${Math.round(v)}</b></div><div class="pm-bar"><i style="width:${v}%;background:${c}"></i></div><small>${sub}</small></div>`;

const BC_PTS=[10,20,40,80,160,320];
function bcOpen(){const N=S.ncaa;return N&&N.round===1&&!N.games[1]&&N.champ==null}
function bc(){const N=S.ncaa;if(!N.bc)N.bc={picks:[[],[],[],[],[],[]],locked:false,view:1};return N.bc}
// Matchups for round r of your bracket, built from your own earlier picks.
function bcField(r){const N=S.ncaa,B=bc();if(r===1)return N.alive.slice();const prev=B.picks[r-2],f=bcField(r-1),out=[];for(let i=0;i*2<f.length;i++)out.push(prev[i]??null);return out}
function bcPick(r,i,id){const B=bc();if(B.locked)return;B.picks[r-1][i]=id;for(let rr=r;rr<6;rr++){const f=bcField(rr+1);B.picks[rr]=B.picks[rr].map((w,j)=>w!=null&&(f[j*2]===w||f[j*2+1]===w)?w:undefined)}}
function bcComplete(){const B=bc();return [1,2,3,4,5,6].every(r=>{const n=64>>r;for(let i=0;i<n;i++)if(B.picks[r-1][i]==null)return false;return true})}
function bcFillChalk(){const N=S.ncaa,B=bc();for(let r=1;r<=6;r++){const f=bcField(r);for(let i=0;i*2<f.length;i++)if(B.picks[r-1][i]==null){const a=f[i*2],b=f[i*2+1];B.picks[r-1][i]=N.seed[a]<N.seed[b]||(N.seed[a]===N.seed[b]&&netOf(a)<netOf(b))?a:b}}}
function bcLock(){const B=bc();if(B.locked)return;if(!bcComplete())bcFillChalk();B.locked=true;B.chalk=chalkBracket()}
function chalkBracket(){const N=S.ncaa,p=[];let f=N.alive.slice();for(let r=1;r<=6;r++){const w=[];for(let i=0;i*2<f.length;i++){const a=f[i*2],b=f[i*2+1];w.push(N.seed[a]<=N.seed[b]?a:b)}p.push(w);f=w}return p}
function bcScore(picks){const N=S.ncaa;let s=0,max=0;const alive=new Set(N.champ!=null?[N.champ]:N.alive);
  for(let r=1;r<=6;r++){const gs=N.games[r];(picks[r-1]||[]).forEach((w,i)=>{if(gs&&gs[i]){if(gs[i].winner===w){s+=BC_PTS[r-1];max+=BC_PTS[r-1]}}else if(alive.has(w))max+=BC_PTS[r-1]})}
  return {s,max};
}
function fanPercentile(){
  const N=S.ncaa,B=bc();if(N.champ==null||!B.locked)return null;if(B.pctl!=null)return B.pctl;const mine=bcScore(B.picks).s;let beat=0,n=400;
  for(let k=0;k<n;k++){let f=N.alive0.slice();const p=[];for(let r=1;r<=6;r++){const w=[];for(let i=0;i*2<f.length;i++){const a=f[i*2],b=f[i*2+1],pa=1/(1+Math.exp(-(N.seed[b]-N.seed[a])*.22));w.push(rnd()<pa?a:b)}p.push(w);f=w}if(bcScore(p).s<mine)beat++}
  return B.pctl=Math.round(beat/n*100);
}
function bcPanel(){
  const N=S.ncaa;if(!N||(!bcOpen()&&!(N.bc&&N.bc.locked)))return "";

      <p class="muted" style="font-size:13px">Scoring: ${BC_PTS.join(", ")} points per correct pick, first round through the title game.</p></div>`}
  const r=B.view||1,f=bcField(r),games=[];for(let i=0;i*2<f.length;i++)games.push([f[i*2],f[i*2+1],i]);
  const done=r=>{const n=64>>r;for(let i=0;i<n;i++)if(B.picks[r-1][i]==null)return false;return true};
  return `<div class="panel" data-c="amber"><div class="row" style="justify-content:space-between"><h3>Bracket challenge</h3><span class="tag amber">Locks at tip-off</span></div>

    <div class="bcg">${games.map(([a,b,i])=>{const w=B.picks[r-1][i];const btn=id=>id==null?`<span class="sub">Pick earlier round</span>`:`<button class="bcp ${w===id?"on":""} ${id===S.user?"mine":""}" data-act="bcPick" data-r="${r}" data-i="${i}" data-id="${id}"><span class="seed">${N.seed[id]}</span>${esc(T(id).name)}</button>`;
      return `<div class="bcm">${r<=4?`<span class="sub">${REGIONS[Math.floor(i/(8>>(r-1)))]}</span>`:""}${btn(a)}${btn(b)}</div>`}).join("")}</div>

}

function cinderellaCheck(games,r){

    if(w===S.user&&s>=11&&r>=1)unlock("cinderella")}
}
function noteBuzzer(gm,b){

function unlock(k){S.ach=S.ach||{};if(S.ach[k])return;S.ach[k]={season:S.season};S.toasts=(S.toasts||[]).concat(k)}
function showToasts(){
  const q=S&&S.toasts;if(!q||!q.length)return;S.toasts=[];const box=document.getElementById("toasts");if(!box)return;

function gameAch(gm){
  const u=S.user;if(gm.h!==u&&gm.a!==u)return;const won=gm.winner===u,o=gm.h===u?gm.a:gm.h,my=gm.h===u?gm.hs:gm.as;
  if(my>=100)unlock("century");if(!won)return;unlock("firstw");
  const r=rankOf(o);if(r<=25)unlock("ranked");if(r===1)unlock("no1");if(isSeniorNight(gm))unlock("senior");
  let st=0;for(let i=S.results.length-1;i>=0;i--){const g=S.results[i];if(g.h!==u&&g.a!==u)continue;if((g.h===u)===(g.hs>g.as))st++;else break}if(st>=10)unlock("streak10");
  const w=record(u).w;if(w>=20)unlock("w20");if(w>=30)unlock("w30");
}
function seasonAch(){
  const u=S.user,N=S.ncaa,h=S.history.at(-1);
  if(h.regChamp)unlock("regchamp");if(h.confChamp)unlock("ctchamp");if(N.seed[u]!=null)unlock("dance");const w=ncaaWins(u);if(w>=2)unlock("s16");if(w>=4)unlock("f4");
  if(N.champ===u){unlock("title");const p=S.history.at(-2);if(p&&p.champ===p.team&&p.season===S.season-1)unlock("b2b")}
  if(S.poy&&S.poy[0]&&S.poy[0].team===u)unlock("poy");if(h.cl===0&&h.cw>0)unlock("unbeatenconf");
