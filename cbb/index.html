.fullsched .wk{font-family:var(--num);color:var(--muted);min-width:34px}
.fullsched .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== Practice ===== */
.prac-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:center;padding:20px;border-radius:24px;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(112deg,transparent 0 60%,rgba(255,255,255,.05) 60% 62%,transparent 62%),linear-gradient(135deg,color-mix(in srgb,var(--tc1) 55%,#000),var(--panel) 75%);box-shadow:0 18px 44px rgba(0,0,0,.45)}
@media (max-width:700px){.prac-head{grid-template-columns:1fr}}
.prac-head h2{font-size:clamp(24px,6vw,34px);line-height:1.05}
.pms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.pms{grid-template-columns:1fr}}
.pm{display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
.pm-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pm-top b{font-size:30px;letter-spacing:0;line-height:1}
.pm-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.pm-bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.pm small{font-size:12px;color:var(--muted)}
.ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.int,.drill{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--hair);color:var(--chalk);cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s}
.int b,.drill b{font-family:var(--num);font-size:19px;letter-spacing:.03em}
.int small,.drill small{font-size:13px;color:var(--muted);line-height:1.35}
.int em,.drill em{font-style:normal;font-family:var(--num);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--amber);margin-top:2px}
.int.on,.drill.on{border-color:var(--amber);background:linear-gradient(160deg,rgba(245,184,61,.16),rgba(245,184,61,.03));box-shadow:0 0 0 1px var(--amber) inset,0 8px 22px rgba(245,184,61,.15)}
.int:disabled,.drill:disabled{opacity:.45;cursor:not-allowed}
.int.on:disabled,.drill.on:disabled{opacity:1}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.drill .di{font-size:26px;line-height:1}
.plog{display:flex;flex-direction:column;gap:10px}.plog div{padding:10px 12px;border-radius:12px;background:var(--panel-2)}.plog p{margin:4px 0 0;font-size:14px;color:#d3d9ec}
:root{--shadow:0 16px 40px rgba(0,0,0,.38)}
.mag-h{--mc:var(--amber)}
.yb-team .logo{width:64px;height:64px;font-size:18px}
.mag-intro h1{font-size:clamp(26px,6vw,40px)}
.bcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.bcm{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.bcp{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;border-radius:8px;border:1px solid var(--hair);background:rgba(255,255,255,.03);font-size:14px;font-weight:600}
.bcp:hover{border-color:var(--muted)}
.bcp.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent);color:#fff}
.bcp.mine{box-shadow:inset 3px 0 0 var(--steel)}
.gd-uni{justify-content:center}


.gdshow{background:linear-gradient(110deg,color-mix(in srgb,var(--ta) 30%,var(--panel)),var(--panel) 45%,var(--panel) 55%,color-mix(in srgb,var(--th) 30%,var(--panel)));--pb:var(--amber)}
.trash{margin:0;padding:12px 14px;border-left:4px solid var(--c1);border-radius:10px;background:rgba(0,0,0,.25)}
.trash p{font-family:var(--display);font-size:18px;line-height:1.3}.trash cite{font-style:normal;font-family:var(--num);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.momo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--num);font-size:13.5px;color:var(--muted)}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden}.mbar i{position:absolute;top:0;bottom:0;transition:width .3s ease}.mbar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.weekly-mast{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--amber);padding-bottom:8px}
.weekly-mast h2{font-size:clamp(22px,5vw,32px)}
.upset{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(255,255,255,.15);box-shadow:var(--shadow);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.upset-k{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.upset-h{font-family:var(--display);font-size:clamp(22px,5.4vw,34px);line-height:1.05;text-wrap:balance}.upset-s{font-family:var(--num);font-size:14px;opacity:.9}
.sec-good{color:var(--good)}
@media (prefers-reduced-motion:reduce){.mbar i{transition:none}}
@media (max-width:560px){.ws{padding:10px 8px;gap:6px}.ws .badge{display:none}.wsc{font-size:34px}.wmid{padding:6px 6px}.wclk{font-size:15px}.wdd{font-size:11.5px}.wn{font-size:13px}.wn small{font-size:11px}.momo{grid-template-columns:1fr;gap:4px}}

.lr-moods{display:flex;gap:10px;justify-content:center}.lr-moods div{display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.12)}
.lr-moods b{font-size:32px;line-height:1}.lr-moods span{font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sos{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}.sos.good{color:var(--good)}.sos.bad{color:var(--bad)}
.sosg .big.good{color:var(--good)}.sosg .big.bad{color:var(--bad)}.sosg small{color:var(--muted)}
.tag.q1{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}.tag.q4{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.selstage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.selstage>p{max-width:62ch;color:#d5dcf5}
.seldots{display:flex;gap:5px}.seldots span{width:18px;height:5px;border-radius:3px;background:var(--line)}.seldots span.on{background:var(--amber)}
.selwait{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 35%,#000));border:1px solid rgba(255,255,255,.2)}
.selwait .logo{width:64px;height:64px;font-size:18px}.selwait b{display:block;font-family:var(--display);font-weight:400;font-size:24px}.selwait span{display:block;font-family:var(--num);font-size:14px;opacity:.9}
.pulse{animation:pulse 1.4s ease-in-out infinite;color:#ffd34d}@keyframes pulse{50%{opacity:.35}}
.selreg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px;width:100%;text-align:left}
.selpair{display:flex;flex-direction:column;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.selt{display:grid;grid-template-columns:24px auto 1fr auto;gap:8px;align-items:center;padding:7px 10px;font-size:14px}.selt+.selt{border-top:1px solid var(--hair)}
.selt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selt small{color:var(--muted);font-family:var(--num)}
.selt.me{background:color-mix(in srgb,var(--amber) 20%,transparent);box-shadow:inset 3px 0 0 var(--amber)}
.selcall{width:100%;padding:14px 16px;border-radius:14px;color:#1a1300;background:linear-gradient(180deg,#ffd987,var(--amber));font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.02em}
.selm{animation:selIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.45s)}
@keyframes selIn{from{opacity:.001;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.bids{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.bids div{display:flex;flex-direction:column;padding:10px;border-radius:10px;background:var(--panel-2)}.bids b{font-family:var(--num);font-size:28px;color:var(--amber);line-height:1}.bids span{font-size:13px;color:var(--muted)}
.selctl{justify-content:center}
@media (prefers-reduced-motion:reduce){.selm,.pulse{animation:none}}

.bdg{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.03em;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--amber) 14%,var(--panel-2));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.slotc{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;border:1px solid var(--hair);background:linear-gradient(135deg,color-mix(in srgb,var(--c1,#1e2944) 40%,var(--panel)),var(--panel) 70%)}
.slotc.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}.slotc b{font-family:var(--display);font-weight:400;font-size:22px}
.exh{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.exh>div{display:flex;flex-direction:column;gap:6px}
.crowdbar{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}.crowdbar i{height:10px;border-radius:3px;background:var(--panel-2)}.crowdbar i.on{background:var(--amber)}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:22px;border-radius:24px;border:1px solid var(--hair);background:linear-gradient(150deg,color-mix(in srgb,var(--amber) 14%,var(--panel)),var(--panel) 60%);box-shadow:0 16px 40px rgba(0,0,0,.38);transition:transform .15s ease,border-color .15s ease}
.mode:hover{transform:translateY(-3px);border-color:var(--amber)}.mode+.mode{background:linear-gradient(150deg,color-mix(in srgb,var(--steel) 18%,var(--panel)),var(--panel) 60%)}
.mode-i{font-size:40px;line-height:1}.mode b{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,34px)}.mode span:not(.mode-i){color:#d5dcf5;font-size:15px}.mode em{font-style:normal;font-family:var(--num);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--gold-soft)}
.h2hhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:20px 22px;border-radius:24px;border:1px solid var(--hair);background:linear-gradient(135deg,#16224a,var(--panel) 70%);box-shadow:0 18px 44px rgba(0,0,0,.45)}
.h2hrec{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.h2hrec b{font-size:36px;line-height:1;color:var(--amber)}
.codebox{width:100%;min-height:96px;resize:vertical;background:var(--panel-2);color:var(--chalk);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.h2hmatch{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:14px;align-items:center}@media (max-width:700px){.h2hmatch{grid-template-columns:1fr}.h2hmatch .gd-at{text-align:center}}
.h2hteam{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 55%,var(--panel)),var(--panel) 80%);border:1px solid rgba(255,255,255,.15)}
.h2hteam b{display:block;font-family:var(--display);font-weight:400;font-size:24px}
.h2hfinal{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px;border-radius:24px;color:#fff;text-align:center;background:radial-gradient(500px 200px at 50% 0%,rgba(255,211,77,.22),transparent 70%),linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 30%,#000));border:1px solid rgba(255,255,255,.2);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.h2hscore{display:flex;align-items:center;gap:18px}.h2hscore div{display:flex;flex-direction:column;align-items:center;gap:4px}.h2hscore .logo{width:64px;height:64px;font-size:17px}.h2hscore b{font-family:var(--num);font-size:48px;line-height:1}.h2hscore .vs{font-size:30px;opacity:.7}
.h2hwl{font-family:var(--display);font-weight:400;font-size:30px}.h2hwl.w{color:#7ff0bf}.h2hwl.l{color:#ffb1bd}

/* ===== Title screen: broadcast HUD ===== */
:root{--hud:'Chakra Petch','Barlow Condensed',system-ui,sans-serif;--neon:#6ed2ff}
.hx{position:relative;overflow:hidden;min-height:clamp(380px,62vh,560px);display:flex;align-items:flex-end;border-radius:28px;border:1px solid rgba(110,210,255,.22);background:#040713;
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04),0 0 60px rgba(110,210,255,.08)}
.hx.compact{min-height:200px}
.hx-c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hx-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(4,7,19,.85) 0%,rgba(4,7,19,.35) 55%,transparent 80%)}
.hx-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;padding:clamp(22px,4vw,40px);max-width:680px}
.hx-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-family:var(--hud);font-weight:600;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#9fc6ff}
.hx-sep{color:rgba(159,198,255,.4)}
.hx-live{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:6px;background:rgba(255,70,90,.14);border:1px solid rgba(255,70,90,.5);color:#ff8a98}
.hx-live i{width:8px;height:8px;border-radius:50%;background:#ff4d63;box-shadow:0 0 10px #ff4d63;animation:hxpulse 1.4s ease-in-out infinite}
@keyframes hxpulse{50%{opacity:.25}}
.hx-title{display:flex;flex-direction:column;line-height:.86;margin:0}
.hx-cbb{font-family:var(--hud);font-weight:700;font-size:clamp(20px,4.4vw,30px);letter-spacing:.5em;color:var(--neon);text-shadow:0 0 18px rgba(110,210,255,.7)}
.hx-dyn{font-family:var(--display);font-weight:400;font-size:clamp(58px,13vw,124px);letter-spacing:.01em;
  background:linear-gradient(180deg,#ffffff 0%,#e6ecff 38%,#8e9dc9 52%,#f6f8ff 62%,#ffd98a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(110,210,255,.35)) drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.hx.compact .hx-dyn{font-size:clamp(44px,9vw,72px)}
.hx-sub{font-size:clamp(15px,2.2vw,18px);color:#d7e2ff;max-width:46ch;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.hx-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:560px}
.hx-stats div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:rgba(6,12,30,.72);border:1px solid rgba(110,210,255,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hx-stats b{font-family:var(--hud);font-weight:700;font-size:clamp(22px,4.5vw,32px);line-height:1;color:#ffd06a;text-shadow:0 0 14px rgba(255,190,80,.55);font-variant-numeric:tabular-nums}
.hx-stats span{font-family:var(--hud);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9fc6ff}
@media (max-width:520px){.hx-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hx-tick{display:flex;align-items:stretch;overflow:hidden;border-radius:14px;border:1px solid rgba(110,210,255,.2);background:#050916}
.hx-tl{flex:none;display:grid;place-items:center;padding:0 14px;font-family:var(--hud);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#05101f;background:linear-gradient(180deg,#8fe1ff,#3fb6f0)}
.hx-tw{overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.hx-tr{display:flex;width:max-content;animation:hxtick 60s linear infinite}
@keyframes hxtick{to{transform:translateX(-50%)}}
.hx-g{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-right:1px solid rgba(255,255,255,.07);font-family:var(--hud);font-size:14px;white-space:nowrap;color:#aeb9d8}
.hx-g em{font-style:normal;font-size:10.5px;letter-spacing:.16em;color:#6f7fa8}.hx-g i{width:8px;height:8px;border-radius:2px}.hx-g b{font-weight:600}.hx-g b.w{color:#fff}
.modes{gap:16px}
.mode{position:relative;overflow:hidden;isolation:isolate;padding:26px 24px 20px;border-radius:26px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,rgba(18,28,58,.95),rgba(8,12,26,.98));gap:10px}
.mode::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(110,210,255,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(110,210,255,.05) 1px,transparent 1px) 0 0/22px 22px;mask-image:linear-gradient(160deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(160deg,#000,transparent 70%)}
.mode-ring{position:absolute;inset:-1px;z-index:-2;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang,0deg),transparent 0 60%,var(--mc) 75%,transparent 90%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hxspin 5s linear infinite;opacity:.9}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes hxspin{to{--ang:360deg}}
.m-team{--mc:#ffc350}.m-h2h{--mc:#6ed2ff}.mode+.mode{background:linear-gradient(160deg,rgba(18,28,58,.95),rgba(8,12,26,.98))}
.mode:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--mc) 60%,transparent);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--mc) 22%,transparent)}
.mode-i{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,transparent);border:1px solid color-mix(in srgb,var(--mc) 40%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--mc) 25%,transparent)}
.mode-i svg{width:38px;height:38px}
.mode-k{font-family:var(--hud);font-weight:600;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:color-mix(in srgb,var(--mc) 80%,#fff)}
.mode b{font-size:clamp(30px,6vw,40px);line-height:1}
.mode .mode-d{color:#c9d4f2;font-size:15px}
.mode-f{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.mode-f em{font-style:normal;font-family:var(--hud);font-weight:600;font-size:13px;letter-spacing:.06em;color:#e7ecff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mode-go{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--hud);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:7px 12px;border-radius:10px;color:#05101f;background:var(--mc);box-shadow:0 0 18px color-mix(in srgb,var(--mc) 50%,transparent)}
.mode-go i{font-style:normal;transition:transform .15s ease}.mode:hover .mode-go i{transform:translateX(3px)}
.hx-feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hx-feats span{font-family:var(--hud);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:8px;color:#9fc6ff;background:rgba(110,210,255,.06);border:1px solid rgba(110,210,255,.18)}
@media (prefers-reduced-motion:reduce){.hx-tr,.mode-ring,.hx-live i{animation:none}.hx-tr{flex-wrap:wrap;width:auto}}

/* =====================================================================
   HUD theme: the title screen's broadcast look, carried through every screen.
   Arena navy, neon cyan accents, gold readouts, glass panels with corner brackets.
   ===================================================================== */
:root{--night:#040713;--panel:#0a1128;--panel-2:#0f1a38;--line:rgba(110,210,255,.16);--hair:rgba(110,210,255,.10);--chalk:#eef3ff;--muted:#8ea3cf;
  --steel:#6ed2ff;--neon:#6ed2ff;--amber:#ffc350;--gold-soft:#ffd98a;--glass:rgba(8,14,34,.78);--num:'Chakra Petch','Barlow Condensed',system-ui,sans-serif;--hud:'Chakra Petch','Barlow Condensed',system-ui,sans-serif}
html,body{background:var(--night)}
body{background:
  radial-gradient(1100px 520px at 50% -240px,color-mix(in srgb,var(--tc1) 34%,transparent),transparent 72%),
  radial-gradient(800px 500px at 100% 100%,rgba(110,210,255,.07),transparent 70%),
  linear-gradient(rgba(110,210,255,.035) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(110,210,255,.035) 1px,transparent 1px) 0 0/40px 40px,var(--night)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
::selection{background:rgba(110,210,255,.35)}
/* Headings */
h2{font-family:var(--display);letter-spacing:.02em}
h3,.panel h3{font-family:var(--hud);font-weight:600;color:#a9d8ff;letter-spacing:.2em}
.panel h3::before{border-radius:2px;width:8px;height:8px;background:var(--acc,var(--neon));box-shadow:0 0 12px var(--acc,var(--neon))}
.eyebrow{font-family:var(--hud);letter-spacing:.2em}
/* Glass panels with HUD corner brackets */
.panel,.slot,.skill,.scheme,.bg,.selpair,.statgrid div,.bcm{--cb:color-mix(in srgb,var(--acc,var(--neon)) 70%,transparent)}
.panel{border:1px solid rgba(110,210,255,.14);border-radius:18px;
  background:
    linear-gradient(var(--cb),var(--cb)) top left/16px 2px no-repeat,linear-gradient(var(--cb),var(--cb)) top left/2px 16px no-repeat,
    linear-gradient(var(--cb),var(--cb)) bottom right/16px 2px no-repeat,linear-gradient(var(--cb),var(--cb)) bottom right/2px 16px no-repeat,
    linear-gradient(180deg,rgba(110,210,255,.05),rgba(110,210,255,0) 140px),linear-gradient(160deg,rgba(14,24,54,.92),rgba(7,11,26,.94));
  box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.panel[data-c]{box-shadow:inset 0 2px 0 color-mix(in srgb,var(--acc) 80%,transparent),0 18px 44px rgba(0,0,0,.45)}
.panel.event{border-color:rgba(255,195,80,.35)}.panel.warn{border-color:rgba(251,113,133,.45)}
.slot,.skill,.scheme,.cand,.bcm{border-color:rgba(110,210,255,.14)}
.skill,.scheme,.slot{background:linear-gradient(160deg,rgba(18,30,64,.85),rgba(10,16,36,.9))}
.scheme.on,.int.on,.drill.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber),0 0 22px rgba(255,195,80,.18)}
.scheme b,.skill b{font-family:var(--hud);letter-spacing:.04em}
/* Buttons */
.btn{font-family:var(--hud);letter-spacing:.14em;border-radius:12px;background:linear-gradient(180deg,#ffe19a,var(--amber) 55%,#e39b1a);box-shadow:0 0 0 1px rgba(255,220,140,.35),0 8px 24px rgba(255,195,80,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:hover{filter:brightness(1.08);box-shadow:0 0 0 1px rgba(255,220,140,.5),0 10px 30px rgba(255,195,80,.4)}
.btn.ghost{color:#cfe9ff;background:rgba(110,210,255,.06);border:1px solid rgba(110,210,255,.32);box-shadow:inset 0 0 18px rgba(110,210,255,.06)}
.btn.ghost:hover{background:rgba(110,210,255,.12);border-color:var(--neon);box-shadow:0 0 18px rgba(110,210,255,.25)}
.small-btn{font-family:var(--hud);letter-spacing:.04em;border-color:rgba(110,210,255,.25);background:rgba(110,210,255,.06);color:#d8ecff}
.small-btn:hover:not(:disabled){border-color:var(--neon);box-shadow:0 0 12px rgba(110,210,255,.25)}
.tab{font-family:var(--hud);letter-spacing:.08em;border-color:rgba(110,210,255,.2);color:#a9c4ee;background:rgba(110,210,255,.04)}
.tab.on{background:linear-gradient(180deg,#ffe19a,var(--amber));color:#1a1200;border-color:var(--amber);box-shadow:0 0 16px rgba(255,195,80,.35)}
.linkbtn{font-family:var(--hud);letter-spacing:.06em;color:#bfe6ff;text-decoration-color:rgba(110,210,255,.5)}
.tag{font-family:var(--hud);border-radius:6px;letter-spacing:.08em;background:rgba(110,210,255,.06);border-color:rgba(110,210,255,.22);color:#bcd7f7}
.seed{font-family:var(--hud);border-radius:4px;background:rgba(110,210,255,.12);color:#ffd98a}
/* Tables */
.tbl th{font-family:var(--hud);color:#8fc9f2;letter-spacing:.14em;background:rgba(110,210,255,.05);border-bottom-color:rgba(110,210,255,.22)}
.tbl td{border-top-color:rgba(110,210,255,.07)}
.tbl tbody tr:hover td{background:rgba(110,210,255,.06)}
.tbl tr.me td{background:linear-gradient(90deg,color-mix(in srgb,var(--tc1) 30%,transparent),rgba(110,210,255,.04) 85%)!important}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.tbl tr.poshead td{font-family:var(--hud);color:var(--neon);background:rgba(110,210,255,.06)}
.wl,.mv,.sos,.num{font-family:var(--hud)}
/* Team header: keeps the school's colors, adds the broadcast treatment */
.teamband{border:1px solid rgba(110,210,255,.25);border-radius:24px;box-shadow:0 26px 64px rgba(0,0,0,.55),0 0 50px color-mix(in srgb,var(--t1) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.teamband::before{content:"";position:absolute;inset:0;pointer-events:none;animation:none;transform:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(4,7,19,.0),rgba(4,7,19,.35))}
.teamband>*{position:relative;z-index:1}
.tb-eyebrow{font-family:var(--hud);font-weight:600;letter-spacing:.24em;color:#cfe9ff}
.tb-name{background:linear-gradient(180deg,#ffffff 0%,#e6ecff 40%,#a7b4dc 54%,#ffffff 66%,#ffe1a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.tb-sub{font-family:var(--hud);letter-spacing:.04em}
/* Stat chips become scoreboard readouts */
.chip{background:rgba(6,12,30,.82);border:1px solid rgba(110,210,255,.25);border-radius:14px;box-shadow:inset 0 2px 0 color-mix(in srgb,var(--acc) 85%,transparent),0 12px 28px rgba(0,0,0,.45)}
.chip span{font-family:var(--hud);color:#8fc9f2;letter-spacing:.18em}
.chip b{font-family:var(--hud);font-weight:700;color:#ffd06a;text-shadow:0 0 14px rgba(255,190,80,.45)}
.chip[data-c="good"] b{color:#7ff0bf;text-shadow:0 0 14px rgba(52,211,153,.4)}.chip[data-c="bad"] b{color:#ffb1bd;text-shadow:0 0 14px rgba(251,113,133,.4)}.chip[data-c="blue"] b{color:#a9e3ff;text-shadow:0 0 14px rgba(110,210,255,.45)}
.chip small{color:#9fb4dc}
/* Dock nav */
.navgroups{background:rgba(6,12,30,.8);border:1px solid rgba(110,210,255,.18);border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 0 30px rgba(110,210,255,.04)}
.navl{font-family:var(--hud);color:#6fa9d6!important;letter-spacing:.26em}
.navg .tab{font-family:var(--hud);letter-spacing:.06em;border-radius:12px;background:rgba(110,210,255,.04);border-color:rgba(110,210,255,.14);color:#a9c4ee}
.navg .tab:hover{background:rgba(110,210,255,.1);border-color:rgba(110,210,255,.4);color:#fff}
.navg .tab.on{box-shadow:0 0 0 1px var(--neon),0 0 22px rgba(110,210,255,.35),0 8px 22px color-mix(in srgb,var(--tc1) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
/* Game day card and live game */
.gameday{border:1px solid rgba(110,210,255,.28);border-radius:22px;box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 40px rgba(110,210,255,.08),inset 0 1px 0 rgba(255,255,255,.2)}
.gameday::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.gd-at{font-family:var(--hud);font-weight:700;letter-spacing:.2em;color:#a9e3ff;text-shadow:0 0 16px rgba(110,210,255,.7)}
.gd-label,.gd-kick,.gd-rec,.gd-rank,.gd-stat span,.gd-stat b,.gd-chip,.gd-tag,.gd-you{font-family:var(--hud)}
.gd-odds{background:rgba(4,8,20,.62);border-color:rgba(110,210,255,.22)}
.gd-bar i{background:linear-gradient(90deg,#6ed2ff,#ffc350);box-shadow:0 0 12px rgba(255,195,80,.5)}
.gd-chip{border-radius:6px}
.wboard{background:linear-gradient(180deg,#050a1a,#02040c);border:1px solid rgba(110,210,255,.3);border-radius:16px;box-shadow:0 0 40px rgba(110,210,255,.1),0 18px 40px rgba(0,0,0,.5)}
.wsc{font-family:var(--hud);font-weight:700;color:#ffd06a;text-shadow:0 0 22px rgba(255,190,80,.6)}
.wclk{font-family:var(--hud);color:#a9e3ff;text-shadow:0 0 14px rgba(110,210,255,.55)}
.wmid{border-inline-color:rgba(110,210,255,.2)}
.court{border:1px solid rgba(110,210,255,.4);box-shadow:0 0 40px rgba(110,210,255,.15),0 14px 34px rgba(0,0,0,.45)}
.wbanner{font-family:var(--hud);letter-spacing:.03em;border-radius:10px;background:linear-gradient(90deg,#ffe19a,var(--amber));box-shadow:0 0 26px rgba(255,195,80,.35)}
.wpt,.mbar,.bar,.hbar,.lr-bar,.pm-bar,.gd-bar{background:rgba(110,210,255,.08)}
.bar i{background:linear-gradient(90deg,#6ed2ff,#ffc350)}
.log div{border-top-color:rgba(110,210,255,.08)}.log .t{color:#6fa9d6}
/* Misc surfaces */
.hub-head,.prac-head,.lr-head,.h2hhead{border:1px solid rgba(110,210,255,.22);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 40px rgba(110,210,255,.06)}
.statgrid div{background:linear-gradient(160deg,rgba(110,210,255,.07),rgba(10,16,36,.9));border:1px solid rgba(110,210,255,.14)}
.statgrid .big{font-family:var(--hud);color:#ffd06a;text-shadow:0 0 14px rgba(255,190,80,.4)}
.poy{border-color:rgba(255,195,80,.4);box-shadow:0 0 40px rgba(255,195,80,.08),0 18px 44px rgba(0,0,0,.45)}
.bg{border-color:rgba(110,210,255,.16);background:rgba(12,20,44,.9)}.bg.me{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset,0 0 16px rgba(255,195,80,.2)}
.selshow,.champ{border-color:rgba(110,210,255,.3)}
.busy span{font-family:var(--hud);border-color:rgba(110,210,255,.35);box-shadow:0 0 40px rgba(110,210,255,.2),0 18px 50px rgba(0,0,0,.5)}
.nm,select,.codebox{border-color:rgba(110,210,255,.3);background:rgba(10,18,40,.9)}
.toast{border-color:rgba(110,210,255,.45);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 24px rgba(110,210,255,.2)}
.badge{border-radius:6px}
@media (prefers-reduced-motion:reduce){body::after{display:none}}

/* live floor, WP chart, arena, feed */
.courtwrap{position:relative}
.court-fl{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);pointer-events:none;border-radius:12px}
.wpc{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch;margin:4px 0 10px;padding:8px 10px;border:1px solid rgba(110,210,255,.25);border-radius:10px;background:rgba(4,10,24,.55)}
.wpc svg{width:100%;height:70px;display:block}
.wpc-l{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.06em}
.arena{display:block;width:100%;height:auto;border-radius:12px;border:1px solid rgba(110,210,255,.3);margin:8px 0 12px}
.feed{display:flex;flex-direction:column;gap:2px}
.post{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(110,210,255,.12)}
.post:last-child{border-bottom:0}
.post p{margin:3px 0 4px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.pav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;background:linear-gradient(135deg,#1b3a6b,#6ed2ff);color:#04101f}
.ph{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.ph .sub{font-size:12.5px}
.pver{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#6ed2ff;color:#04101f;font-size:9px;font-weight:700}
.pf{display:flex;gap:16px;font-family:var(--num);font-size:12px;color:var(--muted)}
.rivc{border-left:4px solid var(--c1)}
.m-mp{--mc:#ff8ad8}

/* meltdown, conspiracy board */
.rage{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px;font-family:var(--num);font-size:13px;letter-spacing:.04em}
.rbar{flex:1;min-width:120px;height:8px;border-radius:4px;background:rgba(255,90,90,.12);overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc350,#ff4d4d);transition:width .3s}
.hotbtn{border-color:#ff4d4d!important;color:#fff!important;background:rgba(255,77,77,.25)!important;animation:hotp 1s ease-in-out infinite}
@keyframes hotp{50%{box-shadow:0 0 18px rgba(255,77,77,.7)}}
@media (prefers-reduced-motion: reduce){.hotbtn{animation:none}}
.cork{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px;padding:16px;border-radius:12px;background:radial-gradient(circle at 30% 20%,#7a5a36,#4b3420);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.note{position:relative;padding:18px 14px 12px;background:#f6edcf;color:#2a2214;border-radius:3px;transform:rotate(var(--r));box-shadow:0 8px 18px rgba(0,0,0,.45);font-family:var(--body)}
.note b{display:block;font-size:16px;line-height:1.25;margin-bottom:6px}
.note p{margin:0 0 8px;font-size:14px}
.note .sub,.note .num{color:#5a4a2c;font-size:12px}
.pin{position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#b31212);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.stamp{display:inline-block;margin-top:8px;padding:2px 10px;border:2px solid #7d6a3e;color:#7d6a3e;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-4deg)}
.stamp.ok{border-color:#c21d1d;color:#c21d1d}
.stamp.no{border-color:#2d6b3a;color:#2d6b3a}

/* ===== CLEANUP: compact sticky nav, tidier hub, smoother motion ===== */
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
button{transition:transform .12s ease,background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease}
button:active:not(:disabled){transform:scale(.97)}
.navgroups{position:sticky;top:8px;z-index:30;display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 12px;border-radius:16px;background:rgba(5,10,26,.86);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.navg{flex-direction:row!important;align-items:center!important;gap:8px;min-width:0}
.navl{writing-mode:horizontal-tb!important;transform:none!important;font-size:9.5px;letter-spacing:.2em;opacity:.8}
.navg .tabs{display:flex!important;flex-wrap:wrap;gap:4px;grid-template-columns:none!important}
.navg .tab{flex-direction:row!important;gap:6px!important;width:auto!important;padding:6px 11px!important;border-radius:999px!important;font-size:11.5px!important;letter-spacing:.05em!important;white-space:nowrap}
.navg .tab .ti{font-size:14px!important}
.navg .tab br{display:none}
@media (max-width:720px){
  .navgroups{display:block;padding:6px 0 6px 8px;border-radius:14px;top:4px}
  .navg{gap:6px;padding:2px 0}
  .navl{width:46px;flex:none;font-size:8.5px;letter-spacing:.12em}
  .navg .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-right:8px;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}
  .navg .tabs::-webkit-scrollbar{display:none}
  .navg .tab{padding:6px 10px!important;font-size:11px!important}
  .chips{display:flex!important;overflow-x:auto;scrollbar-width:none;gap:8px!important;margin:-46px 10px 0!important;padding-bottom:4px}
  .chips::-webkit-scrollbar{display:none}
  .chips .chip{flex:0 0 auto;min-width:104px}
}
.swap{animation:swapIn .22s ease both}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.swap{animation:none}}
.enter>*{animation-duration:.3s!important}
.gd-more{margin:10px 0 4px;border:1px solid rgba(110,210,255,.18);border-radius:12px;background:rgba(0,0,0,.18)}
.gd-more>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:center;padding:9px 12px;font-family:var(--hud,var(--num));font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9c4ee}
.gd-more>summary::-webkit-details-marker{display:none}
.gd-more>summary::before{content:"▸";transition:transform .2s}
.gd-more[open]>summary::before{transform:rotate(90deg)}
.gd-more>summary span{font-family:var(--body);font-weight:500;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.gd-more>.gd-uni{padding:0 10px 10px}
.gd-links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.gd-links .linkbtn{font-size:13px}
.dem .scheme small.up{color:#7fe0a6}
.dem .scheme small.down{color:#ff9a9a}
.panel{transition:border-color .2s ease}
.wview{display:flex;flex-direction:column;gap:16px;min-width:0}
.wv-top,.wv-rest{display:contents}
.log>div{animation:none}
.heads>div{display:grid!important;grid-template-columns:minmax(0,104px) 1fr;align-items:start!important;gap:10px}
.heads>div>.tag{justify-self:stretch;text-align:center;margin-top:1px}
.heads .plink{text-align:left;text-decoration:none}
.heads .plink:hover{text-decoration:underline}
.lookgrid{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.lookprev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:14px;background:radial-gradient(circle at 50% 30%,rgba(110,210,255,.15),rgba(0,0,0,.25));border:1px solid rgba(110,210,255,.2);text-align:center;font-size:13px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.lookbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;border:1px solid rgba(110,210,255,.14);background:rgba(110,210,255,.04);color:#a9c4ee;font-size:11px;line-height:1.15;text-align:center;cursor:pointer}
.lookbtn:hover{border-color:rgba(110,210,255,.4);color:#fff}
.lookbtn.on{border-color:var(--neon,#6ed2ff);box-shadow:0 0 16px rgba(110,210,255,.35);color:#fff}
@media (max-width:560px){.lookgrid{grid-template-columns:1fr}.lookprev{flex-direction:row;justify-content:center}.looks{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}}
.coachline{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.coachline svg{flex:none}

/* ===== PHONE ONLY (600px and narrower). Tablets and desktop are untouched. ===== */
@media (max-width:600px){
  body{font-size:14.5px;padding-block:max(12px,env(safe-area-inset-top,0px)) 32px}
  #app{gap:14px}
  .panel{padding:14px 13px!important;border-radius:16px!important}
  .panel h3{font-size:12px;letter-spacing:.16em}
  /* Team header: one tidy block instead of five wrapped lines */
  .teamband{padding:14px 14px 50px!important;gap:12px!important;border-radius:20px!important;align-items:center}
  .teamband .logo{width:54px!important;height:54px!important;font-size:15px!important}
  .teamband>div{min-width:0}
  .tb-eyebrow{font-size:9.5px!important;letter-spacing:.14em!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-name{font-size:clamp(24px,8vw,30px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-sub{font-size:12px!important;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .teamband::after{font-size:84px!important;bottom:-12px!important;opacity:.07!important}
  /* Stat chips: a slim swipeable strip */
  .chips{margin:-38px 8px 0!important;gap:6px!important}
  .chips .chip{min-width:86px!important;padding:8px 10px!important;border-radius:12px!important}
  .chip span{font-size:9px!important;letter-spacing:.12em!important}
  .chip b{font-size:19px!important}
  .chip b small{font-size:10px}
  /* Menu: one swipeable row, groups split by a thin divider */
  .navgroups{display:flex!important;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:0!important;padding:6px 4px!important;top:max(4px,env(safe-area-inset-top,0px))!important;border-radius:14px!important;-webkit-mask:linear-gradient(90deg,#000 90%,transparent);mask:linear-gradient(90deg,#000 90%,transparent)}
  .navgroups::-webkit-scrollbar{display:none}
  .navg{flex:none!important;padding:0!important;gap:4px!important}
  .navg+.navg{border-left:1px solid rgba(110,210,255,.18);margin-left:6px;padding-left:6px!important}
  .navl{width:auto!important;padding:0 2px 0 4px;font-size:8px!important}
  .navg .tabs{overflow:visible!important;-webkit-mask:none!important;mask:none!important;padding-right:0!important}
  .navg .tab{padding:7px 10px!important;font-size:11px!important}
  /* Offseason steps: one swipeable row */
  .hub-head+.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}
  .hub-head+.tabs::-webkit-scrollbar{display:none}
  .hub-head+.tabs .tab{font-size:12px;padding:7px 12px}
  .hub-head{padding:12px 14px!important;gap:10px!important}
  /* Rotation: each player is one clean row */
  .rost tr:not(.poshead){display:grid;grid-template-columns:52px minmax(0,1fr) 26px 28px auto;align-items:center;column-gap:6px;padding:6px 0;border-bottom:1px solid rgba(110,210,255,.08)}
  .rost tr:not(.poshead) td{display:block;padding:0!important;border:0!important}
  .rost td.hm{display:none!important}
  .rost td:nth-child(2){min-width:0}
  .rost td:nth-child(2) .plink{font-weight:700}
  .rost td:nth-child(2) div.sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rost td:nth-child(2)>.sub.num{display:none}
  .rost td:nth-child(2) .plink{display:inline}
  .rost td:first-child .tag{font-size:9.5px;padding:2px 6px}
  .rost .edit{display:none}
  .rost td:last-child{display:flex!important;gap:4px}
  .rost td:last-child .small-btn{padding:5px 8px;min-width:32px}
  .rost tr.poshead td{padding-top:12px!important}
  /* Tables: dates and numbers stay on one line */
  .tbl td.sub:first-child{white-space:nowrap;font-size:11.5px}
  .tbl td.n,.tbl th.n{white-space:nowrap}
  /* Game card */
  .gameday{border-radius:20px!important}
  .gd-match{gap:4px!important}
  .gd-actions .btn.big{padding:14px 10px!important;font-size:15px!important}
  /* Live game: court runs edge to edge */
  .courtwrap{margin:0 -8px}
  .wbanner{font-size:15px;padding:12px 14px}
  .log{font-size:13px}
  /* Buttons sized for thumbs */
  .btn{min-height:44px}
  .small-btn{min-height:34px}
}

function buildPreseason(){
  const exp={},O={};for(const t of S.teams)O[t.id]=ovr(t);
  for(const t of S.teams){let e=0;for(const d of S.schedule)for(const [h,a,ev] of d){if(h===t.id)e+=winProb(h,a,ev>0);else if(a===t.id)e+=1-winProb(h,a,ev>0)}exp[t.id]=e}
  return {season:S.season,exp,O};
}

const canGz=typeof CompressionStream!=="undefined"&&typeof DecompressionStream!=="undefined";
async function gz(str){const b=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(),u=new Uint8Array(b);let out="";for(let i=0;i<u.length;i+=32768)out+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(out)}
async function gunz(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}

  const i=from.roster.findIndex(p=>p.emmett&&!p.emMoved);if(i<0)return;const p=from.roster[i];if(p.yr!==1)return;

  if(j<0){let lo=999;to.roster.forEach((q,k)=>{if(q.pos==="PG"&&!q.star&&!q.mp&&q.ovr<lo){lo=q.ovr;j=k}});if(j<0)j=to.roster.length-1}

const canEditSched=()=>S.phase==="regular"&&S.results.length===0&&!S.schedLocked;
function myPair(d){return S.schedule[d].find(p=>p[0]===S.user||p[1]===S.user)}
function playedSet(){const s=new Set();for(const d of S.schedule)for(const [h,a] of d)s.add(pairKey(h,a));return s}
function swapOptions(d){
  const u=S.user,cur=myPair(d);if(!cur)return [];
  const Z=cur[0]===u?cur[1]:cur[0];if(T(Z).conf===T(u).conf||rivalryOf(cur[0],cur[1]))return [];
  const played=playedSet(),out=[];
  for(const p of S.schedule[d]){const [h,a]=p;
    if(h===u||a===u||T(h).conf===T(a).conf||rivalryOf(h,a))continue;
    for(const [X,Y] of [[h,a],[a,h]]){
      if(T(X).conf===T(u).conf||played.has(pairKey(u,X))||T(Z).conf===T(Y).conf||played.has(pairKey(Z,Y)))continue;
      out.push({X,Y,p});
    }
  }
  return out;
}
function doSwap(d,X,quiet){
  const o=swapOptions(d).find(x=>x.X===X);if(!o)return;
  const u=S.user,day=S.schedule[d],ci=day.indexOf(myPair(d)),cur=day[ci],Z=cur[0]===u?cur[1]:cur[0],oi=day.indexOf(o.p);
  day[ci]=cur[0]===u?[u,X,cur[2]]:[X,u,cur[2]];day[oi]=rnd()<.5?[Z,o.Y,o.p[2]]:[o.Y,Z,o.p[2]];
  if(!quiet)refreshSchedule();
}
function refreshSchedule(){RK.key=null;S.pre=buildPreseason();S.seniorDay=null}
function toggleHome(d){const day=S.schedule[d],i=day.indexOf(myPair(d));if(day[i][2])return;day[i]=[day[i][1],day[i][0],0];refreshSchedule()}
function setEvent(k){for(const d of EVENT_DAYS){const p=myPair(d);if(p&&p[2])p[2]=k+1}S.myEvent=k}
function autoSchedule(mode){
  const u=S.user,mine=ovr(T(u)),targets=[mine-4,mine-12,mine-22];let slot=0;
  for(let d=0;d<NC_DAYS;d++){
    const cur=myPair(d);if(!cur)continue;const Z=cur[0]===u?cur[1]:cur[0];
    if(T(Z).conf===T(u).conf||rivalryOf(cur[0],cur[1]))continue;
    const all=[Z,...swapOptions(d).map(o=>o.X)],tg=targets[slot++%3];
    const sc=x=>{const o=ovr(T(x));return mode==="easy"?-o:mode==="hard"?o:-Math.abs(o-tg)};
    const best=all.sort((a,b)=>sc(b)-sc(a))[0];if(best!==Z)doSwap(d,best,true);
    if(mode==="easy"){const day=S.schedule[d],i=day.indexOf(myPair(d));if(!day[i][2]&&day[i][0]!==u)day[i]=[u,day[i][0],0]}
  }
  refreshSchedule();
}

  const z=poyC.reduce((s,c)=>s+Math.exp(c.v/1.6),0);

// ===================== LOCKER ROOM =====================
const PERS={leader:["Leader","Lifts everyone around him. Loves being challenged."],grinder:["Grinder","Just wants to work. Challenges fire him up; praise barely registers."],
  diva:["Diva","Needs the spotlight. Loves praise, hates the bench."],quiet:["Quiet","Keeps to himself. Takes criticism hard."],
  hothead:["Hothead","Plays with fire. Challenge him and it could go either way."],team:["Team-first","Easy to coach. Happy as long as the team wins."]};
const PERS_K=Object.keys(PERS);
function relInit(p){if(!p.per)p.per=wpickP([["leader",1],["grinder",1.4],["diva",.9],["quiet",1],["hothead",.8],["team",1.6]]);if(p.rel==null)p.rel=Math.round(58+rnd()*20);return p}
const relLabel=r=>r>=85?"Thrilled":r>=65?"Happy":r>=45?"Content":r>=25?"Frustrated":"Wants out";
const relIcon=r=>r>=85?"🤩":r>=65?"🙂":r>=45?"😐":r>=25?"😠":"🧳";
const relColor=r=>r>=65?"var(--good)":r>=45?"var(--amber)":"var(--bad)";
function relAdj(p,v){relInit(p);p.rel=clamp(Math.round(p.rel+v),0,100)}
function relLog(txt){S.lrLog=S.lrLog||[];S.lrLog.unshift({txt,k:dayKey()});if(S.lrLog.length>14)S.lrLog.pop()}
// Players expect a role that matches their rating on this roster.
function expectedRole(t,p){const r=t.roster.slice().sort((a,b)=>b.ovr-a.ovr).indexOf(p);return r<5?"starter":r<8?"rotation":"bench"}
function myRotation(){const t=T(S.user);return t.roster.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,8)}
function talkKey(){return S.phase+(S.phase==="regular"?S.day:S.phase==="ctourn"?S.ct.round:S.phase==="ncaa"?S.ncaa.round:"")}
const TALKS_PER_GAME=8;
function talksLeft(){if(!S.talk||S.talk.k!==talkKey())S.talk={k:talkKey(),left:TALKS_PER_GAME,max:TALKS_PER_GAME};else if(S.talk.max!==TALKS_PER_GAME){S.talk.left+=TALKS_PER_GAME-2;S.talk.max=TALKS_PER_GAME}return S.talk.left}
const TALK={praise:"Praise",challenge:"Challenge",promise:"Promise minutes"};
function doTalk(p,k){
  relInit(p);const per=p.per;let v=0,msg="";
  if(k==="praise"){v={diva:8,quiet:7,grinder:2,leader:4,hothead:4,team:4}[per];msg=`You praised ${p.n}.`}
  else if(k==="challenge"){if(per==="hothead"){v=rnd()<.5?9:-9;msg=v>0?`${p.n} took the challenge and lit up practice.`:`${p.n} blew up at you after the challenge.`}else{v={leader:7,grinder:8,diva:-4,quiet:-7,team:3}[per];msg=`You challenged ${p.n}.`}}
  else{v=10;p.promise=true;msg=`You promised ${p.n} more minutes. He expects 20 next game.`}
  relAdj(p,v);relLog(`${msg} ${v>=0?"+":""}${v} (${relLabel(p.rel)}).`);
  if(per==="leader"&&k==="challenge")for(const q of myRotation())if(q!==p)relAdj(q,1);
}
function relAfterGame(gm){
  const u=S.user;if(gm.h!==u&&gm.a!==u)return;const L=S.lastGame,t=T(u),won=gm.winner===u;if(!L)return;
  for(const p of t.roster){
    relInit(p);if(p.inj)continue;const min=((L.box[p.id]||{}).min||0)/60,role=expectedRole(t,p),b=L.box[p.id]||{};
    let v=won?1:-1;

    if(role==="starter"&&min<20)v-=p.per==="diva"?5:3;else if(role==="rotation"&&min<10)v-=p.per==="diva"?4:2;

  }

    <p class="muted" style="font-size:13px">${Object.values(PERS).map(([n,d])=>`<b>${n}</b>: ${d}`).join(" ")}</p></div>

const INTENSITY={light:{n:"Light",d:"Shootaround and recovery. Fresh legs, less sharpness.",cond:-1,fat:-12,mult:.6,inj:0,max:1},
  normal:{n:"Normal",d:"A standard two-hour practice.",cond:1,fat:2,mult:1,inj:.006,max:2},

const DRILLS={
  shoot:{n:"Shooting",i:"🎯",d:"Catch-and-shoot reps. Better from three next game."},
  finish:{n:"Finishing",i:"💪",d:"Layup lines through contact. Better at the rim."},
  defense:{n:"Shell defense",i:"🛡️",d:"Rotations and closeouts. Opponents shoot worse."},
  boards:{n:"Rebounding",i:"🧱",d:"Box-out wars. More offensive boards."},
  ball:{n:"Ball security",i:"🤲",d:"Press breaks and two-ball drills. Fewer turnovers."},
  ft:{n:"Free throws",i:"🎳",d:"Pressure free throws at the end of practice."},

function prac(){if(!S.prac)S.prac={int:"normal",drills:["shoot","defense"],cond:55,fat:20,dev:0,log:[],done:null,pb:null};return S.prac}

  for(const d of dr){if(d==="shoot")pb.three+=.012*m;if(d==="finish")pb.rim+=.012*m;if(d==="defense")pb.def+=.008*m;if(d==="boards")pb.orb+=.025*m;if(d==="ball")pb.to+=.07*m;if(d==="ft")pb.ft+=.035*m;if(d==="film")pb.all+=.005*m;if(d==="cond")P.cond=clamp(P.cond+4*m,0,100);if(d==="youth")P.dev=Math.min(1.5,P.dev+.05*m)}

  let hurt=null;if(rnd()<I.inj){const c=myRotation().filter(p=>!p.inj&&!(p.star&&!(S.history||[]).length));if(c.length){hurt=pick(c);hurt.inj=1+Math.floor(rnd()*2)}}

  if(P.log.length>10)P.log.pop();

}

// ===================== BRACKET CHALLENGE =====================
const BC_PTS=[10,20,40,80,160,320];
function bcOpen(){const N=S.ncaa;return N&&N.round===1&&!N.games[1]&&N.champ==null}
function bc(){const N=S.ncaa;if(!N.bc)N.bc={picks:[[],[],[],[],[],[]],locked:false,view:1};return N.bc}
// Matchups for round r of your bracket, built from your own earlier picks.
function bcField(r){const N=S.ncaa,B=bc();if(r===1)return N.alive.slice();const prev=B.picks[r-2],f=bcField(r-1),out=[];for(let i=0;i*2<f.length;i++)out.push(prev[i]??null);return out}
function bcPick(r,i,id){const B=bc();if(B.locked)return;B.picks[r-1][i]=id;for(let rr=r;rr<6;rr++){const f=bcField(rr+1);B.picks[rr]=B.picks[rr].map((w,j)=>w!=null&&(f[j*2]===w||f[j*2+1]===w)?w:undefined)}}
function bcComplete(){const B=bc();return [1,2,3,4,5,6].every(r=>{const n=64>>r;for(let i=0;i<n;i++)if(B.picks[r-1][i]==null)return false;return true})}
function bcFillChalk(){const N=S.ncaa,B=bc();for(let r=1;r<=6;r++){const f=bcField(r);for(let i=0;i*2<f.length;i++)if(B.picks[r-1][i]==null){const a=f[i*2],b=f[i*2+1];B.picks[r-1][i]=N.seed[a]<N.seed[b]||(N.seed[a]===N.seed[b]&&netOf(a)<netOf(b))?a:b}}}
function bcLock(){const B=bc();if(B.locked)return;if(!bcComplete())bcFillChalk();B.locked=true;B.chalk=chalkBracket()}
function chalkBracket(){const N=S.ncaa,p=[];let f=N.alive.slice();for(let r=1;r<=6;r++){const w=[];for(let i=0;i*2<f.length;i++){const a=f[i*2],b=f[i*2+1];w.push(N.seed[a]<=N.seed[b]?a:b)}p.push(w);f=w}return p}
function bcScore(picks){const N=S.ncaa;let s=0,max=0;const alive=new Set(N.champ!=null?[N.champ]:N.alive);
  for(let r=1;r<=6;r++){const gs=N.games[r];(picks[r-1]||[]).forEach((w,i)=>{if(gs&&gs[i]){if(gs[i].winner===w){s+=BC_PTS[r-1];max+=BC_PTS[r-1]}}else if(alive.has(w))max+=BC_PTS[r-1]})}
  return {s,max};
}
function fanPercentile(){
  const N=S.ncaa,B=bc();if(N.champ==null||!B.locked)return null;if(B.pctl!=null)return B.pctl;const mine=bcScore(B.picks).s;let beat=0,n=400;
  for(let k=0;k<n;k++){let f=N.alive0.slice();const p=[];for(let r=1;r<=6;r++){const w=[];for(let i=0;i*2<f.length;i++){const a=f[i*2],b=f[i*2+1],pa=1/(1+Math.exp(-(N.seed[b]-N.seed[a])*.22));w.push(rnd()<pa?a:b)}p.push(w);f=w}if(bcScore(p).s<mine)beat++}
  return B.pctl=Math.round(beat/n*100);
}
function bcPanel(){
  const N=S.ncaa;if(!N||(!bcOpen()&&!(N.bc&&N.bc.locked)))return "";
  const B=bc();
  if(B.locked){const sc=bcScore(B.picks),ch=bcScore(B.chalk||chalkBracket()),champPick=B.picks[5][0],p=fanPercentile();
    return `<div class="panel" data-c="amber"><div class="row" style="justify-content:space-between"><h3>Your bracket</h3><span class="tag amber">${sc.s} pts</span></div>
      <div class="statgrid"><div><span class="big">${sc.s}</span><span>Points</span></div><div><span class="big">${sc.max}</span><span>Max possible</span></div><div><span class="big">${ch.s}</span><span>Chalk bracket</span></div><div><span class="big">${champPick!=null?esc(T(champPick).abbr):"—"}</span><span>Your champion pick</span></div>${p!=null?`<div><span class="big">${p}%</span><span>Of fan brackets beaten</span></div>`:""}</div>
      <p class="muted" style="font-size:13px">Scoring: ${BC_PTS.join(", ")} points per correct pick, first round through the title game.</p></div>`}
  const r=B.view||1,f=bcField(r),games=[];for(let i=0;i*2<f.length;i++)games.push([f[i*2],f[i*2+1],i]);
  const done=r=>{const n=64>>r;for(let i=0;i<n;i++)if(B.picks[r-1][i]==null)return false;return true};
  return `<div class="panel" data-c="amber"><div class="row" style="justify-content:space-between"><h3>Bracket challenge</h3><span class="tag amber">Locks at tip-off</span></div>

    <div class="bcg">${games.map(([a,b,i])=>{const w=B.picks[r-1][i];const btn=id=>id==null?`<span class="sub">Pick earlier round</span>`:`<button class="bcp ${w===id?"on":""} ${id===S.user?"mine":""}" data-act="bcPick" data-r="${r}" data-i="${i}" data-id="${id}"><span class="seed">${N.seed[id]}</span>${esc(T(id).name)}</button>`;
      return `<div class="bcm">${r<=4?`<span class="sub">${REGIONS[Math.floor(i/(8>>(r-1)))]}</span>`:""}${btn(a)}${btn(b)}</div>`}).join("")}</div>
    <div class="row"><button class="small-btn" data-act="bcChalk">Fill the rest with higher seeds</button><button class="small-btn" data-act="bcReset">Start over</button>${bcComplete()?'<span class="tag good">Bracket complete</span>':""}</div></div>`;
}

function cinderellaCheck(games,r){

    if(w===S.user&&s>=11&&r>=1)unlock("cinderella")}
}
function noteBuzzer(gm,b){

function shotOfYear(){const L=(S.bzz||[]).filter(b=>b.season===S.season);return L.sort((a,b)=>b.imp-a.imp||(b.tid===S.user)-(a.tid===S.user))[0]||null}

const TIER_C={bronze:"#cd8a4f",silver:"#c7d0dc",gold:"#ffd34d"};
function unlock(k){S.ach=S.ach||{};if(S.ach[k])return;S.ach[k]={season:S.season};S.toasts=(S.toasts||[]).concat(k)}
function showToasts(){
  const q=S&&S.toasts;if(!q||!q.length)return;S.toasts=[];const box=document.getElementById("toasts");if(!box)return;
  q.forEach((k,i)=>{const a=ACH[k];if(!a)return;const el=document.createElement("div");el.className="toast";el.style.setProperty("--tc",TIER_C[a[3]]);el.style.animationDelay=`${i*.25}s,${4+i*.25}s`;

function gameAch(gm){
  const u=S.user;if(gm.h!==u&&gm.a!==u)return;const won=gm.winner===u,o=gm.h===u?gm.a:gm.h,my=gm.h===u?gm.hs:gm.as;
  if(my>=100)unlock("century");if(!won)return;unlock("firstw");
  const r=rankOf(o);if(r<=25)unlock("ranked");if(r===1)unlock("no1");if(isSeniorNight(gm))unlock("senior");
  let st=0;for(let i=S.results.length-1;i>=0;i--){const g=S.results[i];if(g.h!==u&&g.a!==u)continue;if((g.h===u)===(g.hs>g.as))st++;else break}if(st>=10)unlock("streak10");
  const w=record(u).w;if(w>=20)unlock("w20");if(w>=30)unlock("w30");
}
function seasonAch(){
  const u=S.user,N=S.ncaa,h=S.history.at(-1);
  if(h.regChamp)unlock("regchamp");if(h.confChamp)unlock("ctchamp");if(N.seed[u]!=null)unlock("dance");const w=ncaaWins(u);if(w>=2)unlock("s16");if(w>=4)unlock("f4");
  if(N.champ===u){unlock("title");const p=S.history.at(-2);if(p&&p.champ===p.team&&p.season===S.season-1)unlock("b2b")}
  if(S.poy&&S.poy[0]&&S.poy[0].team===u)unlock("poy");if(h.cl===0&&h.cw>0)unlock("unbeatenconf");
  if(N.bc&&N.bc.locked&&bcScore(N.bc.picks).s>=800)unlock("bracket");
}

function buildYearbook(){
  const u=S.user,t=T(u),h=S.history.at(-1),N=S.ncaa;
  const games=S.results.filter(g=>g.h===u||g.a===u).map(g=>{const o=g.h===u?g.a:g.h,ms=g.h===u?g.hs:g.as,ts=g.h===u?g.as:g.hs;return {a:T(o).abbr,w:ms>ts,sc:`${ms}-${ts}`,tag:g.type==="ncaa"?"NCAA":g.type==="ct"?"CT":g.neutral?"N":g.h===u?"":"@"}});
  const ps=t.roster.filter(p=>p.s.g>0);const by=k=>ps.slice().sort((a,b)=>k(b)-k(a))[0];
  const mvp=ps.map(p=>({p,v:poyScore(p,u)})).sort((a,b)=>b.v-a.v)[0];
  const pg=(p,k)=>p.s[k]/Math.max(1,p.s.g);
  const lead=[["Points",by(p=>pg(p,"pts")),p=>f1(pg(p,"pts"))+" ppg"],["Rebounds",by(p=>(p.s.orb+p.s.drb)/p.s.g),p=>f1((p.s.orb+p.s.drb)/p.s.g)+" rpg"],["Assists",by(p=>pg(p,"ast")),p=>f1(pg(p,"ast"))+" apg"],["Threes",by(p=>p.s.tpm),p=>p.s.tpm+" made"]]
    .filter(x=>x[1]).map(([l,p,f])=>({l,n:p.n,pid:p.id,v:f(p)}));
  const aw=[];for(const p of t.roster)for(const a of p.aw||[])if(a.startsWith(String(S.season)))aw.push({n:p.n,a:a.slice(5)});
  const seniors=seniorsOf(t).map(p=>({n:p.n,pos:p.pos,line:statLine(p)}));
  const ex=expWins(u),diff=h.w-ex,tw=ncaaWins(u);
  const score=diff*1.2+(h.seed?3:-2)+tw*2.5+(N.champ===u?6:0)+(h.confChamp?1.5:0);
  const grade=score>=12?"A+":score>=8?"A":score>=5?"B+":score>=2?"B":score>=-1?"C":score>=-4?"D":"F";
  const sh=shotOfYear();
  return {season:S.season,team:u,w:h.w,l:h.l,cw:h.cw,cl:h.cl,result:h.result,grade,games,mvp:mvp?{n:mvp.p.n,pid:mvp.p.id,pos:mvp.p.pos,no:mvp.p.no,line:statLine(mvp.p)}:null,lead,aw,seniors,
    shot:sh&&sh.tid===u?{n:PL[sh.pid]?PL[sh.pid].n:"",label:sh.label,opp:T(sh.opp).abbr}:null,exp:Math.round(ex),lede:ybLede(h,ex,tw)};
}
function ybLede(h,ex,tw){
  const t=T(h.team),N=S.ncaa;
  if(N.champ===h.team)return `They'll hang this banner forever. ${t.name} went ${h.w}-${h.l} and cut down the nets in ${N.site}.`;
  if(tw>=4)return `A Final Four season. ${t.name} won ${h.w} games and made it to the last weekend of college basketball.`;
  if(h.seed&&tw>=2)return `${t.name} danced into the second weekend as a No. ${h.seed} seed and finished ${h.w}-${h.l}.`;
  if(h.seed)return `${t.name} went ${h.w}-${h.l} and heard their name on Selection Sunday as a No. ${h.seed} seed.`;
  if(h.w>=ex+3)return `Nobody saw this coming. Picked for about ${Math.round(ex)} wins, ${t.name} won ${h.w}, even without a bid.`;
  return `A ${h.w}-${h.l} season at ${t.arena}. Not the March anyone wanted, but the work for next year starts now.`;
}

// ===================== MOMENTUM, CROWD & HOT HANDS =====================
// g.mom runs from -1 (road team rolling) to +1 (home team rolling). Runs build it, every trip bleeds a little off.
function momShift(g,id,pts){g.mom=clamp((g.mom||0)+(id===g.home?1:-1)*pts*.05*(g.ssT&&g.ssT.includes("silent")?1.3:1)*(S&&(g.home===S.user||g.away===S.user)&&isDem("rock")?1.3:1),-1,1)}
function crowdLevel(g){
  if(g.neutral)return {n:g.type==="ncaa"?"Tournament crowd":"Neutral floor",v:.4};
  const v=clamp((T(g.home).hfa/5)*.7+(g.mom||0)*.3+(g.gd?.12:0),0,1);
  return {n:v>=.85?"Deafening":v>=.65?"Rocking":v>=.45?"Into it":v>=.25?"Restless":"Quiet",v};
}
// Hot and cold hands: three straight makes heats a shooter up, five straight misses turns him cold.
function hcMod(g,p){const s=(g.hc&&g.hc[p.id])||0;return s>=3?.025:s<=-5?-.02:0}
function hcUpdate(g,p,made){
  g.hc=g.hc||{};const s=g.hc[p.id]||0,n=made?Math.max(0,s)+1:Math.min(0,s)-1;g.hc[p.id]=n;
  if(n===3)return ` ${p.n} is HEATING UP.`;if(n===-5)return ` ${p.n} has gone ice cold.`;return "";
}
const hcIcon=(g,p)=>{const s=(g.hc&&g.hc[p.id])||0;return s>=3?"🔥":s<=-5?"🧊":""};

// ===================== COLLEGE GAMEDAY =====================
// One marquee game each week gets the show: a guest picker, a packed student section and a bigger crowd edge.
const GD_DAYS=[6,12,15,18,21,24,27,30];
const GUESTS=["a Hall of Fame point guard","a two-time national champion coach","the school's most famous alum","a chart-topping country singer","a Super Bowl MVP","an Olympic gold medalist","a late-night talk show host","the student section's pick of the week"];
function gamedayFor(day){
  if(S.phase!=="regular"||!GD_DAYS.includes(day))return null;
  S.gd=S.gd||{};const k=S.season+":"+day;if(S.gd[k])return S.gd[k];
  const games=S.schedule[day].map(([h,a,ev])=>({h,a,ev}));if(!games.length)return null;
  const r=id=>Math.min(50,rankOf(id));
  const best=games.map(g=>({g,v:(50-r(g.h))+(50-r(g.a))-Math.abs(r(g.h)-r(g.a))*.3+(rivalryOf(g.h,g.a)?12:0)+(T(g.h).hfa*2)})).sort((x,y)=>y.v-x.v)[0].g;
  const p=winProb(best.h,best.a,best.ev>0),pickH=rnd()<clamp(p+.08,.15,.9);
  return S.gd[k]={day,h:best.h,a:best.a,ev:best.ev,guest:pick(GUESTS),pick:pickH?best.h:best.a};
}
const isGameDay=gm=>{const G=gamedayFor(S.day);return !!G&&gm&&gm.h===G.h&&gm.a===G.a};
function gamedayCard(){
  const G=gamedayFor(S.day);if(!G)return "";const h=T(G.h),a=T(G.a),mine=G.h===S.user||G.a===S.user;
  return `<div class="panel gdshow" style="--th:${h.c1};--ta:${a.c1}"><div class="row" style="justify-content:space-between"><h3>College GameDay</h3><span class="tag amber">Live from ${esc(G.ev?EVENTS[G.ev-1]:h.arena)}</span></div>
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="row" style="gap:8px;flex-wrap:nowrap">${badge(a)}<b>${rankTag(a.id)}${esc(a.name)}</b></span><span class="muted">${G.ev?"vs":"at"}</span><span class="row" style="gap:8px;flex-wrap:nowrap;justify-content:flex-end"><b>${rankTag(h.id)}${esc(h.name)}</b>${badge(h)}</span></div>
    <p>Guest picker, ${esc(G.guest)}, puts on the ${esc(T(G.pick).name)} headgear.${mine?` The whole country is watching ${esc(T(S.user).name)}.`:""}</p>
    <p class="muted" style="font-size:13px">${G.ev?"A neutral floor, but the place is packed.":`The students camped out overnight. ${esc(h.abbr)} get an extra crowd boost.`}</p></div>`;
}
function gamedayResult(gm){
  const G=gamedayFor(S.day);if(!G||gm.h!==G.h||gm.a!==G.a)return;
  const ok=gm.winner===G.pick;wire("GameDay",`${T(gm.winner).name} win the College GameDay game, ${Math.max(gm.hs,gm.as)}-${Math.min(gm.hs,gm.as)}. The guest picker ${ok?"called it":"whiffed"}.`);
}

// ===================== RIVALRY WEEK & TRASH TALK =====================
const isRivalryWeek=()=>S.phase==="regular"&&S.day>=DAYS-3;
function seriesOf(a,b){S.series=S.series||{};return S.series[pairKey(a,b)]||(S.series[pairKey(a,b)]={[a]:0,[b]:0,last:null})}
function seriesNote(gm){if(!rivalryOf(gm.h,gm.a))return;const s=seriesOf(gm.h,gm.a);s[gm.winner]=(s[gm.winner]||0)+1;s.last={season:S.season,w:gm.winner,hs:gm.hs,as:gm.as,h:gm.h,a:gm.a}}
const TRASH=[(p,t)=>`"We're not scared of ${t}. We'll see them on our floor."`,(p,t)=>`"${t} talk a lot for a team that can't guard anybody."`,(p,t)=>`"I've had this game circled since the schedule came out."`,(p,t)=>`"Their fans better bring earplugs. It's going to get loud."`,(p,t)=>`"Honestly? I don't think they're that good."`];
function trashFor(gm){

// Average strength of every opponent (results-adjusted rating), split four ways: overall, played, remaining, non-conference.
function sosData(){

    if(S.phase==="regular")for(let d=S.day;d<DAYS;d++)for(const [h,a] of S.schedule[d]){R[h].push(a);R[a].push(h)}
    for(const day of S.schedule)for(const [h,a] of day)if(T(h).conf!==T(a).conf){NC[h].push(a);NC[a].push(h)}

// ===================== RECRUITING RANKINGS =====================
// Every incoming freshman gets a national and position rank. Team classes are scored by stars and quality.
const rScore=p=>p.ovr+p.st*1.5+(p.ht-HT[p.pos][0])*.15;
const newcomer=(p,year)=>(p.yr===0&&!p.tr&&!p.kind)||(p.kind&&p.joined===year);
function rankRecruits(year){
  const list=allPlayers().filter(([p])=>p.yr===0&&!p.tr&&!p.kind).sort((a,b)=>rScore(b[0])-rScore(a[0])),pc={};
  list.forEach(([p],i)=>{pc[p.pos]=(pc[p.pos]||0)+1;p.rr=i+1;p.prr=pc[p.pos];p.rry=year});
  return list.slice(0,100).map(([p,t])=>({pid:p.id,tid:t.id}));
}
function buildClassRank(year){
  const top100=rankRecruits(year),list=classRankings(null,year),myRank=list.findIndex(x=>x.tid===S.user)+1;
  S.classRank={season:year,list,myRank,top100};
  S.classHist=(S.classHist||[]).filter(h=>h.season!==year).concat({season:year,rank:myRank,team:S.user}).slice(-20);
}
function projRank(c){const sc=c.ovr+c.st*1.5+(c.ht-HT[c.pos][0])*.15;let n=1;for(const t of S.teams)for(const p of t.roster)if(p.yr===0&&!p.tr&&!p.kind&&rScore(p)>sc)n++;return n}
function projTag(c){if(c.kind)return "";const r=projRank(c);return r<=100?`<span class="tag ${r<=25?"amber":""}">Proj. No. ${r} nationally</span>`:'<span class="sub">Unranked</span>'}
function recTag(p){return p.rr&&p.rry===S.season&&p.rr<=100?` <span class="tag ${p.rr<=25?"amber":""}">No. ${p.rr} recruit</span>`:""}
function classTable(list,limit){
  const mineAt=list.findIndex(x=>x.tid===S.user),rows=list.slice(0,limit);if(mineAt>=limit)rows.push(list[mineAt]);
  return `<div class="tw"><table class="tbl"><thead><tr><th class="n">#</th><th>Program</th><th class="n">Signees</th><th>Stars</th><th class="hm">Top signee</th><th class="n">Score</th></tr></thead><tbody>${rows.map(x=>{const i=list.indexOf(x),top=x.top&&PL[x.top]?PL[x.top]:null;
    return `<tr class="${x.tid===S.user?"me":""}"><td class="n">${i+1}</td><td>${teamCell(x.tid)}</td><td class="n">${x.n}</td><td class="sub">${[5,4,3].map(k=>x.st[k]?`${x.st[k]}× ${k}★`:"").filter(Boolean).join(", ")||"—"}</td><td class="hm">${top?`${plink(top.id,top.n)} <span class="sub">${top.pos}${top.rr&&top.rry===S.classRank.season?` · No. ${top.rr}`:""}</span>`:'<span class="sub">—</span>'}</td><td class="n">${x.score}</td></tr>`}).join("")}</tbody></table></div>`;
}
function tabRecruiting(toggle){
  if(!S.classRank||S.classRank.season!==S.season||!S.classRank.top100)buildClassRank(S.season);
  const C=S.classRank,H=(S.classHist||[]).slice().reverse();
  return `<div class="panel" data-c="amber"><div class="row" style="justify-content:space-between"><h3>Class of ${C.season} · team rankings</h3>${toggle}</div>
    <p class="muted" style="font-size:13.5px">Freshmen, JUCO and international signees who joined for ${seasonLabel(C.season)}. Five-stars count the most. ${esc(T(S.user).name)}: No. ${C.myRank} of ${C.list.length}.</p>${classTable(C.list,25)}</div>
  <div class="panel"><h3>Top 100 prospects · Class of ${C.season}</h3><div class="tw"><table class="tbl"><thead><tr><th class="n">#</th><th>Player</th><th class="n">Pos</th><th class="n hm">Ht</th><th>School</th><th class="n">OVR</th></tr></thead><tbody>
    ${C.top100.map((x,i)=>{const p=PL[x.pid];if(!p)return "";const t=S.teams.find(tt=>tt.roster.includes(p))||T(x.tid);return `<tr class="${t.id===S.user?"me":""}"><td class="n">${i+1}</td><td>${plink(p.id,p.n)} <span class="stars" style="font-size:12px">${"★".repeat(p.st)}</span><div class="sub">${esc(archName(p))} · No. ${p.prr} ${p.pos}</div></td><td class="n">${p.pos}</td><td class="n hm">${htStr(p.ht)}</td><td>${badge(t)}</td><td class="n">${p.ovr}</td></tr>`}).join("")}
  </tbody></table></div></div>
  ${H.length?`<div class="panel"><h3>Your recruiting history</h3><div class="tw"><table class="tbl"><tbody>${H.map(h=>`<tr><td class="num">Class of ${h.season}</td><td>${badge(T(h.team))}</td><td class="n">No. ${h.rank}</td></tr>`).join("")}</tbody></table></div></div>`:""}`;

// ===================== PLAYER BADGES =====================
// Earned from a season's production or elite skills. Each one changes the sim, and a player can carry up to three.
const BADGES={
  range:["🎯","Deep Range","+1.5% from three"],finisher:["💪","Finisher","+2% at the rim"],clutch:["🧊","Clutch Shooter","+3% on shots late in close games"],
  lock:["🔒","Lockdown Defender","The man he guards shoots 2% worse"],blocker:["🖐️","Shot Blocker","+3% block chance"],glass:["🧱","Glass Cleaner","Grabs 40% more rebounds"],
  general:["🧠","Floor General","5% fewer team turnovers while he plays, and more assists"],hawk:["🦅","Ball Hawk","60% more steals"],ft:["🎳","Free Throw Ace","+6% at the line"],iron:["🛡️","Iron Man","Half as likely to get hurt"],
};
const hasB=(p,k)=>!!(p&&p.bd&&p.bd.includes(k));
const badgeChips=p=>(p.bd||[]).map(k=>`<span class="bdg" title="${esc(BADGES[k][1])}: ${esc(BADGES[k][2])}">${BADGES[k][0]} ${esc(BADGES[k][1])}</span>`).join("");
const badgeIcons=p=>(p.bd||[]).map(k=>BADGES[k][0]).join("");
function badgeCandidates(p,useStats){
  const a=k=>attrVal(p,k),s=p.s,g=Math.max(1,s.g),out=[];
  if(useStats&&s.g>=10){
    if(s.tpm>=55&&s.tpm/Math.max(1,s.tpa)>=.37)out.push("range");if(s.fta>=60&&s.ftm/s.fta>=.82)out.push("ft");
    if(s.blk/g>=1.8)out.push("blocker");if(s.stl/g>=1.6)out.push("hawk");if((s.orb+s.drb)/g>=8.5)out.push("glass");if(s.ast/g>=5)out.push("general");
    if(a("ins")>=84&&s.pts/g>=12)out.push("finisher");if(s.g>=30&&rnd()<.15)out.push("iron");if(p.yr>=2&&p.ovr>=84&&rnd()<.3)out.push("clutch");
  }
  if(a("thr")>=88)out.push("range");if(a("idef")>=90)out.push("blocker");if(a("reb")>=90)out.push("glass");if(a("pas")>=88)out.push("general");if(a("pdef")>=88)out.push("lock");if(a("ins")>=90)out.push("finisher");
  return [...new Set(out)].filter(k=>!hasB(p,k));
}
function earnBadges(initial){
  for(const t of S.teams)for(const p of t.roster){
    p.bd=p.bd||[];if(p.bd.length>=3)continue;const c=badgeCandidates(p,!initial);if(!c.length)continue;
    if(rnd()>(initial?.5:.6))continue;const k=pick(c);p.bd.push(k);
    if(t.id===S.user&&!initial)news(`${p.n} earned the ${BADGES[k][1]} badge ${BADGES[k][0]}.`);
  }
}
function gameBadges(g){const B={};for(const id of [g.home,g.away])for(const p of T(id).roster)if(p.bd&&p.bd.length)B[p.id]=new Set(p.bd);g.bd=B}
const hasGB=(g,p,k)=>!!(p&&g.bd&&g.bd[p.id]&&g.bd[p.id].has(k));

// ===================== TESTING THE WATERS =====================
// Your early entrants go through the draft process. Make a pitch and some of them come back.
function twReturnChance(x){const base=x.proj<=10?.1:x.proj<=30?.3:x.proj<=60?.55:.75,p=PL[x.pid];return clamp(base+((p&&p.rel!=null?p.rel:60)-60)*.005+(x.pitch==="role"?.22:x.pitch==="stock"?(x.proj>30?.3:.05):0),.03,.95)}
const TW_PITCH={role:["Promise a bigger role","He'd be the focal point next season. Works on anyone."],stock:["Show him his draft stock","Be honest about where he'd go. Convincing if he'd slip to the second round or go undrafted."],bless:["Give your blessing","Support his dream. He leaves, but recruits hear about it (+2 recruiting points)."]};
function twPitch(pid,k){const O=S.off,x=(O.tw||[]).find(z=>z.pid===pid);if(!x||x.status!=="testing"||x.pitch)return;x.pitch=k;if(k==="bless"){x.status="left";O.points+=2;twLeave(x)}
  else if(k==="role"&&PL[pid])relAdj(PL[pid],5)}
function twLeave(x){
  const O=S.off,me=T(S.user),p=PL[x.pid];if(!p)return;const i=me.roster.indexOf(p);if(i<0)return;
  me.openSlots=(me.openSlots||[]).concat(i);O.board.push({i,pos:p.pos,signed:null,cands:boardStars().map(st=>makeProspect(p.pos,st)).concat([makeVet(p.pos,"juco"),makeVet(p.pos,"intl")])});
  O.departed.push({name:p.n,pos:p.pos,ovr:p.ovr,why:"Declared for the NBA draft",pid:p.id});
  if(x.proj<=60){p.draft={y:S.season,round:x.proj<=30?1:2,pick:x.proj};O.draft.push({name:p.n,pos:p.pos,round:p.draft.round,pick:x.proj})}
  S.alumni.push({id:p.id,n:p.n,pos:p.pos,no:p.no,ht:p.ht,st:p.st,ovr:p.ovr,car:p.car||[],aw:p.aw||[],left:"Declared for the NBA draft",draft:p.draft||null,until:S.season});
  news(`${p.n} is keeping his name in the NBA draft${p.draft?` (projected No. ${x.proj})`:""}.`);
}
function twResolve(){
  const O=S.off;for(const x of O.tw||[]){if(x.status!=="testing")continue;
    if(rnd()<twReturnChance(x)){x.status="returned";const p=PL[x.pid];if(p){delete p.draft;relAdj(p,4);news(`${p.n} pulled out of the NBA draft and is coming back!`)}}
    else{x.status="left";twLeave(x)}}
}
function twStep(O){
  return `<div class="panel" data-c="amber"><h3>Testing the waters</h3><p>${O.tw.length} of your players entered the NBA draft process but can still pull out. You get one pitch per player. Their decisions come in when you move on.</p></div>
  <div class="grid2">${O.tw.map(x=>{const p=PL[x.pid];if(!p)return "";const ch=Math.round(twReturnChance(x)*100);return `<div class="slot ${x.status==="returned"?"done":""}">
    <div class="row" style="justify-content:space-between"><b>${plink(p.id,p.n)} <span class="sub">${p.pos} · ${YRS[Math.max(0,p.yr-1)]} · ${p.ovr} OVR</span></b>${badgeIcons(p)}</div>
    <p class="sub">Projected pick: ${x.proj<=60?`No. ${x.proj} (round ${x.proj<=30?1:2})`:"Undrafted"} · Mood: ${relLabel(relInit(p).rel)} · ${x.status==="testing"?`${ch}% chance he returns`:x.status==="returned"?"Coming back":"Gone to the draft"}</p>
    ${x.status==="testing"&&!x.pitch?`<div class="row">${Object.entries(TW_PITCH).map(([k,[l,d]])=>`<button class="small-btn" data-act="twPitch" data-id="${p.id}" data-k="${k}" title="${esc(d)}">${l}</button>`).join("")}</div>`:x.pitch?`<span class="tag">${esc(TW_PITCH[x.pitch][0])}</span>`:""}
  </div>`}).join("")}</div>
  <p class="muted" style="font-size:13px">${Object.values(TW_PITCH).map(([l,d])=>`<b>${l}</b>: ${d}`).join(" ")}</p>`;
}

// ===================== MIDNIGHT MADNESS =====================
const DUNKS=["between-the-legs","360 windmill","off-the-backboard alley-oop","free-throw-line takeoff","reverse jam over a teammate","tomahawk off one foot","double-pump reverse","behind-the-back slam"];
const mmOpen=()=>S.phase==="regular"&&S.results.length===0&&(!S.mm||S.mm.season!==S.season);
function runMidnightMadness(){
  const t=T(S.user),cands=t.roster.slice().sort((a,b)=>attrVal(b,"ath")-attrVal(a,"ath")).slice(0,4);
  const dunk=cands.map(p=>{const one=()=>clamp(Math.round(33+(attrVal(p,"ath")-70)*.3+rnd()*13),30,50);const r=[one(),one()];return {pid:p.id,r,tot:r[0]+r[1],d:[pick(DUNKS),pick(DUNKS)],one}}).sort((a,b)=>b.tot-a.tot);
  // A tie at the top goes to a dunk-off: one more dunk each until somebody wins.
  let off=null;if(dunk[1]&&dunk[0].tot===dunk[1].tot){let x,y,n=0;do{x=dunk[0].one();y=dunk[1].one()}while(x===y&&n++<10);if(y>x)[dunk[0],dunk[1]]=[dunk[1],dunk[0]];off=[Math.max(x,y),Math.min(x,y)]}
  dunk.forEach(d=>delete d.one);
  const st=starters(t),bench=t.roster.filter(p=>!st.includes(p)),avg=L=>L.reduce((s,p)=>s+p.ovr,0)/Math.max(1,L.length);
  const blue=Math.round(34+(avg(st)-70)*.4+rnd()*8),white=Math.round(28+(avg(bench)-70)*.4+rnd()*8);
  const mvp=pick(white>blue?bench:st);
  const att=Math.round(t.cap*clamp(.55+t.pres*.07+(rankOf(S.user)<=25?.1:0),.4,1));
  const hype=clamp(Math.round(3+t.pres+(rankOf(S.user)<=25?2:0)+(dunk[0].r.includes(50)?1:0)+rnd()*2),1,10);
  S.mm={season:S.season,dunk,off,blue,white,mvp:mvp?mvp.id:null,att,hype,bank:1+Math.floor(hype/3)};
  if(PL[dunk[0].pid])award(dunk[0].pid,`${S.season} Midnight Madness dunk champion`);
  news(`Midnight Madness: ${att.toLocaleString("en-US")} fans packed ${t.arena}. ${PL[dunk[0].pid]?PL[dunk[0].pid].n:""} won the dunk contest. Hype ${hype}/10.`);
}
function mmCard(){
  if(mmOpen())return `<div class="panel event mm"><div class="row" style="justify-content:space-between"><h3>Midnight Madness</h3><span class="tag amber">Preseason</span></div><p>Open the doors at midnight: a dunk contest, the Blue-White scrimmage and your first look at the team. A big night builds hype, which brings extra recruiting points next offseason and a louder home opener.</p><div class="row"><button class="btn" data-act="mm">Host Midnight Madness</button></div></div>`;
  const M=S.mm;if(!M||M.season!==S.season||S.results.length>3)return "";
  return `<div class="panel mm" data-c="amber"><div class="row" style="justify-content:space-between"><h3>Midnight Madness</h3><span class="tag amber">Hype ${M.hype}/10</span></div>
    <p class="sub">${M.att.toLocaleString("en-US")} fans · +${M.bank} recruiting points next offseason</p>
    <div class="tw"><table class="tbl"><thead><tr><th>Dunk contest</th><th class="n">Dunk 1</th><th class="n">Dunk 2</th><th class="n">Total</th></tr></thead><tbody>${M.dunk.map((d,i)=>`<tr class="${i?"":"me"}"><td>${i?"":"🏆 "}${PL[d.pid]?plink(d.pid,PL[d.pid].n):"Former player"}<div class="sub">${esc(d.d[0])}, ${esc(d.d[1])}</div></td><td class="n">${d.r[0]===50?"<b>50!</b>":d.r[0]}</td><td class="n">${d.r[1]===50?"<b>50!</b>":d.r[1]}</td><td class="n"><b>${d.tot}</b></td></tr>`).join("")}</tbody></table></div>
    ${M.off?`<p class="sub">Tied at ${M.dunk[0].tot}. Dunk-off: ${M.off[0]} to ${M.off[1]}.</p>`:""}
    <p>Blue-White scrimmage: <b>Blue (starters) ${M.blue}, White (bench) ${M.white}</b>.${M.mvp&&PL[M.mvp]?` MVP: ${plink(M.mvp,PL[M.mvp].n)}.`:""}</p></div>`;
}

async function encodeCode(prefix,obj){

  return prefix+body.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

  const json=m[2]==="Z"?await gunz(b):decodeURIComponent(escape(atob(b)));

const ARC_T={walkon:"Walk-on dream",lastride:"The last ride",breakout:"Breakout season",comeback:"The comeback",thirty:"Chasing 30",revenge:"Revenge tour"};
function arcs(){
  if(isMP())return [];const u=S.user,t=T(u);if(S.arcs&&S.arcs.season===S.season&&S.arcs.team===u)return S.arcs.list;
  const R=t.roster,list=[],used=new Set(),add=(k,p,goal,txt)=>{if(p&&!used.has(p.id)){used.add(p.id);list.push({k,pid:p.id,st:"active",prog:0,goal,txt})}};
  const low=R.slice().sort((a,b)=>a.ovr-b.ovr)[0];add("walkon",low,8,`${low.n} is fighting for a scholarship. He needs real minutes in 8 games.`);
  const sr=R.filter(p=>p.yr===3).sort((a,b)=>b.ovr-a.ovr)[0];if(sr)add("lastride",sr,1,`Senior ${sr.n}'s last ride. Can he get one more trip to the NCAA Tournament?`);
  const yg=R.filter(p=>p.yr<=1).sort((a,b)=>b.ovr-a.ovr)[0];if(yg)add("breakout",yg,12,`${yg.n} is a breakout candidate. Can he average 12 points a game?`);
  const st=R.slice().sort((a,b)=>b.ovr-a.ovr)[0];add("thirty",st,30,`${st.n} has never dropped 30. Is this the year?`);
  const rv=R.find(p=>(p.ex||[]).length);if(rv)add("revenge",rv,1,`${rv.n} transferred in from ${T(rv.ex[rv.ex.length-1]).name}. He wants to beat his old team.`);
  S.arcs={season:S.season,team:u,list};return list;
}
function arcDone(a,ok,msg){a.st=ok?"done":"failed";const p=PL[a.pid];news(`${ok?"📖":"💔"} ${ARC_T[a.k]}: ${msg}`);
  if(ok&&p){if(p.rel!=null)p.rel=Math.min(100,p.rel+10);post({h:"@CBBHypeHouse",n:"CBB Hype House",v:true,txt:`STORY OF THE YEAR? ${msg}`,tag:"Storyline",viral:Math.random()<.4,likes:clout(6),rep:[{h:`@${p.n.split(" ")[0]}${p.no}`,n:p.n,txt:pick(["Dreams do come true 🙏","Couldn't have done it without my brothers","Thank you God. Thank you coach."])},{h:pick(RFAN),n:"",txt:"Crying at a basketball game again 😭"}]})}}
function arcAfter(gm){
  if(isMP()||S.phase==="h2h")return;const u=S.user;if(gm.h!==u&&gm.a!==u)return;const L=S.lastGame,o=gm.h===u?gm.a:gm.h;if(!L)return;
  for(const a of arcs()){if(a.st!=="active")continue;const p=PL[a.pid];if(!p||!T(u).roster.includes(p)){a.st="failed";continue}const b=L.box[p.id];
    if(a.k==="walkon"&&b&&b.min>=240){a.prog++;if(a.prog>=a.goal)arcDone(a,true,`${p.n} earned his scholarship! The locker room mobbed him when coach told them.`)}
    if(a.k==="breakout"){const g=p.s.g;a.prog=g?Math.round(p.s.pts/g*10)/10:0;if(g>=15&&a.prog>=12)arcDone(a,true,`${p.n} has arrived: ${a.prog} points a game.`)}
    if(a.k==="thirty"&&b){a.prog=Math.max(a.prog,b.pts);if(b.pts>=30)arcDone(a,true,`${p.n} finally did it: ${b.pts} points against ${T(o).name}!`)}

  }
  // A star coming back from a long injury becomes a storyline.
  for(const p of T(u).roster){if(p.inj>=3&&!arcs().some(a=>a.pid===p.id&&a.k==="comeback"))arcs().push({k:"comeback",pid:p.id,st:"active",prog:0,goal:15,txt:`${p.n} is out ${p.inj} games. Can he come back strong?`})}

let AC=null;
