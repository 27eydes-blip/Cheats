  <body>
    <!-- shown the instant the page opens (never a blank black screen) until the home screen
         has drawn its first frame; it never takes taps -->
    <div id="splash" aria-hidden="true">
      <div class="logo">GLYDRIFT</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="side-bg"></div>
    <div id="game"></div>
    <div id="storage-note">Private browsing: progress won't save</div>
    <div id="safe-probe"></div>
    <div id="share-modal">
      <img alt="Glydrift result card" />
      <p>Long-press the card to save it, or use the buttons below.</p>
      <div class="row">
        <button data-act="share">SHARE</button>
        <button data-act="save">SAVE</button>
        <button data-act="close">CLOSE</button>
      </div>
    </div>
    <div id="account-modal"><div class="card"></div></div>
    <div id="name-modal">
      <form class="card" autocomplete="off">
        <h2>PICK A NAME</h2>
        <p>Shown on the worldwide leaderboard</p>
        <input
          name="username"
          maxlength="12"
          inputmode="text"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="done"
          placeholder="3–12 letters/numbers"
        />
        <p class="err"></p>
        <div class="row">
          <button type="button" class="alt" data-act="random">RANDOM</button>
          <button type="button" class="alt" data-act="cancel">CANCEL</button>
          <button type="submit" data-act="save">SAVE</button>
        </div>
      </form>
    </div>
    <div id="install-modal">
      <div class="card">
        <h2>ADD TO HOME SCREEN</h2>
        <p class="sub">Play full-screen, offline, with one tap.</p>
        <ol></ol>
        <div class="row">
          <button type="button" data-act="close">GOT IT</button>
        </div>
      </div>
    </div>
  </body>
