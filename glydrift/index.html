-modal p,#install-modal p{color:#bfb6e8;margin:0;font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:16px;font-weight:600}#name-modal input,#install-modal input{letter-spacing:1px;text-align:center;color:#fff;-webkit-user-select:text;user-select:text;background:#0b0520;border:2px solid #b45cff;border-radius:14px;outline:none;padding:12px;font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:26px;font-weight:700;box-shadow:0 0 14px #b45cff66}#name-modal input:focus,#install-modal input:focus{border-color:#3ef4ff;box-shadow:0 0 18px #3ef4ff8c}#name-modal .err,#install-modal .err{color:#ff4f7a;min-height:20px}#name-modal .row,#install-modal .row{justify-content:center;gap:10px;display:flex}#name-modal button,#install-modal button{letter-spacing:1px;color:#fff;background:#0c2a1ae6;border:2px solid #39ff88;border-radius:14px;padding:12px 18px;font-family:inherit;font-size:15px;font-weight:700;box-shadow:0 0 14px #39ff8873}#name-modal button.alt,#install-modal button.alt{background:#1e0a3cd9;border-color:#b45cff;box-shadow:0 0 14px #b45cff66}#name-modal button:disabled,#install-modal button:disabled{opacity:.4}#install-modal ol{text-align:left;color:#e8e0ff;flex-direction:column;gap:10px;margin:0;padding:0 0 0 4px;font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:18px;font-weight:600;list-style:none;display:flex}#install-modal li{align-items:center;gap:10px;display:flex}#install-modal li b{color:#3ef4ff;border:2px solid #3ef4ff;border-radius:50%;flex:0 0 30px;justify-content:center;align-items:center;height:30px;font-family:Orbitron,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:14px;display:inline-flex}#install-modal .glyph{color:#fff;border:1px solid #b45cff;border-radius:6px;padding:0 6px;display:inline-block}#share-modal button{letter-spacing:1px;color:#fff;background:#1e0a3ccc;border:2px solid #7ef9ff;border-radius:14px;padding:12px 20px;font-family:inherit;font-size:15px;font-weight:700;box-shadow:0 0 16px #7ef9ff80}</style>

  <body>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <div id="share-modal">
      <img alt="Glydrift result card" />
      <p>Long-press the card to save it, or use the buttons below.</p>
      <div class="row">
        <button data-act="share">SHARE</button>
        <button data-act="save">SAVE</button>
        <button data-act="close">CLOSE</button>
      </div>
    </div>
    <div id="name-modal">
      <form class="card" autocomplete="off">
        <h2>PICK A NAME</h2>
        <p>Shown on the worldwide leaderboard</p>
        <input
          name="username"
          maxlength="12"
          inputmode="text"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="done"
          placeholder="3–12 letters/numbers"
        />
        <p class="err"></p>
        <div class="row">
          <button type="button" class="alt" data-act="random">RANDOM</button>
          <button type="button" class="alt" data-act="cancel">CANCEL</button>
          <button type="submit" data-act="save">SAVE</button>
        </div>
      </form>
    </div>
    <div id="install-modal">
      <div class="card">
        <h2>ADD TO HOME SCREEN</h2>
        <p class="sub">Play full-screen, offline, with one tap.</p>
        <ol></ol>
        <div class="row">
          <button type="button" data-act="close">GOT IT</button>
        </div>
      </div>
    </div>
  </body>
