<!-- Any other old address (e.g. a deep link into /Cheats/glydrift/…) → the game. Goes in the PUBLIC repo "27eydes-blip.github.io" (see
     ../../README.md). Change NEW to the game's new address if it isn't the one below. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found</title>
    <meta name="robots" content="noindex" />
    <script>
      // the new home of the game (option A: same site, new folder; option B: e.g. https://glydrift.pages.dev/)
      var NEW = "https://27eydes-blip.github.io/glydrift/";
      // keep ?daily=…, #… and anything after /Cheats/glydrift/ (shared links keep working)
      var m = location.pathname.match(/^\/Cheats\/glydrift\/?(.*)$/);
      var rest = m ? m[1] : "";
      // only old Glydrift addresses move; anything else is a real "not found"
      if (m) location.replace(NEW + rest + location.search + location.hash);
      else document.addEventListener("DOMContentLoaded", function () {
        document.querySelector("p").textContent = "Page not found.";
      });
    </script>
        <link rel="canonical" href="https://27eydes-blip.github.io/glydrift/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020107;
             color: #e8fdff; font: 600 18px system-ui, sans-serif; text-align: center; }
      a { color: #3ef4ff; }
    </style>
  </head>
  <body>
    <p>Glydrift has moved to <a href="https://27eydes-blip.github.io/glydrift/">its new home</a>.</p>
  </body>
</html>
