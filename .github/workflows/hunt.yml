# Hunt (hunt/): its own tests, separate from the rest of the repo's CI.
# Cloudflare Workers Builds deploys hunt/ from main on every push, so this is the check to look at
# before merging anything that touches the game.
name: Hunt

on:
  pull_request:
    paths:
      - "hunt/**"
      - ".github/workflows/hunt.yml"
  push:
    branches:
      - main
    paths:
      - "hunt/**"
      - ".github/workflows/hunt.yml"

permissions:
  contents: read

concurrency:
  group: hunt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hunt

jobs:
  test:
    name: Node suites, browser suite (Chromium), deploy dry run
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hunt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Node suites (simulation, balance, accounts, deploy config)
        run: npm test

      - name: Production config builds (no upload)
        run: npx wrangler deploy -c wrangler.preview.jsonc --dry-run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # the node suites already ran above, so the browser run leaves its copy of them out; the
      # frame-rate checks run in the next step, alone. In CI a failed test is retried once and
      # reported as flaky if the retry passes (playwright.config.js).
      - name: Browser suite
        run: npm run e2e -- --project=chromium --grep-invert "node test/|60 fps"

      # One worker, so no other test competes with the throttled page for the runner's cores.
      # CI_SLOW_RUNNER: race-perf asserts what a shared runner can show (see its header).
      - name: Frame-rate checks (Chromium, alone on the runner)
        if: ${{ !cancelled() }}
        env:
          CI_SLOW_RUNNER: "1"
        run: npm run e2e -- --project=chromium --workers=1 --grep "60 fps"

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hunt-test-results
          path: hunt/test-results/
          if-no-files-found: ignore

  # WebKit is slow on a shared runner (a full run took ~30 minutes), so it runs the specs that matter
  # most for iPhone Safari: boot / splash, lobby and every menu screen at phone sizes (layout, tap
  # targets, the credit line), the store, and the race with its credit; split over three runners,
  # test by test, so each shard finishes well inside its time limit.
  webkit:
    name: Browser suite on WebKit (closest to iPhone Safari), shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hunt/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      # (the iPad-size audit of every racing screen is left to Chromium: on a shared runner WebKit
      # draws a race at that size at well under one frame a second, so each one overran 5 minutes;
      # the iPad credit check and the iPad space-lobby layout still run here)
      - name: Browser suite (iPhone Safari specs)
        run: >-
          npm run e2e -- --project=webkit --fully-parallel --shard=${{ matrix.shard }}/3
          --grep-invert "phone audit (1180x820|820x1180)"
          tests/e2e/smoke.spec.js tests/e2e/ui.spec.js tests/e2e/overnight-boot.spec.js
          tests/e2e/overnight-lobby-audit.spec.js tests/e2e/overnight-credit-everywhere.spec.js
          tests/e2e/overnight-store.spec.js tests/e2e/race-credit.spec.js

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hunt-test-results-webkit-${{ matrix.shard }}
          path: hunt/test-results/
          if-no-files-found: ignore
