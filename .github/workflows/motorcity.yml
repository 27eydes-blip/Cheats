# Motor City 1915 (motorcity/): build + phone smoke tests, then publish to Cloudflare Pages
# (project "motor-city-1915"). Pushes to main publish production; pushes to the
# polish/motor-city-1915, fix/motor-city-1915-* and claude/motor-city-1915-* branches publish a preview deployment. Nothing else in this repo is touched.
name: Motor City 1915

on:
  push:
    branches: [main, 'polish/motor-city-1915', 'fix/motor-city-1915-*', 'claude/motor-city-1915-*']
    paths: ['motorcity/**', '.github/workflows/motorcity.yml']
  pull_request:
    paths: ['motorcity/**', '.github/workflows/motorcity.yml']
  workflow_dispatch:

concurrency:
  group: motorcity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and phone smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: motorcity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Smoke tests (iPhone portrait + landscape, desktop, full menu flow)
        run: node tests/smoke.test.mjs
      - name: 'Feel tests (iPhone portrait: run-off, soft walls, crashes, car contact, rivals, touch)'
        run: node tests/feel.test.mjs
      - name: 'Collision audit (full lap of every course, every hit checked against what was drawn)'
        run: node tests/collisions.test.mjs
      - name: 'Rival AI (10 bots-only races; Easy / Normal / Hard with a robot player)'
        run: node tests/bots.test.mjs
      - name: 'The Gatsby (garage, unlock, purchase, horn, sparkles)'
        run: node tests/gatsby.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: motorcity-dist
          path: motorcity/dist

  deploy:
    name: Publish to Cloudflare Pages
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: motorcity-cloudflare-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: motorcity-dist
          path: dist
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set"; exit 1; fi
          if [ "$GITHUB_REF_NAME" = main ]; then BRANCH=main; else BRANCH=preview; fi
          npx --yes wrangler@3.114.0 pages project create motor-city-1915 --production-branch=main || echo "project already exists"
          npx --yes wrangler@3.114.0 pages deploy dist --project-name=motor-city-1915 --branch="$BRANCH" --commit-dirty=true --commit-hash="$GITHUB_SHA"
