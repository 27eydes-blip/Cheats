# Gleyde Security site (gleyde-security/): test, then publish to Cloudflare Pages
# (project "gleyde-security" -> https://gleyde-security.pages.dev).
# Runs only when the site changes; it never builds or deploys anything else in this repo.
name: Gleyde Security

on:
  push:
    branches: [main, claude/gleyde-cybersecurity-site-cv4rjj]
    paths: ['gleyde-security/**', '.github/workflows/gleyde-security.yml']
  pull_request:
    paths: ['gleyde-security/**', '.github/workflows/gleyde-security.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gleyde-security
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Unit, attack, scanner and secret-scan tests
        run: npm test
      - name: Live tests against a local server (headers, exposed files, browser XSS)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          cp .dev.vars.example .dev.vars
          # Cloudflare's always-FAIL test secret: proves nothing is scanned or sent without a real Turnstile pass.
          sed -i 's/^TURNSTILE_SECRET_KEY=.*/TURNSTILE_SECRET_KEY=2x0000000000000000000000000000000AA/' .dev.vars
          npx wrangler pages dev --port 8788 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8788/ && break; sleep 1; done
          BASE_URL=http://localhost:8788 npm run test:e2e

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gleyde-security-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: gleyde-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Deploy to Cloudflare Pages (static site + functions)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set"; exit 1; fi
          npx wrangler pages deploy --project-name=gleyde-security --branch=main --commit-dirty=true --commit-hash="$GITHUB_SHA"
