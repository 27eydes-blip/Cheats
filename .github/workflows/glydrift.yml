name: Glydrift tests

# Every push and pull request that touches the game runs the browser suite: WebKit (Safari) on
# all 7 device profiles, Chromium (Chrome / Edge) and Firefox on 3 of them. Nothing is published until
# every browser has passed on these exact files — a broken version never goes live.
on:
  push:
    paths:
      - "glydrift/**"
      - ".github/workflows/glydrift.yml"
  pull_request:
    paths:
      - "glydrift/**"
      - ".github/workflows/glydrift.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish (glydrift.com and the old GitHub Pages copy) if every test passes"
        type: boolean
        default: false
      skip_tests:
        description: "Owner-approved rush only: publish glydrift.com now, without running the tests"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glydrift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: glydrift

jobs:
  # A merge that only brings in code which already passed on all three browsers doesn't need
  # the same hour of tests again. This job fingerprints the game's files (glydrift/ and this
  # workflow, minus the baseline screenshots, which a passing run writes itself) and looks for
  # an earlier run on the exact same files where Chromium, Firefox and WebKit all passed.
  # Found: the tests are skipped and the publish jobs use that result. Not found (two changes
  # combined, the branch moved on, the workflow changed, ...): the full tests run as usual.
  # Only for pushes to the branches that go live; never for pull requests or by hand.
  reuse:
    name: Already tested?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.find.outputs.hit }}
    steps:
      - uses: actions/checkout@v4
        if: >-
          github.event_name == 'push' && (
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/claude/glydrift-arcade-game-7hznpc')
        with:
          fetch-depth: 0
      - name: Look for a green run on the same files
        id: find
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_OK: >-
            ${{ github.event_name == 'push' && (
              github.ref == 'refs/heads/main' ||
              github.ref == 'refs/heads/claude/glydrift-arcade-game-7hznpc') }}
        run: |
          echo "hit=false" >> "$GITHUB_OUTPUT"
          [ "$REUSE_OK" = "true" ] || { echo "Not a push to a live branch: full tests."; exit 0; }
          fp() {
            git ls-tree -r "$1" -- glydrift .github/workflows/glydrift.yml 2>/dev/null \
              | grep -v "glydrift/tests/e2e/__screenshots__/" | sha256sum | cut -d' ' -f1
          }
          me=$(fp HEAD)
          echo "Fingerprint of $GITHUB_SHA: $me"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/glydrift.yml/runs?status=success&per_page=40" \
            --jq '.workflow_runs[] | select(.id != '"$GITHUB_RUN_ID"') | "\(.id) \(.head_sha)"')
          while read -r id sha; do
            [ -n "$id" ] || continue
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            [ "$(fp "$sha")" = "$me" ] || continue
            # every browser must have actually run and passed (a reused run doesn't count)
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
              --jq '[.jobs[] | select(.name | test("^Tests \\((chromium|firefox|webkit)\\)$")) | select(.conclusion == "success")] | length')
            if [ "$green" = "3" ]; then
              echo "::notice::Same files already passed on Chromium, Firefox and WebKit in run $id ($sha): skipping the repeat."
              echo "hit=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo "No earlier green run on these exact files: running the full tests."

  test:
    name: Tests (${{ matrix.engine }})
    needs: reuse
    if: needs.reuse.outputs.hit != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      CI: "true"
      ENGINES: ${{ matrix.engine }}
      # WebKit (Safari, every iPhone and iPad) runs all 7 device profiles. Chromium and Firefox
      # run 3: the tightest phone, the phone size where the once-per-browser checks run, and a
      # laptop. Layout code is shared by every engine, so WebKit's 7 sizes cover the rest.
      PROFILES: ${{ matrix.engine != 'webkit' && 'iphone-small,iphone-std,laptop' || '' }}
      # put "[update screenshots]" in a commit message to re-record the baseline screenshots
      UPDATE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[update screenshots]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json

      - run: npm ci

      - name: Install ${{ matrix.engine }}
        timeout-minutes: 75
        run: |
          # the browser download / system packages occasionally hang or crawl on GitHub's
          # machines: give each attempt 15 minutes and retry instead of stalling the whole run.
          # A timed-out attempt can leave its apt-get running in the background (it runs under
          # sudo, out of timeout's reach) and holding the package lock, which made every retry
          # fail at once: wait for the lock to come free (up to 10 min) before trying again.
          wait_for_apt() {
            for _ in $(seq 120); do
              sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock \
                >/dev/null 2>&1 || return 0
              sleep 5
            done
            echo "::warning::package lock still held after 10 minutes"
          }
          ok=""
          for attempt in 1 2 3; do
            wait_for_apt
            if timeout 900 npx playwright install --with-deps ${{ matrix.engine }}; then ok=1; break; fi
            echo "::warning::browser install attempt $attempt failed or hung - retrying"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::could not install ${{ matrix.engine }}"; exit 1; }
          # software OpenGL (Mesa) for headless WebGL
          wait_for_apt
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libegl1 libgl1

      - name: Build (release + test builds)
        run: npm run build && npm run build:test

      - name: Run the tests
        run: |
          # headless Firefox has no WebGL on Linux: run it headed in a virtual display
          RUN="npx playwright test"
          if [ "$ENGINES" = "firefox" ]; then export FIREFOX_HEADED=1; RUN="xvfb-run -a $RUN"; fi
          # first run for this engine (no baselines yet) or "[update screenshots]": record them
          if [ "$UPDATE" = "true" ] || ! ls tests/e2e/__screenshots__ 2>/dev/null | grep -q "^${ENGINES}-"; then
            $RUN --update-snapshots=all
          else
            # compare; a brand-new screen records its first baseline (and fails once)
            $RUN --update-snapshots=missing
          fi

      - name: Collect new baseline screenshots
        if: always()
        run: |
          mkdir -p ../baselines
          git ls-files --others --modified -- tests/e2e/__screenshots__ | tar -cf ../baselines/new.tar -T - || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselines-${{ matrix.engine }}
          path: baselines/new.tar
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.engine }}
          path: |
            glydrift/playwright-report
            glydrift/test-results
          retention-days: 14

      - name: Failed tests (summary)
        if: failure()
        run: cat failures.txt || true

  # New (or deliberately re-recorded) baselines go back onto the branch they came from
  baselines:
    name: Save baseline screenshots
    needs: test
    if: always() && github.event_name == 'push' && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: baselines-*
          path: baselines
      - name: Commit them
        working-directory: .
        run: |
          shopt -s nullglob
          for t in baselines/*/new.tar; do tar -xf "$t" -C glydrift; done
          if [ -z "$(git status --porcelain -- glydrift/tests/e2e/__screenshots__)" ]; then
            echo "No new baselines."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glydrift/tests/e2e/__screenshots__
          git commit -m "Glydrift: record baseline screenshots [skip ci]"
          # GitHub occasionally answers a push with a 500: retry with backoff
          for wait in 2 4 8 16 32; do
            git push && exit 0
            sleep "$wait"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

  deploy:
    name: Publish to GitHub Pages
    needs: [reuse, test]
    # only after every engine passed (in this run, or on the exact same files earlier);
    # on main, or when started by hand with "deploy"
    if: >-
      !cancelled() && needs.reuse.result == 'success' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.reuse.outputs.hit == 'true')) && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: glydrift-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json
      - run: npm ci
      - name: Publish
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/deploy-gh-pages.sh

  # glydrift.com (Cloudflare Pages). Runs only after every browser's tests have passed, for a
  # push to the game's release branch (or by hand with "deploy"). Never before CI is green.
  deploy-cloudflare:
    name: Publish to glydrift.com (Cloudflare Pages)
    needs: [reuse, test]
    if: >-
      !cancelled() && needs.reuse.result == 'success' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.reuse.outputs.hit == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_tests)) && (
        (github.event_name == 'workflow_dispatch' && inputs.skip_tests) ||
        (github.event_name == 'push' && (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/claude/glydrift-arcade-game-7hznpc')) ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: glydrift-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets set?
        id: keys
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet - skipping the glydrift.com deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json
      - if: steps.keys.outputs.ok == 'true'
        run: npm ci && npm run build
      - name: Create the Pages project (first time only)
        if: steps.keys.outputs.ok == 'true'
        run: npx --yes wrangler@3.114.0 pages project create glydrift --production-branch=main || echo "project already exists"
      - name: Deploy
        if: steps.keys.outputs.ok == 'true'
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name=glydrift --branch=main --commit-dirty=true
