name: Glydrift tests

# Two-speed testing. Nothing is published until its lane has passed on these exact files.
#   FAST lane  small changes (text, colours, one hero, one bug fix): the smoke suite (@smoke:
#              the game loads, the release build loads, a run through several realms, death and
#              retry, level 1 to the finish, the shop, account sign-in, no console errors) on
#              iPhone Safari (WebKit) and Chromium, side by side. Target: live in under 10 min.
#   FULL lane  everything else: the whole suite on all three browsers and every device profile
#              (WebKit 7 profiles, Chromium and Firefox 3), split across 14 machines.
#   no tests   docs-only changes (README, *.md, docs/, marketing/): nothing to test or publish.
# glydrift/scripts/ci-lane.sh picks the lane: [fast] or [full] in the commit message, else
# what changed. Anything touching purchases, accounts, saving or the leaderboard is ALWAYS full.
#
# NIGHTLY: started by hand (or by the nightly scheduled task) with nightly=true: the full lane on
# the live version (the release branch), plus the release build on the real glydrift.com.
# Nothing is published; a failure opens (or updates) a GitHub issue, which emails the owner.
on:
  push:
    paths:
      - "glydrift/**"
      - ".github/workflows/glydrift.yml"
      - ".github/actions/glydrift-setup/**"
  pull_request:
    paths:
      - "glydrift/**"
      - ".github/workflows/glydrift.yml"
      - ".github/actions/glydrift-setup/**"
  workflow_dispatch:
    inputs:
      lane:
        description: "Which tests: auto (decide from what changed), fast or full"
        type: choice
        options: [auto, fast, full]
        default: auto
      deploy:
        description: "Publish (glydrift.com and the old GitHub Pages copy) if the tests pass"
        type: boolean
        default: false
      nightly:
        description: "Nightly check of the live version: full lane + the real glydrift.com, never publishes"
        type: boolean
        default: false
      skip_tests:
        description: "Owner-approved rush only: publish glydrift.com now, without running the tests"
        type: boolean
        default: false

permissions:
  contents: read

# No run is ever cancelled by a newer push: runs go side by side. Publishing is one at a time
# (the publish jobs' own concurrency groups), and a run whose commit is no longer the newest on
# its branch doesn't publish: the newer run will.

defaults:
  run:
    working-directory: glydrift

env:
  LIVE_BRANCH: claude/glydrift-arcade-game-7hznpc

jobs:
  # ------------------------------------------------------------------ which lane, already tested?
  plan:
    name: Plan (which tests)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      reason: ${{ steps.lane.outputs.reason }}
      hit: ${{ steps.reuse.outputs.hit }}
      live: ${{ steps.lane.outputs.live }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.nightly) && env.LIVE_BRANCH || '' }}
      - name: Pick the lane
        id: lane
        working-directory: .
        env:
          EVENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.nightly) && 'schedule' || github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
          DISPATCH_LANE: ${{ inputs.lane || 'auto' }}
          REF: ${{ github.ref }}
        run: |
          bash glydrift/scripts/ci-lane.sh | tee -a "$GITHUB_OUTPUT"
          live=false
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = "refs/heads/$LIVE_BRANCH" ]; }; then live=true; fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          {
            echo "### Lane: \`$(grep '^lane=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)\`"
            echo "$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          } >> "$GITHUB_STEP_SUMMARY"
      # A merge that only brings in files which already passed this lane (or the full lane) on
      # an earlier run doesn't need the same tests again: the publish jobs use that result.
      - name: Already tested on these exact files?
        id: reuse
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ steps.lane.outputs.lane }}
          # (an App Store release always runs its own full lane: never reused)
          REUSE_OK: ${{ github.event_name == 'push' && github.ref != 'refs/heads/release' && !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          echo "hit=false" >> "$GITHUB_OUTPUT"
          [ "$REUSE_OK" = "true" ] && [ "$LANE" != "none" ] || exit 0
          fp() {
            git ls-tree -r "$1" -- glydrift .github/workflows/glydrift.yml .github/actions/glydrift-setup 2>/dev/null \
              | grep -v "glydrift/tests/e2e/__screenshots__/" | sha256sum | cut -d' ' -f1
          }
          me=$(fp HEAD)
          sel='.name == "All tests passed (full)"'
          [ "$LANE" = fast ] && sel="$sel or .name == \"All tests passed (fast)\""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/glydrift.yml/runs?status=success&per_page=40" \
            --jq '.workflow_runs[] | select(.id != '"$GITHUB_RUN_ID"') | "\(.id) \(.head_sha)"')
          while read -r id sha; do
            [ -n "$id" ] || continue
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            [ "$(fp "$sha")" = "$me" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=60" \
              --jq "[.jobs[] | select($sel) | select(.conclusion == \"success\")] | length")
            if [ "${ok:-0}" -ge 1 ]; then
              echo "::notice::These exact files already passed the $LANE lane in run $id ($sha): not repeating it."
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "Already tested in run $id: reused." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<< "$runs"

  # ------------------------------------------------------------------ fast lane: the smoke suite
  smoke:
    name: Smoke (${{ matrix.engine }})
    needs: plan
    if: needs.plan.outputs.lane == 'fast' && needs.plan.outputs.hit != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # the smoke suite grew with the big update: Chromium now needs ~25 min
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    env:
      CI: "true"
      ENGINES: ${{ matrix.engine }}
      PROFILES: iphone-std
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/glydrift-setup
        with:
          engine: ${{ matrix.engine }}
      - name: Smoke tests
        run: npx playwright test --grep @smoke --workers=3
      - name: Failed tests (summary)
        if: failure()
        run: |
          cat failures.txt || true
          { echo "### Smoke (${{ matrix.engine }}) failed"; echo '```'; cat failures.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report-${{ matrix.engine }}
          path: |
            glydrift/playwright-report
            glydrift/test-results
          retention-days: 7

  # ------------------------------------------------------------------ full lane: every test, sharded
  full:
    name: Tests (${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: plan
    if: needs.plan.outputs.lane == 'full' && needs.plan.outputs.hit != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, shard: 1, total: 5 }
          - { engine: chromium, shard: 2, total: 5 }
          - { engine: chromium, shard: 3, total: 5 }
          - { engine: chromium, shard: 4, total: 5 }
          - { engine: chromium, shard: 5, total: 5 }
          - { engine: firefox, shard: 1, total: 3 }
          - { engine: firefox, shard: 2, total: 3 }
          - { engine: firefox, shard: 3, total: 3 }
          - { engine: webkit, shard: 1, total: 6 }
          - { engine: webkit, shard: 2, total: 6 }
          - { engine: webkit, shard: 3, total: 6 }
          - { engine: webkit, shard: 4, total: 6 }
          - { engine: webkit, shard: 5, total: 6 }
          - { engine: webkit, shard: 6, total: 6 }
    env:
      CI: "true"
      ENGINES: ${{ matrix.engine }}
      NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly }}
      # WebKit (Safari, every iPhone and iPad) runs all 7 device profiles. Chromium and Firefox
      # run 3: the tightest phone, the phone size where the once-per-browser checks run, and a
      # laptop. Layout code is shared by every engine, so WebKit's 7 sizes cover the rest.
      PROFILES: ${{ matrix.engine != 'webkit' && 'iphone-small,iphone-std,laptop' || '' }}
      # put "[update screenshots]" in a commit message to re-record the baseline screenshots
      UPDATE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[update screenshots]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.nightly) && env.LIVE_BRANCH || '' }}
      - uses: ./.github/actions/glydrift-setup
        with:
          engine: ${{ matrix.engine }}
      - name: Run the tests (shard ${{ matrix.shard }} of ${{ matrix.total }})
        run: |
          # headless Firefox has no WebGL on Linux: run it headed in a virtual display
          RUN="npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}"
          # the heavy checks (weak phones, a 2-hour session, multi-hazard stress) run nightly only
          if [ "$NIGHTLY" != "true" ]; then RUN="$RUN --grep-invert @nightly"; fi
          if [ "$ENGINES" = "firefox" ]; then export FIREFOX_HEADED=1; RUN="xvfb-run -a $RUN"; fi
          # first run for this engine (no baselines yet) or "[update screenshots]": record them
          if [ "$UPDATE" = "true" ] || ! ls tests/e2e/__screenshots__ 2>/dev/null | grep -q "^${ENGINES}-"; then
            $RUN --update-snapshots=all
          else
            # compare; a brand-new screen records its first baseline (and fails once)
            $RUN --update-snapshots=missing
          fi
      - name: Collect new baseline screenshots
        if: always()
        run: |
          mkdir -p ../baselines
          git ls-files --others --modified -- tests/e2e/__screenshots__ | tar -cf ../baselines/new.tar -T - || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselines-${{ matrix.engine }}-${{ matrix.shard }}
          path: baselines/new.tar
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            glydrift/playwright-report
            glydrift/test-results
          retention-days: 14
      - name: Failed tests (summary)
        if: failure()
        run: |
          cat failures.txt || true
          { echo "### ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.total }} failed"; echo '```'; cat failures.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # nightly only: the release build as it is live on the real glydrift.com
  live:
    name: Live glydrift.com (${{ matrix.engine }})
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    env:
      CI: "true"
      ENGINES: ${{ matrix.engine }}
      PROFILES: iphone-std
      RELEASE_URL: https://glydrift.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LIVE_BRANCH }}
      - uses: ./.github/actions/glydrift-setup
        with:
          engine: ${{ matrix.engine }}
      - name: The live site loads with no errors
        run: npx playwright test -g "release build loads"
      - name: Failed tests (summary)
        if: failure()
        run: |
          { echo "### live glydrift.com (${{ matrix.engine }}) failed"; echo '```'; cat failures.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ one green light per lane
  gate:
    name: All tests passed (${{ needs.plan.outputs.lane }})
    needs: [plan, smoke, full]
    if: always() && needs.plan.outputs.lane != 'none' && needs.plan.outputs.hit != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Check
        working-directory: .
        env:
          LANE: ${{ needs.plan.outputs.lane }}
          SMOKE: ${{ needs.smoke.result }}
          FULL: ${{ needs.full.result }}
        run: |
          echo "lane=$LANE smoke=$SMOKE full=$FULL"
          if [ "$LANE" = fast ] && [ "$SMOKE" = success ]; then exit 0; fi
          if [ "$LANE" = full ] && [ "$FULL" = success ]; then exit 0; fi
          echo "::error::the $LANE lane did not pass"; exit 1

  # nightly only: tell the owner when something broke (a GitHub issue emails them)
  nightly-report:
    name: Nightly report
    needs: [gate, live]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the issue on a failure
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ needs.gate.result }}
          LIVE: ${{ needs.live.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "full suite: $GATE, live site: $LIVE"
          if [ "$GATE" = success ] && [ "$LIVE" = success ]; then
            echo "Nightly check passed." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          title="Glydrift nightly check failed"
          body="The nightly check of the live version failed on $(date -u +%F). Full suite: $GATE. Live glydrift.com: $LIVE. Details: $URL"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          exit 1

  # ------------------------------------------------------------------ baselines and publishing
  # New (or deliberately re-recorded) baselines go back onto the branch they came from
  baselines:
    name: Save baseline screenshots
    needs: full
    if: always() && github.event_name == 'push' && needs.full.result != 'cancelled' && needs.full.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: baselines-*
          path: baselines
      - name: Commit them
        working-directory: .
        run: |
          shopt -s nullglob
          for t in baselines/*/new.tar; do tar -xf "$t" -C glydrift; done
          if [ -z "$(git status --porcelain -- glydrift/tests/e2e/__screenshots__)" ]; then
            echo "No new baselines."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glydrift/tests/e2e/__screenshots__
          git commit -m "Glydrift: record baseline screenshots [skip ci]"
          # GitHub occasionally answers a push with a 500: retry with backoff
          for wait in 2 4 8 16 32; do
            git push && exit 0
            sleep "$wait"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

  deploy:
    name: Publish to GitHub Pages
    needs: [plan, gate]
    # only after the lane passed (in this run, or on the exact same files earlier); on main, or
    # when started by hand with "deploy"
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.lane != 'none' &&
      !(github.event_name == 'workflow_dispatch' && inputs.nightly) &&
      (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.plan.outputs.hit == 'true')) && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: glydrift-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Still the newest commit on the branch?
        id: fresh
        run: |
          head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::$GITHUB_REF_NAME moved on to $head: that run publishes"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json
      - if: steps.fresh.outputs.ok == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Publish
        if: steps.fresh.outputs.ok == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/deploy-gh-pages.sh

  # glydrift.com (Cloudflare Pages): only after the lane passed, for a push to the game's release
  # branch (or by hand with "deploy"). Never before the tests are green.
  deploy-cloudflare:
    name: Publish to glydrift.com (Cloudflare Pages)
    needs: [plan, gate]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.nightly) && (
        (github.event_name == 'workflow_dispatch' && inputs.skip_tests) || (
          needs.plan.outputs.lane != 'none' &&
          (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.plan.outputs.hit == 'true')) && (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/glydrift-arcade-game-7hznpc')) ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy))))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: glydrift-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets set?
        id: keys
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set yet - skipping the glydrift.com deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - name: Still the newest commit on the branch?
        id: fresh
        if: steps.keys.outputs.ok == 'true'
        run: |
          head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$head" = "$GITHUB_SHA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::$GITHUB_REF_NAME moved on to $head: that run publishes"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json
      - if: steps.fresh.outputs.ok == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund && npm run build
      - name: Create the Pages project (first time only)
        if: steps.fresh.outputs.ok == 'true'
        run: npx --yes wrangler@3.114.0 pages project create glydrift --production-branch=main || echo "project already exists"
      - name: Deploy
        if: steps.fresh.outputs.ok == 'true'
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name=glydrift --branch=main --commit-dirty=true
