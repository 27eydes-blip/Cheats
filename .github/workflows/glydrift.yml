name: Glydrift tests

# Every push and pull request that touches the game runs the full browser suite: Chromium
# (Chrome / Edge), Firefox and WebKit (Safari) × 7 device profiles. GitHub Pages is only
# updated after every test has passed — a broken version never goes live.
on:
  push:
    paths:
      - "glydrift/**"
      - ".github/workflows/glydrift.yml"
  pull_request:
    paths:
      - "glydrift/**"
      - ".github/workflows/glydrift.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the web game if every test passes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glydrift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: glydrift

jobs:
  test:
    name: Tests (${{ matrix.engine }})
    # Minute saver for a private repo (repository variable GLYDRIFT_CI_SAVER=true): pushes to
    # ordinary branches skip the suite; main, release, pull requests and manual runs test fully.
    if: >-
      vars.GLYDRIFT_CI_SAVER != 'true' || github.event_name != 'push' ||
      github.ref_name == 'main' || github.ref_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      CI: "true"
      ENGINES: ${{ matrix.engine }}
      # put "[update screenshots]" in a commit message to re-record the baseline screenshots
      UPDATE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[update screenshots]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json

      - run: npm ci

      - name: Install ${{ matrix.engine }}
        timeout-minutes: 35
        run: |
          # the browser download / system packages occasionally hang on GitHub's machines:
          # give each attempt 10 minutes and retry instead of stalling the whole run
          ok=""
          for attempt in 1 2 3; do
            if timeout 600 npx playwright install --with-deps ${{ matrix.engine }}; then ok=1; break; fi
            echo "::warning::browser install attempt $attempt failed or hung - retrying"
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::could not install ${{ matrix.engine }}"; exit 1; }
          # software OpenGL (Mesa) for headless WebGL
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libegl1 libgl1

      - name: Build (release + test builds)
        run: npm run build && npm run build:test

      - name: Run the tests
        run: |
          # headless Firefox has no WebGL on Linux: run it headed in a virtual display
          RUN="npx playwright test"
          if [ "$ENGINES" = "firefox" ]; then export FIREFOX_HEADED=1; RUN="xvfb-run -a $RUN"; fi
          # first run for this engine (no baselines yet) or "[update screenshots]": record them
          if [ "$UPDATE" = "true" ] || ! ls tests/e2e/__screenshots__ 2>/dev/null | grep -q "^${ENGINES}-"; then
            $RUN --update-snapshots=all
          else
            # compare; a brand-new screen records its first baseline (and fails once)
            $RUN --update-snapshots=missing
          fi

      - name: Collect new baseline screenshots
        if: always()
        run: |
          mkdir -p ../baselines
          git ls-files --others --modified -- tests/e2e/__screenshots__ | tar -cf ../baselines/new.tar -T - || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baselines-${{ matrix.engine }}
          path: baselines/new.tar
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.engine }}
          path: |
            glydrift/playwright-report
            glydrift/test-results
          retention-days: 14

      - name: Failed tests (summary)
        if: failure()
        run: cat failures.txt || true

  # The server-side rules (Supabase migrations): every migration applied to a throwaway
  # PostgreSQL, then attacked the way a cheater with the public key would. Never touches Supabase.
  server:
    name: Server checks (Supabase rules)
    # Minute saver for a private repo (repository variable GLYDRIFT_CI_SAVER=true): pushes to
    # ordinary branches skip the suite; main, release, pull requests and manual runs test fully.
    if: >-
      vars.GLYDRIFT_CI_SAVER != 'true' || github.event_name != 'push' ||
      github.ref_name == 'main' || github.ref_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres # the throwaway test database's password, not a real secret
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-server-checks.sh

  # New (or deliberately re-recorded) baselines go back onto the branch they came from
  baselines:
    name: Save baseline screenshots
    needs: test
    if: always() && github.event_name == 'push' && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: baselines-*
          path: baselines
      - name: Commit them
        working-directory: .
        run: |
          shopt -s nullglob
          for t in baselines/*/new.tar; do tar -xf "$t" -C glydrift; done
          if [ -z "$(git status --porcelain -- glydrift/tests/e2e/__screenshots__)" ]; then
            echo "No new baselines."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glydrift/tests/e2e/__screenshots__
          git commit -m "Glydrift: record baseline screenshots [skip ci]"
          # GitHub occasionally answers a push with a 500: retry with backoff
          for wait in 2 4 8 16 32; do
            git push && exit 0
            sleep "$wait"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

  deploy:
    name: Publish the web game
    needs: [test, server]
    # only after every engine and the server checks passed; on main, or by hand with "deploy"
    if: >-
      success() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: glydrift-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glydrift/package-lock.json
      - run: npm ci
      - name: Publish
        env:
          # where the web game lives: GitHub Pages (default), or set the repository variable
          # GLYDRIFT_WEB_HOST=cloudflare (see glydrift/PRIVATE_REPO_PLAN.md, option B)
          WEB_HOST: ${{ vars.GLYDRIFT_WEB_HOST || 'github-pages' }}
          PAGES_SUBDIR: ${{ vars.GLYDRIFT_PAGES_SUBDIR || 'glydrift' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$WEB_HOST" = "cloudflare" ]; then
            bash scripts/deploy-cloudflare.sh
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            bash scripts/deploy-gh-pages.sh
          fi
