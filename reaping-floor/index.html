<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="The Reaping Floor: fifty cities, five districts, one arena. A dystopian dynasty sports game.">
<title>The Reaping Floor</title>
<!--
  THE REAPING FLOOR — single-file HTML5 game. No libraries, no network, no image or font files.
  Layout of this file:
    style block: theme + menu screens (DOM)
    script block: ENGINE section (between the ENGINE START/END markers): sport sim + dynasty logic (no DOM; Node-testable)
                  UI section (between the UI START/END markers): canvas art, audio, screens, game renderer, input
-->
<style>
:root{
  --bg:#050506;--bg2:#0b0c0f;--panel:#101115;--panel2:#15171c;--line:#25272e;--line2:#33363e;
  --txt:#e2e4e8;--dim:#9096a0;--mute:#61666f;--steel:#b9bec6;
  --red:#b3121e;--red2:#ff2a3a;--redd:#5e0a10;--gold:#b9975b;--gold2:#e3c991;
  --hz:repeating-linear-gradient(-45deg,#0a0a0b 0 7px,#9e101b 7px 14px);
  --disp:Impact,Haettenschweiler,"Roboto Condensed","Arial Narrow","Inter Display","Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 "Helvetica Neue",Arial,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#17090b 0%,#050506 60%) fixed,var(--bg)}
button{font:inherit;color:inherit}
#app{position:relative;margin:0 auto;width:100%;max-width:520px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);box-shadow:0 0 60px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#ui{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#ui.hidden,#tabs.hidden,#modal.hidden{display:none}
#ui.notouch{pointer-events:none}
#mute{position:absolute;z-index:30;top:calc(10px + var(--safe-t));right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,10,12,.75);color:var(--steel);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#mute svg{width:20px;height:20px}
#mute.ingame{top:calc(62px + var(--safe-t));right:50px;width:32px;height:32px}
#mute.ingame svg{width:16px;height:16px}
#skip{position:absolute;z-index:30;bottom:calc(18px + var(--safe-b));right:14px}
/* ---------- type + chrome ---------- */
.disp{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase;font-weight:400}
.gold{color:var(--gold2)}.red{color:var(--red2)}.dim{color:var(--dim)}.mute{color:var(--mute)}
.haz{height:7px;background:var(--hz);border-top:1px solid #000;border-bottom:1px solid #000;opacity:.9}
.scr{min-height:100%;padding:calc(12px + var(--safe-t)) 14px calc(96px + var(--safe-b))}
.scr.notabs{padding-bottom:calc(28px + var(--safe-b))}
.logo{display:block;width:100%;max-width:440px;margin:4px auto 2px;height:auto}
.kicker{font:700 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h2.sec{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.06em;margin:18px 0 8px;color:var(--steel);display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--red),transparent)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:12px;position:relative;overflow:hidden}
.card+.card{margin-top:10px}
.card.edge{border-left:3px solid var(--red)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-family:var(--disp);font-size:24px;letter-spacing:.03em;line-height:1.05}
.mid{font-family:var(--disp);font-size:18px;letter-spacing:.03em;line-height:1.1}
.small{font-size:12px}.tiny{font-size:11px}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 10px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--steel);background:#0b0b0d;white-space:nowrap}
.chip.d1{border-color:#7d6537;color:var(--gold2)}.chip.d2{border-color:#6c6f78;color:#d3d6dc}.chip.d3{border-color:#4a4f58;color:#aeb3bb}.chip.d4{border-color:#6b3a1d;color:#e09a62}.chip.d5{border-color:#7a1018;color:#ff6a75}
.chip.on{background:var(--red);border-color:var(--red2);color:#fff}
.emb{width:44px;height:44px;flex:none;display:block}
.emb.s{width:26px;height:26px}.emb.m{width:36px;height:36px}.emb.l{width:68px;height:68px}.emb.xl{width:92px;height:92px}
/* buttons: never smaller than 44px tall */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;font-family:var(--disp);font-size:21px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#d01826,#8c0c15);box-shadow:0 0 0 1px #ff3b48 inset,0 6px 22px rgba(179,18,30,.35);text-shadow:0 1px 0 #000}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn.alt{background:linear-gradient(180deg,#24262c,#141519);box-shadow:0 0 0 1px var(--line2) inset;color:var(--steel)}
.btn.gold{background:linear-gradient(180deg,#c8a76a,#7d6232);box-shadow:0 0 0 1px #e8cf98 inset;color:#120c02;text-shadow:none}
.btn.slim{min-height:44px;font-size:17px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;gap:10px}.btns>*{flex:1}
.lnk{background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 6px;cursor:pointer;font-size:13px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#09090b}
.seg button{flex:1;min-height:44px;border:0;background:none;color:var(--dim);font:700 13px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;cursor:pointer;padding:0 4px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:linear-gradient(180deg,#2a0b0e,#1a0709);color:#fff;box-shadow:inset 0 -2px 0 var(--red2)}
.bar{height:8px;border-radius:5px;background:#1a1b20;overflow:hidden;border:1px solid #000}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2))}
.bar.gold>i{background:linear-gradient(90deg,#7d6232,var(--gold2))}
.bar.steel>i{background:linear-gradient(90deg,#4b5059,#aeb3bb)}
.stat{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.stat b{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1}
.stat span{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
/* broadcast banner */
.bcast{margin:10px 0 12px;border:1px solid #3a0d11;background:linear-gradient(90deg,#160709,#0b0b0d 70%);border-radius:8px;display:flex;align-items:stretch;overflow:hidden;min-height:46px}
.bcast .tag{flex:none;display:flex;flex-direction:column;justify-content:center;padding:6px 9px;background:var(--red);color:#fff;font:800 9px/1.15 "Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.bcast .tag i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:4px;animation:blink 1.2s infinite}
.bcast .msg{flex:1;display:flex;align-items:center;padding:6px 12px;font-family:var(--disp);font-size:17px;letter-spacing:.06em;color:#f0e6d6;transition:opacity .4s}
.bcast.rebel{border-color:#7a1018;background:repeating-linear-gradient(0deg,#120607 0 2px,#0b0b0d 2px 4px)}
.bcast.rebel .msg{color:#ff5d68;text-shadow:2px 0 #00e5ff55,-2px 0 #ff000055;animation:glitch 2.4s infinite steps(1)}
@keyframes blink{50%{opacity:.15}}
@keyframes glitch{0%,100%{transform:none}92%{transform:translateX(2px) skewX(-6deg)}94%{transform:translateX(-3px)}96%{transform:none;opacity:.6}}
/* lists */
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:52px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.li:first-child{border-top:0}
.li.me{background:linear-gradient(90deg,#2a0b0e,transparent);box-shadow:inset 3px 0 0 var(--red2)}
.li.sel{background:linear-gradient(90deg,#3a1015,#14090b);box-shadow:inset 3px 0 0 var(--gold2)}
.li.cut{border-top:2px dashed #7a1018}
.li .n{font-weight:700}
.num{font-family:var(--disp);font-size:18px;min-width:30px;text-align:right}
.rk{width:22px;text-align:center;color:var(--mute);font-weight:700;font-size:12px;flex:none}
.role{flex:none;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:800 13px/1 "Helvetica Neue",Arial,sans-serif;background:#1a1b20;border:1px solid var(--line2);color:var(--steel)}
.role.S{color:#7fc4ff}.role.D{color:#ff7a5c}.role.K{color:#9df07a}.role.W{color:#f5d36b}.role.E{color:#ff4b5c}
.dhead{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.dhead .dn{font-family:var(--disp);font-size:22px;letter-spacing:.05em}
.dperk{font-size:12px;color:var(--dim);margin:-2px 0 8px}
/* tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;background:linear-gradient(180deg,rgba(8,8,10,.92),#050506);border-top:1px solid var(--line);padding-bottom:var(--safe-b);backdrop-filter:blur(6px)}
#tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;cursor:pointer}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:#fff;box-shadow:inset 0 2px 0 var(--red2)}
#tabs button.on svg{color:var(--red2)}
/* modal */
#modal{position:absolute;inset:0;z-index:40;background:rgba(3,3,4,.82);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modal .sheet{width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#141519,#0b0c0f);border-top:1px solid var(--line2);border-radius:14px 14px 0 0;padding:16px 14px calc(18px + var(--safe-b));animation:up .28s ease-out}
#modal.center{align-items:center}
#modal.center .sheet{border-radius:12px;margin:14px;border:1px solid var(--line2);max-height:88%}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.story{text-align:center;padding:8px 4px}
.story .st{font-family:var(--disp);font-size:34px;letter-spacing:.05em;color:var(--red2);text-shadow:0 0 18px #ff2a3a66;margin:6px 0}
.story p{color:#cfd2d8;font-size:15px;margin:10px 0}
.toast{position:absolute;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);z-index:50;background:#140709;border:1px solid var(--red);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;max-width:90%;box-shadow:0 8px 30px #000;animation:up .25s}
.rbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.rbar>span:first-child{width:64px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.rbar .bar{flex:1}
.rbar b{width:26px;text-align:right;font-family:var(--disp);font-weight:400;font-size:15px}
input.txt{width:100%;min-height:48px;background:#0a0a0c;border:1px solid var(--line2);border-radius:8px;color:#fff;padding:0 12px;font-size:16px}
.bracket{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center}
.bk{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font-size:11px;margin:4px 0}
.bk div{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.bk .w{color:#fff;font-weight:700}.bk .l{color:var(--mute)}.bk .me{color:var(--red2)}
.result{text-align:center;padding-top:calc(30px + var(--safe-t))}
.result .verdict{font-family:var(--disp);font-size:54px;line-height:.95;letter-spacing:.04em;margin:8px 0 4px}
.result .verdict.win{color:#f2efe8;text-shadow:0 0 24px rgba(227,201,145,.45),0 2px 0 #000}
.result .verdict.loss{color:var(--red2);text-shadow:0 0 26px rgba(255,42,58,.55),0 2px 0 #000}
.vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0}
.vs .sc{font-family:var(--disp);font-size:46px;line-height:1}
.pausebox{position:absolute;inset:0;z-index:35;background:rgba(3,3,4,.86);display:flex;flex-direction:column;justify-content:center;padding:24px;gap:12px}
.fade-in{animation:fi .45s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
html.noimpact .disp,html.noimpact h2.sec,html.noimpact .big,html.noimpact .mid,html.noimpact .btn,html.noimpact .stat b,html.noimpact .bcast .msg,html.noimpact .dhead .dn,html.noimpact .num,html.noimpact .story .st,html.noimpact .result .verdict,html.noimpact .vs .sc{font-weight:800;letter-spacing:.01em}
.scr>.mid:first-child,.scr>.row:first-child,.scr>.kicker:first-child{padding-right:48px}
@media (min-width:521px){#app{border-left:1px solid #141418;border-right:1px solid #141418}}
@media (prefers-reduced-motion:reduce){.bcast.rebel .msg{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="ui"></div>
  <nav id="tabs" class="hidden"></nav>
  <div id="modal" class="hidden"></div>
  <button id="mute" aria-label="Mute sound"></button>
</div>
<script>
//==ENGINE START
/* =====================================================================
   THE REAPING FLOOR — ENGINE
   Pure logic. No DOM, no canvas, no network. Runs in the page and in Node.
   1 constants + rng · 2 world data · 3 players · 4 match sim · 5 match AI
   6 quick sim · 7 league / dynasty · 8 save + migration · 9 exports
   ===================================================================== */
var RF = (function () {
  'use strict';

  // ---------------------------------------------------------------- 1. CONSTANTS + RNG
  const W = 400, H = 900;                       // 10 units = 1 yard
  const HOOPS = [{ x: 200, y: 80 }, { x: 200, y: 820 }]; // HOOPS[t] = hoop team t attacks
  const DUNK_R = 58, DEEP_R = 370, SIN_BIN = 30, HOLD_MAX = 3, DT = 1 / 60;
  const ROLES = ['S', 'D', 'K', 'W', 'E'];
  const ROLE_NAME = { S: 'Slinger', D: 'Slammer', K: 'Striker', W: 'Wing', E: 'Enforcer' };
  const RATS = ['spd', 'thr', 'kik', 'dnk', 'sht', 'chk', 'sta'];
  const RAT_NAME = { spd: 'Speed', thr: 'Throw', kik: 'Kick', dnk: 'Dunk', sht: 'Shot', chk: 'Check', sta: 'Stamina' };
  // role multipliers on the floor
  const RM = {
    S: { thr: 1.15, spd: 0.95, chk: 0.8, dnk: 1, kik: 1, sht: 1.03, foul: 1, r: 13 },
    D: { thr: 1, spd: 0.93, chk: 1, dnk: 1.15, kik: 1, sht: 0.97, foul: 1.1, r: 16 },
    K: { thr: 1, spd: 1, chk: 0.9, dnk: 1, kik: 1.2, sht: 1, foul: 1, r: 13 },
    W: { thr: 1.03, spd: 1.05, chk: 0.9, dnk: 1.02, kik: 1.03, sht: 1.04, foul: 0.9, r: 12 },
    E: { thr: 0.95, spd: 0.98, chk: 1.18, dnk: 1, kik: 0.97, sht: 0.92, foul: 1.7, r: 14.5 },
  };
  const OVR_W = {
    S: { thr: 0.32, sht: 0.18, spd: 0.15, kik: 0.1, chk: 0.08, dnk: 0.07, sta: 0.1 },
    D: { dnk: 0.32, chk: 0.18, sht: 0.1, spd: 0.12, thr: 0.08, kik: 0.05, sta: 0.15 },
    K: { kik: 0.32, spd: 0.2, sht: 0.15, thr: 0.1, chk: 0.08, dnk: 0.05, sta: 0.1 },
    W: { spd: 0.3, sht: 0.2, thr: 0.12, kik: 0.12, dnk: 0.1, chk: 0.06, sta: 0.1 },
    E: { chk: 0.35, spd: 0.15, dnk: 0.12, thr: 0.08, kik: 0.08, sht: 0.07, sta: 0.15 },
  };
  const ROLE_BONUS = {
    S: { thr: 9, sht: 3, chk: -7, dnk: -3 },
    D: { dnk: 10, chk: 4, spd: -5, kik: -4, sht: -2 },
    K: { kik: 10, spd: 3, dnk: -4, thr: -2 },
    W: { spd: 8, sht: 4, chk: -4 },
    E: { chk: 11, sta: 4, sht: -6, thr: -4 },
  };
  const BODY = { S: [183, 195, 85, 98], D: [198, 212, 105, 125], K: [175, 188, 75, 88], W: [172, 186, 70, 84], E: [188, 200, 100, 115] };

  // shot model knobs (tuned with tests/engine.test.mjs to ~20-40 points a team on 3:00 quarters)
  const TUNE = { dunk: 0.31, dunkK: 0.001, mid: 0.23, midDrop: 0.13, deep: 0.14, deepDrop: 0.08, shtK: 0.0012, press: 64, pressMin: 0.32, ev: 0.55, rimMin: 240, rimVar: 160, gather: 0.45, block: 0.8, guardR: 170, spd0: 104, spdK: 0.4, chkRate: 0.15, rimChk: 3, strip: 0.4, chkCD: 1.8, chkK: 0.003, intT: 0.28, intK: 0.36, refK: 0.25, refFoul: 2, rsens: 0.3, form: 0.08 };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const hyp = Math.hypot;
  function mulberry(seed) {
    let a = seed >>> 0;
    const f = function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return f;
  }
  // league rng: state lives in the save (L.rs) so a dynasty replays deterministically
  function rnd(L) {
    const a = (L.rs = (L.rs + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const ri = (L, a, b) => a + Math.floor(rnd(L) * (b - a + 1));
  const pick = (L, arr) => arr[Math.floor(rnd(L) * arr.length)];
  function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }

  // ---------------------------------------------------------------- 2. WORLD DATA
  const DISTRICTS = [null,
    { id: 1, name: 'The Citadel', short: 'CITADEL', cap: 250, ref: 0.06, spd: 1.03, fury: 0, mean: 70, perk: 'Refs lean your way. Money buys stars.' },
    { id: 2, name: 'The Gilded', short: 'GILDED', cap: 170, ref: 0.03, spd: 1.02, fury: 0, mean: 66, perk: 'Wealthy, polished, protected.' },
    { id: 3, name: 'The Heartland', short: 'HEARTLAND', cap: 115, ref: 0, spd: 1.0, fury: 0, mean: 62, perk: 'Swing cities. The whistle is fair.' },
    { id: 4, name: 'The Scrap', short: 'SCRAP', cap: 75, ref: -0.02, spd: 0.99, fury: 0.7, mean: 58, perk: 'Old gear. Fury builds slowly.' },
    { id: 5, name: 'The Ruins', short: 'RUINS', cap: 40, ref: -0.04, spd: 0.98, fury: 1.7, mean: 55, perk: 'Refs against you. Fury builds fast.' },
  ];
  const FALLEN_REF = [0, 0.01, 0.01, 0, 0, -0.01]; // after The Wall Falls
  const T = (ab, city, name, sym, d, c1, c2, rg) => ({ ab, city, name, sym, d, c1, c2, rg });
  const TEAMS = [
    T('ZUR', 'Zurich', 'Vault Lords', 'keyhole', 1, '#d8dce4', '#1b2a4a', 'deu'),
    T('MON', 'Monaco', 'High Rollers', 'dice', 1, '#c8102e', '#f4efe4', 'fra'),
    T('DUB', 'Dubai', 'Sky Sovereigns', 'skyline', 1, '#d4af37', '#14181d', 'arab'),
    T('DOH', 'Doha', 'Gold Falcons', 'wing', 1, '#7a1230', '#e8c15a', 'arab'),

    if (INTRO.flash > 0) { c.fillStyle = 'rgba(255,235,225,' + INTRO.flash * 0.7 + ')'; c.fillRect(0, 0, w, h); INTRO.flash = Math.max(0, INTRO.flash - dt * 2.5); }
    drawVignette(c, w, h, 0.9);
  }
  function sunburst(c, x, y, r, a, rot) {
    c.save(); c.translate(x, y); c.rotate(rot || 0); c.globalAlpha = a;
    c.fillStyle = '#ff2a3a';
    for (let i = 0; i < 24; i++) { c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r, i * Math.PI / 12, i * Math.PI / 12 + Math.PI / 30); c.closePath(); c.fill(); }
    c.restore();
  }
  // drifting ash flecks (screen space) for menus, intro and games
  const ASH = [];
  function drawAsh(c, w, h, dt, amt) {
    while (ASH.length < 46) ASH.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 8, vy: -4 - Math.random() * 10, s: 0.6 + Math.random() * 1.8, a: 0.15 + Math.random() * 0.4, e: Math.random() < 0.15 });
    for (const p of ASH) {
      p.x += (p.vx + Math.sin((p.y + p.x) * 0.01) * 6) * dt; p.y += p.vy * dt;
      if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
      if (p.x < -5) p.x = w + 5; if (p.x > w + 5) p.x = -5;
      c.fillStyle = p.e ? 'rgba(255,80,50,' + p.a * amt + ')' : 'rgba(170,170,175,' + p.a * amt * 0.7 + ')';
      c.fillRect(p.x, p.y, p.s, p.s);
    }
  }
  let vigC = null, vigKey = '';
  function drawVignette(c, w, h, a, red) {
    const key = w + 'x' + h + (red ? 'r' : '');

      vigC = document.createElement('canvas'); vigC.width = Math.ceil(w); vigC.height = Math.ceil(h);
      const v = vigC.getContext('2d'), g = v.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, red ? 'rgba(90,0,8,.85)' : 'rgba(0,0,0,.85)');
      v.fillStyle = g; v.fillRect(0, 0, w, h); vigKey = key;
    }
    c.globalAlpha = a; c.drawImage(vigC, 0, 0, w, h); c.globalAlpha = 1;
  }
  function drawMenuBg(c, w, h, dt) {
    c.fillStyle = '#050506'; c.fillRect(0, 0, w, h);

  }

      else if (mode === 'game' && G) gameFrame(dt);
      else drawMenuBg(ctx, CW, CH, dt);
    } catch (e) { if (!errShown) { errShown = true; console.error(e); } }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.paused) pauseGame(); });
  L = loadSave();
  resize();
  showIntro();
  requestAnimationFrame(frame);
  // hooks used by tests/shots.mjs (headless screenshots); harmless in play
  window.__RF = {
    RF, get L() { return L; }, get G() { return G; },
    tapIntro() { INTRO.st = 'seq'; INTRO.t = 0; SND.init(); },
    introAt(t) { INTRO.st = 'seq'; INTRO.t = t; },
    enter: enterGames, select: showSelect, hub(tab) { curTab = tab || 'home'; showHub(); },
    newDynasty(id, seed) { L = RF.newLeague(seed || 1234, id); save(); },
    sim(weeks) { for (let i = 0; i < weeks && L.phase === 'season'; i++) RF.advanceWeek(L, null, null); save(); },
    play: startGame,
    step(sec) { if (!G) return; const n = Math.round(sec / RF.DT); for (let i = 0; i < n && G.m.state !== 'final'; i++) { RF.step(G.m, RF.DT); drainEvents(); } },
    dunk() {
      const m = G.m, p = m.pl.find((q) => q.team === 0 && q.ro === 'D') || m.pl.find((q) => q.team === 0);
      m.state = 'play'; m.stateT = 0;
      p.x = 212; p.y = 122; p.vx = 0; p.vy = -60; p.fx = 0; p.fy = -1;
      for (const q of m.pl) if (q !== p) { q.y = Math.max(q.y, 230 + q.k * 8); q.stun = 0; }
      const b = m.ball; Object.assign(b, { mode: 'held', own: p, hold: 0.6, carry: 80, passTeam: -1, target: null });
      m.chain = { team: 0, s: { C: 1, T: 1, K: 1, W: 0 } }; m.lastPoss = 0; m.ctrl = p;
      const keep = m.form[0]; m.form[0] = 9; setTimeout(() => { m.form[0] = keep; }, 120); G.banner = null; G.bigs = []; G.texts = [];
      m.inp.shoot = true;
    },
    finish() { if (G) { G.m.human = -1; while (G.m.state !== 'final') { RF.step(G.m, RF.DT); G.m.ev.length = 0; } finishGame(); } },
    result: showResult,
  };
})();
//==UI END
</script>
