<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Oblivion GP: unlockable cars preview</title>
<style>
html, body { margin: 0; min-height: 100%; background: #05040d; color: #e9f0ff; font-family: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
body.fill { height: 100%; overflow: hidden; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px max(16px, env(safe-area-inset-left)); background: rgba(5,4,13,.88); border-bottom: 1px solid #1c1a3a; }
.bar b { font: 700 13px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .14em; margin-right: 6px; }
.bar a, .bar button { font: 600 12px/1 inherit; letter-spacing: .08em; color: #9fdcff; background: #0e1030; border: 1px solid #2a2f66; border-radius: 6px; padding: 6px 9px; text-decoration: none; cursor: pointer; }
.bar .on { color: #05040d; background: #9fdcff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 10px 16px 30px; }
.card { position: relative; border-radius: 12px; border: 1.5px solid var(--c); background: linear-gradient(160deg, #0b0a22, #06050f); box-shadow: 0 0 14px var(--g) inset; overflow: hidden; }
.card canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
.card .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 4px 10px 0; }
.card .nm { font: 700 15px/1.1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .08em; }
.card .tag { font: 700 10px/1 "Chakra Petch", system-ui, sans-serif; letter-spacing: .16em; color: #05040d; background: var(--c); border-radius: 99px; padding: 3px 7px; }
.card .sub { padding: 2px 10px 8px; font-size: 12px; color: #9aa8cc; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .sw { width: 22px; height: 6px; border-radius: 3px; display: inline-block; }
.card button { font: 600 11px/1 inherit; color: #e9f0ff; background: #12143a; border: 1px solid var(--c); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
#stage { display: block; width: 100vw; height: 100vh; }
.cred { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 3px); text-align: center; font-size: 11px; color: rgba(220,230,255,.72); pointer-events: none; z-index: 6; }
.tagdev { position: fixed; right: 8px; top: 6px; font: 600 10px/1 inherit; letter-spacing: .1em; color: #6b7397; z-index: 6; pointer-events: none; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div id="main"></div>
<div class="cred">Created by Sam Eyde III</div>
<script type="module" src="cars2-preview.js"></script>
</body>
</html>
