<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFB Dynasty 2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}@media (display-mode:standalone){body{padding-top:max(20px,env(safe-area-inset-top))!important;padding-bottom:max(40px,env(safe-area-inset-bottom))!important;overscroll-behavior-y:none}}</style>
<title>CFB Dynasty 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: Saturday night under the lights. Team-colored header, a two-column "this week" board, grouped navigation below. */
:root{
  --night:#0a0f1f; --panel:#121a31; --panel-2:#19223f; --line:#27325a;
  --chalk:#eef2ff; --muted:#9aa5c8; --turf:#2e6a3d; --turf-dark:#285e36;
  --amber:#ffb627; --good:#3ddc97; --bad:#ff5d6c; --los:#6fb7ff;
  --blue:#4ea8ff; --purple:#a78bfa; --teal:#2dd4bf; --pink:#f472b6;
  --display:'Graduate','Rockwell','Courier New',serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--chalk)}
body{background:radial-gradient(1200px 500px at 50% -200px,#1b2a5c 0%,transparent 70%),var(--night)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,48px);letter-spacing:.02em;line-height:1.05}
h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em}
h3{font-family:var(--num);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{background:var(--amber);color:#1a1300;font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border-radius:6px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.badge{display:inline-grid;place-items:center;min-width:46px;height:28px;padding:0 6px;border-radius:4px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.18);flex:none}
.eyebrow{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.stars{color:var(--amber);letter-spacing:.05em;white-space:nowrap}
.tag{display:inline-block;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.amber{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}

/* Team picker */
.hero{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.team-card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.team-card:hover{border-color:var(--amber)}
.team-card .name{font-weight:600}
.team-card .meta{font-family:var(--num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ovr{margin-left:auto;font-family:var(--num);font-weight:700;font-size:22px}
select{background:var(--panel-2);color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}

/* Hub */
.hub-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hub-head .badge{min-width:64px;height:40px;font-size:18px}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.matchup .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.matchup .vs{font-family:var(--display);color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tab.on{background:var(--amber);color:#1a1300;border-color:var(--amber)}
.tw{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--num);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.me td{color:var(--amber)}
.tbl .sub{color:var(--muted);font-size:12.5px}
.wl{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl.w{color:var(--good)} .wl.l{color:var(--bad)}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
.units{display:grid;grid-template-columns:34px 1fr 30px;gap:6px 10px;align-items:center;font-family:var(--num);font-variant-numeric:tabular-nums}
.news{display:flex;flex-direction:column;gap:6px;font-size:14px}
.news div{padding-left:10px;border-left:2px solid var(--line)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.skill{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px}
.pips{display:flex;gap:4px}
.pips i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--amber)}

/* Game */
.log{display:flex;flex-direction:column;gap:4px;font-size:13.5px;max-height:220px;overflow:auto}
.log div{padding:4px 0;border-top:1px solid var(--line);color:var(--muted)}
.log div.hl{color:var(--chalk);font-weight:600}
.final-banner{font-family:var(--display);font-size:clamp(22px,5vw,34px);text-align:center;padding:8px 0}
.small-btn{font-family:var(--num);font-weight:700;padding:5px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.small-btn:hover:not(:disabled){border-color:var(--amber)}
.small-btn:disabled{opacity:.35;cursor:not-allowed}
.nm{background:var(--panel-2);color:var(--chalk);border:1px solid var(--amber);border-radius:5px;padding:5px 8px;font:inherit;width:min(100%,190px);min-width:0}
.edit{color:var(--muted);font-size:14px;padding:2px 5px;border-radius:4px}
.edit:hover{color:var(--amber);background:var(--panel-2)}
.cover{border-radius:12px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;border:1px solid rgba(255,255,255,.15);overflow:hidden}
.cover-mast{font-family:var(--display);font-size:clamp(20px,4.6vw,34px);letter-spacing:.04em;text-transform:uppercase;line-height:1;border-bottom:3px solid currentColor;padding-bottom:10px}
.cover-main{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cover-kicker{font-family:var(--num);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:14px;opacity:.85}
.cover-team{font-family:var(--display);font-size:clamp(34px,9vw,72px);line-height:.95;text-wrap:balance}
.cover-side{display:flex;flex-direction:column;gap:2px;font-family:var(--num);font-size:14px;text-transform:uppercase;letter-spacing:.06em;max-width:260px}
.cover-side b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:none;letter-spacing:0}
.cover-lines{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.cover-lines span{border-left:3px solid currentColor;padding-left:8px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.statgrid div{display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border-radius:8px;padding:10px 12px}
.statgrid .big{font-family:var(--num);font-weight:700;font-size:30px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.statgrid span:last-child{color:var(--muted);font-size:13px}
.venues{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:8px}
.venue{display:grid;grid-template-columns:22px auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.venue.mine{border-color:var(--amber)}
.vrank{font-family:var(--num);font-weight:700;font-size:18px;color:var(--muted);text-align:right}
.crowd{font-size:13px;letter-spacing:1px;color:var(--amber);white-space:nowrap}
.crowd i{font-style:normal;color:var(--line)}
.confs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.confs ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.confs li.me{color:var(--amber)}
#app [id^="mag-"]{scroll-margin-top:12px}
.weekly-mast{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--amber);padding-bottom:8px}
.weekly-mast h2{font-size:clamp(20px,4.5vw,28px)}
.upset{border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(255,255,255,.15)}
.upset-k{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.upset-h{font-family:var(--display);font-size:clamp(22px,5.4vw,36px);line-height:1.05;text-wrap:balance}
.upset-s{font-family:var(--num);font-size:14px;letter-spacing:.04em;opacity:.85}
.games4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.g4{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.g4.mine{border-color:var(--amber)}
.g4t{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-weight:600}
.heads{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.heads div{display:flex;gap:10px;align-items:baseline}
.heads .tag{flex:none;min-width:78px;text-align:center}
.sos{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.sos.hard{color:var(--good)} .sos.easy{color:var(--bad)}
.mv{font-family:var(--num);font-weight:700;font-size:13px;color:var(--muted)}
.mv.up{color:var(--good)} .mv.dn{color:var(--bad)}
.schemes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.scheme{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.scheme:hover{border-color:var(--muted)}
.scheme.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.scheme b{font-family:var(--num);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.scheme small{font-size:13px;line-height:1.35}
.aggr{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--amber)}
details summary{cursor:pointer;color:var(--amber);font-family:var(--num);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.plink{font:inherit;color:inherit;padding:0;text-align:left;text-decoration:underline dotted color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
.plink:hover{color:var(--amber)}
.phead{display:flex;gap:18px;align-items:center;border-radius:12px;padding:18px 20px;border:1px solid rgba(255,255,255,.15)}
.pno{font-family:var(--display);font-size:clamp(44px,11vw,80px);line-height:1;opacity:.95;flex:none}
.pno.sm{font-size:30px;color:var(--amber);min-width:56px;text-align:center}
.jerseys{display:flex;gap:10px;flex-wrap:wrap}
.jersey{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:104px;border-radius:12px 12px 8px 8px;border:1px solid rgba(255,255,255,.2)}
.jersey span{font-family:var(--display);font-size:40px;line-height:1}
.jersey small{font-family:var(--num);font-size:11.5px;text-align:center;padding:0 4px;line-height:1.2}
.hof{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.hofc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.warn{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.warn b{color:var(--bad)}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--night) 70%,transparent);z-index:50}
.busy span{font-family:var(--num);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 22px}
[hidden]{display:none!important}
.cond{text-align:center;font-family:var(--num);font-size:15px;letter-spacing:.03em;margin:0}
.notes{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.notes .tag{margin-right:6px}
.sec-bad{color:var(--bad)}
.offers{display:flex;flex-direction:column;gap:8px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.sched{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.srow select{min-width:0;width:100%}
.wboard{display:grid;grid-template-columns:1fr auto 1fr;background:#050806;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ws{display:flex;align-items:center;gap:10px;padding:12px 14px;min-width:0}
.ws.home{flex-direction:row-reverse;text-align:right}
.wn{font-family:var(--num);font-weight:700;letter-spacing:.06em;min-width:0}
.wsc{font-family:var(--num);font-weight:700;font-size:clamp(36px,9vw,56px);line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;margin-inline:auto}
.wpos{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);vertical-align:middle}
.wmid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;border-inline:1px solid var(--line);font-family:var(--num);text-align:center}
.wclk{font-size:22px;font-weight:700} .wdd{font-size:13px;color:var(--amber);font-weight:600}
.drive{position:relative;height:46px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--turf) 0 8.4%,var(--turf-dark) 8.4% 16.8%);border:2px solid #dfe8df;overflow:hidden}
.dz{position:absolute;top:0;bottom:0;width:8%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:12px}
.dl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45)}
.dfd{position:absolute;top:0;bottom:0;width:3px;background:#ffe14d;transform:translateX(-1px)}
.dball{position:absolute;top:50%;width:20px;height:12px;border-radius:50%;background:#7a3f1d;border:1.5px solid #f3e6d6;transform:translate(-50%,-50%);transition:left .35s ease}
@media (prefers-reduced-motion:reduce){.dball{transition:none}}
.wpbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--num);font-size:14px}
.wpt{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel-2)}
.wpt i{display:block;height:100%}
.wbanner{background:var(--amber);color:#1a1300;font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.02em;padding:12px 16px;border-radius:8px}
.gotw{border-color:color-mix(in srgb,var(--amber) 35%,var(--line))}
.cer{text-align:center;padding:28px 18px;border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.cer.drum h1{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.cer.drum h1{animation:none}}
.cer.reveal{border:1px solid rgba(255,255,255,.2)}
.finalists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.fin{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.fin.mine{border-color:var(--amber)}
/* ===== Locker room ===== */
.lr-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 30%,var(--panel)),var(--panel) 70%);border:1px solid var(--line);box-shadow:var(--shadow)}
@media (max-width:560px){.lr-head{grid-template-columns:1fr}}
.lr-chem{display:flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.15));border:3px solid rgba(255,255,255,.15);margin:auto;text-align:center}
.lr-chem b{font-family:var(--num);font-size:56px;line-height:1}.lr-chem span:last-child{font-family:var(--num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.lr-info p{margin:0 0 8px}
.lr-talks{display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:14px;color:var(--muted)}
.lr-talks i{width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line)}.lr-talks i.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(255,182,39,.6)}
.lr-talks span{margin-left:4px}
.lr-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lr-row:first-of-type{border-top:0}
@media (max-width:760px){.lr-row{grid-template-columns:1fr}.lr-row .lr-btns{justify-content:flex-start}}
.lr-row.risk .lr-who b{color:var(--bad)}
.lr-who{display:flex;gap:10px;align-items:center}.lr-who b{display:block}.lr-who small{color:var(--muted);font-size:13px}
.lr-ic{font-size:22px;line-height:1}
.lr-meter{display:flex;flex-direction:column;gap:4px}.lr-meter small{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lr-bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}.lr-bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.lr-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.caps div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line))}.caps small{color:var(--muted)}
/* ===== Polish & motion ===== */
button,a,[data-act]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.tab,.small-btn,.linkbtn,.uchip,.swc,.book,.uni-set,.mag-toc button{transition:transform .12s ease,filter .15s ease,box-shadow .15s ease,border-color .15s ease,background-color .15s ease,color .15s ease}
.tab:active,.small-btn:active,.uchip:active,.book:active,.uni-set:active,.mag-toc button:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.07)}
#app.enter>*{animation:enterUp .38s cubic-bezier(.2,.75,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:.03s}#app.enter>*:nth-child(3){animation-delay:.06s}#app.enter>*:nth-child(4){animation-delay:.09s}#app.enter>*:nth-child(5){animation-delay:.12s}#app.enter>*:nth-child(n+6){animation-delay:.15s}
@keyframes enterUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.navg .tab{display:inline-flex;align-items:center;gap:6px}
.ti2{font-size:14px;line-height:1;filter:saturate(1.1)}
.navg .tabs{scrollbar-width:thin}
.navg .tabs::-webkit-scrollbar{height:4px}.navg .tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.panel,.chip,.pred,.tcard,.case,.ach,.offer2{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.chip:hover,.pred:hover,.tcard:hover,.case:hover,.offer2:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.4)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(800px 400px at 0% 100%,rgba(78,168,255,.07),transparent 70%),radial-gradient(700px 360px at 100% 30%,rgba(167,139,250,.06),transparent 70%)}
.busy span{display:flex;align-items:center;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.busy span::before{content:"🏈";display:inline-block;font-size:24px;animation:spinball .9s linear infinite}
@keyframes spinball{to{transform:rotate(360deg)}}
#toasts{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,380px);pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#1d2647,#121a31);border:1px solid rgba(255,211,77,.5);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 24px rgba(255,211,77,.18);animation:toastIn .45s cubic-bezier(.2,.8,.2,1) both,toastOut .5s ease 4s both}
.toast .ti{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-size:22px;flex:none;background:radial-gradient(circle at 35% 30%,#fff8,transparent 60%),var(--tc);box-shadow:0 0 16px var(--tc)}
.toast small{display:block;font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffd34d}
.toast b{font-family:var(--num);font-size:19px}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){#app.enter>*,.toast,.busy span::before,.ring{animation:none!important}.chip:hover,.pred:hover,.tcard:hover,.case:hover,.offer2:hover{transform:none}}
/* ===== Yearbook ===== */
.yb{border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12)}
.yb-cover{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 45%,#000));text-shadow:0 2px 4px rgba(0,0,0,.45)}
.yb-mast{grid-column:1/-1;font-family:var(--display);font-size:clamp(28px,7vw,48px);line-height:1;border-bottom:3px solid rgba(255,255,255,.8);padding-bottom:8px}
.yb-team{display:flex;align-items:center;gap:12px}.yb-team .gd-logo{width:64px;height:64px;font-size:18px}
.yb-team b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,5.5vw,32px);line-height:1.05}.yb-team span{font-family:var(--num);font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.yb-rec{grid-column:1;display:flex;align-items:baseline;gap:12px}.yb-rec b{font-family:var(--num);font-size:clamp(44px,12vw,72px);line-height:1}.yb-rec span{font-family:var(--num);font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.yb-grade{grid-column:2;grid-row:2/4;align-self:center;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;border:4px solid #ffd34d;color:#ffd34d;font-family:var(--display);font-size:40px;line-height:1;transform:rotate(-10deg);text-shadow:none;background:rgba(0,0,0,.35);box-shadow:0 0 0 3px rgba(0,0,0,.3) inset}
.yb-grade small{font-family:var(--num);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:-14px}
.yb-page{background:#f4ecd8;color:#231d12;padding:20px 18px 24px;display:flex;flex-direction:column;gap:10px;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(35,29,18,.05) 31px 32px)}
.yb-page .plink{color:#231d12;text-decoration-color:rgba(35,29,18,.4)}
.yb-lede{margin:0;font-size:17px;line-height:1.55;font-weight:500}
.yb-lede::first-letter{font-family:var(--display);font-size:44px;float:left;line-height:.9;margin:4px 8px 0 0;color:var(--c1)}
.yb-h{margin:12px 0 2px;font-family:var(--display);font-weight:400;font-size:22px;color:#231d12;border-bottom:2px solid var(--c1);padding-bottom:4px}
.ybgames{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ybg{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:8px;background:#fffaf0;border:1px solid #d9ccae;font-family:var(--num);text-align:center}
.ybg.w{border-bottom:4px solid #1f8a54}.ybg.l{border-bottom:4px solid #b4232c}
.ybg span{font-size:10.5px;letter-spacing:.12em;color:#7a6c4f;min-height:12px}.ybg b{font-size:15px}.ybg small{font-size:12px;color:#5b4f37}
.ybms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.ybm{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:#fffaf0;border:1px solid #d9ccae}
.ybm .pk{color:#8a5a00}.ybm b{font-family:var(--num);font-size:26px}.ybm small{color:#7a6c4f}
.ybmvp{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 18%,#fffaf0),#fffaf0)}
.ybno{font-family:var(--display);font-size:56px;line-height:1;color:var(--c1);min-width:70px;text-align:center}
.ybmvp b{display:block;font-family:var(--display);font-weight:400;font-size:24px}.ybmvp div span{display:block;font-family:var(--num);letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:#5b4f37}.ybmvp small{color:#5b4f37}
.ybl,.ybsup,.ybp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.ybl div,.ybsup div,.ybp div{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#fffaf0;border:1px solid #d9ccae}
.ybl span,.ybsup span,.ybp span{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a5a00}
.ybl b{font-family:var(--num);font-size:28px;line-height:1.1}.ybsup b,.ybp b{font-size:16px}
.ybl small,.ybsup small,.ybp small{color:#5b4f37;font-size:13px}
.ybp i{position:absolute;right:8px;top:8px;font-style:normal;font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;transform:rotate(4deg)}
.ybp i.ok{color:#1f8a54;border:2px solid #1f8a54}.ybp i.no{color:#b4232c;border:2px solid #b4232c}
.ybaw,.ybsen{display:flex;flex-direction:column;gap:6px}.ybaw div,.ybsen div{padding:8px 12px;border-radius:8px;background:#fffaf0;border:1px solid #d9ccae}
.ybaw span,.ybsen small{color:#5b4f37;font-size:13.5px}.ybsen div{display:flex;flex-direction:column}
.yb-sign{margin:14px 0 0;text-align:right;font-style:italic;font-size:17px;color:#5b4f37}
/* ===== Trophy room ===== */
.troom{display:flex;flex-direction:column;gap:14px;padding:20px 16px;border-radius:18px;background:radial-gradient(600px 220px at 50% 0%,rgba(255,211,77,.12),transparent 70%),linear-gradient(180deg,#1b1408,#0e0b06);border:1px solid rgba(255,211,77,.35);box-shadow:var(--shadow)}
.tr-head{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tr-head .eyebrow{color:#ffd34d}.tr-head h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);background:linear-gradient(180deg,#fff3c4,#ffd34d 50%,#c8901a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%;margin-top:6px}
.tr-stats div{display:flex;flex-direction:column;padding:10px;border-radius:10px;background:rgba(255,211,77,.07);border:1px solid rgba(255,211,77,.25)}
.tr-stats b{font-family:var(--num);font-size:28px;color:#ffd34d;line-height:1.1}.tr-stats span{font-size:12.5px;color:#d6c79f}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;padding-bottom:12px;border-bottom:8px solid #3a2a10;box-shadow:0 10px 0 -2px #1d1406}
.case{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 10px 12px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);border-bottom:3px solid var(--c1)}
.case .ci{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,211,77,.55))}
.case.nat{background:linear-gradient(180deg,rgba(255,211,77,.2),rgba(255,211,77,.04));border-color:rgba(255,211,77,.6)}.case.nat .ci{font-size:58px}
.case b{font-size:14px;line-height:1.2;color:#f6ecd2}.case small{font-family:var(--num);font-size:13px;color:#c9b37a;letter-spacing:.06em}
.stops{display:flex;flex-direction:column;gap:6px}.stops div{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--panel-2);border-left:4px solid var(--c1)}.stops span{color:var(--muted);font-size:14px}
.books{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding:6px 4px 0;border-bottom:6px solid #3a2a10}
.book{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:54px;height:150px;padding:10px 4px;border-radius:4px 4px 0 0;cursor:pointer;color:#fff;background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 70%,#000),var(--c1) 30%,var(--c1) 70%,color-mix(in srgb,var(--c1) 60%,#000));border:1px solid rgba(255,255,255,.2);border-bottom:0;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.book:hover{transform:translateY(-6px)}
.book span{font-family:var(--num);font-weight:700;font-size:15px}.book b{writing-mode:vertical-rl;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.1em}.book small{font-family:var(--num);font-size:12px}
.book i{font-style:normal;font-family:var(--display);font-size:16px;color:#ffd34d}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);opacity:.55;filter:grayscale(.8)}
.ach.on{opacity:1;filter:none;border-color:color-mix(in srgb,var(--tc) 60%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 14%,var(--panel-2)),var(--panel-2))}
.ach .ai{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:22px;flex:none;background:var(--panel);border:2px solid var(--tc)}
.ach.on .ai{box-shadow:0 0 14px color-mix(in srgb,var(--tc) 60%,transparent)}
.ach b{display:block;font-size:15px}.ach small{display:block;color:var(--muted);font-size:13px}.ach em{font-style:normal;font-family:var(--num);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tc)}
/* ===== Uniforms ===== */
.uni-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.uni-set{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);color:var(--chalk);cursor:pointer}
.uni-set.on{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset,0 0 18px rgba(244,114,182,.25)}
.uni-set b{font-family:var(--num);font-size:15px}.uni-set small{font-size:12px;color:var(--muted)}
.unisvg{max-width:100%;height:auto;display:block}
.uni-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:640px){.uni-edit{grid-template-columns:1fr}}
.uni-big{padding:16px;border-radius:14px;background:radial-gradient(circle at 50% 30%,#2a3560,#0d1226 70%);border:1px solid var(--line);display:grid;place-items:center}
.uni-ctl{display:flex;flex-direction:column;gap:10px}
.uni-row{display:flex;flex-direction:column;gap:6px}.uni-row>span{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swc{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.swc.on{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.sw input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:2px;cursor:pointer}
.gd-uni{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--num);font-size:13px}
.gd-uni>span{font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-right:2px}
.uchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-family:var(--num);font-weight:600;font-size:13px;cursor:pointer}
.uchip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.uchip.on{background:#fff;color:#111;border-color:#fff}
/* ===== Job offers ===== */
.phone{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(61,220,151,.14),var(--panel) 60%);border:1px solid rgba(61,220,151,.4)}
.phone.quiet{background:var(--panel);border-color:var(--line)}
.phone h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,36px);line-height:1.05}
.ring{font-size:48px;line-height:1;animation:ring 1.4s ease-in-out infinite;transform-origin:50% 60%}
.phone.quiet .ring{animation:none}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-14deg)}10%,20%,30%{transform:rotate(14deg)}}
.offers2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.offer2{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 34%,var(--panel)),var(--panel) 65%);border:1px solid color-mix(in srgb,var(--c1) 55%,var(--line));box-shadow:var(--shadow)}
.offer2.stay{border-style:dashed}
.of-top{display:flex;gap:12px;align-items:center}.of-top .gd-logo{width:60px;height:60px;font-size:17px}
.of-top b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05}.of-top span{font-size:14px;color:var(--muted)}
.of-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.of-facts div{display:flex;flex-direction:column;padding:8px;border-radius:10px;background:rgba(0,0,0,.25);text-align:center}
.of-facts b{font-family:var(--num);font-size:19px}.of-facts span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.of-pitch{margin:0;font-style:italic;font-size:15px}.of-pitch small{font-style:normal;color:var(--muted)}
.of-pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.of-pc p{margin:3px 0 0;font-size:13.5px}
.newjob{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px;border-radius:18px;color:#fff;background:radial-gradient(500px 200px at 50% 0%,rgba(255,211,77,.25),transparent 70%),linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 40%,#000));text-shadow:0 2px 4px rgba(0,0,0,.5);box-shadow:var(--shadow)}
.newjob h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,48px)}
.newjob .gd-logo{width:90px;height:90px;font-size:24px}
/* ===== Preseason magazine ===== */
:root{--g1:#fff3c4;--g2:#ffd34d;--g3:#c8901a}
.mag{display:flex;flex-direction:column;gap:16px}
.mag-intro{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:8px 0}
.mag-cover{position:relative;overflow:hidden;border-radius:16px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:16px;color:#fff;min-height:420px;
  background:radial-gradient(500px 340px at 85% 45%,rgba(255,255,255,.18),transparent 70%),linear-gradient(150deg,var(--c1) 0%,color-mix(in srgb,var(--c1) 55%,#000) 60%,color-mix(in srgb,var(--c2) 45%,#000) 100%);
  border:1px solid rgba(255,255,255,.2);box-shadow:var(--shadow);text-shadow:0 2px 6px rgba(0,0,0,.55)}
.mc-num{position:absolute;right:-10px;bottom:-40px;font-family:var(--display);font-size:clamp(220px,52vw,380px);line-height:1;color:rgba(255,255,255,.09);pointer-events:none;text-shadow:none}
.mc-top{display:flex;flex-direction:column;gap:4px;border-bottom:4px solid #fff;padding-bottom:8px;position:relative}
.mc-mast{font-family:var(--display);font-size:clamp(44px,13vw,92px);line-height:.9;letter-spacing:.02em;text-transform:uppercase}
.mc-issue{font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#ffd34d}
.mc-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:end;position:relative;flex:1}
.mc-lines{display:flex;flex-direction:column;gap:12px}
.mc-lines div{display:flex;flex-direction:column;border-left:4px solid #ffd34d;padding-left:10px}
.mc-lines b{font-family:var(--num);font-weight:700;font-size:clamp(17px,4.2vw,22px);text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.mc-lines span{font-size:13.5px;opacity:.9}
.mc-star{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px}
.mc-kick{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;background:#ffd34d;color:#1a1300;padding:3px 10px;border-radius:4px;text-shadow:none}
.mc-name{font-family:var(--display);font-size:clamp(40px,10vw,76px);line-height:.92;text-wrap:balance}
.mc-sub{font-family:var(--num);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.mc-head{font-family:var(--display);font-size:clamp(18px,4.4vw,26px);color:#ffd34d;line-height:1.1}
.mc-foot{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.4);padding-top:8px;position:relative}
.mc-bar{margin-left:auto;width:90px;height:22px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px);opacity:.8}
@media (max-width:560px){.mc-body{grid-template-columns:1fr}.mc-star{align-items:flex-start;text-align:left;order:-1}.mag-cover{min-height:0}}
.mag-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:6px}

/* =====================================================================
   CFB Dynasty 2 remodel: team-colored theme, stadium header, dock nav,
   glass cards. The user's team colors flow in as --tc1/--tc2.
   ===================================================================== */
:root{--night:#060914;--panel:#0d1429;--panel-2:#141d39;--line:#202d55;--r:20px;--tc1:#1e3a8a;--tc2:#ffffff;
  --glass:rgba(13,20,41,.72);--hair:rgba(255,255,255,.08)}
html,body{background:var(--night)}
body{background:
  radial-gradient(1100px 520px at 50% -220px,color-mix(in srgb,var(--tc1) 42%,transparent),transparent 72%),
  radial-gradient(600px 400px at 100% 0%,rgba(255,255,255,.04),transparent 70%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 1px,transparent 1px 96px),
  var(--night);background-attachment:scroll}
::selection{background:color-mix(in srgb,var(--tc1) 60%,#fff 10%)}
#app{gap:20px}
h2{font-family:var(--display);font-weight:400;letter-spacing:.02em}

/* ---------- Hero header ---------- */
.teamband{padding:26px 24px 64px;border-radius:26px;border:1px solid rgba(255,255,255,.14);
  background:
    linear-gradient(112deg,transparent 0 57%,rgba(255,255,255,.07) 57% 59.5%,transparent 59.5% 62%,rgba(255,255,255,.045) 62% 63.5%,transparent 63.5%),
    radial-gradient(700px 320px at 12% -20%,color-mix(in srgb,var(--t2) 26%,transparent),transparent 70%),
    radial-gradient(500px 260px at 100% 120%,rgba(0,0,0,.55),transparent 70%),
    linear-gradient(135deg,var(--t1) 0%,color-mix(in srgb,var(--t1) 60%,#000) 62%,color-mix(in srgb,var(--t1) 38%,#000) 100%);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.teamband::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.10) 45%,transparent 60%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{55%,100%{transform:translateX(120%)}}
.teamband::after{opacity:.1;font-size:clamp(110px,26vw,200px);bottom:-30px}
.tb-logo{width:clamp(78px,18vw,104px);height:clamp(86px,20vw,116px);border-radius:24px 24px 50% 50%/24px 24px 44% 44%;font-size:clamp(20px,5vw,28px);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--t2) 80%,transparent),0 0 0 7px rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.5)!important}
.tb-name{font-size:clamp(30px,7vw,54px);line-height:.98;text-shadow:0 4px 18px rgba(0,0,0,.45)}
.tb-eyebrow{letter-spacing:.24em}
.teamband+.chips{margin:-50px 14px 0;position:relative;z-index:2}
.chips{gap:10px}
.chip{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--hair);border-left:0;border-radius:16px;
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--acc) 85%,transparent),0 12px 28px rgba(0,0,0,.4);padding:12px 14px}
.chip span{font-size:11px;letter-spacing:.18em}
.chip b{font-size:26px}

/* ---------- Dock navigation ---------- */
.navgroups{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--hair);border-radius:22px;padding:12px 14px;gap:12px 22px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.navl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;letter-spacing:.24em;opacity:.9}
.navg{gap:10px}
.navg .tabs{gap:6px}
.navg .tab{flex-direction:column;justify-content:center;gap:5px;min-width:76px;padding:9px 8px 8px;border-radius:14px;font-size:11.5px;letter-spacing:.08em;
  background:rgba(255,255,255,.03);border:1px solid var(--hair);color:#b9c2e3}
.navg .tab .ti2{font-size:20px}
.navg .tab:hover{background:rgba(255,255,255,.07);color:#fff}
.navg .tab.on{color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc1) 78%,#fff 14%),var(--tc1) 60%,color-mix(in srgb,var(--tc1) 70%,#000));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--tc2) 55%,transparent),0 8px 22px color-mix(in srgb,var(--tc1) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
@media (max-width:600px){.navl{writing-mode:horizontal-tb;transform:none}.navg{flex-direction:column;align-items:flex-start}.navg .tab{min-width:70px}}

/* ---------- Cards ---------- */
.panel{--pb:color-mix(in srgb,var(--acc,var(--blue)) 45%,transparent);border:1px solid transparent;border-radius:22px;padding:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 120px) padding-box,linear-gradient(var(--panel),var(--panel)) padding-box,
    linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 38%,var(--pb)) border-box;
  box-shadow:0 16px 40px rgba(0,0,0,.38)}
.panel[data-c]{border-top:1px solid transparent;box-shadow:inset 0 3px 0 color-mix(in srgb,var(--acc) 85%,transparent),0 16px 40px rgba(0,0,0,.38)}
.panel.event{--pb:var(--amber)}.panel.warn{--pb:var(--bad)}
.panel>h3,.panel>.row>h3,.panel h3:first-child{font-size:12.5px;letter-spacing:.2em}
.panel>h3::after{content:"";flex:1;height:1px;margin-left:6px;background:linear-gradient(90deg,var(--line),transparent)}
.panel h3::before{width:10px;height:10px;border-radius:3px}
details.panel summary{padding:2px 0}

/* ---------- Tables ---------- */
.tbl th{font-size:11px;letter-spacing:.16em;background:rgba(255,255,255,.025)}
.tbl td{border-color:var(--hair)}
.tbl tbody tr{transition:background-color .15s ease}
.tbl tbody tr:hover td{background:rgba(255,255,255,.035)}
.tbl tr.me td{background:linear-gradient(90deg,color-mix(in srgb,var(--tc1) 34%,transparent),transparent 85%)!important;color:#fff}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--amber)}

/* ---------- Badges & buttons ---------- */
.badge{border-radius:8px;border-color:rgba(255,255,255,.22);
  background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,0) 48%),linear-gradient(105deg,var(--b1,#333) 0 82%,color-mix(in srgb,var(--b2,#fff) 85%,var(--b1,#333)) 82% 88%,var(--b1,#333) 88%)}
.btn{border-radius:14px;letter-spacing:.08em;box-shadow:0 3px 0 #9a6400,0 10px 26px rgba(255,182,39,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.small-btn{border-radius:10px}
.tab{border-radius:999px}

/* ---------- Game day ---------- */
.gameday{border-radius:26px;box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.gameday::after{content:"";position:absolute;inset:-40% -10% auto;height:70%;pointer-events:none;
  background:radial-gradient(closest-side at 20% 50%,rgba(255,255,255,.14),transparent),radial-gradient(closest-side at 80% 50%,rgba(255,255,255,.14),transparent);mix-blend-mode:screen}
.gd-logo{box-shadow:0 0 0 4px rgba(255,255,255,.12),0 12px 28px rgba(0,0,0,.5)!important}

/* ---------- Title screen ---------- */
.brand.sel-hero{min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:34px 28px 30px;border-radius:28px;border:1px solid rgba(255,255,255,.14);

function depthOf(t,pos){

}

// ===================== SCHEDULE =====================
const pairKey=(a,b)=>a<b?a+"-"+b:b+"-"+a;
// Random perfect matching of ids where bad(a,b) pairs are not allowed.
function perfectMatch(ids,bad){
  for(let t=0;t<400;t++){
    const a=shuffle(ids.slice()),out=[];let ok=true;
    while(a.length){
      const x=a.pop(),opts=a.filter(y=>!bad(x,y));
      if(!opts.length){ok=false;break}
      const y=opts[Math.floor(rnd()*opts.length)];a.splice(a.indexOf(y),1);out.push([x,y]);
    }
    if(ok)return out;
  }
  return null;
}
// C rounds of conference play; protected rivalries are always included.
function confRounds(ids,C,req){
  for(let t=0;t<300;t++){
    const used=new Set(),rounds=[],todo=shuffle(req.slice());let ok=true;
    for(let r=0;r<C&&ok;r++){
      const busy=new Set(),pairs=[];
      for(const [a,b] of todo.slice()){if(!busy.has(a)&&!busy.has(b)&&!used.has(pairKey(a,b))){pairs.push([a,b]);busy.add(a);busy.add(b);todo.splice(todo.findIndex(e=>e[0]===a&&e[1]===b),1)}}
      const rest=perfectMatch(ids.filter(i=>!busy.has(i)),(x,y)=>used.has(pairKey(x,y)));
      if(!rest){ok=false;break}
      for(const [x,y] of rest){const k=todo.findIndex(e=>pairKey(e[0],e[1])===pairKey(x,y));if(k>=0)todo.splice(k,1)}
      for(const pr of [...pairs,...rest])used.add(pairKey(pr[0],pr[1]));
      rounds.push([...pairs,...rest]);
    }
    if(ok&&!todo.length)return rounds;
  }
  return null;
}
function makeSchedule(){
  const teams=S.teams.filter(act);
  for(let attempt=0;attempt<60;attempt++){
    const played=new Set(),weeks=[...Array(12)].map(()=>[]),busy=[...Array(12)].map(()=>new Set());
    const put=(w,a,b)=>{weeks[w].push(rnd()<.5?[a,b]:[b,a]);busy[w].add(a);busy[w].add(b);played.add(pairKey(a,b))};
    let ok=true;
    CONFS.forEach((c,ci)=>{
      if(!ok)return;
      const ids=teams.filter(t=>t.conf===ci).map(t=>t.id);if(!ids.length)return;
      const C=Math.min(CONF_GAMES[ci],ids.length-1),ncw=nonConfWeeks(ci),cw=[...Array(12).keys()].filter(w=>!ncw.includes(w)).slice(0,C);
      const req=RIVALS.map(([x,y])=>[idOf(x),idOf(y)]).filter(([a,b])=>ids.includes(a)&&ids.includes(b));
      const rounds=confRounds(ids,C,req);if(!rounds){ok=false;return}
      shuffle(rounds).forEach((pairs,k)=>pairs.forEach(([a,b])=>put(cw[k],a,b)));
    });
    if(!ok)continue;
    for(const [x,y] of RIVALS){
      const a=idOf(x),b=idOf(y);if(a<0||b<0||!act(T(a))||!act(T(b))||T(a).conf===T(b).conf)continue;
      if(!busy[11].has(a)&&!busy[11].has(b)&&!played.has(pairKey(a,b)))put(11,a,b);
    }
    for(let w=0;w<12&&ok;w++){
      const avail=teams.filter(t=>!busy[w].has(t.id)).map(t=>t.id);
      const pairs=perfectMatch(avail,(a,b)=>T(a).conf===T(b).conf||played.has(pairKey(a,b)));
      if(!pairs){ok=false;break}
      pairs.forEach(([a,b])=>put(w,a,b));
    }
    if(ok)return weeks;
  }
  throw new Error("Could not build a schedule");
}


// ===================== SCHEDULE BUILDER =====================
const canEditSched=()=>S.phase==="regular"&&S.results.length===0;
function myGame(w){return S.schedule[w].find(p=>p.includes(S.user))}
function swapOptions(w){
  const u=S.user,cur=myGame(w),Z=cur[0]===u?cur[1]:cur[0];
  if(T(Z).conf===T(u).conf||rivalryOf(cur[0],cur[1]))return [];
  const played=new Set();S.schedule.forEach(wk=>wk.forEach(([h,a])=>played.add(pairKey(h,a))));
  const out=[];
  for(const [h,a] of S.schedule[w]){
    if(h===u||a===u||T(h).conf===T(a).conf||rivalryOf(h,a))continue;
    for(const [X,Y] of [[h,a],[a,h]]){
      if(T(X).conf===T(u).conf||played.has(pairKey(u,X))||T(Z).conf===T(Y).conf||played.has(pairKey(Z,Y)))continue;
      out.push({X,Y,h,a});
    }
  }
  return out;
}
function refreshSchedule(){S.wx={};RK.key=null;S.pre=buildPreseason()}
function doSwap(w,X,quiet){
  const o=swapOptions(w).find(x=>x.X===X);if(!o)return;
  const u=S.user,wk=S.schedule[w],ci=wk.findIndex(p=>p.includes(u)),cur=wk[ci],Z=cur[0]===u?cur[1]:cur[0];
  const oi=wk.findIndex(p=>p[0]===o.h&&p[1]===o.a);
  wk[ci]=cur[0]===u?[u,X]:[X,u];wk[oi]=rnd()<.5?[Z,o.Y]:[o.Y,Z];
  if(!quiet)refreshSchedule();
}
function toggleHome(w){const wk=S.schedule[w],i=wk.findIndex(p=>p.includes(S.user));wk[i]=[wk[i][1],wk[i][0]];refreshSchedule()}
function autoSchedule(mode){
  const u=S.user,mine=ovr(T(u));
  const targets=[mine-8,72,62];let slot=0;
  for(const w of nonConfWeeks(T(u).conf)){
    const cur=myGame(w),Z=cur[0]===u?cur[1]:cur[0];
    if(T(Z).conf===T(u).conf||rivalryOf(cur[0],cur[1]))continue;
    const all=[Z,...swapOptions(w).map(o=>o.X)],tg=targets[slot++%3];
    const score=x=>{const o=ovr(T(x));return mode==="easy"?-o:mode==="hard"?o:-Math.abs(o-tg)};
    const best=all.sort((a,b)=>score(b)-score(a))[0];
    if(best!==Z)doSwap(w,best,true);
    if(mode==="easy"){const p=myGame(w);if(p[0]!==u){const wk=S.schedule[w],i=wk.indexOf(p);wk[i]=[u,p[0]]}}
  }
  refreshSchedule();
}

// ===================== RECORDS & RANKINGS =====================
function record(id){
  let w=0,l=0,pf=0,pa=0;
  for(const g of S.results){if(g.h!==id&&g.a!==id)continue;const me=g.h===id?g.hs:g.as,th=g.h===id?g.as:g.hs;pf+=me;pa+=th;me>th?w++:l++}
  return {w,l,pf,pa};
}
function confRec(id){
  let w=0,l=0;const c=T(id).conf;
  for(const g of S.results){if(g.type!=="reg"||(g.h!==id&&g.a!==id))continue;const o=g.h===id?g.a:g.h;if(T(o).conf!==c)continue;const me=g.h===id?g.hs:g.as,th=g.h===id?g.as:g.hs;me>th?w++:l++}
  return {w,l};
}
let RK={key:null};
function rankData(){
  const key=S.season+"|"+S.results.length;
  if(RK.key===key)return RK;
  const ids=S.teams.filter(act).map(t=>t.id),n={},m={},op={};
  ids.forEach(i=>{n[i]=0;m[i]=0;op[i]=[]});
  for(const g of S.results){const d=clamp(g.hs-g.as,-24,24);m[g.h]+=d;m[g.a]-=d;n[g.h]++;n[g.a]++;op[g.h].push(g.a);op[g.a].push(g.h)}
  let r={};ids.forEach(i=>r[i]=n[i]?m[i]/n[i]:0);
  for(let it=0;it<20;it++){const nr={};let avg=0;ids.forEach(i=>{nr[i]=n[i]?m[i]/n[i]+op[i].reduce((s,o)=>s+r[o],0)/n[i]:0;avg+=nr[i]});avg/=ids.length;ids.forEach(i=>r[i]=nr[i]-avg)}
  // Strength of each team: early on it leans on preseason talent, later on actual results.
  const str={};ids.forEach(i=>{const pr=ovr(T(i))-80;str[i]=(n[i]*r[i]+3*pr)/(n[i]+3)});
  // Strength of schedule: average strength of opponents played (full schedule before week 1).
  const sos={},qw={},bl={};
  ids.forEach(i=>{
    let opps=op[i];
    if(!opps.length&&S.schedule)opps=S.schedule.map(wk=>wk.find(p=>p.includes(i))).filter(Boolean).map(([h,a])=>h===i?a:h).filter(o=>str[o]!==undefined);
    sos[i]=opps.length?opps.reduce((s,o)=>s+str[o],0)/opps.length:0;
    qw[i]=0;bl[i]=0;
  });
  for(const g of S.results){const w=g.hs>g.as?g.h:g.a,l=w===g.h?g.a:g.h;if(str[l]>=6)qw[w]=(qw[w]||0)+1;if(str[w]<=-8)bl[l]=(bl[l]||0)+1}
  const meanSos=ids.reduce((s,i)=>s+sos[i],0)/ids.length;
  const sosOrder=ids.slice().sort((a,b)=>sos[b]-sos[a]),sosRank={};sosOrder.forEach((id,k)=>sosRank[id]=k+1);
  const score={};
  ids.forEach(i=>{const rc=record(i),prior=(ovr(T(i))-80)*1.3;
    score[i]=(rc.w-1.3*rc.l)*3+r[i]*.5+prior*Math.max(0,7-n[i])/5+prior*.15+[3,-1,-10][CONF_TIER[T(i).conf]]*Math.min(n[i],6)/6
      +(sos[i]-meanSos)*.55*Math.min(n[i],4)/4+(qw[i]||0)*1.2-(bl[i]||0)*1.5});
  // The CFP committee only looks at this season's resume: no preseason bias, more weight on schedule and big wins.
  const cfp={};ids.forEach(i=>{const rc=record(i);cfp[i]=(rc.w-1.3*rc.l)*3+r[i]*.6+(sos[i]-meanSos)*.75*Math.min(n[i],4)/4+(qw[i]||0)*1.8-(bl[i]||0)*2
    +[3,-1,-10][CONF_TIER[T(i).conf]]+(S.ccg&&S.ccg.some(g=>g.winner===i)?2:0)});
  const cfpOrder=ids.slice().sort((a,b)=>cfp[b]-cfp[a]);
  RK={key,score,sos,sosRank,qw,bl,cfp,cfpOrder,order:ids.sort((a,b)=>score[b]-score[a])};
  return RK;
}
// AP Poll: 62 voters rank 25 teams. Voters are slow to move teams they ranked last week.
function voteAP(){
  const RD=rankData(),prev=S.ap&&S.ap.season===S.season?S.ap.rank:{},base={};
  RD.order.forEach(i=>{const pr=prev[i];base[i]=RD.score[i]+(pr&&pr<=25?(26-pr)*.35:0)});
  const cand=RD.order.slice().sort((a,b)=>base[b]-base[a]),pool=cand.slice(0,40),pts={},fpv={};
  for(let v=0;v<62;v++)pool.map(i=>[i,base[i]+normal()*2.2]).sort((a,b)=>b[1]-a[1]).slice(0,25).forEach(([i],k)=>{pts[i]=(pts[i]||0)+25-k;if(!k)fpv[i]=(fpv[i]||0)+1});
  const voted=Object.keys(pts).map(Number).sort((a,b)=>pts[b]-pts[a]||base[b]-base[a]);
  const order=[...voted,...cand.filter(i=>!pts[i])],rank={};order.forEach((id,k)=>rank[id]=k+1);
  S.ap={season:S.season,order,pts,fpv,rank,prev};
}
const rankIds=()=>S.ap&&S.ap.season===S.season?S.ap.order:rankData().order;
const cfpIds=()=>rankData().cfpOrder;
const cfpOut=()=>S.phase!=="regular"||S.week>=9;
const sosRankOf=id=>rankData().sosRank[id]||"–";
const qWins=id=>rankData().qw[id]||0;
function rankOf(id){return rankIds().indexOf(id)+1}
function rankTag(id){const r=rankOf(id);return r<=25?`#${r} `:""}
function confStandings(c){
  const rs=rankData().score;
  return S.teams.filter(t=>t.conf===c&&act(t)).map(t=>t.id).sort((a,b)=>{
    const A=confRec(a),B=confRec(b);if((B.w-B.l)!==(A.w-A.l))return (B.w-B.l)-(A.w-A.l);
    const h2h=S.results.find(g=>g.type==="reg"&&((g.h===a&&g.a===b)||(g.h===b&&g.a===a)));
    if(h2h){const aw=(h2h.h===a)===(h2h.hs>h2h.as);return aw?-1:1}
    return rs[b]-rs[a];
  });
}

// ===================== GAME ENGINE =====================
function opp(g,id){return id===g.home?g.away:g.home}

function changePoss(g,team,pos){if(g.ot){otNext(g);return}setPoss(g,team,pos)}

// ---------- AI play calling ----------
function aiOff(g){
  const id=g.poss,o=opp(g,id),lead=g.score[id]-g.score[o],late=!g.ot&&g.qtr===4&&g.clock<g.qlen*60*.35,A=plan(id).aggr;
  if(g.ot&&g.ot.round>=3)return wpick({run_in:20,qb_draw:10,short:30,mesh:25,pa:15});
  if(!g.ot&&g.qtr===4&&lead>0&&g.clock<=(5-g.down)*40)return "kneel";
  if(g.down===4){
    const fp=fgProb(g,id,100-g.pos+17);let go=false;
    if(g.ot){
      const second=g.ot.n===1;
      if(second&&lead<-3)go=true;
      else if(fp>.5&&(g.togo>2||(second&&lead===-3)))return "fg";
      else go=true;
    } else if(late&&lead<0&&(lead<-3||fp<.5))go=true;
    else if(late&&lead<0&&fp>=.5)return "fg";
    else if(g.togo<=[0,1,2,3,4][A-1]&&g.pos>=[99,70,45,40,32][A-1])go=true;
    else if(fp>=[.4,.5,.55,.62,.72][A-1])return "fg";
    if(!go)return "punt";
  }
  const w=planWeights(id),runs=["run_in","run_out","qb_draw","reverse"],passes=["short","mesh","deep","pa","screen","flea"];
  const mul=(keys,f)=>keys.forEach(k=>{if(w[k])w[k]*=f});
  if(g.togo<=2){mul(runs,2);w.sneak=g.togo<=1?25:10;mul(["deep","flea"],.3)}
  else if(g.down>=3&&g.togo>=7){mul(passes,2.5);mul(runs,.25);mul(["rpo"],.4)}
  if(late&&lead<0){mul(["deep"],2);mul(["short","mesh"],1.5);mul(runs,.4)}
  if(late&&lead>0){mul(runs,2.5);mul(["deep"],.2);w.flea=0}
  if(garbage(g,id)){mul(runs,2.5);mul(["deep","flea"],.2)}
  return wpick(w);
}
function aiDef(g){
  const d=opp(g,g.poss),DP=dplan(d),lead=g.score[d]-g.score[g.poss],late=!g.ot&&g.qtr===4&&g.clock<g.qlen*60*.3,B=[.6,.8,1,1.3,1.7][plan(d).aggr-1];
  const w={...DSCHEMES[DP.scheme].w},mul=(ks,f)=>ks.forEach(k=>w[k]=(w[k]||0)*f);
  if(g.togo<=2){mul(["stop"],2.5);mul(["blitz","zblitz"],1.4);mul(["c4","c2"],.4);w.prevent=0}
  else if(g.down>=3&&g.togo>=7){mul(["stop"],.25);mul(["c2","c3","c4"],1.6);mul(["prevent"],.5)}
  if(late&&lead>8){mul(["prevent"],8);mul(["c4"],2)}
  mul(["blitz","zblitz"],B);
  mul(["stop"],1-.2*DP.focus);mul(["c2","c3","c4","prevent"],1+.12*DP.focus);
  return wpick(w);
}
function stepAI(g){
  if(g.pending)autoDecide(g);
  else{const c=aiOff(g);if(c==="fg")kickFG(g);else if(c==="punt")punt(g);else runPlay(g,c,aiDef(g))}
  advance(g);
}

// ---------- Finishing a game ----------

function playRound(userRes){

  const exp=games.map(gm=>winProb(gm.h,gm.a,gm.neutral?null:gm.h));

    gm.hs=r.hs;gm.as=r.as;gm.winner=r.hs>r.as?r.h:r.a;
    S.results.push({h:gm.h,a:gm.a,hs:r.hs,as:r.as,type:gm.type,label:gm.label,wk:S.phase==="regular"?S.week:null});
    S.mo=S.mo||{};const w=gm.winner,l=w===gm.h?gm.a:gm.h,up=ovr(T(w))<ovr(T(l))-4;

  for(const t of S.teams)for(const p of t.roster)if(p.inj>0){p.inj--;if(!p.inj)p.susp=false;if(p.inj===0&&t.id===S.user)news(`${p.pos} ${p.n} is back from injury.`)}

  else if(P.round==="qf"){P.sf=[[0,3],[1,2]].map(([a,b],i)=>({h:P.qf[a].winner,a:P.qf[b].winner,neutral:true,type:"cfp",label:`${SF_BOWLS[i]} (CFP semifinal)`}));P.round="sf"}
  else if(P.round==="sf"){P.final={h:P.sf[0].winner,a:P.sf[1].winner,neutral:true,type:"cfp",label:"National Championship"};P.round="final"}

// ---------- Awards ----------
function heisScore(p,tid){
  const s=p.s,w=record(tid).w;let v;
  if(p.pos==="QB")v=s.py/20+s.ptd*5-s.pint*4+s.ry/10+s.rtd*6;
  else if(p.pos==="RB")v=s.ry/9+s.rtd*6+s.rey/10+s.retd*6;
  else if(p.pos==="WR"||p.pos==="TE")v=s.rey/8+s.retd*6;
  else if(["DL","LB","CB","S"].includes(p.pos))v=s.sk*9+s.dint*14+s.tk*.9;
  else return -1;
  // Sammy Eyde is the face of the sport in a dynasty's first season, and voters know it.
  const hype=p.star&&!(S.history||[]).length?1.3:1;
  return (v*.75+w*14)*hype+(hype>1?40:0);
}
function statLine(p){
  const s=p.s;
  if(p.pos==="QB")return `${s.pc}/${s.pa}, ${s.py} yds, ${s.ptd} TD, ${s.pint} INT${s.ry>150?`, ${s.ry} rush`:""}`;
  if(p.pos==="RB")return `${s.ra} car, ${s.ry} yds, ${s.rtd} TD${s.rec?`, ${s.rec} rec`:""}`;
  if(p.pos==="WR"||p.pos==="TE")return `${s.rec} rec, ${s.rey} yds, ${s.retd} TD`;
  if(p.pos==="K")return `${s.fgm}/${s.fga} FG`;
  if(p.pos==="OL")return "Starting lineman";
  return `${s.tk} tkl, ${s.sk} sacks, ${s.dint} INT`;
}
function allPlayers(){const out=[];for(const t of S.teams.filter(act))for(const p of t.roster)out.push([p,t]);return out}
function heismanWatch(n){return allPlayers().map(([p,t])=>({p,t,v:heisScore(p,t.id)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,n)}

// ===================== COACHING CAROUSEL =====================
function expW(id){const O=(S.pre&&S.pre.O&&S.pre.O[id])||ovr(T(id));return Math.round(clamp(3+(O-65)*.28,2,11)*10)/10}
function secDelta(id){const r=record(id),P=S.post;return (r.w-expW(id))*7+(P&&P.seeds.includes(id)?8:0)+(P&&P.champ===id?15:0)+(S.ccg&&S.ccg.some(g=>g.winner===id)?5:0)-2}
function secLabel(v){return v>=70?"Safe":v>=45?"Warm seat":v>=20?"Hot seat":"On the brink"}
function hireNew(id,moves){const t=T(id);t.coach=newCoach(t);t.plan=aiPlan(t);t.plan.def=aiDefPlan(t);moves.push({tid:id,txt:`${t.name} hire ${t.coach.n}.`})}
function runCarousel(){
  const u=S.user,moves=[],openings=[];
  for(const t of S.teams.filter(act)){
    if(t.id===u)continue;
    const c=t.coach||(t.coach=newCoach(t));c.sec=clamp(c.sec+secDelta(t.id),0,100);c.yrs++;
    if((c.sec<18&&c.yrs>=2)||c.sec<6){openings.push(t.id);moves.push({tid:t.id,big:t.pres>=3,txt:`${t.name} fire ${c.n} after a ${recStr(t.id)} season.`})}
    else if(c.yrs>=12&&rnd()<.15){openings.push(t.id);moves.push({tid:t.id,big:t.pres>=3,txt:`${c.n} retires from ${t.name}.`})}
  }
  const J=S.job,before=J.sec,delta=secDelta(u),me=T(u),r=record(u),exp=expW(u);
  J.sec=clamp(J.sec+delta,0,100);J.yrs++;
  const fired=(J.sec<15&&J.yrs>=2)||J.sec<5;
  let offers=[];
  if(fired){
    const pool=openings.filter(id=>T(id).pres<=me.pres+.2);
    shuffle(S.teams.filter(t=>act(t)&&t.id!==u&&!openings.includes(t.id)&&!isFCS(t.id)&&t.pres<=Math.max(1.6,me.pres-.4)).map(t=>t.id)).slice(0,Math.max(0,3-pool.length)).forEach(id=>{
      openings.push(id);pool.push(id);moves.push({tid:id,txt:`${T(id).name} fire ${T(id).coach.n}.`})});
    offers=shuffle(pool).slice(0,3);
  } else if(J.sec>=60){
    const n=r.w>=exp+3?3:r.w>=exp+1?2:J.sec>=85?1:0;
    offers=openings.filter(id=>T(id).pres>=me.pres-.2&&!isFCS(id)).sort((a,b)=>T(b).pres-T(a).pres).slice(0,n);
    // Bigger programs with a shaky coach will make a change to land a hot name.
    if(offers.length<n){const poach=S.teams.filter(t=>act(t)&&t.id!==u&&!openings.includes(t.id)&&!isFCS(t.id)&&t.coach&&t.coach.sec<55&&t.pres>me.pres+.3&&t.pres<=me.pres+(r.w>=exp+3?1.6:1)).sort((a,b)=>b.pres-a.pres).slice(0,n-offers.length);
      for(const t of poach){openings.push(t.id);offers.push(t.id);moves.push({tid:t.id,big:true,txt:`${t.name} part ways with ${t.coach.n} and call your agent.`})}}
  }
  const done=new Set(offers);
  for(let i=0;i<openings.length;i++){
    const id=openings[i];if(done.has(id))continue;done.add(id);const t=T(id);
    const cand=rnd()<.45&&S.teams.filter(x=>act(x)&&x.id!==u&&!openings.includes(x.id)&&x.coach&&x.coach.sec>=78&&x.pres<t.pres-.6).sort((a,b)=>(b.coach.sec+b.coach.sk*10)-(a.coach.sec+a.coach.sk*10))[0];
    if(cand){
      t.coach={...cand.coach,yrs:0,sec:65};t.plan={...cand.plan,def:{...dplan(cand.id)}};
      moves.push({tid:id,big:t.pres>=3,txt:`${t.name} hire ${t.coach.n} away from ${cand.name}.`});
      openings.push(cand.id);cand.coach=null;
    } else hireNew(id,moves);
  }
  return {before,after:J.sec,delta,fired,offers,moves,exp,w:r.w,done:false};
}
function settleOffers(){const C=S.off.car;if(!C||C.done)return;const mv=[];for(const id of C.offers)if(id!==C.taken)hireNew(id,mv);C.moves.push(...mv);C.done=true}
function takeJob(id){
  const C=S.off.car,old=T(S.user),nw=T(id);
  for(const i of old.openSlots||[]){const st=starsFor(old.pres);old.roster[i]=newPlayer(old.roster[i].pos,recruitOvr(st,old),0,st)}
  old.openSlots=[];
  const myPlan=old.plan;old.coach=newCoach(old);old.plan=aiPlan(old);old.plan.def=aiDefPlan(old);
  nw.plan=myPlan;nw.coach={n:"You",sk:3,yrs:0,sec:70};nw.openSlots=[];
  C.moves.push({tid:old.id,big:true,txt:`${old.name} hire ${old.coach.n} to replace you.`});
  S.user=id;S.job={sec:70,yrs:0};C.taken=id;S.off.board=[];

// ===================== CONFERENCE REALIGNMENT =====================
// Winning small-conference programs get invited up. Conferences swap members so every league keeps its size.
const clout=t=>t.pres+ovr(t)/40;
const baseOf=t=>(TEAMS0.find(x=>x[1]===t.abbr)||[])[4]||70;
const movedRecently=id=>(S.realign||[]).some(m=>(m.tid===id||m.swap===id)&&S.season-m.season<3);
function realignTargets(t,toTier){
  // Only a struggling, low-prestige member can be swapped out, and traditional powers never are.
  return shuffle(CONFS.map((_,i)=>i).filter(i=>CONF_TIER[i]===toTier&&i!==t.conf)).map(c=>{
    const weak=S.teams.filter(x=>act(x)&&x.conf===c&&x.id!==S.user&&!movedRecently(x.id)&&record(x.id).w<=5&&baseOf(x)<(toTier===0?82:74)&&x.pres<=2.2)
      .sort((a,b)=>clout(a)-clout(b))[0];
    return weak&&clout(weak)+.5<clout(t)?{c,weak:weak.id}:null}).filter(Boolean);
}
function swapConf(a,b){const ta=T(a),tb=T(b),c=ta.conf;ta.conf=tb.conf;tb.conf=c}
function runRealignment(){
  const moves=[],u=S.user,ap=rankIds();let invite=null;
  const rising=(tier,fn)=>S.teams.filter(t=>act(t)&&CONF_TIER[t.conf]===tier&&fn(t)).sort((a,b)=>ap.indexOf(a.id)-ap.indexOf(b.id));
  const go=(list,toTier,max,prob,why)=>{
    let n=0;
    for(const t of list){
      if(n>=max)break;
      const opts=realignTargets(t,toTier);if(!opts.length)continue;
      if(t.id===u){invite={...opts[0],why};continue}
      if(rnd()>prob)continue;
      const from=t.conf,{c,weak}=opts[0];swapConf(t.id,weak);n++;
      moves.push({tid:t.id,from,to:c,swap:weak,txt:`${t.name} leave the ${CONFS[from]} for the ${CONFS[c]}. ${T(weak).name} move to the ${CONFS[from]} in the swap.`});
    }
  };
  go(rising(1,t=>{const r=record(t.id);return !movedRecently(t.id)&&r.w>=10&&ap.indexOf(t.id)<15&&t.pres>=1.8}),0,1,.6,"after a huge season");
  go(rising(2,t=>!movedRecently(t.id)&&record(t.id).w>=11&&ovr(t)>=66),1,1,.35,"after dominating the FCS");
  S.realign=(S.realign||[]).concat(moves.map(m=>({season:S.season,...m}))).slice(-30);
  return {moves,invite};
}

    for(const p of t.roster){
      if(p.yr===3)leave.push([p,"Graduated"]);
      else if(p.yr===2&&p.ovr>=90&&rnd()<.55*(t.id===u?(1-.25*fac("acad"))*((p.rel||60)>=85?.6:1):1))leave.push([p,"Declared for the NFL draft"]);
    }

      for(const p of t.roster)if(p.yr<3&&!leave.some(x=>x[0]===p)&&p.rel<40&&rnd()<(p.rel<25?.7:.3))leave.push([p,"Entered the transfer portal (unhappy)"]);
      const k=Math.max(0,(rec.l>=6?2:rnd()<.4?1:0)-(rnd()<.33*fac("acad")?1:0));
      shuffle(t.roster.filter(p=>p.yr<2&&(p.rel??60)<75&&!leave.some(x=>x[0]===p))).slice(0,k).forEach(p=>leave.push([p,"Entered the transfer portal"]));
    }
    for(const [p,why] of leave){
      if(!why.startsWith("Entered the transfer portal")&&p.ovr>=84)draft.push({p,t,why});
      if(t.id===u)departed.push({name:p.n,pos:p.pos,ovr:p.ovr,why,slot:t.roster.indexOf(p),pid:p.id});
    }
    const gone=new Set(leave.map(x=>x[0]));
    const slots=[];t.roster.forEach((p,i)=>{if(gone.has(p))slots.push(i)});

      if(gone.has(p))continue;

      p.ovr=clamp(Math.round(p.ovr+gr),45,99);p.inj=0;

    }

    else for(const i of slots){const st=starsFor(t.pres+((t.coach?t.coach.sk:3)-3)*.3+dif().ai*.4);t.roster[i]=newPlayer(t.roster[i].pos,recruitOvr(st,t),0,st)}
  }

  const hs=S.headStart;S.headStart=false;

  seasonAch(myDraft,aa);
  S.off={boost:true,step:"yearbook",aa,draft:myDraft,departed,points:pts,portal:buildPortal(),portalSigned:0,pf:"All",
    board:me.openSlots.map(i=>({i,pos:me.roster[i].pos,signed:null,cands:[5,4,3,2].map(st=>makeProspect(me.roster[i].pos,st))}))};
  if(hs&&S.off.board.length){const c=S.off.board[0].cands[0];c.chance=Math.min(.98,c.chance+.3);c.visited=true}

}
function stadiumCost(t){return 8+t.hfa*4}
function makeProspect(pos,st){

}
const PORTAL_MIX={QB:4,RB:4,WR:6,TE:2,OL:4,DL:4,LB:3,CB:3,S:2,K:2};
const PORTAL_MAX=5;
function portalCost(o){return Math.max(2,Math.round((o-68)/2))}
function portalPres(o){return o>=89?4:o>=85?3:o>=81?2:1}
// Real players leave AI programs and land in the portal with last season's stats.
function buildPortal(){
  const out=[];
  for(const pos in PORTAL_MIX){
    for(let k=0;k<PORTAL_MIX[pos];k++){
      const pool=[];
      for(const t of S.teams)if(t.id!==S.user&&act(t))t.roster.forEach((p,i)=>{if(p.pos===pos&&!p.portal&&p.yr>=1)pool.push([[t,p,i],Math.pow(Math.max(1,p.ovr-62),.9)*(p.ovr>=94?.3:1)])});
      if(!pool.length)break;
      const [t,p,i]=wpickP(pool);
      p.portal=true;
      out.push({p,from:t.id,line:statLine(p),pos,ovr:p.ovr,yr:p.yr,st:p.st,n:p.n,cost:portalCost(p.ovr),minPres:portalPres(p.ovr),status:"open"});
      const st=starsFor(t.pres);t.roster[i]=newPlayer(pos,recruitOvr(st,t),0,st);
    }
  }
  for(const c of out)delete c.p.portal;
  return out.sort((a,b)=>b.ovr-a.ovr);
}
// Transfers nobody signed land at other schools.
function placeLeftovers(){
  for(const c of S.off.portal){
    if(c.status!=="open")continue;
    const spots=[];
    for(const t of S.teams)if(t.id!==S.user&&t.id!==c.from)t.roster.forEach((p,i)=>{if(p.pos===c.pos&&p.ovr<c.ovr)spots.push([t,i])});
    if(!spots.length)continue;
    const [t,i]=spots[Math.floor(rnd()*spots.length)];t.roster[i]=c.p;c.status="elsewhere";c.to=t.id;
  }
}
function portalSign(i){
  const O=S.off,c=O.portal[i],me=T(S.user);
  if(c.status!=="open"||O.points<c.cost||O.portalSigned>=PORTAL_MAX||presStars(me)<c.minPres)return;
  const open=O.board.find(b=>!b.signed&&b.pos===c.pos);
  const np=c.p;
  if(open){me.roster[open.i]=np;open.signed={...c,transfer:true}}
  else{
    const same=me.roster.map((p,i)=>[p,i]).filter(([p])=>p.pos===c.pos&&!me.openSlots.includes(me.roster.indexOf(p))).sort((a,b)=>a[0].ovr-b[0].ovr)[0];
    if(!same||same[0].ovr>=c.ovr)return;
    news(`${same[0].pos} ${same[0].n} lost his starting job and transferred.`);
    me.roster[same[1]]=np;
  }
  O.points-=c.cost;O.portalSigned++;c.status="signed";
}
function offer(si,ci){

  if(slot.signed||c.status!=="open"||O.points<c.cost)return;
  O.points-=c.cost;

}

// Saves are gzip-compressed (several times smaller) when the browser supports it.
const canGz=typeof CompressionStream!=="undefined"&&typeof DecompressionStream!=="undefined";
async function gz(str){
  const b=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(),u=new Uint8Array(b);
  let out="";for(let i=0;i<u.length;i+=32768)out+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(out);
}
async function gunz(b64){
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}

}

// ===================== WEEKLY MAGAZINE =====================
function lineFor(h,a,neutral){
  const d=ovr(T(h))-ovr(T(a))+(neutral?0:T(h).hfa*.8),pts=Math.round(Math.abs(d)*2)/2;
  return pts<.5?"Pick'em":`${T(d>0?h:a).abbr} -${pts}`;
}
function buildWeekly(ctx){
  const {before,games,exp,label,phase,heisBefore}=ctx,L=S.roundLog||{stars:[],ot:[],inj:[],trophy:[]};
  const after=rankIds(),rb=id=>before.indexOf(id)+1,ra=id=>after.indexOf(id)+1;
  // Biggest upset
  let upset=null;
  games.forEach((gm,i)=>{
    if(gm.winner===undefined)return;
    const pw=gm.winner===gm.h?exp[i]:1-exp[i];
    if(pw<.5&&(!upset||pw<upset.pw))upset={w:gm.winner,l:gm.winner===gm.h?gm.a:gm.h,ws:Math.max(gm.hs,gm.as),ls:Math.min(gm.hs,gm.as),pw,wr:rb(gm.winner),lr:rb(gm.winner===gm.h?gm.a:gm.h),label:gm.label,site:gm.neutral?"":T(gm.h).stadium};
  });
  // Headlines
  const H=[];
  L.stars.sort((a,b)=>b.sc-a.sc).slice(0,3).forEach(x=>H.push({tag:"Star",pid:x.pid,text:`${T(x.tid).abbr} ${pPos(x.pid)} ${pName(x.pid)}: ${x.line} in a ${x.won?"win over":"loss to"} ${T(x.opp).name}.`}));
  L.ot.slice(0,2).forEach(o=>{const w=o.hs>o.as?o.h:o.a,l=w===o.h?o.a:o.h;H.push({tag:"Thriller",text:`${T(w).name} outlast ${T(l).name} ${Math.max(o.hs,o.as)}-${Math.min(o.hs,o.as)} in ${o.rounds>1?o.rounds+" overtimes":"overtime"}.`})});

// ===================== LIVE GAMES =====================
const gameKey=gm=>`${gm.h}-${gm.a}-${gm.label}`;
let WATCH=null,wTimer=null;
const SPEED={1:900,3:320,10:110};
function startWatch(gm,kind){
  const g=newGame(gm,false,15);g.auto=true;
  WATCH={g,gm,kind,key:gameKey(gm),speed:3,paused:false,banner:null,exp:winProb(gm.h,gm.a,gm.neutral?null:gm.h)};
  clearTimeout(wTimer);wTimer=setTimeout(wLoop,600);
}
function wStep(n){
  const W=WATCH,g=W.g;
  for(let i=0;i<n&&!g.over;i++){
    stepAI(g);
    const top=g.log[0];
    if(top&&top.hl&&/TOUCHDOWN|INTERCEPTED|FUMBLE|BLOCKED|SAFETY|MISSES|ONSIDE|MUFFED|game on the line|SACKED|Overtime/.test(top.txt))W.banner={txt:top.txt,at:g.log.length+":"+g.qtr+":"+g.clock};
  }
}
function wLoop(){
  if(!WATCH)return;
  if(!WATCH.paused&&!WATCH.g.over){wStep(WATCH.speed>=10?4:1);render()}
  if(WATCH&&!WATCH.g.over)wTimer=setTimeout(wLoop,SPEED[WATCH.speed]);
}
function liveWP(W){
  const g=W.g,left=g.over?0:g.ot?.01:clamp(((4-g.qtr)*15*60+g.clock)/3600,0,1);
  if(g.over)return g.score[g.home]>g.score[g.away]?1:0;
  const pre=Math.log(W.exp/(1-W.exp))*6.5;
  const diff=g.score[g.home]-g.score[g.away]+pre*left+(g.poss===g.home?1.5:-1.5)*(1-left);
  return 1/(1+Math.exp(-1.7*diff/(13*Math.sqrt(Math.max(left,.01))+1.5)));
}
function finishWatch(){
  const W=WATCH;if(!W||!W.g.over)return;
  WATCH=null;clearTimeout(wTimer);
  const res=finalizeGame(W.g);
  if(W.kind==="user"){playRound(res);scrollTo(0,0)}
  else{S.preRes=S.preRes||{};S.preRes[W.key]=res;news(`Game of the Week: ${T(res.hs>res.as?res.h:res.a).name} beat ${T(res.hs>res.as?res.a:res.h).name} ${Math.max(res.hs,res.as)}-${Math.min(res.hs,res.as)}.`)}
}

    ${[10,20,30,40,50,60,70,80,90].map(y=>`<i class="dl" style="left:${8+y*.84}%"></i>`).join("")}
    ${g.over?"":`<i class="dfd" style="left:${8+fd*.84}%"></i><b class="dball" style="left:${8+x*.84}%"></b>`}

}

function rollEvents(){
  if(!userGame())return;
  if(rnd()<.3){const list=EVENTS.slice();for(let i=0;i<4;i++){const e=wpickP(list.map(e=>[e,e.w]));const r=e.run();if(r){r.choices=r.choices||null;S.event={...r,choice:!!e.choice,season:S.season,week:S.week};if(!e.choice){news(`${r.t}: ${r.x}`)}break}}}
  if(rnd()<.35){
    const top=rankIds().slice(0,10).filter(id=>id!==S.user),id=top[Math.floor(rnd()*top.length)],t=T(id),k=Math.floor(rnd()*3);let txt;
    if(k===0){const q=starter(t,"QB");if(q&&!q.inj){q.inj=2;q.susp=true;txt=`${t.name} QB ${q.n} is suspended for this week's game.`}}
    else if(k===1&&t.coach){t.coach.sec=clamp(t.coach.sec-30,0,100);txt=`Scandal at ${t.name}: an NCAA investigation puts coach ${t.coach.n} on the hot seat.`}
    else{const h=heismanWatch(3).map(x=>x.p).find(p=>p.inj===0&&!p.star&&!T(S.user).roster.includes(p));if(h){h.inj=3;txt=`Heisman contender ${h.n} is out two weeks with an injury.`}}
    if(txt){news(`Breaking: ${txt}`);if(S.weekly)S.weekly.headlines.unshift({tag:"Breaking",text:txt})}
  }
}
function resolveEvent(k){
  const E=S.event;if(!E)return;
  if(E.choice&&k){
    let res="";
    if(k==="walkon"){const me=T(S.user),old=me.roster[E.data.slot];const np=newPlayer(E.data.pos,E.data.ovr,1,2);me.roster[E.data.slot]=np;buildPL();S.bank=(S.bank||0)-4;res=`Walk-on ${np.n} is your new starting ${np.pos} (${np.ovr}). ${old.n} moves to the bench.`}
    else if(k==="raise"){S.bank=(S.bank||0)-5;S.mo[S.user]=clamp((S.mo[S.user]||0)+.5,-3,3);res="Your coordinator stays. The staff is fired up."}
    else if(k==="go"){S.mo[S.user]=clamp((S.mo[S.user]||0)-1,-3,3);S.nextEdge={y:-.15,txt:"new OC"};res="Your coordinator leaves. The offense will need a week to adjust."}
    else if(k[0]==="r"&&k!=="raise"){const P=id=>PL[id],D=E.data||{},p=P(D.pid);
      if(k==="rTouch"&&p){relAdj(p,10);p.promise=S.season;res=`${p.n} is happy, for now. He'll expect to keep starting.`}
      else if(k==="rEarn"&&p){relInit(p);const ok=p.per==="grinder"||p.per==="leader";relAdj(p,ok?6:-8);if(ok)p.fire=true;res=ok?`${p.n} respected that. He's going to go earn it.`:`${p.n} didn't like hearing that.`}
      else if(k==="rSusp"){[P(D.a),P(D.b)].forEach(x=>x&&relAdj(x,-6));myStarters().forEach(x=>relAdj(x,2));res="The team respects the line you drew. The two of them are sore about it."}
      else if(k==="rHouse"){[P(D.a),P(D.b)].forEach(x=>x&&relAdj(x,4));if(rnd()<.3){S.nextEdge={y:-.1,txt:"distraction"};res="They hugged it out, but the drama is still a distraction."}else res="They hugged it out. Locker room's fine."}
      else if(k==="rDinner"&&p){relAdj(p,15);res=`${p.n} felt at home for the first time. He's staying.`}
      else if(k==="rTough"&&p){relAdj(p,-12);res=`${p.n} is quieter than ever. Keep an eye on him.`}
      else if(k==="rFloor"&&p){relAdj(p,6);myStarters().forEach(x=>{relAdj(x,2);x.fire=x.fire||rnd()<.25});S.mo[S.user]=clamp((S.mo[S.user]||0)+.5,-3,3);res=`${p.n} gave a speech nobody will forget. The team is fired up.`}
      else if(k==="rNo"&&p){relAdj(p,-6);res=`${p.n} understood, but he's a little hurt.`}
      for(const l of [res])relLog(l)}
    else if(k==="visit"){S.bank=(S.bank||0)-3;S.headStart=true;res="The visit went great. That 5★ recruit will be much more interested on signing day."}
    else res="You passed.";
    news(`${E.t}: ${res}`);
  }
  S.event=null;
}
