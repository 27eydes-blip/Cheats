// ===================== PLAYOFF BRACKET =====================
function bracketGames(live){
  const P=S.post;if(!P)return null;
  const sd=id=>P.seeds.indexOf(id)+1;
  const box=(gm,ph)=>{
    if(!gm)return {ph};
    const L=live&&live[gameKey(gm)],done=gm.winner!==undefined;
    const sc=id=>done?(id===gm.h?gm.hs:gm.as):L?L.score[id]:null;
    return {gm,label:gm.label,t:[gm.a,gm.h].map(id=>({id,seed:sd(id),sc:sc(id),win:done&&gm.winner===id})),live:!!L&&!L.over,done};
  };
  const r1=P.r1.map(g=>box(g));
  const qf=[0,1,2,3].map(i=>P.qf?box(P.qf[i]):{ph:[`#${i+1} ${T(P.seeds[i]).abbr}`,`Winner ${T(P.r1[3-i].a).abbr}/${T(P.r1[3-i].h).abbr}`]});
  const sf=[0,1].map(i=>P.sf?box(P.sf[i]):{ph:["Quarterfinal winner","Quarterfinal winner"]});
  const fin=[P.final?box(P.final):{ph:["Semifinal winner","Semifinal winner"]}];
  return [["First round",r1],["Quarterfinals",qf],["Semifinals",sf],["Championship",fin]];
}
function bracketHTML(live){
  const B=bracketGames(live);if(!B)return "";
  const line=x=>`<div class="bt ${x.win?"win":""} ${x.id===S.user?"me-t":""}"><span class="sub num">${x.seed||""}</span>${badge(T(x.id))}<span class="bn">${esc(T(x.id).abbr)}</span><b class="num">${x.sc??""}</b></div>`;
  return `<div class="tw"><div class="bracket">${B.map(([name,games])=>`<div class="bcol"><h3>${name}</h3><div class="bgs">${games.map(b=>`<div class="bg ${b.live?"live":""}">
    ${b.ph?b.ph.map(t=>`<div class="bt ph"><span class="sub">${esc(t)}</span></div>`).join(""):`<div class="sub bl">${esc(b.label.replace(/ \(CFP.*\)/,""))}${b.live?' · <span class="livedot">LIVE</span>':""}</div>${b.t.map(line).join("")}`}</div>`).join("")}</div></div>`).join("")}
    <div class="bcol champ"><h3>Champion</h3><div class="bgs"><div class="bg">${S.post.champ!==undefined&&S.post.champ!==null?`<div class="bt win">${badge(T(S.post.champ))}<span class="bn">${esc(T(S.post.champ).name)}</span></div>`:'<div class="bt ph"><span class="sub">TBD</span></div>'}</div></div></div>
  </div></div>`;
}

// ===================== PLAYOFF WATCH PARTY =====================
let PARTY=null,pTimer=null;
const ROUND_NAME={r1:"First Round",qf:"Quarterfinals",sf:"Semifinals",final:"National Championship"};
function partyGames(){return S.phase==="post"?currentGames().filter(g=>g.type==="cfp"&&!(S.preRes&&S.preRes[gameKey(g)])):[]}
function startParty(){
  const gs=partyGames();if(!gs.length)return;
  PARTY={stage:"picks",round:S.post.round,games:gs.map(gm=>({gm,key:gameKey(gm),exp:winProb(gm.h,gm.a,gm.neutral?null:gm.h),g:null,done:false})),picks:{},feed:[],speed:3,paused:false};
}
function kickoffParty(){
  for(const x of PARTY.games){x.g=newGame(x.gm,false,15);x.g.auto=true}
  PARTY.stage="live";clearTimeout(pTimer);pTimer=setTimeout(pLoop,600);
}
function pStep(n){
  for(const x of PARTY.games){
    if(x.done)continue;
    for(let i=0;i<n&&!x.g.over;i++){
      stepAI(x.g);const top=x.g.log[0];
      if(top&&top.hl&&/TOUCHDOWN|INTERCEPTED|FUMBLE|BLOCKED|SAFETY|MISSES|ONSIDE|MUFFED|game on the line|Overtime/.test(top.txt))
        PARTY.feed.unshift({k:x.key,a:x.gm.a,h:x.gm.h,txt:top.txt});
    }
    if(x.g.over){
      x.done=true;const res=finalizeGame(x.g);S.preRes=S.preRes||{};S.preRes[x.key]=res;
      const w=res.hs>res.as?res.h:res.a,l=w===res.h?res.a:res.h,ws=Math.max(res.hs,res.as),ls=Math.min(res.hs,res.as);
      const upset=S.post.seeds.indexOf(w)>S.post.seeds.indexOf(l);
      PARTY.feed.unshift({k:x.key,a:x.gm.a,h:x.gm.h,final:true,txt:`FINAL: ${T(w).name} ${upset?"upset":"beat"} ${T(l).name} ${ws}-${ls}${x.g.ot?" in overtime":""}.`});
      x.gm.liveRes=res;
    }
  }
  PARTY.feed=PARTY.feed.slice(0,40);
  if(PARTY.games.every(x=>x.done))PARTY.stage="done";
}
function pLoop(){
  if(!PARTY||PARTY.stage!=="live")return;
  if(!PARTY.paused){pStep(PARTY.speed>=10?4:1);render()}
  if(PARTY&&PARTY.stage==="live")pTimer=setTimeout(pLoop,SPEED[PARTY.speed]);
}
function endParty(){
  if(!PARTY||PARTY.stage!=="done")return;
  PARTY=null;clearTimeout(pTimer);DCC=null;
  playRound(null);S.tab="post";scrollTo(0,0);
}
function partyTile(x){
  const g=x.g,gm=x.gm,u=S.user,sd=id=>S.post.seeds.indexOf(id)+1,mine=gm.h===u||gm.a===u;
  let clk="Pregame",wp=x.exp;
  if(g){
    const mm=Math.floor(g.clock/60),ss=String(g.clock%60).padStart(2,"0");
    clk=g.over?"FINAL"+(g.ot?" (OT)":""):g.ot?`OT${g.ot.round>1?g.ot.round:""}`:g.qEnd&&g.qtr===2?"Halftime":`${ordinal(g.qtr)} · ${mm}:${ss}`;
    wp=liveWP({g,exp:x.exp});
  }
  const fav=x.exp>=.5?gm.h:gm.a,dog=fav===gm.h?gm.a:gm.h,dogWp=dog===gm.h?wp:1-wp;
  const alert=g&&!g.over&&g.qtr>=3&&dogWp>.6;
  const row=id=>{const sc=g?g.score[id]:"",lead=g&&g.score[id]>g.score[opp(g,id)];
    return `<div class="pt ${g&&g.over&&lead?"win":""}"><span class="sub num">${sd(id)}</span>${badge(T(id))}<span class="pn">${esc(T(id).name)}${g&&!g.over&&g.poss===id?' <i class="wpos"></i>':""}</span><b class="psc">${sc}</b></div>`};
  const pick=PARTY.picks[x.key];
  return `<div class="ptile ${mine?"mine":""} ${g&&g.over?"over":""}">
    <div class="row" style="justify-content:space-between"><span class="sub">${esc(gm.label.replace(/ \(CFP.*\)/,""))}</span><span class="num ${g&&!g.over?"livedot":""}">${clk}</span></div>
    ${row(gm.a)}${row(gm.h)}
    <div class="wpt sm"><i style="width:${(1-wp)*100}%;background:${T(gm.a).c1}"></i><i style="width:${wp*100}%;background:${T(gm.h).c1}"></i></div>
    <div class="sub plast">${alert?'<span class="tag bad">Upset alert</span> ':""}${g?esc((g.log[0]||{}).txt||""):esc(lineFor(gm.h,gm.a,gm.neutral))+" · "+esc(condText(condFor(gm)))}</div>
    ${PARTY.stage==="picks"?`<div class="row">${[gm.a,gm.h].map(id=>`<button class="small-btn ${pick===id?"picked":""}" data-act="pPick" data-k="${x.key}" data-id="${id}">Pick ${esc(T(id).abbr)}</button>`).join("")}</div>`:
      pick!==undefined?`<div class="sub">Your pick: <b>${esc(T(pick).abbr)}</b>${g&&g.over?(g.score[pick]>g.score[opp(g,pick)]?' <span class="tag good">Correct</span>':' <span class="tag bad">Wrong</span>'):""}</div>`:""}
  </div>`;
}
function renderParty(){

function partyCard(){
  const gs=partyGames();if(!gs.length)return "";

// ---------- Game view ----------
function boxScore(g,tid){
  const t=T(tid),rows=[];
  const B=pid=>g.box[pid]||{};
  const ps=t.roster.filter(p=>g.box[p.id]);
  const qb=ps.filter(p=>B(p.id).pa).sort((a,b)=>B(b.id).py-B(a.id).py)[0];
  if(qb){const b=B(qb.id);rows.push([qb,`${b.pc||0}/${b.pa} · ${b.py||0} yds · ${b.ptd||0} TD${b.pint?` · ${b.pint} INT`:""}`])}
  ps.filter(p=>B(p.id).ra).sort((a,b)=>(B(b.id).ry||0)-(B(a.id).ry||0)).slice(0,1).forEach(p=>{const b=B(p.id);rows.push([p,`${b.ra} car · ${b.ry||0} yds${b.rtd?` · ${b.rtd} TD`:""}`])});
  ps.filter(p=>B(p.id).rec).sort((a,b)=>(B(b.id).rey||0)-(B(a.id).rey||0)).slice(0,2).forEach(p=>{const b=B(p.id);rows.push([p,`${b.rec} rec · ${b.rey||0} yds${b.retd?` · ${b.retd} TD`:""}`])});
  ps.filter(p=>B(p.id).tk||B(p.id).dint).sort((a,b)=>((B(b.id).sk||0)*3+(B(b.id).dint||0)*4+(B(b.id).tk||0))-((B(a.id).sk||0)*3+(B(a.id).dint||0)*4+(B(a.id).tk||0))).slice(0,2).forEach(p=>{const b=B(p.id);rows.push([p,`${b.tk||0} tkl${b.sk?` · ${b.sk} sack${b.sk>1?"s":""}`:""}${b.dint?` · ${b.dint} INT`:""}`])});
  return `<div class="panel"><h3>${esc(t.name)}</h3><div class="tw"><table class="tbl"><tbody>
    <tr><td class="sub">Team</td><td class="sub">${g.stats[tid].yds} yds · ${g.stats[tid].plays} plays · ${g.stats[tid].to} TO${g.pen?` · ${g.pen[tid].n}-${g.pen[tid].y} pen`:""}</td></tr>
    ${rows.map(([p,l])=>`<tr><td>${plink(p.id,p.n)} <span class="sub">${p.pos}</span></td><td class="num">${l}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function relLog(txt){S.lrlog=[{s:S.season,w:S.week,txt},...(S.lrlog||[])].slice(0,14)}

function relEdgeNow(){const st=myStarters(),fire=st.filter(p=>p.fire).length;return (chemistry()-60)*.012+Math.min(4,fire)*.06}
function talkKey(){return `${S.season}-${S.phase}-${S.week}-${S.post?S.post.round:""}`}
function talksLeft(){if(!S.talk||S.talk.key!==talkKey())S.talk={key:talkKey(),left:3};return S.talk.left}
const TALK={praise:"Praise",challenge:"Challenge",film:"1-on-1 film",promise:"Promise snaps"};
function doTalk(p,k){
  relInit(p);const per=p.per,nm=`${p.pos} ${p.n}`,coin=rnd()<.5;let d=0,txt="";
  if(k==="praise"){d={diva:12,quiet:8,team:6,leader:6,hothead:6,grinder:3}[per];txt=per==="diva"?`${nm} lit up. He's telling everyone what you said.`:per==="grinder"?`${nm} nodded and went back to work. Praise isn't really his thing.`:`${nm} appreciated it. You can see him standing a little taller.`}
  else if(k==="challenge"){
    if(per==="leader"||per==="grinder"){d=per==="grinder"?12:10;p.fire=true;txt=`${nm} took it personally, in the best way. He's fired up for Saturday.`}
    else if(per==="hothead"){if(coin){d=12;p.fire=true;txt=`${nm} heard you loud and clear. He's on a mission this week.`}else{d=-12;txt=`${nm} blew up at practice. That one backfired.`}}
    else if(per==="diva"){if(coin){d=6;p.fire=true;txt=`${nm} wants to prove you wrong. Good.`}else{d=-8;txt=`${nm} is sulking. He thinks you're picking on him.`}}
    else if(per==="quiet"){d=-6;txt=`${nm} went quiet. He took the criticism harder than you meant it.`}

  else if(k==="promise"){d=15;p.promise=S.season;txt=`You promised ${nm} more snaps. He's thrilled, but he'll remember if you don't follow through.`}

// After each of your games: winning heals, losing stings, and players stuck on the bench get restless.
function relAfterGame(gm){
  const u=S.user;if(gm.h!==u&&gm.a!==u)return;
  const t=T(u),won=gm.winner===u,riv=rivalryOf(gm.h,gm.a),st=new Set(myStarters());
  for(const p of t.roster){relInit(p);
    let d=won?(p.per==="team"?3:2):-2;if(riv&&won)d+=2;
    if(st.has(p))d+=1;
    else if(p.yr>=2&&!p.inj){const best=startersOf(t,p.pos).slice(-1)[0];if(best&&p.ovr>=best.ovr-3)d-=p.per==="diva"?4:2}
    if(p.rs&&p.per==="diva")d-=1;
    relAdj(p,d);p.fire=false;
  }

// Depth chart moves are felt: losing a starting job hurts, earning one helps.
function relDepthChange(before,after){
  for(const p of before)if(!after.includes(p)){const d=p.per==="diva"?-16:p.per==="team"?-5:-10;relAdj(p,d);relLog(`${p.pos} ${p.n} lost his starting job. He's not happy. (${d})`)}
  for(const p of after)if(!before.includes(p)){relAdj(p,8);relLog(`${p.pos} ${p.n} earned a starting job. (+8)`)}

// Offseason: broken promises and unhappy players walk; loyal stars stick around.
function relOffseason(){
  const t=T(S.user),st=new Set(myStarters()),out=[];

    if(p.promise===S.season&&!st.has(p)){relAdj(p,-25);out.push(`You promised ${p.n} more snaps and didn't deliver. (-25)`)}

function buildYearbook(myDraft){
  const u=S.user,me=T(u),h=S.history[S.history.length-1],P=S.pre&&S.pre.season===S.season?S.pre:null,R=me.roster;
  const games=S.results.filter(g=>g.h===u||g.a===u).map(g=>{const home=g.h===u,o=home?g.a:g.h,us=home?g.hs:g.as,th=home?g.as:g.hs;
    return {o,home,neutral:g.type!=="reg",us,th,w:us>th,label:g.label,rk:rankOf(o)||99,type:g.type}});
  const wins=games.filter(g=>g.w),losses=games.filter(g=>!g.w),mg=g=>g.us-g.th;
  const best=wins.slice().sort((a,b)=>a.rk-b.rk)[0]||null,worst=losses.slice().sort((a,b)=>b.rk-a.rk)[0]||null;

function offerInfo(id){
  const t=T(id),me=T(S.user);let h=(id*9301+S.season*49297)%233280;const r=()=>(h=(h*9301+49297)%233280)/233280;
  const yrs=4+Math.floor(r()*3),sal=(1.2+t.pres*1.25+r()*.8).toFixed(1);
  const pitch=[`"We want a winner, and we'll give you everything you need to build one."`,`"Name your staff. Our boosters are ready."`,`"This place is a sleeping giant. You're the one to wake it up."`,`"We've watched what you built. Come do it here, on a bigger stage."`,`"Facilities, budget, fan base. The only thing missing is you."`][Math.floor(r()*5)];
  const go=[],stay=[];
  if(t.pres>me.pres+.2)go.push("Bigger brand: recruiting gets easier");
  if(CONF_TIER[t.conf]<CONF_TIER[me.conf])go.push(`Power conference: a real path to the playoff`);
  if(ovr(t)>ovr(me))go.push(`More talent: ${ovr(t)} OVR roster vs your ${ovr(me)}`);

  if(S.job.sec>=70)stay.push("Your job is safe where you are");

}
function jobsStep(O){
  const me=T(S.user),C=O.car;if(!C)return `<p class="muted">No coaching news this year.</p>`;
  const big=C.moves.filter(m=>m.big||m.tid===S.user).slice(0,10);
  const sec=`<div class="panel ${C.fired&&!C.taken?"warn":""}" data-c="blue"><h3>Your job at ${esc(T(C.taken??S.user).name)}</h3>
    <p>Expected about ${C.exp} wins, you won ${C.w}. Job security ${Math.round(C.before)} → <b>${Math.round(C.after)}</b> (${secLabel(C.after)}).</p>
    ${C.fired&&!C.taken?"<p><b>You've been fired.</b> Pick your next job to keep coaching.</p>":""}${C.stay?`<p><span class="tag good">Raise</span> You turned down the offers. The AD gave you an extension, +10 job security and +3 recruiting points.</p>`:""}</div>`;
  let main;
  if(C.taken!==undefined){const t=T(C.taken);main=`<div class="newjob" style="--c1:${t.c1};--c2:${t.c2}"><span class="pk" style="color:#ffd34d">It's official</span><span class="gd-logo" style="background:linear-gradient(145deg,${t.c1},${t.c2});color:#fff">${esc(t.abbr)}</span><h2>Welcome to ${esc(t.name)}</h2><p>Their roster and recruiting class are already set. Your game plan comes with you.</p></div>`}
  else if(C.stay)main="";
  else if(C.offers.length){
    main=`<div class="phone"><div class="ring" aria-hidden="true">📞</div><div><div class="eyebrow">${C.fired?"Your agent has news":"The phone is ringing"}</div><h2>${C.fired?"Schools willing to give you another shot":`${C.offers.length} school${C.offers.length>1?"s want":" wants"} you`}</h2></div></div>
    <div class="offers2">${C.offers.map(id=>{const t=T(id),f=offerInfo(id),conf=O.jobConfirm===id;return `<div class="offer2" style="--c1:${t.c1};--c2:${t.c2}">
      <div class="of-top"><span class="gd-logo" style="background:linear-gradient(145deg,${t.c1},${t.c2});color:#fff">${esc(t.abbr)}</span><div><b>${esc(t.name)}</b><span>${esc(CONFS[t.conf])} · <span class="stars">${starStr(presStars(t))}</span></span></div></div>
      <div class="of-facts"><div><b>${ovr(t)}</b><span>Roster OVR</span></div><div><b>${recStr(id)}</b><span>Last season</span></div><div><b>${f.yrs} yrs</b><span>Contract</span></div><div><b>$${f.sal}M</b><span>Per year</span></div></div>
      <p class="of-pitch">${esc(f.pitch)} <small>— Athletic director</small></p>
      <div class="of-pc"><div><span class="pk" style="color:var(--good)">Why go</span>${f.go.map(x=>`<p>+ ${esc(x)}</p>`).join("")||"<p>+ A fresh start</p>"}</div><div><span class="pk" style="color:var(--bad)">Why stay</span>${f.stay.map(x=>`<p>− ${esc(x)}</p>`).join("")}</div></div>
      <button class="btn ${conf?"":"ghost"}" data-act="takeJob" data-id="${id}">${conf?`Tap again to sign with ${esc(t.abbr)}`:"Take the job"}</button></div>`}).join("")}
      ${C.fired?"":`<div class="offer2 stay" style="--c1:${me.c1};--c2:${me.c2}"><div class="of-top"><span class="gd-logo" style="background:linear-gradient(145deg,${me.c1},${me.c2});color:#fff">${esc(me.abbr)}</span><div><b>Stay at ${esc(me.name)}</b><span>Use the offers as leverage</span></div></div>
        <p class="of-pitch">Your AD matches the interest with an extension: +10 job security and +3 recruiting points.</p>${C.stay?'<span class="tag good">Done</span>':`<button class="btn" data-act="stayPut">Stay and get a raise</button>`}</div>`}</div>`;
  } else main=`<div class="phone quiet"><div class="ring" aria-hidden="true">📵</div><div><div class="eyebrow">Quiet phone</div><h2>No schools came calling this year</h2><p class="muted" style="margin:0">Win more than people expect and the bigger programs will notice.</p></div></div>`;
  return `${main}${sec}
    ${O.invite?`<div class="panel event"><div class="row" style="justify-content:space-between"><h3>Conference invitation</h3><span class="tag amber">Decision</span></div>
      <p>The <b>${esc(CONFS[O.invite.c])}</b> wants ${esc(me.name)} to join ${esc(O.invite.why)}. You'd leave the ${esc(CONFS[me.conf])}, and ${esc(T(O.invite.weak).name)} would take your spot. Bigger conference: tougher schedule, more prestige, better recruiting and a clearer path to the playoff.</p>
      <div class="row"><button class="btn" data-act="joinConf">Join the ${esc(CONFS[O.invite.c])}</button><button class="btn ghost" data-act="stayConf">Stay put</button></div></div>`:""}
    ${(O.realign||[]).length?`<div class="panel"><h3>Conference realignment</h3><div class="news">${O.realign.map(m=>`<div>${esc(m.txt)}</div>`).join("")}</div></div>`:""}
    ${big.length?`<div class="panel"><h3>Coaching carousel</h3><div class="news">${big.map(m=>`<div>${esc(m.txt)}</div>`).join("")}</div></div>`:""}`;
}
