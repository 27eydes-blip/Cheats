<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Glydrunner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Same three faces Glydrift ships (@fontsource orbitron 700/900, rajdhani 600/700, silkscreen 700) -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Silkscreen:wght@700&display=swap" rel="stylesheet">
<style>
  /* ===== Glydrift UI tokens (from glydrift/index.html + src/config.js) ===== */
  :root {
    --bg: #05010f;
    --ink: #e8fdff;
    --cyan: #3ef4ff;
    --mint: #7dffc8;
    --green: #39ff88;
    --pink: #ff4fd8;
    --purple: #c04bff;
    --lav: #b9a8ff;
    --gold: #ffc83d;
    --red: #ff2a3d;
    --panel: rgba(8, 4, 24, 0.9);
    --title: 'Orbitron', system-ui, sans-serif;
    --body: 'Rajdhani', system-ui, sans-serif;
    --pixel: 'Silkscreen', 'Orbitron', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: var(--body); color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #game { position: fixed; inset: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ----- HUD (Glydrift layout: pause left, glowing score centre, coins right) ----- */
  #hud {
    position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) 0 calc(env(safe-area-inset-left) + 14px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    opacity: 0; transition: opacity .2s;
  }
  #hud.show { opacity: 1; }
  .ring-btn {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
    background: rgba(5, 1, 15, .82); border: 2.5px solid var(--cyan); color: #fff;
    box-shadow: 0 0 10px rgba(62, 244, 255, .55), inset 0 0 8px rgba(62, 244, 255, .25);
    display: grid; place-items: center; touch-action: manipulation;
  }
  .ring-btn:active { transform: scale(.92); }
  .ring-btn svg { width: 18px; height: 18px; }
  .score { text-align: center; }
  #hudDist {
    font: 700 46px/1 var(--body); color: #effeff; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan), 0 0 34px rgba(62, 244, 255, .5);
  }
  #hudDist small { font-size: 20px; margin-left: 2px; opacity: .8; }
  #hudBest { font: 700 14px/1 var(--body); letter-spacing: 1px; color: var(--lav); margin-top: 3px; }
  .coins { justify-self: end; display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .gem {
    width: 18px; height: 22px; background: linear-gradient(135deg, #fff1a0 0 30%, var(--gold) 30% 65%, #d08a10 65%);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); filter: drop-shadow(0 0 6px rgba(255, 200, 61, .7));
  }
  #hudCoins {
    font: 700 28px/1 var(--body); color: #fff4c8; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(255, 200, 61, .9), 0 0 16px rgba(255, 160, 30, .6);
    display: inline-block; transition: transform .08s;
  }
  #hudCoins.bump { transform: scale(1.35); }

  /* ----- Biome banner ----- */
  #banner {
    position: absolute; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none;
    opacity: 0; transform: scale(.8);
  }
  #banner.show { animation: banner 2.4s cubic-bezier(.2, 1.3, .4, 1) both; }
  #banner .k { font: 700 14px var(--body); letter-spacing: 4px; color: var(--lav); }
  #banner .n { font: 900 clamp(28px, 8vw, 54px)/1.05 var(--title); letter-spacing: 3px; color: #fff; }
  @keyframes banner {
    0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.05); }
    20% { transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: scale(1.02) translateY(-10px); }
  }

  /* ----- Screens ----- */
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);
    opacity: 0; pointer-events: none; transition: opacity .18s; text-align: center;
  }
  .screen.show { opacity: 1; pointer-events: auto; }
  #startScreen { background: radial-gradient(ellipse at 50% 42%, rgba(26, 11, 58, .55) 0%, rgba(7, 3, 26, .7) 60%, rgba(2, 1, 7, .85) 100%); }
  #pauseScreen, #overScreen { background: rgba(2, 1, 7, .72); }
  .logo {
    margin: 0; font: 900 clamp(34px, 10.5vw, 76px)/1 var(--title); letter-spacing: .06em; color: #eafff6;
    text-shadow: 0 0 6px var(--mint), 0 0 22px var(--mint), 0 0 44px rgba(125, 255, 200, .45);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { text-shadow: 0 0 4px var(--mint), 0 0 14px var(--mint), 0 0 30px rgba(125, 255, 200, .3); } }
  .tagline { font: 700 clamp(14px, 3.6vw, 19px) var(--body); letter-spacing: 3px; color: var(--lav); margin: 8px 0 22px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; max-width: 520px; }
  .chip {
    font: 600 15px var(--body); color: #dcd6ff; background: rgba(8, 4, 24, .8);
    border: 2px solid rgba(192, 75, 255, .7); border-radius: 12px; padding: 6px 12px;
    box-shadow: 0 0 10px rgba(192, 75, 255, .3);
  }
  .chip b { font: 700 12px var(--pixel); color: #fff; margin-right: 6px; letter-spacing: .5px; }
  .neon-btn {
    font: 700 clamp(26px, 7vw, 40px)/1 var(--pixel); letter-spacing: 2px; cursor: pointer; touch-action: manipulation;
    color: #eafff0; background: linear-gradient(#0f3a22, #071a10); padding: 18px 64px; border-radius: 22px;
    border: 3px solid var(--green);
    box-shadow: 0 0 14px rgba(57, 255, 136, .7), 0 0 36px rgba(57, 255, 136, .3), inset 0 0 16px rgba(57, 255, 136, .25);
    text-shadow: 0 0 8px var(--green), 0 0 18px var(--green);
  }
  .neon-btn:active { transform: scale(.96); }
  .neon-btn.small { font-size: 16px; padding: 12px 22px; border-radius: 14px; }
  .neon-btn.cyan { border-color: var(--cyan); background: linear-gradient(#0a2c3a, #04121a); box-shadow: 0 0 12px rgba(62, 244, 255, .6), inset 0 0 12px rgba(62, 244, 255, .2); text-shadow: 0 0 8px var(--cyan); }
  .neon-btn.purple { border-color: var(--purple); background: linear-gradient(#2a0c3e, #12041e); box-shadow: 0 0 12px rgba(192, 75, 255, .6), inset 0 0 12px rgba(192, 75, 255, .2); text-shadow: 0 0 8px var(--purple); }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .best { font: 700 16px var(--body); color: var(--lav); letter-spacing: 1.5px; margin-top: 18px; min-height: 20px; }
  .hint { font: 600 13px var(--body); color: rgba(220, 214, 255, .55); margin-top: 8px; letter-spacing: .5px; }
  .portrait-tip { display: none; }
  @media (orientation: portrait) and (max-width: 600px) { .portrait-tip { display: block; } }
  .panel {
    background: var(--panel); border: 3px solid var(--cyan); border-radius: 26px; padding: 22px 22px 24px;
    width: min(420px, 100%);
    box-shadow: 0 0 16px rgba(62, 244, 255, .55), 0 0 40px rgba(62, 244, 255, .2), inset 0 0 18px rgba(62, 244, 255, .12);
  }
  .panel.red { border-color: var(--red); box-shadow: 0 0 16px rgba(255, 42, 61, .6), 0 0 40px rgba(255, 42, 61, .22), inset 0 0 18px rgba(255, 42, 61, .12); }
  .panel h2 { margin: 0 0 14px; font: 900 34px/1 var(--title); letter-spacing: 3px; color: #fff; text-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan); }
  .panel.red h2 { text-shadow: 0 0 8px var(--red), 0 0 22px var(--red); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .stat { background: rgba(255, 255, 255, .04); border: 2px solid rgba(185, 168, 255, .35); border-radius: 14px; padding: 8px 4px 6px; }
  .stat .v { font: 700 30px/1 var(--body); font-variant-numeric: tabular-nums; color: #fff; }
  .stat .l { font: 700 11px var(--pixel); color: var(--lav); letter-spacing: 1px; margin-top: 4px; }
  .stat.gold .v { color: #fff4c8; text-shadow: 0 0 8px rgba(255, 200, 61, .8); }
  .stat.cyan .v { text-shadow: 0 0 8px var(--cyan); }
  .newbest {
    display: inline-block; font: 700 17px var(--pixel); letter-spacing: 1px; color: #1a1000; background: var(--gold);
    border-radius: 999px; padding: 4px 12px; margin: -4px 0 12px; box-shadow: 0 0 14px rgba(255, 200, 61, .8);
    animation: pop .45s cubic-bezier(.2, 1.7, .4, 1) both .1s;
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .retry { font: 700 22px var(--pixel); color: #eafff0; letter-spacing: 2px; margin-top: 14px; text-shadow: 0 0 8px var(--green), 0 0 18px var(--green); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .biome-reached { font: 700 14px var(--body); color: var(--lav); letter-spacing: 1.5px; margin: 10px 0 0; }
  @media (max-height: 430px) {
    .tagline { margin: 4px 0 10px; } .chips { margin-bottom: 12px; }
    .neon-btn { padding: 12px 48px; } .panel { padding: 14px 18px 16px; } .panel h2 { font-size: 26px; margin-bottom: 8px; }
    .best { margin-top: 10px; } .retry { margin-top: 8px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Glydrunner game"></canvas>

  <div id="hud">
    <div><button class="ring-btn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
    </button></div>
    <div class="score"><div id="hudDist">0<small>m</small></div><div id="hudBest"></div></div>
    <div class="coins"><span class="gem"></span><span id="hudCoins">0</span></div>
  </div>

  <div id="banner"><div class="k">ENTERING</div><div class="n" id="bannerName"></div></div>

  <div class="screen show" id="startScreen">
    <h1 class="logo">GLYDRUNNER</h1>
    <div class="tagline">RUN THE NEON COSMOS</div>
    <div class="chips">
      <span class="chip"><b>TAP</b>jump</span>
      <span class="chip"><b>HOLD</b>glide</span>
      <span class="chip"><b>STAY LOW</b>under rocks</span>
    </div>
    <button class="neon-btn" id="playBtn">PLAY</button>
    <div class="best" id="startBest"></div>
    <div class="row"><button class="neon-btn small purple" id="muteBtn1">SOUND ON</button></div>
    <div class="hint">Space / ↑ jump · hold to glide · P pause</div>
    <div class="hint portrait-tip">Turn your phone sideways to see further ahead</div>
  </div>

  <div class="screen" id="pauseScreen">
    <div class="panel">
      <h2>PAUSED</h2>
      <div class="row" style="margin-top:4px">
        <button class="neon-btn small" id="resumeBtn">RESUME</button>
        <button class="neon-btn small purple" id="muteBtn2">SOUND ON</button>
        <button class="neon-btn small cyan" id="quitBtn">MENU</button>
      </div>
    </div>
  </div>

  <div class="screen" id="overScreen">
    <div class="panel red">
      <h2>CRASHED</h2>
      <div id="newBest"></div>
      <div class="stats">
        <div class="stat cyan"><div class="v" id="overDist">0</div><div class="l">METERS</div></div>
        <div class="stat gold"><div class="v" id="overCoins">0</div><div class="l">COINS</div></div>
        <div class="stat"><div class="v" id="overBest">0</div><div class="l">BEST</div></div>
      </div>
      <div class="biome-reached" id="overBiome"></div>
      <div class="retry">TAP TO RETRY</div>
      <div class="row"><button class="neon-btn small cyan" id="menuBtn">MENU</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// =====================================================================================
//  Pixel toolkit + Volt sprite — ported verbatim from glydrift/src/pixel/px.js and
//  glydrift/src/pixel/common.js so the hero is pixel-identical to Glydrift's.
// =====================================================================================
class PixelCanvas {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  get(x, y) { return this.in(x, y) ? this.d[y * this.w + x] : null; }
  set(x, y, c) { x = Math.round(x); y = Math.round(y); if (this.in(x, y)) this.d[y * this.w + x] = c; return this; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  hline(x0, x1, y, c) { for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) this.set(x, y, c); return this; }
  vline(x, y0, y1, c) { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) this.set(x, y, c); return this; }
  circle(cx, cy, r, c) {
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
        if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r + r * 0.6) this.set(x, y, c);
    return this;
  }
  ellipse(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
        if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1.05) this.set(x, y, c);
    return this;
  }
  poly(pts, c) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++)
      for (let x = Math.floor(Math.min(...xs)); x <= Math.ceil(Math.max(...xs)); x++) {
        const px = x + 0.5, py = y + 0.5; let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if (yi > py !== yj > py && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
        }
        if (inside) this.set(x, y, c);
      }
    return this;
  }
  stamp(x, y, rows, pal) {
    rows.forEach((row, j) => { [...row].forEach((ch, i) => { if (ch === '.' || ch === ' ') return; const c = pal[ch]; if (c !== undefined) this.set(x + i, y + j, c); }); });
    return this;
  }
  outline(c, thickness = 1, diagonal = false) {
    for (let t = 0; t < thickness; t++) {
      const src = this.d.slice();
      const g = (x, y) => (x >= 0 && y >= 0 && x < this.w && y < this.h ? src[y * this.w + x] : null);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        if (g(x, y) !== null) continue;
        const n = g(x - 1, y) !== null || g(x + 1, y) !== null || g(x, y - 1) !== null || g(x, y + 1) !== null ||
          (diagonal && (g(x - 1, y - 1) !== null || g(x + 1, y - 1) !== null || g(x - 1, y + 1) !== null || g(x + 1, y + 1) !== null));
        if (n) this.d[y * this.w + x] = c;
      }
    }
    return this;
  }
  blit(pc, ox, oy) { for (let y = 0; y < pc.h; y++) for (let x = 0; x < pc.w; x++) { const c = pc.d[y * pc.w + x]; if (c !== null) this.set(ox + x, oy + y, c); } return this; }
  toCanvas(scale = 4) {
    const small = document.createElement('canvas'); small.width = this.w; small.height = this.h;
    const sctx = small.getContext('2d'), img = sctx.createImageData(this.w, this.h), px = img.data;
    for (let i = 0; i < this.d.length; i++) { const c = this.d[i]; if (c === null) continue; const o = i * 4; px[o] = (c >> 16) & 255; px[o + 1] = (c >> 8) & 255; px[o + 2] = c & 255; px[o + 3] = 255; }
    sctx.putImageData(img, 0, 0);
    const cv = document.createElement('canvas'); cv.width = this.w * scale; cv.height = this.h * scale;
    const c2 = cv.getContext('2d'); c2.imageSmoothingEnabled = false; c2.drawImage(small, 0, 0, cv.width, cv.height);
    return cv;
  }
}
const OUT = 0x07101e; // Glydrift's bold character outline

// VOLT — storm bird (24x24), Glydrift's default hero. Frames: 0 wing up, 1 mid, 2 down.
function volt(frame) {
  const pc = new PixelCanvas(24, 24);
  const B = 0x2aa8ff, Bd = 0x1670d0, L = 0x8fe4ff, W = 0xe8fbff;
  pc.poly([[7, 12], [1, 9], [4, 13], [0, 14], [5, 16], [8, 15]], Bd);
  pc.set(2, 10, L).set(1, 14, L);
  pc.ellipse(11.5, 13.5, 6.8, 5.2, B);
  pc.circle(16.5, 9.5, 4.3, B);
  pc.ellipse(13, 15.5, 4, 2.2, W);
  pc.hline(10, 15, 17, L);
  pc.stamp(14, 2, ['..y.', '.yy.', 'yyy.', '.yyy', '..y.'], { y: 0xffe14d });
  pc.set(16, 3, 0xfff6c0);
  pc.rect(17, 7, 3, 3, 0xffffff);
  pc.rect(18, 8, 2, 2, 0x0b1830);
  pc.set(18, 8, 0xffffff);
  pc.stamp(20, 9, ['oo..', 'ooyy', 'oo..'], { o: 0xffa31a, y: 0xffd23f });
  pc.set(21, 9, 0xffd23f);
  pc.set(16, 12, 0xff8fb8);
  const wings = [
    [[8, 12], [5, 4], [9, 6], [10, 3], [12, 7], [13, 12]],
    [[7, 11], [2, 9], [6, 8], [4, 6], [10, 9], [13, 12]],
    [[8, 13], [6, 20], [9, 18], [10, 21], [12, 17], [13, 13]],
  ];
  pc.poly(wings[frame], L);
  if (frame === 0) pc.set(10, 7, 0xffe14d).set(9, 8, 0xffe14d).set(10, 9, 0xffe14d);
  if (frame === 1) pc.set(6, 9, 0xffe14d).set(7, 9, 0xffe14d).set(8, 10, 0xffe14d);
  if (frame === 2) pc.set(10, 15, 0xffe14d).set(9, 16, 0xffe14d).set(10, 17, 0xffe14d);
  for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) {
    const c = pc.get(x, y);
    if (c === B && (pc.get(x, y + 1) === null || pc.get(x + 1, y + 1) === null)) pc.set(x, y, Bd);
    if (c === B && pc.get(x, y - 1) === null) pc.set(x, y, L);
  }
  pc.outline(OUT, 1, true);
  return pc;
}
// Thin white rim so the hero is always the brightest, clearest shape (Glydrift's rim()).
function rim(pc) { const out = new PixelCanvas(pc.w + 2, pc.h + 2); out.blit(pc, 1, 1); return out.outline(0xffffff, 1, false); }
// Gold coin, 10x12, 4 spin frames (Glydrift's coin()).
function coinArt(frame) {
  const pc = new PixelCanvas(10, 12);
  const rx = [3.6, 2.4, 0.9, 2.4][frame];
  pc.ellipse(4.5, 5.5, rx + 0.4, 4.8, 0xffc83d);
  for (let y = 0; y < 12; y++) for (let x = 0; x < 10; x++) {
    if (pc.get(x, y) === null) continue;
    if (x < 4.5 - rx * 0.4) pc.set(x, y, 0xfff1a0);
    else if (x > 4.5 + rx * 0.5) pc.set(x, y, 0xd08a10);
  }
  if (frame === 0) pc.vline(4, 3, 7, 0xd08a10).vline(5, 3, 7, 0xfff1a0);
  pc.outline(0x3a2400, 1);
  return pc;
}
// Volt's trail colours (characterDefs.js → volt.pixel.trail)
const VOLT_TRAIL = ['#ffffff', '#8fe4ff', '#2aa8ff', '#1670d0'];
const SPR_VOLT = [0, 1, 2].map(f => rim(volt(f)).toCanvas(4));
const SPR_COIN = [0, 1, 2, 3].map(f => coinArt(f).toCanvas(4));
const HERO_ART = 1.45; // world units per art pixel for the hero (26 art px → ~38 units)

// =====================================================================================
//  Biomes (dark neon, Glydrift-style). Hazards use Glydrift's DANGER colours.
// =====================================================================================
const DANGER = { red: '#ff2a3d', orange: '#ff6a1a', pink: '#ff2d78' };
const BIOMES = [
  {
    id: 'meadow', name: 'SKY MEADOW', glow: '#39ff88',
    sky: ['#040b1f', '#0a2340', '#0f4a55'], horizon: 'rgba(57,255,136,0.18)',
    danger: DANGER.pink, hazBody: '#1c0614', pit: ['#06202a', '#010509'],
    ground: { line: '#39ff88', top: '#127a4c', topHi: '#2fd07a', body: '#082129', body2: '#0b2d36', speck: '#14485a' },
  },
  {
    id: 'canyon', name: 'SUNSET CANYON', glow: '#ffb22e',
    sky: ['#12031f', '#4a0c3c', '#c2412c'], horizon: 'rgba(255,140,40,0.28)',

    else b.vy = Math.min(GLIDE_FALL, b.vy + G * 0.3 * dt);

  const dt = 1 / 120; let x = 0;

  if (mObs > 140) choices.push(['glideGap', 1.3]);
  if (mObs > 180) choices.push(['ball', bi === 0 ? 2.4 : 1.1]);        // Sky Meadow's new hazard
  if (mObs >= BIOME_M) choices.push(['mesa', bi === 1 ? 2.6 : 1.0]);   // Sunset Canyon's
  if (mObs >= BIOME_M * 2) choices.push(['orb', bi === 2 ? 2.6 : 1.0]); // Neon Night's
  let total = 0; for (const c of choices) total += c[1];
  let r = Math.random() * total, type = choices[0][0];
  for (const c of choices) { if ((r -= c[1]) <= 0) { type = c[0]; break; } }

  let safe = sp * (lerp(0.8, 0.4, diff) + Math.random() * lerp(0.55, 0.3, diff)) + 30;
  const needsGlide = type === 'wall' || type === 'glideGap';
  if (needsGlide && S.lastGlide) safe = Math.max(safe, sp * GLIDE_REFILL + 40);
  if (safe > 220 && Math.random() < 0.25) addRowCoins(S.cursor + 40, S.cursor + safe - 70, GROUND - 14);

  const start = S.cursor + safe;
  const arrive = predict(Math.max(0, start - birdX));
  sp = arrive.sp;
  S.lastGlide = needsGlide;

  if (type === 'ceiling') {
    const w = Math.round(sp * rand(0.5, 1.1)), x = start + HB.w + 8;
    S.obstacles.push({ type, x, w, bi });
    addRowCoins(x + 15, x + w - 15, GROUND - 14);
    S.cursor = x + w + HB.w + 10;
    return;
  }

  if (type === 'ball') {
    // A thorn seed rolls toward the bird and meets it at the planned takeoff point.
    const rel = simPath(sp + BALL_V, false);
    const [xs, xe] = clearWindow(rel, GROUND - BALL_R * 2 - 4);
    const span = HB.w + BALL_R, slack = Math.max(0, (xe - xs) - 2 * span);
    const R0 = xs + span + slack / 2; // bird→seed centre distance at takeoff
    const o = { type: 'ball', x: start + R0 - BALL_R, w: BALL_R * 2, T: arrive.t, X0: start + R0, y: GROUND - BALL_R, vy: 0, rot: 0, bi };
    const land = pushJump(o, start, simPath(sp, false), false);
    S.cursor = Math.max(land, start + R0 + BALL_V * 1.8) + 20;
    return;
  }

  if (type === 'orb') {
    // A pulse orb bobs on a rail. When the bird gets there it is either up (stay on the
    // ground and run under) or down (jump it). Its bob is timed from the bird's arrival.
    const x = start + 80, at = predict(Math.max(0, x - birdX));
    const mode = Math.random() < 0.5 ? 'under' : 'over';
    const o = { type: 'orb', x: x - ORB_R, w: ORB_R * 2, cx: x, T: at.t, mode, bi };
    if (mode === 'under') { S.obstacles.push(o); addRowCoins(x - 30, x + 30, GROUND - 14); S.cursor = x + ORB_R + HB.w + 20; S.lastGlide = false; return; }
    const pts = simPath(at.sp, false);
    const [xs, xe] = clearWindow(pts, ORB_BOT - ORB_R - 6);
    const slack = Math.max(0, (xe - xs - 2 * HB.w) - o.w);
    const takeoff = x - ORB_R - xs - HB.w - slack / 2;
    const land = pushJump(o, takeoff, pts, false);
    S.cursor = Math.max(land, x + ORB_R + HB.w) + 10;
    return;
  }

  if (type === 'mesa') {
    // Stepping-stone mesas over a chasm: a chain of 2-4 hops with no rest in between.
    const n = 2 + Math.floor(Math.random() * lerp(1.6, 3, diff));
    const pts = simPath(sp, false), L = pts[pts.length - 1].x;
    let takeoff = start, prevEnd = null;
    for (let i = 0; i < n; i++) {
      const w = Math.round(L * rand(0.32, 0.48)), gx = takeoff + (L - w) / 2;
      if (prevEnd !== null) S.obstacles.push({ type: 'mesa', x: prevEnd, w: gx - prevEnd, bi });
      const land = pushJump({ type: 'gap', x: gx, w, glide: false, bi, mesa: true }, takeoff, pts, false, i % 2 === 0);
      prevEnd = gx + w;
      takeoff = land + sp * 0.14 + 10;
      S.cursor = land + 10;
    }
    S.lastGlide = false;
    return;
  }

  const glide = needsGlide;
  const pts = simPath(sp, glide);
  let obstacle, takeoff = start;
  if (type === 'spikes') {
    const [xs, xe] = clearWindow(pts, GROUND - SPIKE_H - 4);
    const maxN = Math.max(1, Math.floor((xe - xs - 22) / SPIKE_W));
    const n = Math.max(1, Math.min(maxN, 1 + Math.floor(Math.random() * lerp(2, 4.5, diff))));
    const w = n * SPIKE_W, slack = (xe - xs - 22) - w;
    obstacle = { type, x: takeoff + xs + HB.w + slack / 2, w, n, bi };
  } else if (type === 'wall') {
    const [xs, xe] = clearWindow(pts, WALL_TOP - 4);
    const [ns, ne] = clearWindow(simPath(sp, false), WALL_TOP - 4);
    const maxW = xe - xs - 22, minW = Math.min(maxW * 0.7, (ne - ns - 22) + 30);
    const w = Math.round(rand(minW, lerp(minW, maxW * 0.85, 0.4 + 0.6 * diff)));
    obstacle = { type, x: takeoff + xs + HB.w + (maxW - w) / 2, w, bi };
  } else {
    const L = pts[pts.length - 1].x;
    let w;
    if (type === 'gap') w = rand(Math.min(70, L * 0.4), L * lerp(0.55, 0.75, diff));
    else { const noGlideL = simPath(sp, false).slice(-1)[0].x; w = rand(noGlideL + 20, lerp(noGlideL + 40, L * 0.8, 0.3 + 0.7 * diff)); }
    w = Math.round(Math.min(w, L - 50));
    obstacle = { type: 'gap', x: takeoff + (L - w) / 2, w, glide, bi };
  }
  const land = pushJump(obstacle, takeoff, pts, glide);
  S.cursor = Math.max(land, obstacle.x + obstacle.w + HB.w) + 10;
}

// =====================================================================================
//  Particles (pooled, world-space)
// =====================================================================================
const particles = Array.from({ length: 320 }, () => ({ life: 0 }));
// kinds: 0 pixel square, 1 feather, 2 sparkle star, 3 ring, 4 speed streak
function emit(x, y, vx, vy, life, size, color, kind = 0, grav = 0) {
  for (const p of particles) if (p.life <= 0) {
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.size = size;
    p.color = color; p.kind = kind; p.grav = grav; p.rot = Math.random() * 6; return;
  }
}
function dust(x, n, k = 1) {
  const c = BIOMES[biomeAtX(x)].ground.topHi;
  for (let i = 0; i < n; i++) emit(x + rand(-10, 10), GROUND - 2, rand(-120, 60) * k, rand(-90, -15) * k, rand(0.25, 0.45), rand(2, 3.5), i % 2 ? c : '#ffffff', 0, 260);
}

const screens = { start: $('startScreen'), pause: $('pauseScreen'), over: $('overScreen') };
function showScreen(name) { for (const k in screens) screens[k].classList.toggle('show', k === name); }
function updateStartBest() { $('startBest').textContent = best.m > 0 ? `BEST ${best.m} m · ${best.coins} coins` : ''; }

function goMenu() { S.mode = 'menu'; resetWorld(MENU_SPEED); showScreen('start'); $('hud').classList.remove('show'); updateStartBest(); }
function startGame() {
  audio();
  resetWorld(SPEED0); S.mode = 'play';
  showScreen(null); $('hud').classList.add('show');
  $('hudBest').textContent = best.m > 0 ? `BEST ${best.m}` : '';
  S.lastMeters = S.lastCoins = -1;
}
function pause() { if (S.mode !== 'play') return; S.mode = 'paused'; showScreen('pause'); input.pointers.clear(); input.keys.clear(); }
function resume() { if (S.mode !== 'paused') return; S.mode = 'play'; showScreen(null); last = performance.now(); }
function die() {
  if (S.mode === 'menu') { resetWorld(MENU_SPEED); return; } // attract mode: restart quietly
  if (S.mode !== 'play') return;
  const b = S.bird, bx = S.dist + S.bx;
  S.mode = 'dying'; S.deathT = 0; S.shake = 1; S.flash = 0.7; S.hitstop = 0.07;
  b.vy = -520; b.grounded = false; b.gliding = false;
  sfx.die();
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  for (let i = 0; i < 22; i++) {
    const a = rand(0, Math.PI * 2), s = rand(90, 300);
    emit(bx, b.y - 14, Math.cos(a) * s, Math.sin(a) * s - 90, rand(0.6, 1.1), rand(3, 6), VOLT_TRAIL[i % 4], 1, 420);
  }
  for (let i = 0; i < 6; i++) emit(bx, b.y - 14, rand(-140, 140), rand(-260, -60), rand(0.4, 0.7), 4, '#ffe14d', 2, 300);
  emit(bx, b.y - 14, 0, 0, 0.35, 6, '#ffffff', 3);
}
function gameOver() {
  S.mode = 'over';
  const m = Math.floor(S.dist / UNITS_PER_M), isBest = m > best.m;
  if (isBest) best.m = m;
  if (S.coins > best.coins) best.coins = S.coins;
  store.set('best', best);
  $('overDist').textContent = m; $('overCoins').textContent = S.coins; $('overBest').textContent = best.m;
  $('newBest').innerHTML = isBest && m > 0 ? '<span class="newbest">NEW BEST!</span>' : '';
  $('overBiome').textContent = 'Reached ' + BIOMES[Math.floor(m / BIOME_M) % BIOMES.length].name;

  n.style.textShadow = `0 0 8px ${BIOMES[i].glow}, 0 0 24px ${BIOMES[i].glow}`;

// =====================================================================================
//  Update
// =====================================================================================
function botThink() {
  const bx = S.dist + S.bx, b = S.bird;
  if (b.grounded) bot.hold = false;
  if (!bot.target || bot.target.done) bot.target = S.plans.find(p => !p.done && p.takeoff >= bx - 40) || null;
  const t = bot.target;
  if (t && b.grounded && bx >= t.takeoff) { b.buffer = BUFFER; bot.hold = t.glide; t.done = true; }
}
const orbY = (o, t) => {
  const c = Math.cos((2 * Math.PI * (t - o.T)) / ORB_PERIOD), mid = (ORB_TOP + ORB_BOT) / 2, amp = (ORB_BOT - ORB_TOP) / 2;
  return o.mode === 'over' ? mid + amp * c : mid - amp * c;
};
function rectCircle(l, t, r, btm, cx, cy, rad) {
  const nx = Math.max(l, Math.min(cx, r)), ny = Math.max(t, Math.min(cy, btm));
  return (nx - cx) ** 2 + (ny - cy) ** 2 < rad * rad;
}

function step(dt) {
  const b = S.bird;
  if (S.hitstop > 0) { S.hitstop -= dt; return; }
  S.time += dt;
  const auto = S.mode === 'menu' || BOT_PLAY;

  if (S.mode === 'dying') {
    S.speed *= Math.exp(-6 * dt); S.dist += S.speed * dt;
    b.vy = Math.min(MAX_FALL, b.vy + G * dt); b.y += b.vy * dt; b.rot += 10 * dt;
    S.deathT += dt;
    if (S.deathT > 0.45) gameOver();
    return;
  }

  if (S.mode === 'play') S.speed = Math.min(SPEED_MAX, S.speed + SPEED_ACC * dt);
  S.dist += S.speed * dt;
  while (S.cursor < S.dist + view.w + 600) spawnNext();

  // the biome changes as the bird crosses each 1000 m line
  const bIdx = Math.floor(S.dist / BIOME_UNITS) % BIOMES.length;
  if (bIdx !== S.biome) {
    S.biomePrev = S.biome; S.biome = bIdx; S.biomeMix = 0;
    if (S.mode === 'play') { showBanner(bIdx); sfx.biome(); S.flash = 0.25; }
  }
  if (S.biomeMix < 1) S.biomeMix = Math.min(1, S.biomeMix + dt / 1.6);

  if (auto) botThink();
  const hold = auto ? bot.hold : isHeld();
  const bx = S.dist + S.bx;

  b.buffer -= dt; b.anim += dt * S.speed / 26; b.flapT -= dt;
  if (b.grounded) {
    b.meter = Math.min(1, b.meter + dt / GLIDE_REFILL);
    if (!solidAt(bx)) { b.grounded = false; b.coyote = COYOTE; b.vy = 0; }
  } else b.coyote -= dt;

  if (b.buffer > 0 && (b.grounded || b.coyote > 0)) {
    b.vy = -JUMP_V; b.grounded = false; b.coyote = 0; b.buffer = 0;
    b.sq = -0.32; b.sqv = 0; b.flapT = 0.18; // stretch tall on takeoff
    if (S.mode === 'play') sfx.jump();
    dust(bx, 6, 0.8);
  }

  if (!b.grounded) {
    const prevY = b.y, prevVy = b.vy;
    airStep(b, dt, hold);
    if (b.gliding && !b.wasGliding && S.mode === 'play') sfx.glide();
    b.wasGliding = b.gliding;
    if (b.vy >= 0 && b.y >= GROUND) {
      if (solidAt(bx)) {
        if (prevY <= GROUND + 8) {
          const k = Math.min(1, prevVy / 700);
          b.y = GROUND; b.vy = 0; b.grounded = true; b.gliding = b.wasGliding = false;
          b.sq = 0.18 + 0.32 * k; b.sqv = 0; // squash on landing; harder falls squash more
          dust(bx, 5 + Math.round(k * 6), 0.6 + k * 0.6);
          if (S.mode === 'play') sfx.land(0.5 + k * 0.5);
          if (k > 0.7) S.shake = Math.max(S.shake, 0.12);
        } else return die();
      } else if (b.y > GROUND + 8 && solidAt(bx + HB.w - 3)) return die();
      else if (b.y > GROUND + 130) return die();
    }
  } else { b.gliding = b.wasGliding = false; }

  // squash & stretch spring (bouncy, settles in ~0.3 s)
  b.sqv += (-b.sq * 520 - b.sqv * 16) * dt; b.sq += b.sqv * dt;

  // rolling thorn seeds
  for (const o of S.obstacles) {
    if (o.type !== 'ball') continue;
    o.x = o.X0 - BALL_V * (S.time - o.T) - BALL_R;
    o.rot -= BALL_V * dt / BALL_R;
    const cx = o.x + BALL_R;
    if (cx < o.X0 - 10 && (o.vy > 0 || !solidAt(cx))) { o.vy += G * dt; o.y += o.vy * dt; }
  }

  // hazard collisions
  const l = bx - HB.w, r = bx + HB.w, t = b.y - HB.top, btm = b.y - HB.bot;
  for (const o of S.obstacles) {
    if (o.type === 'ball') { if (rectCircle(l, t, r, btm, o.x + BALL_R, o.y, BALL_R - 2)) return die(); continue; }
    if (o.x > r + 10 || o.x + o.w < l) continue;
    if (o.type === 'spikes') {
      for (let i = 0; i < o.n; i++) { const sx = o.x + i * SPIKE_W + 7; if (r > sx && l < sx + 12 && btm > GROUND - 22) return die(); }
    } else if (o.type === 'ceiling') {
      if (r > o.x && l < o.x + o.w && t < CEIL_HB) return die();
    } else if (o.type === 'wall') {
      if (r > o.x && l < o.x + o.w && t < WALL_BOT && btm > WALL_TOP) return die();
    } else if (o.type === 'orb') {
      if (rectCircle(l, t, r, btm, o.cx, orbY(o, S.time), ORB_R - 2)) return die();
    }
  }

  // coins
  const cy = b.y - 14;
  coinChainT -= dt; if (coinChainT <= 0) coinChain = 0;
  for (let i = S.coinList.length - 1; i >= 0; i--) {
    const c = S.coinList[i];
    if (c.x < S.dist - 60) { S.coinList.splice(i, 1); continue; }
    const dx = c.x - bx, dy = c.y - cy;
    if (dx * dx + dy * dy < 23 * 23) {
      S.coinList.splice(i, 1);
      if (S.mode === 'play') {
        S.coins++; sfx.coin(); coinChain++; coinChainT = 0.6;
        const el = $('hudCoins'); el.classList.add('bump'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('bump'), 90);
      }
      for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2; emit(c.x, c.y, Math.cos(a) * 120 + S.speed * 0.3, Math.sin(a) * 120, rand(0.25, 0.4), 2.5, k % 2 ? '#fff1a0' : '#ffc83d', 0, 0); }
      emit(c.x, c.y, S.speed * 0.4, 0, 0.25, 4, '#ffe14d', 3);
    }
  }

  // glide sparkle trail: Volt's trail colours plus gold bolt sparks
  if (b.gliding) {
    b.spark += dt * 40;
    while (b.spark > 1) {
      b.spark -= 1;
      emit(bx - 12 + rand(-4, 4), b.y - rand(6, 24), rand(-60, -10), rand(-20, 30), rand(0.35, 0.6), rand(1.5, 3), VOLT_TRAIL[Math.floor(Math.random() * 3)], 0, 0);
      if (Math.random() < 0.35) emit(bx - 10, b.y - rand(8, 22), rand(-50, 0), rand(-30, 30), rand(0.4, 0.6), rand(3, 5), Math.random() < 0.5 ? '#ffe14d' : '#ffffff', 2, 0);
    }
    S.trail.push({ x: bx - 8, y: b.y - 15 });
    if (S.trail.length > 22) S.trail.shift();
  } else if (S.trail.length) { S.trail.shift(); if (S.trail.length) S.trail.shift(); }

  // speed streaks at high speed
  if (S.speed > 420 && Math.random() < dt * (S.speed - 420) / 20) emit(S.dist + view.w + 10, rand(GROUND - 200, GROUND - 10), -S.speed * 1.6, 0, 0.6, rand(14, 30), 'rgba(255,255,255,0.35)', 4);

  // cleanup
  for (let i = S.obstacles.length - 1; i >= 0; i--) {
    const o = S.obstacles[i];
    if (o.x + o.w < S.dist - 120 || o.y > GROUND + 300) S.obstacles.splice(i, 1);
  }
  while (S.plans.length && S.plans[0].takeoff < S.dist - 400) S.plans.shift();
}

function update(dt) {
  if (S.mode !== 'paused' && S.mode !== 'over') {
    const n = Math.ceil(dt / (1 / 120)), h = dt / n;
    for (let i = 0; i < n && (S.mode === 'play' || S.mode === 'menu' || S.mode === 'dying'); i++) step(h);
  }
  if (S.mode !== 'paused') for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 7;
  }
  const b = S.bird;
  const targetRot = b.grounded ? 0 : b.gliding ? 0.08 : Math.max(-0.45, Math.min(0.55, b.vy / 1300));
  if (S.mode !== 'dying' && S.mode !== 'over') b.rot += (targetRot - b.rot) * Math.min(1, dt * 14);
  b.meterAlpha += ((b.meter < 0.999 || b.gliding) && S.mode === 'play' ? 1 - b.meterAlpha : -b.meterAlpha) * Math.min(1, dt * 8);
  S.shake = Math.max(0, S.shake - dt * 2.2);
  S.flash = Math.max(0, S.flash - dt * 2.5);

  if (S.mode === 'play') {
    const m = Math.floor(S.dist / UNITS_PER_M);
    if (m !== S.lastMeters) { S.lastMeters = m; $('hudDist').firstChild.nodeValue = m; }
    if (S.coins !== S.lastCoins) { S.lastCoins = S.coins; $('hudCoins').textContent = S.coins; }
  }
}

// =====================================================================================
//  Rendering
// =====================================================================================
function drawLayer(img, par, baseY, alpha) {
  const w = img.width * BG_ART, h = img.height * BG_ART;
  let x = -((S.dist * par) % w); if (x > 0) x -= w;
  ctx.globalAlpha = alpha;
  for (; x < view.w; x += w) ctx.drawImage(img, x, baseY - h, w + 0.5, h);
  ctx.globalAlpha = 1;
}
function drawCelestial(bi, alpha) {
  ctx.globalAlpha = alpha;
  const cx = view.w * 0.74, cy = Math.max(view.top + 70, GROUND - 205);
  if (bi === 0) { // pale moon with a soft halo
    ctx.fillStyle = 'rgba(143,247,255,0.08)'; ctx.beginPath(); ctx.arc(cx, cy, 58, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(143,247,255,0.12)'; ctx.beginPath(); ctx.arc(cx, cy, 40, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#d8fbff'; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#a6dce8'; ctx.fillRect(cx - 10, cy - 8, 6, 6); ctx.fillRect(cx + 6, cy + 4, 8, 6); ctx.fillRect(cx - 4, cy + 10, 4, 4);
  } else if (bi === 1) { // striped synthwave sun, sinking behind the mesas
    const sy = GROUND - 120, r = 74;
    ctx.fillStyle = 'rgba(255,90,60,0.12)'; ctx.beginPath(); ctx.arc(cx, sy, r + 30, 0, 6.283); ctx.fill();
    for (let y = -r; y < r; y += 4) {
      if (y > 0 && Math.floor(y / 4) % 3 === 0) continue;
      const half = Math.sqrt(r * r - y * y);
      ctx.fillStyle = y < -r * 0.3 ? '#ffe14d' : y < r * 0.2 ? '#ff9a3a' : '#ff4d6a';
      ctx.fillRect(cx - half, sy + y, half * 2, 4);
    }
  } else { // ringed planet
    ctx.fillStyle = 'rgba(192,75,255,0.1)'; ctx.beginPath(); ctx.arc(cx, cy, 52, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#2a1460'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#3d2088'; ctx.beginPath(); ctx.arc(cx - 6, cy - 6, 22, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#3ef4ff'; ctx.lineWidth = 2; ctx.globalAlpha = alpha * 0.8;
    ctx.beginPath(); ctx.ellipse(cx, cy, 52, 11, -0.3, 0, 6.283); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawBiomeBack(bi, alpha) {
  const L = ART[bi].layers;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = skyGrads[bi]; ctx.fillRect(-10, view.top - 10, view.w + 20, GROUND - view.top + 20);
  ctx.fillStyle = horizonGrads[bi]; ctx.fillRect(-10, GROUND - 110, view.w + 20, 110);
  ctx.globalAlpha = 1;
  // layer 1 (far, slowest): stars, tiled up to the top of the view, plus the moon/sun/planet
  for (let y = GROUND - 40; y > view.top - 300; y -= L.far.height * BG_ART) drawLayer(L.far, 0.03, y, alpha);
  drawCelestial(bi, alpha);
  drawLayer(L.mid, 0.18, GROUND + 2, alpha);   // layer 2: hills / mesas / skyline
  drawLayer(L.near, 0.45, GROUND + 4, alpha);  // layer 3: trees & flowers / cacti / neon poles
}

function drawGroundSeg(x1, x2) {
  // split at biome boundaries so the terrain changes exactly at each 1000 m line
  while (x1 < x2) {
    const bi = biomeAtX(x1 + 0.01);
    const bEnd = S.bx + (Math.floor((x1 + 0.01 - S.bx) / BIOME_UNITS) + 1) * BIOME_UNITS;
    const e = Math.min(x2, Math.max(bEnd, x1 + 1));
    drawGroundPart(x1, e, bi); x1 = e;
  }
}
function drawGroundPart(x1, x2, bi) {
  const s1 = x1 - S.dist, s2 = x2 - S.dist, w = s2 - s1;
  if (w <= 0) return;
  const tile = ART[bi].ground, tw = tile.width * BG_ART, th = tile.height * BG_ART, g = BIOMES[bi].ground;
  ctx.save(); ctx.beginPath(); ctx.rect(s1, GROUND - 4, w, view.bottom - GROUND + 8); ctx.clip();
  ctx.fillStyle = g.body; ctx.fillRect(s1, GROUND + th - 1, w, view.bottom - GROUND);
  for (let tx = Math.floor(x1 / tw) * tw - S.dist; tx < s2; tx += tw) ctx.drawImage(tile, tx, GROUND, tw + 0.5, th);
  if (bi === 2) { // Tron grid on the ground face
    ctx.strokeStyle = 'rgba(62,244,255,0.16)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let y = GROUND + th + 8; y < view.bottom; y += 16 + (y - GROUND) * 0.08) { ctx.moveTo(s1, y); ctx.lineTo(s2, y); }
    for (let k = Math.floor(x1 / 32); k * 32 - S.dist < s2; k++) { const gx = k * 32 - S.dist; ctx.moveTo(gx, GROUND + th); ctx.lineTo(gx + (gx - view.w / 2) * 0.6, view.bottom); }
    ctx.stroke();
  }
  ctx.fillStyle = g.line; ctx.globalAlpha = 0.25; ctx.fillRect(s1, GROUND - 3, w, 4); ctx.globalAlpha = 1;
  ctx.fillRect(s1, GROUND - 0.5, w, 1.5);
  ctx.restore();
}
// Glydrift hazard look: dark body, inner tint, thick saturated outline, soft glow, white core.
function neon(color, w = 2.4) {
  ctx.lineJoin = 'round'; ctx.strokeStyle = color;
  ctx.globalAlpha = 0.22; ctx.lineWidth = w * 3.4; ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = w; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = w * 0.38; ctx.stroke();
}
function hazFill(bi, color) {
  ctx.fillStyle = BIOMES[bi].hazBody; ctx.fill();
  ctx.globalAlpha = 0.16; ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1;
}
function drawPit(o) {
  const x = o.x - S.dist, bi = o.bi, col = BIOMES[bi].ground.line;
  ctx.fillStyle = pitGrads[bi]; ctx.fillRect(x - 1, GROUND, o.w + 2, view.bottom - GROUND);
  ctx.fillStyle = col; ctx.globalAlpha = 0.45;
  ctx.fillRect(x, GROUND, 2, 50); ctx.fillRect(x + o.w - 2, GROUND, 2, 50);
  ctx.globalAlpha = 0.2; ctx.fillRect(x, GROUND + 50, 2, 40); ctx.fillRect(x + o.w - 2, GROUND + 50, 2, 40);
  ctx.globalAlpha = 1;
}
function drawSpikes(o) {
  const sx = o.x - S.dist, c = BIOMES[o.bi].danger;
  ctx.beginPath();
  for (let i = 0; i < o.n; i++) { const x = sx + i * SPIKE_W; ctx.moveTo(x + 1, GROUND); ctx.lineTo(x + SPIKE_W / 2, GROUND - SPIKE_H); ctx.lineTo(x + SPIKE_W - 1, GROUND); }
  ctx.closePath(); hazFill(o.bi, c); neon(c, 2.2);
}
function drawCeiling(o) {
  const x = o.x - S.dist, top = view.top - 10, c = BIOMES[o.bi].danger;
  ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, CEIL_ROCK);
  const n = Math.max(1, Math.floor(o.w / 16)), tw = o.w / n;
  for (let k = 0; k < n; k++) { ctx.lineTo(x + k * tw + tw / 2, GROUND - 44); ctx.lineTo(x + (k + 1) * tw, CEIL_ROCK); }
  ctx.lineTo(x + o.w, top); ctx.closePath();
  hazFill(o.bi, c); neon(c, 2.4);
  ctx.strokeStyle = c; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let y = CEIL_ROCK - 16; y > top; y -= 18) { ctx.moveTo(x + 6, y); ctx.lineTo(x + o.w - 6, y); }
  ctx.stroke(); ctx.globalAlpha = 1;
}
function drawWall(o) {
  const x = o.x - S.dist, h = WALL_BOT - WALL_TOP, c = BIOMES[o.bi].danger, bob = Math.sin(S.time * 3 + o.x) * 1.2;
  ctx.fillStyle = c; ctx.globalAlpha = 0.12; ctx.fillRect(x, GROUND - 3, o.w, 3); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.roundRect(x, WALL_TOP + bob, o.w, h, 8);
  hazFill(o.bi, c); neon(c, 2.6);
  ctx.beginPath();
  for (let k = 16; k < o.w - 8; k += 22) { ctx.moveTo(x + k, WALL_TOP + 10 + bob); ctx.lineTo(x + k - 10, WALL_BOT - 10 + bob); }
  ctx.strokeStyle = c; ctx.globalAlpha = 0.45; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
}
function drawBall(o) {
  const cx = o.x + BALL_R - S.dist, cy = o.y, c = DANGER.pink;
  if (cx < -40 || cx > view.w + 40) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(o.rot);
  ctx.beginPath();
  for (let k = 0; k < 16; k++) { const a = (k / 16) * Math.PI * 2, r = k % 2 ? BALL_R - 3 : BALL_R + 3; if (k) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(r, 0); }
  ctx.closePath(); hazFill(o.bi, c); neon(c, 2.2);
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.283); ctx.fillStyle = c; ctx.fill();
  ctx.restore();
}
function drawOrb(o) {
  const cx = o.cx - S.dist, cy = orbY(o, S.time), c = DANGER.red;
  ctx.fillStyle = c; ctx.globalAlpha = 0.35; // dotted rail so the bob reads from far away
  for (let y = ORB_TOP - ORB_R; y < GROUND; y += 6) ctx.fillRect(cx - 1, y, 2, 3);
  ctx.globalAlpha = 0.2; ctx.beginPath(); ctx.arc(cx, cy, ORB_R + 9, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cx, cy, ORB_R, 0, 6.283); hazFill(o.bi, c); neon(c, 2.6);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, 3.5 + Math.sin(S.time * 10), 0, 6.283); ctx.fill();
}
function drawMesa(o) { // stone pillar under each stepping stone
  const x = o.x - S.dist, th = 64;
  ctx.fillStyle = 'rgba(255,178,46,0.12)'; ctx.fillRect(x + 4, GROUND + th, o.w - 8, view.bottom - GROUND - th);
  ctx.fillStyle = '#ffb22e'; ctx.globalAlpha = 0.5; ctx.fillRect(x + 2, GROUND + 2, 2, view.bottom - GROUND); ctx.fillRect(x + o.w - 4, GROUND + 2, 2, view.bottom - GROUND); ctx.globalAlpha = 1;
}
function drawCoin(c) {
  const x = c.x - S.dist; if (x < -20 || x > view.w + 20) return;
  const f = Math.floor(S.time * 8 + c.ph) & 3, y = c.y + Math.sin(S.time * 4 + c.ph) * 1.5;
  ctx.drawImage(SPR_COIN[f], x - 7.5, y - 9, 15, 18);
}
function drawTrail() {
  const T = S.trail; if (T.length < 2) return;
  ctx.lineCap = 'round';
  for (let i = 1; i < T.length; i++) {
    const k = i / T.length, a = T[i - 1], b = T[i];
    ctx.strokeStyle = VOLT_TRAIL[Math.min(3, Math.floor((1 - k) * 4))];
    ctx.globalAlpha = k * 0.85; ctx.lineWidth = 1 + k * 7;
    ctx.beginPath(); ctx.moveTo(a.x - S.dist, a.y); ctx.lineTo(b.x - S.dist, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawBird() {
  const b = S.bird, x = S.bx;
  ctx.save();
  ctx.translate(x, b.y);
  const sq = Math.max(-0.45, Math.min(0.55, b.sq)) + (b.gliding ? -0.06 : 0);
  ctx.scale(1 + sq * 0.9, 1 - sq * 0.9); // squash & stretch around the feet
  const run = b.grounded && S.mode !== 'dying' && S.mode !== 'over';
  const bob = run ? Math.abs(Math.sin(b.anim)) * 2.2 : 0;
  ctx.translate(0, -bob);
  ctx.rotate(b.rot);
  if (run) { // little running legs
    ctx.fillStyle = '#ffa31a';
    const a = Math.sin(b.anim * 2) * 4;
    ctx.fillRect(-4 + a, -7, 3, 7 + bob); ctx.fillRect(2 - a, -7, 3, 7 + bob);
  }
  let frame;
  if (S.mode === 'dying' || S.mode === 'over') frame = 2;
  else if (b.gliding) frame = Math.floor(S.time * 14) % 2 ? 1 : 0;
  else if (run) frame = Math.floor(b.anim * 1.2) % 3;
  else if (b.flapT > 0) frame = b.flapT > 0.09 ? 2 : 1;
  else frame = b.vy < 0 ? 1 : 0;
  const w = 26 * HERO_ART;
  ctx.drawImage(SPR_VOLT[frame], -w / 2 - 2, -25 * HERO_ART, w, w);
  ctx.restore();

  if (b.meterAlpha > 0.02) { // glide meter
    const w = 34, y = b.y - 62, mx = x - w / 2, col = b.meter < 0.25 ? '#ff2a3d' : '#3ef4ff';
    ctx.globalAlpha = b.meterAlpha;
    ctx.fillStyle = 'rgba(5,1,15,0.85)'; ctx.fillRect(mx - 2, y - 2, w + 4, 8);
    ctx.fillStyle = col; ctx.globalAlpha = b.meterAlpha * 0.3; ctx.fillRect(mx - 3, y - 3, w + 6, 10);
    ctx.globalAlpha = b.meterAlpha; ctx.fillRect(mx, y, w * b.meter, 4);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(mx, y, w * b.meter, 1);
    ctx.globalAlpha = 1;
  }
}
function drawParticles() {
  for (const p of particles) {
    if (p.life <= 0) continue;
    const a = Math.min(1, (p.life / p.max) * 1.6), x = p.x - S.dist;
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    if (p.kind === 0) ctx.fillRect(x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    else if (p.kind === 1) { ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size * 0.4, p.size * 2, p.size * 0.8); ctx.restore(); }
    else if (p.kind === 2) { const s = p.size * (0.5 + 0.5 * a); ctx.fillRect(x - s, p.y - 0.75, s * 2, 1.5); ctx.fillRect(x - 0.75, p.y - s, 1.5, s * 2); }
    else if (p.kind === 3) { const k = 1 - p.life / p.max; ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * (1 - k) + 0.5; ctx.beginPath(); ctx.arc(x, p.y, p.size + k * 26, 0, 6.283); ctx.stroke(); }
    else { ctx.globalAlpha = a * 0.7; ctx.fillRect(x, p.y, p.size, 1.2); }
  }
  ctx.globalAlpha = 1;
}

function render() {
  const k = view.scale * view.dpr;
  let shx = 0, shy = 0;
  if (S.shake > 0) { const s = S.shake * S.shake * 14; shx = (Math.random() - 0.5) * s; shy = (Math.random() - 0.5) * s; }
  ctx.setTransform(k, 0, 0, k, shx * k, (view.offY + shy) * k);
  ctx.imageSmoothingEnabled = false;

  if (S.biomeMix < 1) { drawBiomeBack(S.biomePrev, 1); drawBiomeBack(S.biome, S.biomeMix); }
  else drawBiomeBack(S.biome, 1);

  let seg = S.dist - 20;
  for (const o of S.obstacles) {
    if (o.type !== 'gap') continue;
    if (o.x > S.dist + view.w + 20) break;
    if (o.x + o.w < S.dist - 20) continue;
    drawPit(o); drawGroundSeg(seg, o.x); seg = o.x + o.w;
  }
  drawGroundSeg(seg, S.dist + view.w + 20);

  for (const o of S.obstacles) {
    const sx = o.x - S.dist;
    if (o.type !== 'ball' && (sx > view.w + 30 || sx + o.w < -30)) continue;
    if (o.type === 'spikes') drawSpikes(o);
    else if (o.type === 'ceiling') drawCeiling(o);
    else if (o.type === 'wall') drawWall(o);
    else if (o.type === 'ball') drawBall(o);
    else if (o.type === 'orb') drawOrb(o);
    else if (o.type === 'mesa') drawMesa(o);
  }
  for (const c of S.coinList) drawCoin(c);
  drawTrail();
  drawParticles();
  drawBird();

  if (S.flash > 0) { ctx.globalAlpha = S.flash * 0.6; ctx.fillStyle = '#ffffff'; ctx.fillRect(-20, view.top - 20, view.w + 40, view.h + 40); ctx.globalAlpha = 1; }
}

// ===== Main loop =====
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  update(dt); render();
  requestAnimationFrame(frame);
}
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
goMenu();
if (BOT_PLAY) startGame();
window.__glyd = { S, startGame, view, step, solidAt, BIOMES };
requestAnimationFrame(frame);
})();
</script>
