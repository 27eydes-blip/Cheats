<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0907">
  <meta name="color-scheme" content="dark">
  <title>Jericho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <h1 id="name">Jericho</h1>
      <nav class="top-links">
        <a class="top-link" href="/calls">Calls</a>
        <a class="top-link" href="/memory">Memory</a>
      </nav>
    </header>

    <section class="stage">
      <button id="orb" class="orb" data-state="off" aria-label="Start listening">
        <canvas id="viz" aria-hidden="true"></canvas>
      </button>
      <p id="orb-label" class="state-label">Start</p>
      <p id="status" class="status" role="status">Tap the circle, then say “Jericho”.</p>
      <p id="heard" class="heard" aria-live="polite"></p>
      <div id="confirm" class="confirm" hidden>
        <button id="yes" class="yes">Yes</button>
        <button id="no" class="no">No</button>
      </div>
    </section>

    <ol id="log" class="log" aria-label="Conversation"></ol>

    <form id="typed" class="typed" autocomplete="off">
      <input id="typed-text" placeholder="Or type a request…" aria-label="Type a request">
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
